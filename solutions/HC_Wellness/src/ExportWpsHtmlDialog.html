    <script>
      (function() {
        // rawHtml is injected by the Apps Script template
        var rawHtml = <?= JSON.stringify(rawHtml) ?>;
        var iframe = document.getElementById('previewFrame');
        if (iframe && iframe.contentWindow && iframe.contentWindow.document) {
          var doc = iframe.contentWindow.document;
          doc.open();
          doc.write(rawHtml);  // this renders the HTML table, not plain text
          doc.close();
        }
      })();
    </script>
