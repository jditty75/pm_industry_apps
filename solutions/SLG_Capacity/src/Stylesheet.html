.wfm25-worker-panel[hidden] {
  display: none !important;
}
.wfm25-worker-panel-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--business-card);
  background: #fff;
  flex-shrink: 0;
}
.wfm25-worker-panel-close {
  font-size: 13px;
  padding: 4px 8px;
  flex-shrink: 0;
}
.wfm25-worker-panel-identity {
  flex: 1;
  min-width: 0;
}
.wfm25-worker-panel-name {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  color: var(--after-hours);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfm25-worker-panel-meta {
  font-size: 12px;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfm25-adjust-hours-btn {
  font-size: 12px;
  padding: 5px 12px;
  flex-shrink: 0;
  white-space: nowrap;
}
.wfm25-worker-quarter-strip {
  flex-shrink: 0;
  padding: 10px 16px;
  border-bottom: 1px solid var(--business-card);
  background: #fff;
}
.wfm25-worker-quarter-strip[hidden] {
  display: none !important;
}
.wfm25-worker-qstrip-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.wfm25-worker-qstrip-table th {
  font-weight: 600;
  color: var(--staple);
  padding: 2px 6px 4px;
  text-align: center;
  font-size: 11px;
}
.wfm25-worker-qstrip-table td {
  padding: 4px 6px;
  text-align: center;
  vertical-align: middle;
}
.wfm25-worker-panel-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px 16px 20px;
}
/* WFM.25 Pass 1 — worker-panel KPI tiles + projects by role category */
.wfm25-worker-kpi-strip {
  margin-bottom: 12px;
  padding: 0;
  border-bottom: none;
}
.wfm25-worker-kpi-tile {
  flex: 1 1 120px;
  min-width: 110px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--business-card);
  font-variant-numeric: tabular-nums;
}
.wfm25-worker-kpi-tile--neutral {
  background: var(--paper);
  color: var(--laptop);
}
.wfm25-worker-kpi-tile--trend {
  background: var(--paper);
  color: var(--laptop);
  min-width: 100px;
}
.wfm25-worker-kpi-label {
  font-size: 11px;
  font-weight: 600;
  color: inherit;
  opacity: 0.85;
  margin-bottom: 4px;
  line-height: 1.2;
}
.wfm25-worker-kpi-value {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.wfm25-worker-kpi-spark {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 26px;
}
.wfm25-worker-projects-card {
  margin-bottom: 14px;
  padding: var(--wfm25-chrome-card-pad);
}
.wfm25-worker-projects-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 10px;
}
.wfm25-worker-projects-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--after-hours);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.wfm25-worker-projects-qtr {
  font-size: 11px;
}
.wfm25-worker-projects-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.wfm25-worker-projects-row {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px solid var(--business-card);
  font-size: 13px;
  line-height: 1.3;
}
.wfm25-worker-projects-row:last-child {
  border-bottom: none;
}
.wfm25-worker-projects-divider {
  list-style: none;
  border-top: 1px solid var(--business-card);
  margin: 6px 0 4px;
  padding: 0;
  height: 0;
}
.wfm25-worker-projects-row--display-only {
  opacity: 0.72;
}
.wfm25-projects-col {
  min-width: 0;
  font-variant-numeric: tabular-nums;
}
.wfm25-projects-col--identity {
  font-weight: 600;
  color: var(--after-hours);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfm25-projects-col--role {
  color: var(--staple);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfm25-projects-col--hours {
  font-weight: 600;
  color: var(--after-hours);
  text-align: right;
  white-space: nowrap;
}
.wfm25-worker-projects-row--display-only .wfm25-projects-col--identity,
.wfm25-worker-projects-row--display-only .wfm25-projects-col--hours {
  color: var(--staple);
  font-weight: 500;
}
.wfm25-worker-projects-label-col {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}
.wfm25-worker-projects-primary {
  font-weight: 600;
  color: var(--after-hours);
  line-height: 1.3;
}
.wfm25-worker-projects-row--display-only .wfm25-worker-projects-primary {
  color: var(--staple);
  font-weight: 500;
}
.wfm25-worker-projects-sub {
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  line-height: 1.3;
}
.wfm25-worker-projects-display-note {
  font-size: 10px;
  font-style: italic;
  margin-left: 4px;
  opacity: 0.85;
}
.wfm25-worker-projects-hours {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--after-hours);
}

/* WFM.25 Pass 3A — worker-panel Specialty Practice card */
.wfm25-worker-specialty-card {
  margin-bottom: 14px;
  padding: var(--wfm25-chrome-card-pad);
}
.wfm25-worker-specialty-head {
  margin-bottom: 10px;
}
.wfm25-worker-specialty-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--after-hours);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.wfm25-worker-specialty-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.wfm25-worker-specialty-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) auto;
  gap: 10px;
  align-items: center;
  padding: 5px 0;
  border-bottom: 1px solid var(--business-card);
  font-size: 13px;
  line-height: 1.3;
}
.wfm25-worker-specialty-row:last-child {
  border-bottom: none;
}
.wfm25-worker-specialty-row--unclassified {
  opacity: 0.72;
}
.wfm25-specialty-col {
  min-width: 0;
  font-variant-numeric: tabular-nums;
}
.wfm25-specialty-col--label {
  font-weight: 600;
  color: var(--after-hours);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.wfm25-specialty-col--bar {
  display: flex;
  align-items: center;
}
.wfm25-worker-specialty-bar-wrap {
  flex: 1;
  height: 4px;
  background: var(--paper);
  border-radius: 2px;
  overflow: hidden;
}
.wfm25-worker-specialty-bar {
  display: block;
  height: 100%;
  min-width: 2px;
  border-radius: 2px;
  background: var(--ballpoint);
}
.wfm25-specialty-col--hours {
  font-weight: 600;
  color: var(--after-hours);
  text-align: right;
  white-space: nowrap;
}
.wfm25-worker-specialty-row--unclassified .wfm25-specialty-col--label,
.wfm25-worker-specialty-row--unclassified .wfm25-specialty-col--hours {
  color: var(--staple);
  font-weight: 500;
}
.wfm25-worker-specialty-row--unclassified .wfm25-worker-specialty-bar {
  background: var(--staple);
}

/* WFM.25 Pass 2 — weekly capacity bar chart */
.wfm25-weekly-card {
  margin-bottom: 0;
  padding: var(--wfm25-chrome-card-pad);
}
.wfm25-weekly-head {
  margin-bottom: 8px;
}
.wfm25-weekly-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--after-hours);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.wfm25-weekly-empty {
  font-size: 13px;
  padding: 8px 0;
}
.wfm25-weekly-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  margin-bottom: 10px;
  font-size: 11px;
  color: var(--staple);
}
.wfm25-weekly-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.wfm25-weekly-legend-swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 2px;
  border: 1px solid rgba(11, 30, 63, .12);
  flex-shrink: 0;
}
.wfm25-weekly-legend-swatch--actual {
  background: var(--ballpoint);
  border-color: var(--ballpoint);
}
.wfm25-weekly-legend-swatch--forecast {
  background: var(--blue-sky);
  border-color: rgba(11, 30, 63, .18);
  position: relative;
  overflow: hidden;
}
.wfm25-weekly-legend-swatch--forecast::after {
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.10) 2px,
    rgba(0, 0, 0, 0.10) 4px
  );
}
.wfm25-weekly-legend-swatch--draft-add {
  background: var(--happy-hour);
  border-color: var(--happy-hour);
}
.wfm25-weekly-legend-swatch--draft-reduce {
  background: transparent;
  border: 2px dashed var(--happy-hour);
  opacity: 0.65;
}
.wfm25-weekly-scroll {
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.wfm25-weekly-bars {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  min-width: min-content;
  padding: 4px 2px 0;
}
.wfm25-weekly-bar-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 0 0 44px;
  min-width: 44px;
}
.wfm25-weekly-bar-slot.is-expanded .wfm25-weekly-bar-btn {
  outline: 2px solid var(--wfm25-chrome-accent);
  outline-offset: 2px;
}
.wfm25-weekly-bar-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  width: 100%;
  padding: 0 2px 2px;
  border: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 4px;
  position: relative;
}
.wfm25-weekly-bar-btn:hover {
  background: rgba(8, 117, 193, .06);
}
.wfm25-weekly-bar-btn:focus-visible {
  outline: 2px solid var(--wfm25-chrome-accent);
  outline-offset: 2px;
}
.wfm25-weekly-bar-stack {
  display: flex;
  flex-direction: column-reverse;
  justify-content: flex-start;
  align-items: stretch;
  width: 28px;
  margin: 0 auto;
}
.wfm25-weekly-bar-committed {
  background: var(--ballpoint);
  border-radius: 2px 2px 0 0;
  min-height: 2px;
  position: relative;
}
.wfm25-weekly-bar-committed--forecast {
  background: var(--blue-sky);
}
.wfm25-weekly-bar-committed--forecast::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: repeating-linear-gradient(
    -45deg,
    transparent,
    transparent 3px,
    rgba(0, 0, 0, 0.08) 3px,
    rgba(0, 0, 0, 0.08) 6px
  );
}
.wfm25-weekly-bar-draft-add {
  background: var(--happy-hour);
  border-radius: 2px 2px 0 0;
  min-height: 2px;
}
.wfm25-weekly-bar-ghost {
  border: 2px dashed var(--happy-hour);
  border-radius: 2px;
  background: rgba(231, 111, 28, .08);
  min-height: 2px;
  opacity: 0.75;
  box-sizing: border-box;
}
.wfm25-weekly-draft-label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  margin-top: 2px;
  white-space: nowrap;
}
.wfm25-weekly-draft-label--add,
.wfm25-weekly-draft-label--reduce {
  color: var(--happy-hour);
}
.wfm25-weekly-bar-label {
  font-size: 10px;
  color: var(--staple);
  margin-top: 4px;
  text-align: center;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.wfm25-weekly-breakdown {
  margin-top: 10px;
}
.wfm25-weekly-breakdown-content {
  padding-top: 10px;
  border-top: 1px solid var(--business-card);
}
.wfm25-weekly-breakdown-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}
.wfm25-weekly-breakdown-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--after-hours);
}
.wfm25-weekly-breakdown-total {
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.wfm25-weekly-breakdown-list {
  list-style: none;
  margin: 0;
  padding: 0;
}
.wfm25-weekly-breakdown-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--business-card);
}
.wfm25-weekly-breakdown-row:last-child {
  border-bottom: none;
}
.wfm25-weekly-breakdown-row--display-only {
  opacity: 0.72;
}
.wfm25-weekly-breakdown-row--draft {
  border-top: 1px dashed rgba(231, 111, 28, .35);
  margin-top: 4px;
  padding-top: 6px;
}
.wfm25-weekly-breakdown-identity {
  min-width: 0;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--after-hours);
}
.wfm25-weekly-breakdown-row--display-only .wfm25-weekly-breakdown-identity {
  color: var(--staple);
}
.wfm25-weekly-breakdown-hours {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  color: var(--after-hours);
  white-space: nowrap;
}
@media (prefers-reduced-motion: reduce) {
  .wfm25-weekly-bar-btn,
  .wfm25-weekly-breakdown {
    transition: none !important;
  }
}
.wfm25-team-count {
  font-size: 12px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.wfm25-org-total-row td {
  background: var(--keyboard);
}
.wfm25-org-total-row .wfm25-team-name-cell {
  font-weight: 600;
}
@media (prefers-reduced-motion: reduce) {
  .wfm25-worker-kpi-spark .wfm25-mix-trend-sparkline {
    animation: none;
  }
}
.wfm25-panel-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 120px;
  padding: 24px 16px;
}
.wfm25-util-loading-cell {
  text-align: center;
  padding: 0 !important;
  border-bottom: 0 !important;
}
.wfm25-util-loading {
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  min-height: 280px;
}
.wfm25-util-loading[hidden] {
  display: none !important;
}
.wfm25-util-loading-inner {
  min-height: 160px;
}
.wfm25-util-content[hidden] {
  display: none !important;
}
.wfm25-week-ending-caption {
  font-size: 11px;
}
.wfm25-scorecard-view-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--laptop);
  cursor: default;
  user-select: none;
}
.wfm25-worker-panel-footer {
  flex-shrink: 0;
  padding: 8px 16px;
  border-top: 1px solid var(--business-card);
  background: #fff;
  font-size: 12px;
}
.wfm25-worker-panel-footer[hidden] {
  display: none !important;
}
.wfm25-pending-indicator {
  font-size: 11px;
}

/* ── Soft-booking overlay drawer ─────────────────────────── */
.wfm25-softbook-overlay {

.wfm25-util-cell.has-draft {

}
.wfm25-util-committed {
  font-size: 12px;
  color: var(--staple);

  line-height: 1.2;
}
.wfm25-util-draft {

  font-size: 13px;

}
.wfm25-worker-qstrip-committed {
  font-size: 11px;
  color: var(--staple);
}
.wfm25-worker-qstrip-draft {
  margin-top: 2px;
  font-size: 12px;
  font-weight: 700;
  color: var(--happy-hour);
}
.wfm25-worker-qstrip-cell {
  border-radius: 4px;
  min-width: 64px;
}

/* ── Tab bar ─────────────────────────────────────────────── */
.wfm25-tab-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 0;
  background: var(--wfm25-chrome-canvas);
  padding: 12px 20px 0;
  flex-shrink: 0;
  gap: 16px;
}
.wfm25-tabs {
  display: flex;
  gap: 6px;
  padding: 4px;
  background: var(--wfm25-chrome-surface);
  border-radius: var(--wfm25-chrome-pill-radius);
  box-shadow: var(--wfm25-chrome-card-shadow);
}
.wfm25-tab {
  padding: 7px 16px;
  border: 0;
  border-radius: var(--wfm25-chrome-pill-radius);
  background: transparent;
  font-size: 13px;
  font-weight: 500;
  color: var(--staple);
  cursor: pointer;
  transition: background var(--wfm25-motion-duration) var(--wfm25-motion-ease),
              color var(--wfm25-motion-duration) var(--wfm25-motion-ease);
}
.wfm25-tab:hover {
  color: var(--laptop);
  background: var(--business-card);
}
.wfm25-tab:focus-visible {
  outline: 2px solid var(--wfm25-chrome-accent);
  outline-offset: 1px;
}
.wfm25-tab.active {
  color: var(--wfm25-chrome-accent-fg);
  background: var(--wfm25-chrome-accent-soft);
}

/* Group-by toggle */
.wfm25-groupby {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 0;
  flex-shrink: 0;
}
.wfm25-groupby-label {
  font-size: 12px;
  color: var(--staple);
  white-space: nowrap;
}
.wfm25-groupby-btn {
  padding: 5px 12px;
  border: 1px solid transparent;
  border-radius: var(--wfm25-chrome-pill-radius);
  background: var(--wfm25-chrome-surface);
  font-size: 12px;
  font-weight: 500;
  color: var(--laptop);
  cursor: pointer;
  box-shadow: var(--wfm25-chrome-card-shadow);
  transition: background var(--wfm25-motion-duration) var(--wfm25-motion-ease),
              color var(--wfm25-motion-duration) var(--wfm25-motion-ease),
              border-color var(--wfm25-motion-duration) var(--wfm25-motion-ease);
}
.wfm25-groupby-btn:focus-visible {
  outline: 2px solid var(--wfm25-chrome-accent);
  outline-offset: 1px;
}
.wfm25-groupby-btn.active {
  background: var(--wfm25-chrome-accent-soft);
  border-color: transparent;
  color: var(--wfm25-chrome-accent-fg);
}
.wfm25-groupby-btn:hover:not(.active) {
  background: var(--business-card);
}

/* ── Aggregate content region ────────────────────────────── */
.wfm25-aggregate-content {
  flex: 1;
  min-height: 0;
  overflow: visible;
  padding: 16px 20px 24px;
}
.wfm25-tab-panel {
  position: relative;
}
.wfm25-tab-panel[hidden] {
  display: none !important;
}

/* ── Utilization table (white header, no .data-table tan) ── */
.wfm25-util-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}
#wfm25UtilTable thead th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--staple);
  background: #fff;
  border-bottom: 1px solid var(--business-card);
  padding: 10px 12px;
  position: static;
}
.wfm25-team-col {
  text-align: left;
}
.wfm25-qth {
  text-align: center;
  font-size: 11px;
  color: var(--staple);
  font-weight: 600;
  padding: 10px 8px !important;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.wfm25-qth.wfm25-cur-qth {
  color: var(--ballpoint);
}

/* Util table: fit 35% roster pane — scoped to #wfm25UtilTable / #wfm25UtilWrap only */
#wfm25UtilWrap {
  overflow: visible;
  max-height: none;
  border: 0;
}
#wfm25UtilTable {
  table-layout: fixed;
  width: 100%;
}
#wfm25UtilTable .wfm25-team-col {
  min-width: 0;
  width: 34%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#wfm25UtilTable .wfm25-qth,
#wfm25UtilTable tbody td:not(.wfm25-team-col) {
  min-width: 0;
  text-align: center;
  font-variant-numeric: tabular-nums;
  padding: 8px 8px;
  white-space: nowrap;
}
#wfm25UtilTable tbody td {
  border-bottom: 1px solid var(--business-card);
  font-size: 13px;
  color: var(--laptop);
  vertical-align: middle;
}
#wfm25UtilTable tbody tr:last-child td {
  border-bottom: 0;
}

/* Team rows — left color-bar + swatch dot */
.wfm25-team-row {
  cursor: pointer;
  transition: background .1s;
}
.wfm25-team-row:hover td:first-child {
  background: var(--paper);
}
.wfm25-team-row:hover td:not(:first-child) {
  box-shadow: inset 0 0 0 9999px rgba(0, 0, 0, .08);
}
.wfm25-team-row td {
  font-weight: 600;
  padding: 10px 12px !important;
}
.wfm25-team-row[data-wfm25-team*="functional" i] > td:first-child {
  box-shadow: inset 4px 0 0 var(--ballpoint);
}
.wfm25-team-row[data-wfm25-team*="technical" i] > td:first-child {
  box-shadow: inset 4px 0 0 var(--tack);
}
.wfm25-team-row[data-wfm25-team*="delivery" i] > td:first-child {
  box-shadow: inset 4px 0 0 var(--smoothie);
}
.wfm25-team-name-cell {
  display: flex;
  align-items: center;
  gap: 8px;
}
.wfm25-team-swatch {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-block;
}
.wfm25-expand-chev {
  font-size: 9px;
  color: var(--staple);
  margin-left: auto;
  transition: transform .15s;
  display: inline-block;
}
.wfm25-team-row.expanded .wfm25-expand-chev {
  transform: rotate(90deg);
}

/* Worker rows — clickable with right chevron */
.wfm25-worker-row {
  cursor: pointer;
  background: #fff;
  transition: background .12s;
  position: relative;
}
.wfm25-worker-row:hover td:first-child {
  background: var(--paper);
}
.wfm25-worker-row:hover td:not(:first-child) {
  box-shadow: inset 0 0 0 9999px rgba(0, 0, 0, .08);
}
.wfm25-worker-row td:first-child {
  padding-left: 36px !important;
  font-size: 13px;
  color: var(--laptop);
  position: relative;
}
.wfm25-worker-row td:first-child::after {
  content: '\203a';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  line-height: 1;
  color: var(--staple);
  opacity: .45;
  transition: opacity .15s, color .15s;
  pointer-events: none;
}
.wfm25-worker-row:hover td:first-child::after {
  opacity: 1;
  color: var(--ballpoint);
}
.wfm25-worker-row td {
  padding: 7px 12px !important;
  font-size: 13px;
}
.wfm25-worker-row-selected td:first-child {
  font-weight: 600;
  color: var(--ballpoint);
}

/* Util cells */
.wfm25-util-cell {
  text-align: center !important;
  font-size: 13px;
  font-weight: 500;
}
/* Team util cells slightly larger font */
.wfm25-team-row .wfm25-util-cell {
  font-size: 14px;
}

/* ── Placeholder panels (Hours & Budget, Mix & Trend) ─────── */
.wfm25-placeholder-panel {
  display: flex !important;
  align-items: flex-start;
  justify-content: center;
  padding-top: 40px;
}
.wfm25-placeholder-panel[hidden] {
  display: none !important;
}
.wfm25-coming-soon {
  text-align: center;
  color: var(--staple);
  padding: 40px 20px;
}
.wfm25-coming-soon-icon {
  font-size: 32px;
  margin-bottom: 12px;
}
.wfm25-coming-soon-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--laptop);
  margin-bottom: 6px;
}
.wfm25-coming-soon-body {
  font-size: 13px;
}

/* ── Role group-by stub notice ───────────────────────────── */
.wfm25-role-stub {
  margin: 32px auto;
  max-width: 440px;
  background: var(--keyboard);
  border: 1px solid var(--desk);
  border-radius: 8px;
  padding: 20px 24px;
  text-align: center;
  color: var(--laptop);
  font-size: 13px;
}
/* ── WFM.25 Admin surface (minimal Operations upload) ─────── */
.wfm25-admin-canvas {
  padding: 16px 20px 32px;
  max-width: 760px;
}
.wfm25-admin-card {
  border: 0;
  box-shadow: var(--wfm25-chrome-card-shadow);
  border-radius: var(--wfm25-chrome-card-radius);
}
.wfm25-admin-canvas[hidden] {
  display: none !important;
}
.wfm25-admin-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.wfm25-back-btn {
  font-size: 13px;
  padding: 6px 10px;
}
.wfm25-admin-title {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
}
.wfm25-admin-card .upload-zone {
  margin: 0 16px 16px;
}
.wfm25-admin-card .status,
.wfm25-admin-card .consolidated-upload-result {
  margin: 0 16px 16px;
}

.wfm25-role-stub strong {
  display: block;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--after-hours);
}

/* ============================================================
   WFM.25 DESIGN SYSTEM
   Component layer — calm chrome, colorful meaning.
   Appended rules only; palette tokens live in :root above.
   ============================================================ */

/* ── 1. CHROME (white-on-paper, no tan/navy) ─────────────── */

.wfm25-app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  overflow: hidden;
}

.wfm25-topbar {
  height: var(--wfm25-topbar-h, 48px);
  background: #fff;
  border-bottom: 1px solid var(--business-card);
  display: flex;
  align-items: center;
  padding: 0 var(--space-4);
  gap: var(--space-4);
  flex-shrink: 0;
  position: relative;
  z-index: 100;
}

.wfm25-rail {
  width: var(--wfm25-strip-w, 64px);
  background: #fff;
  border-right: 1px solid var(--business-card);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: var(--space-3) 0;
  gap: var(--space-1);
  flex-shrink: 0;
}

.wfm25-rail-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 10px 4px;
  border: 0;
  background: transparent;
  border-radius: var(--radius);
  cursor: pointer;
  width: 52px;
  color: var(--staple);
  transition: background .15s, color .15s, box-shadow .15s;
}

.wfm25-rail-item:hover {
  background: var(--paper);
  color: var(--laptop);
}

.wfm25-rail-item.active {
  background: rgba(8, 117, 193, .08);
  color: var(--ballpoint);
  box-shadow: inset 3px 0 0 var(--ballpoint);
}

.wfm25-card {
  background: var(--wfm25-chrome-surface);
  border: 0;
  border-radius: var(--wfm25-chrome-card-radius);
  padding: var(--wfm25-chrome-card-pad);
  box-shadow: var(--wfm25-chrome-card-shadow);
}

.wfm25-chrome-card {
  background: var(--wfm25-chrome-surface);
  border: 0;
  border-radius: var(--wfm25-chrome-card-radius);
  box-shadow: var(--wfm25-chrome-card-shadow);
  overflow: hidden;
}

.wfm25-chrome-section-header {
  margin: 0 0 12px;
  padding-top: var(--wfm25-chrome-section-gap);
  font-size: 13px;
  font-weight: 600;
  color: var(--after-hours);
  letter-spacing: .01em;
}
.wfm25-chrome-section-header:first-child {
  padding-top: 0;
}

.wfm25-card-grid {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* ── 2. TABLE (aggregate — white, no tan header) ─────────── */

.wfm25-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}

.wfm25-table thead th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--staple);
  background: #fff;
  border-bottom: 1px solid var(--business-card);
  padding: 10px 12px;
  text-align: left;
  white-space: nowrap;
}

.wfm25-table tbody td {
  font-size: 13px;
  color: var(--laptop);
  padding: 10px 12px;
  border-bottom: 1px solid var(--business-card);
  font-variant-numeric: tabular-nums;
  vertical-align: middle;
}

.wfm25-table tbody tr:last-child td {
  border-bottom: 0;
}

.wfm25-table tbody tr:hover td:first-child {
  background: var(--paper);
}
.wfm25-table tbody tr:hover td:not(:first-child) {
  box-shadow: inset 0 0 0 9999px rgba(0, 0, 0, .08);
}

/* Team identity helpers (for statically-classed rows) */
.wfm25-team-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-block;
}

.wfm25-team-functional {
  box-shadow: inset 4px 0 0 var(--ballpoint);
}

.wfm25-team-functional .wfm25-team-dot {
  background: var(--ballpoint);
}

.wfm25-team-technical {
  box-shadow: inset 4px 0 0 var(--tack);
}

.wfm25-team-technical .wfm25-team-dot {
  background: var(--tack);
}

.wfm25-team-delivery {
  box-shadow: inset 4px 0 0 var(--smoothie);
}

.wfm25-team-delivery .wfm25-team-dot {
  background: var(--smoothie);
}

/* ── 3. COLOR MEANING ────────────────────────────────────── */
/* Utilization heat: cellColor() inline styles — do not restyle */

.wfm25-draft {
  color: var(--happy-hour);
  background: rgba(231, 111, 28, .14);
  font-weight: 700;
}

.wfm25-draft-delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 700;
  color: var(--happy-hour);
  background: rgba(231, 111, 28, .16);
  border: 1px solid rgba(231, 111, 28, .40);
  white-space: nowrap;
}

/* Worker-class mix — reuse --wc-* tokens */
.wfm25-wc-slg         { color: var(--wc-slg); }
.wfm25-wc-slg-generic { color: var(--wc-slg-generic); }
.wfm25-wc-nonslg      { color: var(--wc-nonslg); }
.wfm25-wc-partner     { color: var(--wc-partner); }

.wfm25-wc-bar-slg         { background: var(--wc-slg); }
.wfm25-wc-bar-slg-generic { background: var(--wc-slg-generic); }
.wfm25-wc-bar-nonslg      { background: var(--wc-nonslg); }
.wfm25-wc-bar-partner     { background: var(--wc-partner); }

/* ── 5. TYPOGRAPHY & SPACING ─────────────────────────────── */

.wfm25-section-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--after-hours);
  margin: 0 0 var(--space-4);
  line-height: 1.3;
}

.wfm25-section-title-lg {
  font-size: 16px;
}

.wfm25-util-number {
  font-size: 24px;
  font-weight: 700;
  color: var(--after-hours);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.wfm25-util-number-sm {
  font-size: 20px;
}

.wfm25-util-number-lg {
  font-size: 28px;
}

.wfm25-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.wfm25-stack-loose {
  gap: var(--space-6);
}

.wfm25-pad {
  padding: var(--space-5);
}

.wfm25-pad-loose {
  padding: var(--space-6);
}

/* ── WFM.25 reusable collapse transition (Stage 5 motion primitive) ── */
.wfm25-collapse-host,
.wfm25-motion-collapse {
  display: grid;
  grid-template-rows: 1fr;
  transition: grid-template-rows var(--wfm25-motion-duration) var(--wfm25-motion-ease),
              opacity var(--wfm25-motion-duration) var(--wfm25-motion-ease);
  opacity: 1;
}
.wfm25-collapse-host.wfm25-collapse-hidden,
.wfm25-motion-collapse.wfm25-motion-collapse-hidden {
  grid-template-rows: 0fr;
  opacity: 0;
  pointer-events: none;
}
.wfm25-collapse-inner,
.wfm25-motion-collapse-inner {
  overflow: hidden;
  min-height: 0;
}

/* Tab cross-fade */
.wfm25-motion-tab-enter {
  animation: wfm25-tab-enter var(--wfm25-motion-duration) var(--wfm25-motion-ease) both;
}
.wfm25-motion-tab-exit {
  animation: wfm25-tab-exit var(--wfm25-motion-duration) var(--wfm25-motion-ease) both;
  pointer-events: none;
}
@keyframes wfm25-tab-enter {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes wfm25-tab-exit {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-4px); }
}

/* Worker panel slide */
.wfm25-worker-panel.wfm25-motion-panel-enter {
  animation: wfm25-panel-enter var(--wfm25-motion-duration) var(--wfm25-motion-ease) both;
}
.wfm25-worker-panel.wfm25-motion-panel-exit {
  animation: wfm25-panel-exit var(--wfm25-motion-duration) var(--wfm25-motion-ease) both;
  pointer-events: none;
}
@keyframes wfm25-panel-enter {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes wfm25-panel-exit {
  from { opacity: 1; transform: translateX(0); }
  to   { opacity: 0; transform: translateX(12px); }
}

/* Drill zoom-in-place */
.wfm25-motion-drill {
  transition: opacity var(--wfm25-motion-duration) var(--wfm25-motion-ease),
              transform var(--wfm25-motion-duration) var(--wfm25-motion-ease);
  transform-origin: top center;
}
.wfm25-motion-drill-exit {
  opacity: 0;
  transform: scale(0.98);
}
.wfm25-motion-drill-enter {
  animation: wfm25-drill-enter var(--wfm25-motion-duration) var(--wfm25-motion-ease) both;
}
@keyframes wfm25-drill-enter {
  from { opacity: 0; transform: scale(1.02); }
  to   { opacity: 1; transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
  .wfm25-collapse-host,
  .wfm25-motion-collapse,
  .wfm25-draft-panel,
  .wfm25-motion-drill {
    transition: none !important;
    animation: none !important;
  }
  .wfm25-motion-tab-enter,
  .wfm25-motion-tab-exit,
  .wfm25-worker-panel.wfm25-motion-panel-enter,
  .wfm25-worker-panel.wfm25-motion-panel-exit,
  .wfm25-motion-drill-enter,
  .wfm25-motion-drill-exit {
    animation: none !important;
  }
}

/* ── WFM.25 Stage 4: Hours & Capacity ───────────────────── */
.wfm25-hours-capacity-banner {
  padding: var(--wfm25-chrome-card-pad);
  border-bottom: 0;
  background: transparent;
}
.wfm25-hours-capacity-banner-caption {
  margin: 10px 0 0;
  font-size: 11px;
  text-align: center;
}
.wfm25-hours-capacity-banner-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) repeat(4, minmax(0, 1fr));
  gap: 12px;
}
@media (max-width: 1200px) {
  .wfm25-hours-capacity-banner-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .wfm25-hours-capacity-banner-tile--hero {
    grid-column: 1 / -1;
  }
}
@media (max-width: 640px) {
  .wfm25-hours-capacity-banner-grid {
    grid-template-columns: 1fr;
  }
}
.wfm25-hours-capacity-banner-tile {
  background: var(--paper);
  border: 1px solid var(--business-card);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  text-align: right;
}
.wfm25-hours-capacity-banner-tile--hero {
  padding: 16px 18px;
  background: #fff;
  text-align: left;
}
.wfm25-hours-capacity-banner-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--staple);
  line-height: 1.3;
}
.wfm25-hours-capacity-banner-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--laptop);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}
.wfm25-hours-capacity-banner-tile--hero .wfm25-hours-capacity-banner-value {
  font-size: 30px;
}
.wfm25-hours-capacity-banner-sub {
  font-size: 11px;
  color: var(--staple);
  font-variant-numeric: tabular-nums;
}
.wfm25-hours-capacity-wrap {
  overflow: visible;
  max-height: none;
  border: 0;
}
.wfm25-hours-capacity-table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  table-layout: fixed;
}
#wfm25HoursCapacityTable thead th {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--staple);
  background: #fff;
  border-bottom: 1px solid var(--business-card);
