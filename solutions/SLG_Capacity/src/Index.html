<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- Index.html — SLG Capacity Planner WFM.25 Unified UX -->
  <?!= include('Stylesheet'); ?>
</head>
<body>
<div id="app" class="app-shell wfm25-shell">

  <!-- ============ WFM.25 Top Bar ============ -->
  <header class="wfm25-topbar">
    <div class="wfm25-topbar-title">SLG Capacity Planner</div>
    <div class="wfm25-topbar-center">
      <nav aria-label="Breadcrumb">
        <span id="wfm25Breadcrumb" class="wfm25-breadcrumb">SLG Org</span>
      </nav>
    </div>
    <div class="wfm25-topbar-end">
      <div class="user-chip wfm25-user-chip" id="userChip">…</div>
      <button type="button" class="wfm25-freshness-badge" id="wfm25FreshnessBadge"
              aria-label="Data freshness: loading — open Admin">
        <span class="wfm25-freshness-dot" id="wfm25FreshnessDot" aria-hidden="true"></span>
        <span class="wfm25-freshness-label" id="wfm25FreshnessLabel">…</span>
      </button>
      <button type="button" class="wfm25-chrome-search-trigger" id="wfm25SearchTrigger"
              aria-label="Search teams, workers, and roles" title="Search (Ctrl+K)">
        <span class="wfm25-chrome-search-icon" aria-hidden="true">⌕</span>
        <span class="wfm25-chrome-search-placeholder">Search teams, workers, roles…</span>
        <kbd class="wfm25-chrome-search-kbd" aria-hidden="true">Ctrl K</kbd>
      </button>
      <button class="wfm25-search-btn" id="wfm25SearchBtn" hidden
              aria-label="Search" title="Search">⌕</button>
    </div>
  </header>

  <!-- ============ WFM.25 Body: strip + canvas + draft tray ============ -->
  <div class="wfm25-body">

    <!-- Slim icon strip (left nav — two items only) -->
    <nav class="wfm25-icon-strip" aria-label="Main navigation">
      <button class="wfm25-strip-btn active" data-wfm25-nav="capacity" title="Capacity">
        <span class="wfm25-strip-icon">◈</span>
        <span class="wfm25-strip-label">Capacity</span>
      </button>
      <button class="wfm25-strip-btn" data-wfm25-nav="staffing" title="Unfilled Demand">
        <span class="wfm25-strip-icon">◇</span>
        <span class="wfm25-strip-label">Demand</span>
      </button>
      <button class="wfm25-strip-btn" data-wfm25-nav="admin" title="Admin">
        <span class="wfm25-strip-icon">⚙</span>
        <span class="wfm25-strip-label">Admin</span>
      </button>
    </nav>

    <!-- Main content: Capacity canvas + minimal Admin surface -->
    <main class="wfm25-main" id="wfm25Main">
      <div class="wfm25-capacity-body" id="wfm25CapacityBody">
        <?!= include('CapacityCanvas'); ?>
        <?!= include('WorkerPanel'); ?>
      </div>
      <?!= include('CommitmentsCanvas'); ?>
      <?!= include('AdminCanvas'); ?>
    </main>

    <!-- Draft tray — right-edge slide-out (Stage 3) -->
    <aside class="wfm25-draft-tray" id="wfm25DraftTray" aria-hidden="true">
      <div class="wfm25-draft-panel" id="wfm25DraftTrayPanel">
        <header class="wfm25-draft-panel-header">
          <h2 class="wfm25-draft-panel-title" id="wfm25DraftTrayTitle">Pending changes (0)</h2>
          <button type="button" class="icon-btn" id="wfm25DraftTrayClose" aria-label="Close draft tray">✕</button>
        </header>
        <div class="wfm25-draft-panel-body" id="wfm25DraftTrayBody">
          <div class="wfm25-draft-empty muted">No pending drafts</div>
        </div>
        <footer class="wfm25-draft-panel-footer">
          <p class="muted wfm25-draft-panel-note">Drafts are private until committed</p>
          <div class="wfm25-draft-panel-actions">
            <button type="button" class="btn-ghost" id="wfm25DraftDiscardAll">Discard all</button>
            <button type="button" class="btn-primary" id="wfm25DraftCommit">Commit</button>
          </div>
        </footer>
      </div>
      <button type="button" class="wfm25-draft-handle" id="draftTrayHandle"
              aria-expanded="false" title="Pending changes">
        <span class="wfm25-draft-handle-label">Pending changes (0)</span>
      </button>
    </aside>

  </div><!-- /.wfm25-body -->

  <!-- ============ Soft-book overlay (fixed; outside flex split) ============ -->
  <?!= include('SoftBookDrawer'); ?>

  <!-- ============ Confirm Modal (kept for JS compatibility) ============ -->
  <div class="modal" id="confirmModal" hidden>
    <div class="modal-backdrop" data-confirm-close></div>
    <div class="modal-panel" style="width:420px;max-width:92vw;">
      <header class="modal-header">
        <div class="drawer-title" id="confirmModalTitle">Confirm</div>
        <button class="icon-btn" data-confirm-close aria-label="Close">✕</button>
      </header>
      <div class="modal-body" style="padding:16px 20px;">
        <p id="confirmModalBody" style="margin:0 0 8px;"></p>
        <p id="confirmModalError" style="margin:0;color:var(--thumbtack);font-size:13px;" hidden></p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="confirmModalCancel">Cancel</button>
        <button type="button" class="btn-primary" id="confirmModalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- ============ Soft-book commit modal (WFM.23 engine — restored for WFM.25) ============ -->
  <div class="modal" id="softBookCommitModal" hidden>
    <div class="modal-backdrop" data-sb-commit-close></div>
    <div class="modal-panel" style="width:920px;max-width:96vw;">
      <header class="modal-header">
        <div>
          <div class="drawer-title">Commit changes</div>
          <div class="muted" style="margin-top:4px;font-size:12px;">Promotes drafts to committed assignments (optionally grouped in a scenario)</div>
        </div>
        <button class="icon-btn" data-sb-commit-close aria-label="Close">✕</button>
      </header>
      <div class="modal-body" style="padding:16px 20px;">
        <label class="field"><span>Scenario name (optional)</span>
          <input type="text" class="input" id="sbCommitScenarioName" placeholder="e.g. Q3 capacity plan (optional)">
        </label>
        <div class="sb-commit-apply-all">
          <span class="muted">Apply to all:</span>
          <div class="seg seg-sm" id="sbCommitApplyWhatSeg">
            <button type="button" data-val="deployment">Deployment</button>
            <button type="button" data-val="opportunity" class="on">Opportunity</button>
            <button type="button" data-val="label">Manual label</button>
          </div>
          <input type="text" class="input" id="sbCommitApplySearch" placeholder="Filter…">
          <select class="select" id="sbCommitApplyLink"></select>
          <input type="text" class="input" id="sbCommitApplyLabel" hidden placeholder="Manual label text">
          <button type="button" class="btn-ghost" id="sbCommitApplyBtn">Apply</button>
        </div>
        <div class="sb-commit-table-wrap">
          <table class="sb-commit-table">
            <thead><tr>
              <th>Worker</th><th>Dates</th><th class="num">Hours</th>
              <th style="min-width:280px">What</th><th style="width:72px"></th>
            </tr></thead>
            <tbody id="sbCommitGridBody"></tbody>
          </table>
        </div>
        <p id="sbCommitError" class="muted" style="color:var(--thumbtack);font-size:13px;margin:10px 0 0;" hidden></p>
      </div>
      <div class="modal-actions" style="padding:12px 20px;border-top:1px solid var(--business-card);">
        <span class="muted sb-commit-footer-note">Drafts become shared committed capacity</span>
        <button type="button" class="btn-ghost" data-sb-commit-close>Cancel</button>
        <button type="button" class="btn-primary" id="sbCommitSubmitBtn">Commit</button>
      </div>
    </div>
  </div>

  <!-- ============ Toasts ============ -->
  <div class="toast-stack" id="toastStack"></div>

  <!-- ============ WFM.25 Global Search Overlay ============ -->
  <div class="wfm25-search-overlay" id="wfm25SearchOverlay" hidden role="dialog"
       aria-modal="true" aria-label="Global search">
    <button type="button" class="wfm25-search-backdrop" id="wfm25SearchBackdrop"
            aria-label="Close search" tabindex="-1"></button>
    <div class="wfm25-search-palette" role="document">
      <div class="wfm25-search-input-wrap">
        <span class="wfm25-chrome-search-icon" aria-hidden="true">⌕</span>
        <input type="search" class="wfm25-search-input" id="wfm25SearchInput"
               placeholder="Search teams, workers, roles…"
               autocomplete="off" autocorrect="off" spellcheck="false"
               aria-controls="wfm25SearchResults" aria-autocomplete="list">
        <div class="wfm25-search-hints" aria-hidden="true">
          <span class="wfm25-search-hint">↑↓</span>
          <span class="wfm25-search-hint">↵</span>
          <span class="wfm25-search-hint">esc</span>
        </div>
      </div>
      <div class="wfm25-search-results" id="wfm25SearchResults" role="listbox"
           aria-label="Search results"></div>
    </div>
  </div>

</div><!-- /#app -->

<!-- Chart.js via CDN (kept for any chart helpers in JavaScript.html) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<?!= include('JavaScript'); ?>
</body>
</html>
