    } else {
      rSel.disabled = false;
      const locationLabel = matchType === 'project' ? 'on this project' : 'on this account';
      workers.forEach(function (w) {
        const opt = document.createElement('option');
        opt.value = w.resource_name;
        opt.textContent = w.resource_name + ' (' + w.hours + 'h ' + locationLabel + ')';
        rSel.appendChild(opt);
      });
    }

    drawer.hidden = false;
    $('#reductionBaselineCard').hidden = true;
  }

  /**
   * Populate the #r_deployment_id dropdown for the given resource.
   * Pre-selects existingId when editing. Handles empty-allocation disabled state
   * and unmapped legacy deployment_ids.
   * @param {string} resourceName
   * @param {string} [existingId]
   */
  async function _populateDeploymentDropdown_(resourceName, existingId) {
    const sel  = $('#r_deployment_id');
    const hint = $('#r_deployment_hint');
    if (!sel) return;

    sel.disabled = false;
    sel.innerHTML = '<option value="">— No deployment —</option>';
    if (hint) hint.textContent = 'Limited to deployments where this worker has PSA allocations.';

    if (!resourceName) return;

    let options = [];
    try { options = await call('api_getDeploymentsForWorker', resourceName); } catch (e) { options = []; }

    if (!options || !options.length) {
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = '— No allocations to reduce —';
      ph.disabled = true;
      sel.innerHTML = '';
      sel.appendChild(ph);
      sel.value = '';
      sel.disabled = true;
      if (hint) hint.textContent = 'This worker has no PSA allocations to associate with a reduction.';
      return;
    }

    options.forEach(function (o) {
      const opt = document.createElement('option');
      opt.value = o.deployment_id;
      opt.textContent = o.label;
      sel.appendChild(opt);
    });

    if (existingId) {
      const found = options.some(o => o.deployment_id === existingId);
      if (!found) {
        // Prepend option for legacy/orphaned deployment_id
        const unmapped = document.createElement('option');
        unmapped.value = existingId;
        unmapped.textContent = '(no longer active: ' + existingId + ')';
        sel.insertBefore(unmapped, sel.options[1]);
      }
      sel.value = existingId;
    }
  }

  async function openAdjustHoursDrawer_(adjustmentId, prefilledResource, prefilledScenario) {
    const drawer = $('#reductionDrawer');
    if (!drawer) return;

    // Clear deployment lock and restore drawer header to default Explorer/Scenarios mode
    _reductionDrawerDepLock = null;
    const titleEl = $('#reductionDrawerTitle');
    const ctxEl   = $('#reductionDrawerContext');
    if (titleEl) titleEl.textContent = 'Adjust Worker Capacity';
    if (ctxEl)   ctxEl.textContent   = 'Workforce Modeling';
    const depField = $('#r_deployment_field');
    if (depField) depField.hidden = false;

    // Populate resource select
    const rSel = $('#r_resource');
    rSel.disabled = false;
    rSel.innerHTML = '<option value="">— Select worker —</option>' +
      (State.ref.resources || []).map(r =>
        `<option value="${escapeHtml_(r.name)}">${escapeHtml_(r.name)}</option>`
      ).join('');

    // Populate scenario select
    const sSel = $('#r_scenario');
    sSel.innerHTML = '<option value="">— No scenario —</option>' +
      (State.scenarios || []).filter(s => s.status !== 'Archived')
        .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`).join('');

    // Reset form
    $('#r_adjustment_id').value = '';
    $('#r_start').value = '';
    $('#r_end').value = '';
    $('#r_hours').value = '';
    $('#r_reason').value = '';
    $$('#r_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === 'Even'));
    const sub = $('#reductionDrawerWorkerSub');
    if (sub) sub.textContent = '';

    // Default direction to 'reduce'
    $$('#r_direction button').forEach(b => b.classList.toggle('on', b.dataset.val === 'reduce'));
    _syncAdjustHoursDirectionUI_('reduce');

    // Reset deployment dropdown to a neutral state before async populate
    const depSel = $('#r_deployment_id');
    if (depSel) { depSel.innerHTML = '<option value="">— No deployment —</option>'; depSel.disabled = false; }

    if (adjustmentId) {
      // Edit mode: fetch the existing adjustment
      try {
        const adjs = await call('api_listCapacityAdjustments', {});
        const adj = (adjs || []).find(a => a.adjustment_id === adjustmentId);
        if (adj) {
          $('#r_adjustment_id').value = adj.adjustment_id;
          rSel.value = adj.resource_name || '';
          rSel.disabled = false;
          if (adj.start_date) $('#r_start').value = String(adj.start_date).slice(0,10);
          if (adj.end_date)   $('#r_end').value   = String(adj.end_date).slice(0,10);
          // hours_reduction is signed; show magnitude in the input
          $('#r_hours').value  = Math.abs(Number(adj.hours_reduction) || 0) || '';
          $('#r_reason').value = adj.reason || '';
          sSel.value = adj.scenario_id || '';
          // Restore direction from saved adjustment
          const savedDir = adj.direction || (Number(adj.hours_reduction) >= 0 ? 'reduce' : 'add');
          $$('#r_direction button').forEach(b => b.classList.toggle('on', b.dataset.val === savedDir));
          _syncAdjustHoursDirectionUI_(savedDir);
          // Restore saved distribution; fall back to Even if it's not one of
          // the currently-allowed modes (e.g. a legacy 'Custom' row -- removed
          // in WFM.12 -- mirrors the server's defensive default-to-Even).
          const allowedDist = ['Even', 'Front-loaded', 'Back-loaded'];
          const restoredDist = allowedDist.includes(adj.distribution) ? adj.distribution : 'Even';
          $$('#r_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === restoredDist));
          if (sub) sub.textContent = adj.resource_name || '';
          // Populate deployment dropdown and pre-select saved value
          await _populateDeploymentDropdown_(adj.resource_name || '', String(adj.deployment_id || ''));
        }
      } catch (e) {
        toast('Failed to load adjustment: ' + e.message, 'err');
      }
    } else {
      // Create mode
      if (prefilledResource) {
        rSel.value = prefilledResource;
        rSel.disabled = true;
        if (sub) sub.textContent = prefilledResource;
      } else {
        rSel.disabled = false;
      }
      if (prefilledScenario) sSel.value = prefilledScenario;
      // Populate deployment dropdown for the pre-filled resource (if any)
      if (prefilledResource) await _populateDeploymentDropdown_(prefilledResource, '');
    }

    drawer.hidden = false;

    // Load baseline when resource + dates are already set
    const res = rSel.value;
    const st = $('#r_start').value;
    const en = $('#r_end').value;
    if (res && st && en) loadResourceBaselineForDrawer_(res, st, en);
  }

  // Distribution segmented control for reduction drawer
  $$('#r_distribution button').forEach(b => {
    b.addEventListener('click', () => {
      $$('#r_distribution button').forEach(x => x.classList.toggle('on', x === b));
      updateReductionPreview_();
    });
  });

  // Event wiring — date and hours inputs (debounced 200ms).
  ['r_start', 'r_end', 'r_hours'].forEach(id => {
    $('#' + id)?.addEventListener('input', () => {
      clearTimeout(window._reductionPreviewTimer);
      window._reductionPreviewTimer = setTimeout(updateReductionPreview_, 200);
      // reload baseline when resource is set
      const res = $('#r_resource').value;
      const st  = $('#r_start').value;
      const en  = $('#r_end').value;
      if (res && st && en) loadResourceBaselineForDrawer_(res, st, en);
    });
  });

  $('#r_resource')?.addEventListener('change', () => {
    const res = $('#r_resource').value;
    const st  = $('#r_start').value;
    const en  = $('#r_end').value;
    const sub = $('#reductionDrawerWorkerSub');
    if (sub) sub.textContent = res || '';
    // Re-populate deployment dropdown only in the unlocked (Explorer/Scenarios) flow
    if (!_reductionDrawerDepLock) _populateDeploymentDropdown_(res, '');
    // In deployment-locked mode load baseline on worker change alone (no dates needed for context)
    if (res && (_reductionDrawerDepLock || (st && en))) {
      loadResourceBaselineForDrawer_(res, st || null, en || null);
    }
  });

  /**
   * Load baseline PSA committed hours for a worker and render the
   * baseline context panel inside the reduction drawer.
   * When _reductionDrawerDepLock is set, shows both "Total PSA" and
   * "On this deployment" datasets side-by-side.
   */
  async function loadResourceBaselineForDrawer_(resourceName, startDate, endDate) {
    const card = $('#reductionBaselineCard');
    if (!card) return;
    try {
      const depLock = _reductionDrawerDepLock;
      const start = startDate ? startDate.slice(0,7) : null;
      const end   = endDate   ? endDate.slice(0,7)   : null;
      const hoursReduction = Number($('#r_hours').value) || 0;

      if (depLock) {
        // Deployment-locked mode: fetch two-row baseline (new shape: {months, match_type})
        const resp = await call('api_getResourceBaselineForDeployment', resourceName, depLock);
        const baselineMonths = (resp && resp.months) ? resp.months : (Array.isArray(resp) ? resp : []);
        const depMatchType   = (resp && resp.match_type) || ($('#reductionDrawer').dataset.depMatchType) || 'none';
        if (!baselineMonths.length) { card.hidden = true; return; }
        const filtered = baselineMonths.filter(b =>
          (!start || b.monthKey >= start) && (!end || b.monthKey <= end)
        );
        if (!filtered.length && (start || end)) { card.hidden = true; return; }
        const data = filtered.length ? filtered : baselineMonths;
        const matchedLabel = depMatchType === 'project' ? 'On this project' : 'On this account';
        const ctx2 = $('#reductionBaselineChart').getContext('2d');
        if (window._reductionBaselineChartInst) window._reductionBaselineChartInst.destroy();
        window._reductionBaselineChartInst = new Chart(ctx2, {
          type: 'bar',
          data: {
            labels: data.map(b => fmtMonth(b.monthKey)),
            datasets: [
              { label: 'Total PSA', data: data.map(b => b.total_psa_hours), backgroundColor: cssVar_('--ballpoint') },
              { label: matchedLabel, data: data.map(b => b.matched_hours || 0), backgroundColor: cssVar_('--lunchBreak') }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            plugins: { legend: { position: 'bottom' } },
            scales: { x: { stacked: false, grid: { display: false } }, y: { beginAtZero: true } }
          }
        });
        const totalMatched = data.reduce((s, b) => s + (b.matched_hours || 0), 0);
        const noteEl = $('#reductionBaselineNote');
        if (noteEl) noteEl.textContent = `${matchedLabel}: ${Math.round(totalMatched)}h PSA`;
        card.hidden = false;
      } else {
        // Standard mode: single "PSA Committed" row
        const baseline = await call('api_getResourceBaseline', resourceName);
        if (!baseline || !baseline.length) { card.hidden = true; return; }
        const filtered = baseline.filter(b =>
          (!start || b.monthKey >= start) && (!end || b.monthKey <= end)
        );
        if (!filtered.length) { card.hidden = true; return; }

        const n = filtered.length;
        const perMonth = n > 0 ? hoursReduction / n : 0;

        const ctx = $('#reductionBaselineChart').getContext('2d');
        if (window._reductionBaselineChartInst) window._reductionBaselineChartInst.destroy();
        window._reductionBaselineChartInst = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: filtered.map(b => fmtMonth(b.monthKey)),
            datasets: [
              { label: 'PSA Committed', data: filtered.map(b => b.committed_hours), backgroundColor: cssVar_('--ballpoint') },
              { label: 'Proposed Reduction', data: filtered.map(() => perMonth), backgroundColor: '#e74c3c88' }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            plugins: { legend: { position: 'bottom' } },
            scales: { x: { stacked: false, grid: { display: false } }, y: { beginAtZero: true } }
          }
        });

        const totalBaseline = filtered.reduce((s, b) => s + b.committed_hours, 0);
        const net = totalBaseline - hoursReduction;
        const noteEl = $('#reductionBaselineNote');
        if (noteEl) noteEl.textContent = `Baseline: ${Math.round(totalBaseline)}h — Reduction: ${Math.round(hoursReduction)}h — Net: ${Math.round(net)}h`;
        card.hidden = false;
      }
    } catch (e) {
      card.hidden = true;
    }
  }

  /** Refresh the reduction preview chart. */
  async function updateReductionPreview_() {
    const resource = $('#r_resource').value;
    const start    = $('#r_start').value;
    const end      = $('#r_end').value;
    const hours    = Number($('#r_hours').value) || 0;
    if (!start || !end || !hours) return;
    const activeBtn = $$('#r_distribution button').find(b => b.classList.contains('on'));
    const dist = activeBtn ? activeBtn.dataset.val : 'Even';
    const adj = {
      start_date: start, end_date: end,
      hours_reduction: hours, distribution: dist
    };
    try {
      const preview = await call('api_previewCapacityAdjustment', adj);
      const ctx = $('#reductionPreviewChart').getContext('2d');
      if (window._reductionPreviewChartInst) window._reductionPreviewChartInst.destroy();
      window._reductionPreviewChartInst = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: (preview || []).map(m => fmtMonth(m.monthKey)),
          datasets: [{ label: 'Reduction (hrs)', data: (preview || []).map(m => m.hours_reduction), backgroundColor: '#e74c3c88' }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { position: 'bottom' } },
          scales: { x: { grid: { display: false } }, y: { beginAtZero: true } }
        }
      });
    } catch (e) { /* preview is best-effort */ }
  }

  /**
   * Sync the hours label and preview chart color to the selected direction.
   * @param {'reduce'|'add'} dir
   */
  function _syncAdjustHoursDirectionUI_(dir) {
    const labelEl = $('#r_hoursLabel');
    if (labelEl) {
      labelEl.innerHTML = dir === 'add'
        ? 'Hours to add <span style="color:var(--thumbtack);">*</span>'
        : 'Hours to reduce <span style="color:var(--thumbtack);">*</span>';
    }
  }

  // Wire direction segmented control
  $$('#r_direction button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      $$('#r_direction button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      _syncAdjustHoursDirectionUI_(btn.dataset.val);
    });
  });

  // Submit reduction form
  $('#reductionForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    await withLoading_($('#saveReductionModeledBtn') || e.submitter, () => submitReductionForm_(false), { label: 'Saving...' });
  });

  $('#commitReductionNowBtn')?.addEventListener('click', async function() {
    await withLoading_(this, () => submitReductionForm_(true), { label: 'Committing...' });
  });

  async function submitReductionForm_(commitNow) {
    const resource = $('#r_resource').value;
    const start    = $('#r_start').value;
    const end      = $('#r_end').value;
    const hours    = Number($('#r_hours').value) || 0;
    const reason   = $('#r_reason').value.trim();
    const scenario = $('#r_scenario').value;
    const adjId    = $('#r_adjustment_id').value;

    if (!resource) { toast('Worker is required', 'err'); return; }
    if (!start || !end) { toast('Date range is required', 'err'); return; }
    if (hours <= 0) { toast('Hours must be > 0', 'err'); return; }
    if (!reason) { toast('Reason is required', 'err'); return; }

    const dirBtn = $$('#r_direction button').find(b => b.classList.contains('on'));
    const direction = dirBtn ? dirBtn.dataset.val : 'reduce';

    const activeBtn = $$('#r_distribution button').find(b => b.classList.contains('on'));
    const dist = activeBtn ? activeBtn.dataset.val : 'Even';

    const adj = {
      adjustment_id:     adjId || null,
      resource_name:     resource,
      start_date:        start,
      end_date:          end,
      hours_reduction:   hours,
      direction:         direction,
      distribution:      dist,
      reason:            reason,
      scenario_id:       scenario || '',
      deployment_id:     ($('#r_deployment_id') && !$('#r_deployment_id').disabled) ? ($('#r_deployment_id').value || '') : '',
      status:            commitNow ? 'Committed' : 'Modeled'
    };

    const panel = $('#reductionDrawer .drawer-panel') || $('#reductionDrawer');
    const spinner = panel?.querySelector('.drawer-spinner');
    if (panel) panel.classList.add('is-submitting');
    if (spinner) spinner.textContent = commitNow ? 'Committing...' : 'Saving...';
    try {
      await call('api_saveCapacityAdjustment', adj);
      toast(commitNow ? 'Adjustment committed' : 'Adjustment saved as modeled', 'ok');
      $('#reductionDrawer').hidden = true;

      // Refresh relevant views
      if (State.currentView === 'scenarios' && State.selectedScenario) {
        await loadScenarioAssignments_(State.selectedScenario);
      }
      refreshExplorerSurfaces_(resource);
    } catch (err) {
      toast('Save failed: ' + err.message, 'err');
    } finally {
      if (panel) panel.classList.remove('is-submitting');
    }
  }

  // Reduction drawer close — also clear the deployment lock
  $('#reductionDrawer')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      $('#reductionDrawer').hidden = true;
      _reductionDrawerDepLock = null;
    }
  });
</script>

<script>
// ============================================================
// Capacity Explorer — unified three-surface refresh
// ============================================================

/**
 * Refresh all three Capacity Explorer surfaces for a given worker.
 * Guards on both State.currentView and State.selectedResource so
 * saves from other views don't trigger wasted fetches.
 * @param {string} workerName
 */
function refreshExplorerSurfaces_(workerName) {
  if (State.currentView === 'explorer' && State.selectedResource === workerName) {
    refreshExplorer_({ reason: 'surface-refresh' });
  }
  if (State.projectAllocation && State.projectAllocation.resource === workerName) {
    loadProjectAllocationCard_(State.projectAllocation.resource, State.projectAllocation.monthKey);
  }
}

// ============================================================
// Quick Adjust Modal — scoped to (worker, account, month)
// ============================================================

/**
 * Open the quick-adjust modal for an Edit button click from the
 * Project Allocation card.
 * @param {{ workerName: string, accountName: string, monthKey: string, deployments: Object[] }} ctx
 */
function openQuickAdjustModal_(ctx) {
  State.qaCtx = ctx;
  const modal = $('#quickAdjustModal');
  if (!modal) return;

  // Context line
  const ctxEl = $('#qaContext');
  if (ctxEl) ctxEl.textContent = ctx.workerName + ' \u00b7 ' + ctx.accountName + ' \u00b7 ' + fmtMonth(ctx.monthKey);

  // Deployment dropdown — show only when multiple
  const depField = $('#qaDeploymentField');
  const depSel   = $('#qaDeployment');
  if (depField && depSel) {
    depSel.innerHTML = (ctx.deployments || []).map(function (d) {
      return '<option value="' + escapeHtml_(d.deployment_id) + '">' + escapeHtml_(d.deployment_name) + '</option>';
    }).join('');
    depField.hidden = (ctx.deployments || []).length <= 1;
  }

  // Scenario dropdown
  const scSel = $('#qaScenario');
  if (scSel) {
    scSel.innerHTML = '<option value="">— No scenario —</option>' +
      (State.scenarios || []).filter(function (s) { return s.status !== 'Archived'; })
        .map(function (s) { return '<option value="' + escapeHtml_(s.scenario_id) + '">' + escapeHtml_(s.name) + '</option>'; }).join('');
  }

  // Reset form
  const hoursEl = $('#qaHours');
  const reasonEl = $('#qaReason');
  const errEl   = $('#qaError');
  if (hoursEl)  hoursEl.value = '';
  if (reasonEl) reasonEl.value = '';
  if (errEl)    errEl.textContent = '';

  // Default direction to 'reduce'
  $$('#qaDirection button').forEach(function (b) { b.classList.toggle('on', b.dataset.val === 'reduce'); });
  const labEl = $('#qaHoursLabel');
  if (labEl) labEl.textContent = 'Hours to reduce';

  modal.hidden = false;

  // Populate PSA hours for the first deployment
  _qaRefreshPsaHours_();
}

/**
 * Fetch and display PSA hours in the modal's read-only field.
 */
async function _qaRefreshPsaHours_() {
    const ctx = State.qaCtx;
    if (!ctx) return;
    const depSel = $('#qaDeployment');
    const deploymentId = depSel && depSel.value
      ? depSel.value
      : ((ctx.deployments && ctx.deployments[0]) ? ctx.deployments[0].deployment_id : '');
    if (!deploymentId) { const f = $('#qaPsaHours'); if (f) f.value = '—'; return; }
    try {
      const resp = await call('api_getPsaHoursForWorkerDeploymentMonth', {
        resource_name: ctx.workerName,
        deployment_id: deploymentId,
        monthKey: ctx.monthKey
      });
      const f = $('#qaPsaHours');
      if (f) f.value = String(Math.round((resp && resp.psa_hours) || 0)) + 'h';
    } catch (e) {
      const f = $('#qaPsaHours');
      if (f) f.value = '—';
    }
  }

  // Wire QA modal close (backdrop + cancel buttons with data-qa-close)
  document.addEventListener('click', function (e) {
    if (e.target.dataset && e.target.dataset.qaClose !== undefined) {
      const modal = $('#quickAdjustModal');
      if (modal) modal.hidden = true;
    }
  });

  // Wire QA deployment change to refresh PSA hours
  $('#qaDeployment')?.addEventListener('change', _qaRefreshPsaHours_);

  // Wire QA direction toggle
  $$('#qaDirection button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      $$('#qaDirection button').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      const labEl = $('#qaHoursLabel');
      if (labEl) labEl.textContent = btn.dataset.val === 'add' ? 'Hours to add' : 'Hours to reduce';
    });
  });

  // Wire QA save button
  $('#qaSaveBtn')?.addEventListener('click', async function () {
    const ctx = State.qaCtx;
    if (!ctx) return;

    const dirBtn = $$('#qaDirection button').find(function (b) { return b.classList.contains('on'); });
    const direction = dirBtn ? dirBtn.dataset.val : 'reduce';
    const magnitude = Number($('#qaHours').value) || 0;
    const reason    = ($('#qaReason').value || '').trim();
    const scenario  = $('#qaScenario') ? $('#qaScenario').value : '';
    const depSel    = $('#qaDeployment');
    const deploymentId = depSel && depSel.value
      ? depSel.value
      : ((ctx.deployments && ctx.deployments[0]) ? ctx.deployments[0].deployment_id : '');

    const errEl = $('#qaError');
    if (errEl) errEl.textContent = '';

    if (magnitude <= 0) { if (errEl) errEl.textContent = 'Hours must be greater than 0.'; return; }
    if (!reason)        { if (errEl) errEl.textContent = 'Reason is required.'; return; }

    // Build date range from monthKey (first → last of month)
    const [yr, mo] = ctx.monthKey.split('-').map(Number);
    const startDate = yr + '-' + String(mo).padStart(2, '0') + '-01';
    const lastDay = new Date(yr, mo, 0).getDate();
    const endDate = yr + '-' + String(mo).padStart(2, '0') + '-' + String(lastDay).padStart(2, '0');

    const payload = {
      resource_name:  ctx.workerName,
      start_date:     startDate,
      end_date:       endDate,
      hours_reduction: magnitude,
      direction:       direction,
      distribution:   'Even',
      reason:          reason,
      scenario_id:     scenario || '',
      deployment_id:   deploymentId || '',
      status:          'Modeled'
    };

    await withLoading_($('#qaSaveBtn'), async function () {
      await call('api_saveCapacityAdjustment', payload);
      $('#quickAdjustModal').hidden = true;
      toast('Adjustment saved as Modeled', 'ok');
      refreshExplorerSurfaces_(ctx.workerName);
    }, { label: 'Saving...' });
  });
</script>

<script>
  // ============================================================
  // Drop 7: Worker Planning Detail card
  // ============================================================

  /**
   * Paint Planning card from already-fetched data (no server round-trip).
   * @param {string} resourceName
   * @param {Object[]} rows
   * @param {Object} summary
   */
  function applyWorkerPlanning_(resourceName, rows, summary) {
    State.workerPlanning = { rows: rows || [], summary: summary || {}, resource: resourceName };
    _populatePlanningScenarioFilter_();
    renderWorkerPlanning_();
    const card = $('#workerPlanningCard');
    if (card) card.hidden = false;
  }

  /**
   * Fetch api_getWorkerPlanning + api_getWorkerPlanningSummary in parallel.
   * Shows the planning card, populates State.workerPlanning.
   */
  async function loadWorkerPlanning_(resourceName) {
    if (!resourceName) {
      const card = $('#workerPlanningCard');
      if (card) card.hidden = true;
      return;
    }
    try {
      const [rows, summary] = await Promise.all([
        call('api_getWorkerPlanning', resourceName, {}),
        call('api_getWorkerPlanningSummary', resourceName)
      ]);
      applyWorkerPlanning_(resourceName, rows, summary);
    } catch (err) {
      toast('Planning load failed: ' + err.message, 'err');
    }
  }

  function _populatePlanningScenarioFilter_() {
    const sel = $('#planningScenarioFilter');
    if (!sel || !State.workerPlanning) return;
    const rows = State.workerPlanning.rows || [];
    const scenIds = [...new Set(rows.map(r => r.scenario_id).filter(Boolean))];
    const current = sel.value;
    sel.innerHTML = '<option value="">All scenarios</option>' +
      scenIds.map(id => {
        const name = (State.scenarios || []).find(s => s.scenario_id === id)?.name || id;
        return `<option value="${escapeHtml_(id)}">${escapeHtml_(name)}</option>`;
      }).join('');
    if (current) sel.value = current;
  }

  /**
   * Apply current filter controls client-side and render the table.
   */
  function renderWorkerPlanning_() {
    if (!State.workerPlanning) return;
    const { rows, summary, resource } = State.workerPlanning;

    $('#planningWorkerName').textContent = resource || '—';

    // Apply filters
    const statusF   = ($$('#planningStatusFilter button').find(b => b.classList.contains('on')) || {}).dataset?.val || '';
    const typeF     = ($$('#planningTypeFilter button').find(b => b.classList.contains('on')) || {}).dataset?.val || '';
    const scenF     = $('#planningScenarioFilter')?.value || '';

    let visible = rows;
    if (statusF) visible = visible.filter(r => r.status === statusF);
    if (typeF)   visible = visible.filter(r => r.type   === typeF);
    if (scenF)   visible = visible.filter(r => r.scenario_id === scenF);

    const subtitle = `${rows.filter(r => r.type === 'assignment').length} assignments · ${rows.filter(r => r.type === 'reduction').length} reductions`;
    $('#planningSubtitle').textContent = subtitle;

    const body = $('#workerPlanningBody');
    if (!visible.length) {
      body.innerHTML = '<tr><td colspan="8" class="planning-empty">No records match the current filters.</td></tr>';
    } else {
      body.innerHTML = visible.map(r => _planningRow_(r)).join('');
      // Wire row actions
      body.querySelectorAll('[data-plan-edit]').forEach(btn => {
        btn.addEventListener('click', () => _planningEdit_(btn.dataset.planEdit, btn.dataset.planType, btn.dataset.planOppId));
      });
      body.querySelectorAll('[data-plan-commit]').forEach(btn => {
        btn.addEventListener('click', () => _planningCommit_(btn.dataset.planCommit, btn.dataset.planType));
      });
      body.querySelectorAll('[data-plan-revert]').forEach(btn => {
        btn.addEventListener('click', () => _planningRevert_(btn.dataset.planRevert, btn.dataset.planType));
      });
      body.querySelectorAll('[data-plan-delete]').forEach(btn => {
        btn.addEventListener('click', () => _planningDelete_(btn.dataset.planDelete, btn.dataset.planType));
      });
      // Wire status pills
      body.querySelectorAll('.plan-status-pill').forEach(pill => {
        pill.addEventListener('click', e => _planningStatusPillClick_(e));
      });
    }

    // Footer
    if (summary) {
      $('#pfTotalAssigned').textContent = (summary.totalAssignedHours || 0) + 'h';
      $('#pfTotalReductions').textContent = '-' + (summary.totalReductionHours || 0) + 'h';
      $('#pfNet').textContent = (summary.netHours || 0) + 'h';
      $('#pfMeta').textContent = `${summary.distinctProjects || 0} project(s) · ${summary.distinctScenarios || 0} scenario(s)`;
      const footer = $('#planningFooter');
      if (footer) footer.hidden = false;
    }
  }

  function _planningRow_(r) {
    const isAssign = r.type === 'assignment';
    const typeIcon = isAssign
      ? '<span class="type-icon assign" title="Assignment">▶</span>'
      : '<span class="type-icon reduce" title="Reduction">▼</span>';
    const reductionSub = r.subtitle || '';
    const orphanStyle = r.orphaned ? ' style="color:var(--lunchBreak,#e8a317);font-size:11px;"' : ' style="font-size:11px;"';
    const titleHtml = isAssign
      ? `<div>${escapeHtml_(r.title)}</div><div class="muted"${orphanStyle}>${escapeHtml_(r.subtitle || '')}</div>`
      : `<div>${escapeHtml_(r.title)}</div>${reductionSub ? `<div class="muted"${orphanStyle}>${escapeHtml_(reductionSub)}</div>` : (r.reason ? `<div class="muted" style="font-size:11px;">${escapeHtml_(r.reason)}</div>` : '')}`;
    const dates = r.start_date && r.end_date
      ? fmtDate(r.start_date) + ' – ' + fmtDate(r.end_date) : '—';
    const hoursHtml = isAssign
      ? `<span>${r.hours}h</span>`
      : `<span class="reduction-hours">-${r.hours}h</span>`;
    const statusHtml = `<span class="plan-status-pill status-${r.status.toLowerCase()}" data-row-id="${escapeHtml_(r.id)}" data-row-type="${r.type}" data-row-status="${r.status}">${escapeHtml_(r.status)}</span>`;
    const scenHtml = r.scenario_name ? escapeHtml_(r.scenario_name) : '<span class="muted">—</span>';
    const distPill = `<span class="badge ghost" style="font-size:11px;">${escapeHtml_(r.distribution)}</span>`;

    // Action buttons — revealed on row hover via CSS
    let actions = `<div class="plan-row-actions">
      <button class="btn-ghost row-btn" data-plan-edit="${escapeHtml_(r.id)}" data-plan-type="${r.type}" data-plan-opp-id="${escapeHtml_(r.opportunity_id || '')}">Edit</button>`;
    if (r.status === 'Modeled') {
      actions += `<button class="btn-ghost row-btn" data-plan-commit="${escapeHtml_(r.id)}" data-plan-type="${r.type}">Commit</button>`;
    } else if (r.status === 'Committed') {
      actions += `<button class="btn-ghost row-btn" data-plan-revert="${escapeHtml_(r.id)}" data-plan-type="${r.type}">Revert</button>`;
    }
    actions += `<button class="btn-ghost row-btn danger" data-plan-delete="${escapeHtml_(r.id)}" data-plan-type="${r.type}">Delete</button>
    </div>`;

    return `<tr class="plan-row">
      <td>${typeIcon}</td>
      <td>${titleHtml}</td>
      <td style="white-space:nowrap;">${dates}</td>
      <td class="num">${hoursHtml}</td>
      <td>${distPill}</td>
      <td>${statusHtml}</td>
      <td>${scenHtml}</td>
      <td>${actions}</td>
    </tr>`;
  }

  // Status pill click — show inline flip options via popover-style injection
  function _planningStatusPillClick_(e) {
    const pill = e.currentTarget;
    const id = pill.dataset.rowId;
    const type = pill.dataset.rowType;
    const status = pill.dataset.rowStatus;
    // Remove any existing flip menu
    document.querySelectorAll('.plan-status-menu').forEach(el => el.remove());
    const menu = document.createElement('div');
    menu.className = 'plan-status-menu';
    const options = [];
    if (status === 'Modeled')   { options.push(['Commit', 'commit']); options.push(['Archive', 'archive']); }
    if (status === 'Committed') { options.push(['Revert', 'revert']); options.push(['Archive', 'archive']); }
    if (status === 'Archived')  { options.push(['Un-archive', 'unarchive']); }
    menu.innerHTML = options.map(([label, action]) =>
      `<button data-action="${action}" data-id="${escapeHtml_(id)}" data-type="${type}">${label}</button>`
    ).join('');
    pill.parentElement.style.position = 'relative';
    pill.parentElement.appendChild(menu);
    menu.addEventListener('click', async e2 => {
      const btn = e2.target.closest('button');
      if (!btn) return;
      menu.remove();
      const { action, id: rowId, type: rowType } = btn.dataset;
      await withLoading_(btn, async () => {
        if (action === 'commit')   await _planningCommit_(rowId, rowType);
        if (action === 'revert')   await _planningRevert_(rowId, rowType);
        if (action === 'archive')  await _planningDelete_(rowId, rowType, true);
        if (action === 'unarchive') await _planningRevert_(rowId, rowType);
      }, { label: 'Working...' });
    });
    document.addEventListener('click', function dismissMenu(e3) {
      if (!menu.contains(e3.target) && e3.target !== pill) {
        menu.remove();
        document.removeEventListener('click', dismissMenu);
      }
    }, { capture: true, once: false });
  }

  async function _planningEdit_(id, type, oppId) {
    if (type === 'assignment') {
      // Re-open assign drawer for editing: need the assignment row to pre-fill.
      const rows = (State.workerPlanning && State.workerPlanning.rows) || [];
      const row = rows.find(r => r.id === id);
      if (row && row.opportunity_id) {
        // Make sure opportunities are loaded before opening drawer
        if (!State.opportunities.length && !State.deployments.length) {
          try { State.opportunities = await call('api_listOpportunities', {}); } catch (e) {}
        }
        await openAssignDrawerForEdit_(id, row);
      } else {
        toast('Cannot open edit drawer — opportunity context missing', 'err');
      }
    } else {
      openReductionDrawer_(id);
    }
  }

  /**
   * Open the Assign drawer pre-populated with an existing assignment.
   * @param {string} assignmentId
   * @param {Object} planRow  — row from State.workerPlanning.rows
   */
  async function openAssignDrawerForEdit_(assignmentId, planRow) {
    if (!State.scenarios.length) await loadScenariosList();
    // Ensure opportunities list is populated
    if (!State.opportunities || !State.opportunities.length) {
      try { State.opportunities = await call('api_listOpportunities', {}); } catch (e) {}
    }
    const oppId = planRow.opportunity_id;
    const opp = State.opportunities.find(o => o.opportunity_id === oppId) || { opportunity_id: oppId };
    await openAssignDrawer_(oppId, 'pipeline');
    // Pre-fill assignment-specific fields
    $('#f_assignment_id').value = assignmentId;
    const resSel = $('#f_resource');
    if (resSel && State.workerPlanning) resSel.value = State.workerPlanning.resource || '';
    if ($('#f_start'))  $('#f_start').value  = planRow.start_date || '';
    if ($('#f_end'))    $('#f_end').value    = planRow.end_date || '';
    if ($('#f_hours'))  $('#f_hours').value  = planRow.hours || '';
    // Fall back to Even if the saved distribution isn't one of the
    // currently-allowed modes (e.g. a legacy 'Custom' row -- removed in
    // WFM.12 -- mirrors the server's defensive default-to-Even).
    const allowedDist_ = ['Even', 'Front-loaded', 'Back-loaded'];
    const restoredDist_ = allowedDist_.includes(planRow.distribution) ? planRow.distribution : 'Even';
    $$('#f_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === restoredDist_));
    const scenSel = $('#f_scenario');
    if (scenSel && planRow.scenario_id) scenSel.value = planRow.scenario_id;
  }

  async function _planningCommit_(id, type) {
    const ok = await confirmAction_({
      title: 'Commit ' + type + '?',
      body: 'Commit this ' + type + '? It will become part of the committed baseline.',
      confirmLabel: 'Commit',
      confirmStyle: 'primary',
      asyncHandler: async () => {
        if (type === 'assignment') await call('api_commitAssignment', id);
        else await call('api_commitCapacityAdjustment', id);
      }
    });
    if (ok) {
      toast('Committed', 'ok');
      await loadWorkerPlanning_(State.selectedResource);
      if (State.currentView === 'explorer') {
        await refreshExplorer_({ reason: 'commit' });
      }
    }
  }

  async function _planningRevert_(id, type) {
    const ok = await confirmAction_({
      title: 'Revert to Modeled?',
      body: 'Revert to Modeled? This removes it from the committed baseline.',
      confirmLabel: 'Revert',
      confirmStyle: 'primary',
      asyncHandler: async () => {
        if (type === 'assignment') await call('api_revertAssignmentToModeled', id);
        else await call('api_revertCapacityAdjustmentToModeled', id);
      }
    });
    if (ok) {
      toast('Reverted to Modeled', 'ok');
      await loadWorkerPlanning_(State.selectedResource);
    }
  }

  async function _planningDelete_(id, type, skipConfirm) {
    if (type === 'assignment') {
      const reason = skipConfirm ? 'Archived via status flip' : prompt('Reason for archiving this assignment (required):');
      if (!reason || !reason.trim()) return;
      try {
        await call('api_archiveAssignment', id, reason.trim());
        toast('Assignment archived', 'ok');
        await loadWorkerPlanning_(State.selectedResource);
      } catch (err) { toast('Archive failed: ' + err.message, 'err'); }
    } else {
      const delOk = skipConfirm ? true : await confirmAction_({
        title: 'Delete reduction?',
        body: 'Delete this reduction? This cannot be undone.',
        confirmLabel: 'Delete',
        confirmStyle: 'danger'
      });
      if (!delOk) return;
      try {
        await call('api_deleteCapacityAdjustment', id);
        toast('Reduction deleted', 'ok');
        await loadWorkerPlanning_(State.selectedResource);
      } catch (err) { toast('Delete failed: ' + err.message, 'err'); }
    }
  }

  // Planning filter controls (client-side, no re-fetch)
  $$('#planningStatusFilter button, #planningTypeFilter button').forEach(btn => {
    btn.addEventListener('click', () => {
      const parent = btn.closest('.seg');
      parent.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === btn));
      renderWorkerPlanning_();
    });
  });
  $('#planningScenarioFilter')?.addEventListener('change', renderWorkerPlanning_);
</script>

<script>
  // ============================================================
  // Assign drawer (Pipeline / Deployments)
  //
  // NOTE: Priority 4 will substantially restructure this drawer
  // (Role dropdown from Config_Resource_Type, Resource filtered
  // to SLG-only, both required, save resource_type + team_label).
  // This block is the pre-Priority-4 implementation, unchanged.
  // ============================================================
    // ============================================================
  // Priority 4: Assign drawer with resource_type-sourced Role
  // dropdown and SLG-only Resource dropdown. Both required.
  //
  // Role:     populated from State.ref.resourceTypeOptions (Config_Resource_Type).
  // Resource: filtered to worker_class in (SLG_Real, SLG_Generic),
  //           including Generic_Resources (which are stamped SLG_Generic
  //           server-side via _resourceIndex_).
  // Both have empty-value placeholders to fail browser native required validation.
  // ============================================================
  async function openAssignDrawer_(opportunityId, source) {
    hideSoftBookAssignFields_();
    if (!State.scenarios.length) await loadScenariosList();
    const drawer = $('#assignDrawer');
    const opp = State.opportunities.find(o => o.opportunity_id === opportunityId) ||
                State.deployments.find(d => d.deployment_id === opportunityId);
    if (!opp) return;

    $('#drawerAccount').textContent = opp.account || opp.account_name || '—';
    $('#drawerOppName').textContent = opp.opportunity_name || opp.deployment_name || 'Assign';
    $('#drawerStage').textContent = opp.stage || opp.deployment_stage || '—';
    $('#drawerProb').textContent = opp.probability ? fmtPct(opp.probability / 100) : '—';
    $('#drawerSegment').textContent = opp.segment || opp.industry || '—';

    $('#f_assignment_id').value = '';
    $('#f_opportunity_id').value = opportunityId;

    // Priority 4: Role dropdown sourced from Config_Resource_Type.
    // resourceTypeOptions is sorted alphabetically server-side.
    const roleSel = $('#f_role');
    const resourceTypeOptions = (State.ref && State.ref.resourceTypeOptions) || [];
    roleSel.innerHTML = '<option value="">— Select role —</option>' +
      resourceTypeOptions
        .map(rt => `<option value="${escapeHtml_(rt)}">${escapeHtml_(rt)}</option>`)
        .join('');

    // Priority 4: Resource dropdown filtered to SLG workers only
    // (SLG_Real + SLG_Generic, including Generic_Resources).
    const resSel = $('#f_resource');
    const allResources = (State.ref && State.ref.resources) || [];
    const slgResources = allResources.filter(r =>
      r.worker_class === 'SLG_Real' || r.worker_class === 'SLG_Generic'
    );
    resSel.innerHTML = '<option value="">— Select resource —</option>' +
      slgResources
        .map(r => `<option value="${escapeHtml_(r.name)}">${escapeHtml_(r.name)}</option>`)
        .join('');

    // Populate scenarios (unchanged)
    const scenSel = $('#f_scenario');
    scenSel.innerHTML = '<option value="">— No scenario —</option>' +
      (State.scenarios || [])
        .filter(s => s.status !== 'Archived')
        .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`).join('');

    $('#f_start').value = '';
    $('#f_end').value = '';
    $('#f_hours').value = '';
    $('#f_notes').value = '';
    $$('#f_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === 'Even'));

    drawer.hidden = false;
  }

  async function openAssignDrawerFromSoftBooking_(booking) {
    if (!booking) {
      toast('No pending soft booking to commit.', 'err');
      return;
    }
    if (!State.scenarios.length) await loadScenariosList();
    if (!State.opportunities || !State.opportunities.length) {
      try { State.opportunities = await call('api_listOpportunities', {}); } catch (e) {}
    }
    if (!State.deployments || !State.deployments.length) {
      try { State.deployments = await call('api_listDeployments'); } catch (e) {}
    }
    const drawer = $('#assignDrawer');
    $('#drawerAccount').textContent = 'Soft booking';
    $('#drawerOppName').textContent = booking.resource_name;
    $('#drawerStage').textContent = 'Commit';
    $('#drawerProb').textContent = '—';
    $('#drawerSegment').textContent = '—';

    $('#f_assignment_id').value = '';
    $('#f_opportunity_id').value = '';

    const roleSel = $('#f_role');
    const resourceTypeOptions = (State.ref && State.ref.resourceTypeOptions) || [];
    roleSel.innerHTML = '<option value="">— Select role —</option>' +
      resourceTypeOptions
        .map(rt => `<option value="${escapeHtml_(rt)}">${escapeHtml_(rt)}</option>`)
        .join('');

    const resSel = $('#f_resource');
    const allResources = (State.ref && State.ref.resources) || [];
    const slgResources = allResources.filter(r =>
      r.worker_class === 'SLG_Real' || r.worker_class === 'SLG_Generic'
    );
    resSel.innerHTML = '<option value="">— Select resource —</option>' +
      slgResources
        .map(r => `<option value="${escapeHtml_(r.name)}">${escapeHtml_(r.name)}</option>`)
        .join('');

    const scenSel = $('#f_scenario');
    scenSel.innerHTML = '<option value="">— No scenario —</option>' +
      (State.scenarios || [])
        .filter(s => s.status !== 'Archived')
        .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`).join('');

    const resourceType = getResourceTypeForWorker_(booking.resource_name);
    if (resourceType) roleSel.value = resourceType;
    resSel.value = booking.resource_name;
    $('#f_start').value = booking.start_date;
    $('#f_end').value = booking.end_date;
    $('#f_hours').value = booking.total_hours;
    $('#f_notes').value = '';
    $$('#f_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === 'Even'));

    populateSoftBookWhatSelect_();
    const whatField = $('#softBookWhatField');
    if (whatField) whatField.hidden = false;
    const whatSel = $('#f_softbook_what');
    if (whatSel) whatSel.value = '';
    State.softBookCommitKey = softBookCommitKey_(booking);

    drawer.hidden = false;
  }

  $('#assignDrawer')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      $('#assignDrawer').hidden = true;
      hideSoftBookAssignFields_();
    }
  });

  $('#f_softbook_what')?.addEventListener('change', function () {
    $('#f_opportunity_id').value = this.value || '';
    const sel = this.options[this.selectedIndex];
    if (sel && sel.value) {
      $('#drawerAccount').textContent = sel.dataset.account || '—';
      $('#drawerOppName').textContent = sel.dataset.name || sel.textContent;
    } else {
      $('#drawerAccount').textContent = 'Soft booking';
      const booking = getSoftBookingForPerWorkerCommit_();
      $('#drawerOppName').textContent = booking ? booking.resource_name : 'Assign';
    }
  });

  $$('#f_distribution button').forEach(b => {
    b.addEventListener('click', () => {
      $$('#f_distribution button').forEach(x => x.classList.toggle('on', x === b));
    });
  });

  $('#f_newScenarioBtn')?.addEventListener('click', () => {
    openScenarioModal_();
  });

  $('#assignForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    await withLoading_($('#saveModeledBtn'), () => saveAssignment_('Modeled'), { label: 'Saving...' });
  });

  $('#commitNowBtn')?.addEventListener('click', async function() {
    await withLoading_(this, () => saveAssignment_('Committed'), { label: 'Committing...' });
  });

    // ============================================================
  // Priority 4: required-field validation + resource_type payload.
  //
  // Client sends the user's literal Role-dropdown selection as
  // resource_type. Server enriches team_label, role (ICP), and team
  // via saveAssignment_ in Assignments.gs. Whatever the client sends
  // for role/team/team_label is overwritten server-side; we send role
  // as an empty string to be explicit about this.
  //
  // Both Role and Resource are required. Client-side validation
  // catches both the form-submit path (Save as Modeled) and the
  // direct button-click path (Commit Now) which bypasses native
  // browser required validation.
  // ============================================================
  async function saveAssignment_(status) {
    const resourceType = $('#f_role').value;
    const resourceName = $('#f_resource').value;

    // Required-field validation (covers Commit Now bypass of native required)
    if (!resourceType) {
      toast('Role is required.', 'err');
      return;
    }
    if (!resourceName) {
      toast('Resource is required.', 'err');
      return;
    }

        const dist = $$('#f_distribution button').find(b => b.classList.contains('on'));
    const distVal = dist ? dist.dataset.val : 'Even';

    const payload = {
      assignment_id: $('#f_assignment_id').value || null,
      opportunity_id: $('#f_opportunity_id').value,
      resource_type: resourceType,              // Priority 4: canonical role field
      role: '',                                  // Priority 4: server derives from team_label
      resource_name: resourceName,
      start_date: $('#f_start').value,
      end_date: $('#f_end').value,
      estimated_hours: Number($('#f_hours').value) || 0,
      distribution: distVal,
      scenario_id: $('#f_scenario').value || null,
      notes: $('#f_notes').value,
      status: status
    };
    const panel = $('#assignDrawer .drawer-panel') || $('#assignDrawer');
    const spinner = panel?.querySelector('.drawer-spinner');
    if (panel) panel.classList.add('is-submitting');
    if (spinner) spinner.textContent = (status === 'Committed') ? 'Committing...' : 'Saving...';
    try {
      await call('api_saveAssignment', payload);
      toast('Assignment saved as ' + status, 'ok');
      $('#assignDrawer').hidden = true;
      hideSoftBookAssignFields_();
      const softBookCommitted = removeSoftBookCommitIfDone_();
      if (softBookCommitted) {
        refreshExplorer_({ reason: 'softbook-commit' });
      } else if (State.currentView === 'dashboard') loadDashboard();
      else if (State.currentView === 'scenarios') loadScenarios();
      // Refresh planning card if the affected worker is selected
      if (State.selectedResource && State.selectedResource === resourceName) {
        loadWorkerPlanning_(resourceName);
      }
    } catch (err) {
      toast('Save failed: ' + err.message, 'err');
    } finally {
      if (panel) panel.classList.remove('is-submitting');
    }
  }

    // ============================================================
  // Priority 4 patch: restore Monthly Load Preview chart.
  //
  // Wires the drawer's #previewChart canvas to api_previewAssignment.
  // Triggered on distribution change OR debounced input on start/end/
  // hours fields. Chart is destroyed on drawer close to prevent
  // duplicate instances on re-open.
  //
  // collectFormForPreview_ sends only what api_previewAssignment needs
  // (dates, hours, distribution). It does NOT mirror the save-time
  // payload — Priority 4's resource_type/role/team_label enrichment is
  // server-side at save time and irrelevant to monthly preview math.
  // ============================================================
  function closeDrawer_() {
    $('#assignDrawer').hidden = true;
    hideSoftBookAssignFields_();
    if (State.charts.preview) {
      State.charts.preview.destroy();
      State.charts.preview = null;
    }
  }

    function collectFormForPreview_() {
    const dist = $$('#f_distribution button').find(b => b.classList.contains('on'));
    const distVal = dist ? dist.dataset.val : 'Even';
    return {
      start_date: $('#f_start').value,
      end_date: $('#f_end').value,
      estimated_hours: Number($('#f_hours').value) || 0,
      distribution: distVal
    };
  }

  async function updatePreview_() {
    const a = collectFormForPreview_();
    if (!a.start_date || !a.end_date || !a.estimated_hours) return;
    try {
      const months = await call('api_previewAssignment', a);
      renderPreviewChart_(months);
    } catch (err) {
      // silent during typing
    }
  }

    function renderPreviewChart_(months) {
    const filtered = months.filter(m => monthKeyOnOrAfterToday(m.monthKey));
    const src = filtered.length ? filtered : months;
    const ctx = $('#previewChart').getContext('2d');
    if (State.charts.preview) State.charts.preview.destroy();
    const cs = getComputedStyle(document.documentElement);
    State.charts.preview = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: src.map(m => fmtMonth(m.monthKey)),
        datasets: [{
          label: 'Hours',
          data: src.map(m => Math.round(m.hours)),
          backgroundColor: cs.getPropertyValue('--ballpoint').trim()
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: false, resizeDelay: 100,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false } },
          y: { grid: { color: '#ECEEF1' }, title: { display: true, text: 'Hours' } }
        }
      }
    });
  }

  // ============================================================
  // Distribution controls (Even / Front-loaded / Back-loaded only --
  // Custom removed in WFM.12; see the parent commit message for why).
  // ============================================================

  // Event wiring — distribution segmented control change
  $('#f_distribution')?.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    // The visual .on toggle is already handled elsewhere (in the
    // existing $$('#f_distribution button').forEach handler).
    updatePreview_();
  });

  // Event wiring — date and hours inputs (debounced 200ms).
  ['f_start', 'f_end', 'f_hours'].forEach(id => {
    $('#' + id)?.addEventListener('input', () => {
      clearTimeout(window._previewTimer);
      window._previewTimer = setTimeout(updatePreview_, 200);
    });
  });

  // Drawer close — destroy chart instance to prevent leaks on re-open
  $('#assignDrawer')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      if (State.charts.preview) {
        State.charts.preview.destroy();
        State.charts.preview = null;
      }
    }
  });
</script>

<script>
  // ============================================================
  // Admin
  // ============================================================
  function renderDataFreshness_(data) {
    const body = $('#dataFreshnessBody');
    if (!body) return;
    const feeds = [
      { key: 'wowIngest', label: 'Consolidated WoW ingest' },
      { key: 'pipeline', label: 'Pipeline (Salesforce)' },
      { key: 'deployments', label: 'Deployments' }
    ];
    body.innerHTML = feeds.map(function (f) {
      const feed = (data && data[f.key]) || {};
      const ok = feed.lastSuccess;
      const fail = feed.lastFailure;
      const successHtml = ok
        ? escapeHtml_(fmtDateTime(ok.when)) + ' — ' + escapeHtml_(ok.detail || '')
        : '<span class="muted">No successful run found</span>';
      const failHtml = fail
        ? '<span class="data-freshness-fail">' +
          escapeHtml_(fmtDateTime(fail.when)) + ' — ' + escapeHtml_(fail.detail || '') +
          '</span>'
        : '<span class="muted">no recent failures</span>';
      return '<div class="data-freshness-feed">' +
        '<div class="data-freshness-feed-label">' + escapeHtml_(f.label) + '</div>' +
        '<div class="data-freshness-line"><span class="data-freshness-line-label">Last successful update:</span> ' +
          successHtml + '</div>' +
        '<div class="data-freshness-line"><span class="data-freshness-line-label">Last failed run:</span> ' +
          failHtml + '</div>' +
        '</div>';
    }).join('');
  }

  async function loadAdmin() {
    try {
      const freshness = await call('api_getDataFreshness');
      renderDataFreshness_(freshness);

      const generics = await call('api_listAllGenericResources');
      const rtOpts = await loadResourceTypeOptions_();
      renderGenericResources_(generics, rtOpts);

      const excl = await call('api_getExclusions');
      $('#exclusionsBody').innerHTML = (excl || []).map(w => `
        <tr>
          <td><input type="checkbox" data-excl-active ${String(w.active).toLowerCase() === 'yes' ? 'checked' : ''}></td>
          <td>${escapeHtml_(w.worker_name)}</td>
          <td>${escapeHtml_(w.manager_org)}</td>
          <td>${escapeHtml_(w.reason || '')}</td>
        </tr>
      `).join('');
    } catch (err) {
      toast('Admin load failed: ' + err.message, 'err');
    }
  }

  $('#saveExclusionsBtn')?.addEventListener('click', async function() {
    const rows = $$('#exclusionsBody tr').map(tr => ({
      worker_name: (tr.querySelector('[data-excl-name]') || {}).textContent || '',
      manager_org: (tr.querySelector('[data-excl-org]') || {}).textContent || '',
      reason:      (tr.querySelector('[data-excl-reason]') || {}).textContent || '',
      active:      (tr.querySelector('[data-excl-active]') || {}).checked ? 'Yes' : 'No'
    }));
    await withLoading_(this, async () => {
      await call('api_saveExclusions', { workers: rows });
      toast('Exclusions saved', 'ok');
    }, { label: 'Saving...' });
  });

  $('#flushCachesBtn')?.addEventListener('click', async () => {
    await call('api_flushCaches');
    toast('Caches flushed', 'ok');
    State.ref = await call('api_getReference');
    reloadCurrentView_();
  });

  $('#refreshOppsBtn')?.addEventListener('click', async () => {
    await call('api_refreshOpportunities');
    toast('Opportunities refreshed', 'ok');
    loadAdmin();
  });

  // ============================================================
  // Drop 6: Generic Resources — editable table
  // ============================================================

  /**
   * Render Generic Resources rows as an editable table.
   * Each row has inline inputs; newly added rows get .generic-new-row.
   * @param {Object[]} rows — rows from api_listGenericResources (all rows, including Inactive)
   */
  /**
   * Render the Generic Resources table body.
   * @param {Object[]} rows   — rows from api_listAllGenericResources
   * @param {Object}   [rtOptions]  — map from api_getResourceTypeOptions
   */
  function renderGenericResources_(rows, rtOptions) {
    const gBody = $('#genericBody');
    if (!gBody) return;
    if (!rows || !rows.length) {
      gBody.innerHTML = '<tr><td colspan="12" class="muted" style="padding:12px">No generic resources configured yet.</td></tr>';
      return;
    }
    gBody.innerHTML = rows.map((g, i) => _genericRow_(g, i, rtOptions || {})).join('');
  }

  /**
   * Build a team <select> option list for the given current value.
   * @param {Object} rtOptions  — { team: [resource_types] }
   * @param {string} currentVal — existing row.team value
   */
  function _teamSelectOptions_(rtOptions, currentVal) {
    const teams = Object.keys(rtOptions || {}).sort();
    const hasMatch = teams.includes(currentVal);
    let html = '<option value="">— Select team —</option>';
    if (currentVal && !hasMatch) {
      html += `<option value="${escapeHtml_(currentVal)}" selected>(unmapped: ${escapeHtml_(currentVal)})</option>`;
    }
    html += teams.map(t =>
      `<option value="${escapeHtml_(t)}"${t === currentVal ? ' selected' : ''}>${escapeHtml_(t)}</option>`
    ).join('');
    return html;
  }

  /**
   * Build a resource-type <select> option list for the given team + current value.
   * @param {Object} rtOptions  — { team: [resource_types] }
   * @param {string} team       — currently selected team
   * @param {string} currentVal — existing row.resource_type value
   */
  function _rtSelectOptions_(rtOptions, team, currentVal) {
    if (!team) {
      return `<option value="">— Select team first —</option>`;
    }
    const rts = (rtOptions && rtOptions[team]) || [];
    const hasMatch = rts.includes(currentVal);
    let html = '<option value="">— Select —</option>';
    if (currentVal && !hasMatch) {
      html += `<option value="${escapeHtml_(currentVal)}" selected>(unmapped: ${escapeHtml_(currentVal)})</option>`;
    }
    html += rts.map(rt =>
      `<option value="${escapeHtml_(rt)}"${rt === currentVal ? ' selected' : ''}>${escapeHtml_(rt)}</option>`
    ).join('');
    return html;
  }

  /** Build a single editable row string with cascading Team/Resource Type selects. */
  function _genericRow_(g, i, rtOptions) {
    const mgr = g.manager_org || '';
    const statusOpts = ['Active','Inactive'].map(s =>
      `<option value="${s}"${g.status === s ? ' selected' : ''}>${s}</option>`
    ).join('');
    const mgrOpts = '<option value="">— None —</option>' +
      (State.ref.managerOrgs || []).map(m =>
        `<option value="${escapeHtml_(m)}"${mgr === m ? ' selected' : ''}>${escapeHtml_(m)}</option>`
      ).join('');
    const startVal = g.start_date ? (g.start_date instanceof Date
      ? g.start_date.toISOString().slice(0,10) : String(g.start_date).slice(0,10)) : '';
    const endVal = g.end_date ? (g.end_date instanceof Date
      ? g.end_date.toISOString().slice(0,10) : String(g.end_date).slice(0,10)) : '';
    const currentTeam = g.team || '';
    const currentRt   = g.resource_type || '';
    const teamDisabled  = '';
    const rtDisabled    = currentTeam ? '' : ' disabled';
    return `
      <tr data-row-index="${i}">
        <td><input type="text" class="table-input" data-g="name" value="${escapeHtml_(g.name)}" placeholder="Name" required></td>
        <td><select class="table-input select" data-g="resource_type" id="gen-rt-${i}"${rtDisabled}>${_rtSelectOptions_(rtOptions, currentTeam, currentRt)}</select></td>
        <td><input type="text" class="table-input" data-g="project_role" value="${escapeHtml_(g.project_role)}"></td>
        <td><select class="table-input select" data-g="manager_org">${mgrOpts}</select></td>
        <td><select class="table-input select" data-g="team" id="gen-team-${i}">${_teamSelectOptions_(rtOptions, currentTeam)}</select></td>
        <td><input type="text" class="table-input" data-g="practice" value="${escapeHtml_(g.practice)}"></td>
        <td><input type="date" class="table-input" data-g="start_date" value="${startVal}"></td>
        <td><input type="date" class="table-input" data-g="end_date" value="${endVal}"></td>
        <td><input type="number" class="table-input" data-g="capacity_hours" min="0" value="${Number(g.capacity_hours) || 160}" style="width:70px;text-align:right;"></td>
        <td><select class="table-input select" data-g="status">${statusOpts}</select></td>
        <td><input type="text" class="table-input" data-g="notes" value="${escapeHtml_(g.notes)}"></td>
        <td><button type="button" class="generic-delete-btn" title="Delete this row">×</button></td>
      </tr>`;
  }

  /**
   * Walk the rendered rows, build an array of objects matching the
   * Generic_Resources schema. Rows with a blank name are filtered out
   * (user added then abandoned).
   */
  function collectGenericResources_() {
    return $$('#genericBody tr[data-row-index]').map(tr => {
      const get = (attr) => {
        const el = tr.querySelector('[data-g="' + attr + '"]');
        return el ? el.value : '';
      };
      return {
        name:           get('name').trim(),
        resource_type:  get('resource_type').trim(),
        project_role:   get('project_role').trim(),
        manager_org:    get('manager_org'),
        team:           get('team').trim(),
        practice:       get('practice').trim(),
        start_date:     get('start_date'),
        end_date:       get('end_date'),
        capacity_hours: Number(get('capacity_hours')) || 160,
        status:         get('status') || 'Active',
        notes:          get('notes').trim()
      };
    }).filter(r => r.name !== '');
  }

  // Inline Delete confirmation
  document.addEventListener('click', (e) => {
    const delBtn = e.target.closest('.generic-delete-btn');
    if (!delBtn) return;
    const td = delBtn.parentElement;
    delBtn.style.display = 'none';
    const confirm = document.createElement('span');
    confirm.className = 'generic-delete-confirm';
    confirm.innerHTML = '<button class="confirm-yes">Confirm</button><button class="confirm-cancel">Cancel</button>';
    td.appendChild(confirm);
    confirm.querySelector('.confirm-yes').addEventListener('click', () => {
      delBtn.closest('tr').remove();
    });
    confirm.querySelector('.confirm-cancel').addEventListener('click', () => {
      confirm.remove();
      delBtn.style.display = '';
    });
  });

  // Cascading Team → Resource Type: event delegation on genericBody
  $('#genericBody')?.addEventListener('change', function(e) {
    const sel = e.target;
    if (!sel.matches('[data-g="team"]')) return;
    const tr = sel.closest('tr[data-row-index]');
    if (!tr) return;
    const idx = tr.dataset.rowIndex;
    const rtSel = tr.querySelector('[data-g="resource_type"]');
    if (!rtSel) return;
    const newTeam = sel.value;
    const rtOptions = _resourceTypeOptionsCache || {};
    rtSel.innerHTML = _rtSelectOptions_(rtOptions, newTeam, '');
    rtSel.disabled = !newTeam;
  });

  // "+ Add Generic Worker" button
  $('#addGenericBtn')?.addEventListener('click', async () => {
    const gBody = $('#genericBody');
    // Clear the empty-state placeholder row if present
    const placeholder = gBody.querySelector('td[colspan]');
    if (placeholder) placeholder.closest('tr').remove();

    const idx = $$('#genericBody tr[data-row-index]').length;
    const blank = {
      name: '', resource_type: '', project_role: '',
      manager_org: '', team: '', practice: '',
      start_date: '', end_date: '',
      capacity_hours: 160, status: 'Active', notes: ''
    };
    const rtOptions = await loadResourceTypeOptions_();
    const div = document.createElement('tbody');
    div.innerHTML = _genericRow_(blank, idx, rtOptions);
    const newRow = div.querySelector('tr');
    newRow.classList.add('generic-new-row');
    gBody.prepend(newRow);
    newRow.querySelector('[data-g="name"]')?.focus();
  });

  // Save Generic Resources
  $('#saveGenericBtn')?.addEventListener('click', async function() {
    const resources = collectGenericResources_();
    // Duplicate name check (client-side for fast feedback)
    const names = resources.map(r => r.name.toLowerCase());
    const dupes = names.filter((n, i) => names.indexOf(n) !== i);
    if (dupes.length) {
      toast('Duplicate names: ' + [...new Set(dupes)].join(', '), 'err');
      return;
    }
    await withLoading_(this, async () => {
      try {
        await call('api_saveGenericResources', { resources });
        await call('api_flushCaches');
        State.ref = await call('api_getReference');
        toast('Generic resources saved', 'ok');
        const fresh = await call('api_listAllGenericResources');
        const freshRtOpts = await loadResourceTypeOptions_();
        renderGenericResources_(fresh, freshRtOpts);
      } catch (err) {
        toast('Save failed: ' + err.message, 'err');
      }
    }, { label: 'Saving...' });
  });

  // ============================================================
  // Admin tab navigation (Drop 2)
  // ============================================================
  function initAdminTabs_() {
    document.addEventListener('click', (e) => {
      const tab = e.target.closest('[data-admin-tab]');
      if (!tab) return;
      activateAdminTab_(tab.dataset.adminTab);
    });
  }

  function activateAdminTab_(tabName) {
    tabName = resolveAdminTab_(tabName);
    $$('[data-admin-tab]').forEach(btn => {
      const isActive = btn.dataset.adminTab === tabName;
      btn.classList.toggle('on', isActive);
      btn.setAttribute('aria-selected', String(isActive));
    });
    $$('[data-admin-panel]').forEach(panel => {
      panel.hidden = panel.dataset.adminPanel !== tabName;
    });
    try { localStorage.setItem(ADMIN_TAB_KEY, tabName); } catch (e) {}
    if (tabName === 'overrides') loadOverridesAdmin_();
  }

  // Consolidated workbook upload (WFM.21)
  const consolidatedUploadZone = $('#consolidatedUploadZone');
  const consolidatedFile = $('#consolidatedFile');
  const consolidatedBrowseBtn = $('#consolidatedBrowseBtn');
  const CONSOLIDATED_REQUIRED_SHEETS_UI = [
    'Forecast_Staged',
    'Actuals_Current_Normalized',
    'Utilization_Normalized',
    'History_Normalized',
    '_manifest'
  ];

  consolidatedBrowseBtn?.addEventListener('click', () => consolidatedFile.click());
  consolidatedUploadZone?.addEventListener('dragover', (e) => {
    e.preventDefault();
    consolidatedUploadZone.classList.add('drag');
  });
  consolidatedUploadZone?.addEventListener('dragleave', () => {
    consolidatedUploadZone.classList.remove('drag');
  });
  consolidatedUploadZone?.addEventListener('drop', (e) => {
    e.preventDefault();
    consolidatedUploadZone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleConsolidatedFile_(e.dataTransfer.files[0]);
  });
  consolidatedFile?.addEventListener('change', () => {
    if (consolidatedFile.files.length) handleConsolidatedFile_(consolidatedFile.files[0]);
  });

  function setConsolidatedUploadBusy_(busy) {
    consolidatedUploadZone?.classList.toggle('is-disabled', !!busy);
    if (consolidatedBrowseBtn) consolidatedBrowseBtn.disabled = !!busy;
    if (consolidatedFile) consolidatedFile.disabled = !!busy;
  }

  function renderConsolidatedUploadResult_(result) {
    const panel = $('#consolidatedUploadResult');
    if (!panel) return;
    panel.hidden = false;

    const passed = !!(result.preflight && result.preflight.passed);
    const success = result.success !== false && passed;
    panel.className = 'consolidated-upload-result ' + (success ? 'is-ok' : 'is-fail');

    const checks = (result.preflight && result.preflight.checks) || [];
    const sheetChecks = CONSOLIDATED_REQUIRED_SHEETS_UI.map(function (sheetName) {
      const check = checks.find(function (c) {
        return (c.label || c.check) === 'sheet_present:' + sheetName;
      });
      return {
        sheet: sheetName,
        passed: check ? !!check.passed : false,
        detail: check ? check.detail : 'No preflight result'
      };
    });

    const failedChecks = checks.filter(function (c) { return !c.passed; });
    const written = result.written || {};
    const warnings = result.warnings || [];

    panel.innerHTML = `
      <div class="consolidated-result-title">${success ? 'Ingest complete' : 'Preflight failed — no data written'}</div>
      <div class="consolidated-metric">
        <span class="consolidated-metric-label">Preflight</span>
        <span class="consolidated-metric-value">${passed ? 'Passed' : 'Failed'}</span>
      </div>
      <div class="consolidated-result-title" style="margin-top:12px;">Required sheets</div>
      <ul class="consolidated-check-list">
        ${sheetChecks.map(function (item) {
          return `<li>
            <span class="consolidated-check-badge ${item.passed ? 'pass' : 'fail'}">${item.passed ? 'OK' : 'FAIL'}</span>
            <span><code>${escapeHtml_(item.sheet)}</code>${item.detail ? ' — ' + escapeHtml_(item.detail) : ''}</span>
          </li>`;
        }).join('')}
      </ul>
      ${success ? `
        <div class="consolidated-result-title">Rows written</div>
        <div class="consolidated-written-grid">
          <div class="consolidated-metric">
            <span class="consolidated-metric-label">Forecast normalized</span>
            <span class="consolidated-metric-value">${Number(written.forecastRowsOut || 0).toLocaleString()}</span>
          </div>
          <div class="consolidated-metric">
            <span class="consolidated-metric-label">Actuals normalized</span>
            <span class="consolidated-metric-value">${Number(written.actualsRowsOut || 0).toLocaleString()}</span>
          </div>
          <div class="consolidated-metric">
            <span class="consolidated-metric-label">Worker summary</span>
            <span class="consolidated-metric-value">${Number(written.summaryRowsOut || 0).toLocaleString()}</span>
          </div>
          <div class="consolidated-metric">
            <span class="consolidated-metric-label">Utilization quarterly</span>
            <span class="consolidated-metric-value">${Number(written.utilQuarterlyRows || 0).toLocaleString()}</span>
          </div>
          <div class="consolidated-metric">
            <span class="consolidated-metric-label">History</span>
            <span class="consolidated-metric-value">${Number(written.historyRows || 0).toLocaleString()}</span>
          </div>
        </div>
      ` : `
        <div class="consolidated-result-title">Failed checks</div>
        <ul class="consolidated-check-list">
          ${failedChecks.slice(0, 12).map(function (item) {
            return `<li>
              <span class="consolidated-check-badge fail">FAIL</span>
              <span>${escapeHtml_(item.label || item.check)}${item.detail ? ' — ' + escapeHtml_(item.detail) : ''}</span>
            </li>`;
          }).join('')}
          ${failedChecks.length > 12 ? `<li class="muted">…and ${failedChecks.length - 12} more</li>` : ''}
        </ul>
      `}
      ${warnings.length ? `
        <div class="consolidated-warnings">
          <strong>Warnings (${warnings.length})</strong>
          <ul style="margin:6px 0 0 18px;padding:0;">
            ${warnings.slice(0, 8).map(function (w) { return '<li>' + escapeHtml_(w) + '</li>'; }).join('')}
            ${warnings.length > 8 ? '<li>…and ' + (warnings.length - 8) + ' more</li>' : ''}
          </ul>
        </div>
      ` : ''}
    `;
  }

  function handleConsolidatedFile_(file) {
    const status = $('#consolidatedUploadStatus');
    const resultPanel = $('#consolidatedUploadResult');
    status.hidden = false;
    resultPanel.hidden = true;
    status.className = 'status info';
    status.textContent = 'Validating and ingesting ' + file.name + '…';
    setConsolidatedUploadBusy_(true);

    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(',')[1];
        const result = await call('api_uploadConsolidatedWorkbook', base64, file.name);
        if (!result || typeof result !== 'object' || !result.preflight) {
          throw new Error('Consolidated upload returned no readable result — check the server response contract.');
        }
        renderConsolidatedUploadResult_(result);

        if (result.success && result.preflight.passed) {
          status.className = 'status ok';
          const warnCount = (result.warnings || []).length;
          status.textContent = 'Consolidated workbook ingested successfully' +
            (warnCount ? ' · ' + warnCount + ' warning' + (warnCount === 1 ? '' : 's') : '');
          State.ref = await call('api_getReference');
          if (WFM25_SHELL) {
            WFM25State.scorecardData = null;
            WFM25State.xorgForecastData = null;
            WFM25State.specialtyDemandData = null;
        WFM25State.specialtyActualsData = null;
            await loadWFM25Utilization_();
          } else if (State.currentView === 'dashboard') {
            loadDashboard();
          }
          toast('Consolidated workbook ingested', 'ok');
          loadWFM25Freshness_();
          loadWFM25AdminRefreshLog_();
        } else {
          status.className = 'status err';
          status.textContent = 'Preflight failed — no destination data was written.';
          toast('Consolidated workbook preflight failed', 'err');
        }
      } catch (err) {
        status.className = 'status err';
        status.textContent = 'Upload failed: ' + err.message;
        resultPanel.hidden = false;
        resultPanel.className = 'consolidated-upload-result is-fail';
        resultPanel.innerHTML = '<div class="consolidated-result-title">Upload failed</div><div class="muted">' +
          escapeHtml_(err.message) + '</div>';
        toast('Consolidated upload failed', 'err');
      } finally {
        setConsolidatedUploadBusy_(false);
      }
    };
    reader.readAsDataURL(file);
  }

  // PSA upload
  const uploadZone = $('#uploadZone');
  const staffFile = $('#staffFile');
  $('#browseBtn')?.addEventListener('click', () => staffFile.click());
  uploadZone?.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone?.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone?.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleStaffFile_(e.dataTransfer.files[0]);
  });
  staffFile?.addEventListener('change', () => {
    if (staffFile.files.length) handleStaffFile_(staffFile.files[0]);
  });

  function handleStaffFile_(file) {
    const status = $('#uploadStatus');
    status.hidden = false;
    status.className = 'status info';
    status.textContent = 'Uploading ' + file.name + '…';
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(',')[1];
        const result = await call('api_uploadStaffFile', base64, file.name);
        status.className = 'status ok';
        const warnCount = (result.warnings || []).length;
        status.textContent = 'Uploaded: ' + result.rowsOut + ' rows normalized · ' + result.weeksDetected + ' weeks' +
          (warnCount ? ' · ' + warnCount + ' warning' + (warnCount === 1 ? '' : 's') + ' (see Admin → Normalization Log)' : '');
        State.ref = await call('api_getReference');
        if (State.currentView === 'dashboard') loadDashboard();
      } catch (err) {
        status.className = 'status err';
        status.textContent = 'Upload failed: ' + err.message;
      }
    };
    reader.readAsDataURL(file);
  }

  // Actuals upload
  const actualsUploadZone = $('#actualsUploadZone');
  const actualsFile = $('#actualsFile');
  $('#actualsBrowseBtn')?.addEventListener('click', () => actualsFile.click());
  actualsUploadZone?.addEventListener('dragover', (e) => { e.preventDefault(); actualsUploadZone.classList.add('drag'); });
  actualsUploadZone?.addEventListener('dragleave', () => actualsUploadZone.classList.remove('drag'));
  actualsUploadZone?.addEventListener('drop', (e) => {
    e.preventDefault();
    actualsUploadZone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleActualsFile_(e.dataTransfer.files[0]);
  });
  actualsFile?.addEventListener('change', () => {
    if (actualsFile.files.length) handleActualsFile_(actualsFile.files[0]);
  });

  function handleActualsFile_(file) {
    const status = $('#actualsUploadStatus');
    status.hidden = false;
    status.className = 'status info';
    status.textContent = 'Uploading ' + file.name + '…';
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(',')[1];
        const result = await call('api_uploadActualsFile', base64, file.name);
        status.className = 'status ok';
        const warnCount = (result.warnings || []).length;
        status.textContent = 'Uploaded: ' + result.rowsOut + ' rows normalized · ' + result.weeksDetected + ' weeks' +
          (warnCount ? ' · ' + warnCount + ' warning' + (warnCount === 1 ? '' : 's') + ' (see Admin → Normalization Log)' : '');
        State.ref = await call('api_getReference');
        if (State.currentView === 'dashboard') loadDashboard();
      } catch (err) {
        status.className = 'status err';
        status.textContent = 'Upload failed: ' + err.message;
      }
    };
    reader.readAsDataURL(file);
  }
</script>

<script>
  // ============================================================
  // Override Drawer (Drop 3)
  // ============================================================
  let _overridableFieldsCache_ = null;

  // Patch: client-side cache for api_getResourceTypeOptions.
  // { "Delivery": ["Engagement Manager", ...], ... }
  let _resourceTypeOptionsCache = null;

  async function loadResourceTypeOptions_() {
    if (!_resourceTypeOptionsCache) {
      _resourceTypeOptionsCache = await call('api_getResourceTypeOptions');
    }
    return _resourceTypeOptionsCache;
  }

  async function loadOverridableFields_() {
    if (!_overridableFieldsCache_) {
      _overridableFieldsCache_ = await call('api_listOverridableFields');
    }
    return _overridableFieldsCache_;
  }
