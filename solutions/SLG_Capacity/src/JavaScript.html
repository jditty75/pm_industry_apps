  async function openOverrideDrawer_(source, recordId) {
    const drawer = $('#overrideDrawer');
    if (!drawer) return;

    $('#overrideDrawerSource').textContent = source;
    $('#overrideDrawerTitle').textContent =
      'Edit ' + (source === 'Pipeline' ? 'opportunity' : 'deployment') + ' overrides';
    $('#overrideDrawerRecordId').textContent = String(recordId || '');
    $('#o_source').value = source;
    $('#o_record_id').value = recordId;
    $('#o_reason').value = '';
    $('#o_expires').value = '';

    try {
      const [fields, existingOverrides] = await Promise.all([
        loadOverridableFields_(),
        call('api_listOverrides', { source: source, record_id: recordId, status: 'Active' })
      ]);
      renderOverrideFields_(fields, existingOverrides, source, recordId);
    } catch (err) {
      $('#overrideFieldsContainer').innerHTML =
        '<div class="muted" style="padding:8px 0;">Failed to load field definitions: ' +
        escapeHtml_(err.message) + '</div>';
    }

    drawer.hidden = false;
  }

  function renderOverrideFields_(fields, currentOverrides, source, recordId) {
    const container = $('#overrideFieldsContainer');
    if (!container) return;

    const sourceFields = (fields || []).filter(function (f) { return f.source === source; });
    const overrideByField = {};
    (currentOverrides || []).forEach(function (o) { overrideByField[o.field] = o; });

    const sourceRecords = source === 'Pipeline' ? State.opportunities : State.deployments;
    const sourceRecord = sourceRecords.find(function (r) {
      return (r.opportunity_id || r.deployment_id) === recordId;
    }) || {};

    if (!sourceFields.length) {
      container.innerHTML = '<div class="muted" style="padding:8px 0;">No overridable fields configured for ' + escapeHtml_(source) + '.</div>';
      return;
    }

    container.innerHTML = sourceFields.map(function (f) {
      const existing = overrideByField[f.field];
      const sourceValue = sourceRecord[f.field] != null ? String(sourceRecord[f.field]) : '';
      const currentValue = existing ? String(existing.override_value || '') : '';

      let inputHtml;
      switch (f.data_type) {
        case 'date':
          inputHtml = '<input type="date" class="input override-field-input" data-field="' +
            escapeHtml_(f.field) + '" value="' + escapeHtml_(currentValue) + '">';
          break;
        case 'number':
        case 'currency':
        case 'percent':
          inputHtml = '<input type="number" step="any" class="input override-field-input" data-field="' +
            escapeHtml_(f.field) + '" placeholder="' + escapeHtml_(sourceValue) + '" value="' +
            escapeHtml_(currentValue) + '">';
          break;
        default:
          inputHtml = '<input type="text" class="input override-field-input" data-field="' +
            escapeHtml_(f.field) + '" placeholder="' + escapeHtml_(sourceValue) + '" value="' +
            escapeHtml_(currentValue) + '">';
      }

      const isOverridden = !!existing;
      const overriddenBadge = isOverridden
        ? '<span class="badge amber" style="font-size:10px;padding:1px 5px;margin-left:4px;">overridden</span>'
        : '';
      const metaHtml = isOverridden
        ? '<div class="override-field-meta">Original: ' + escapeHtml_(String(existing.original_value || '')) +
          ' · By ' + escapeHtml_(existing.created_by || '') +
          ' · ' + (existing.created_at ? existing.created_at.slice(0, 10) : '') + '</div>'
        : '';

      const rowAttrs = [
        'class="override-field-row"',
        'data-field="' + escapeHtml_(f.field) + '"',
        existing ? 'data-override-id="' + escapeHtml_(String(existing.override_id || '')) + '"' : '',
        existing ? 'data-modified-at="' + escapeHtml_(String(existing.modified_at || '')) + '"' : ''
      ].filter(Boolean).join(' ');

      return '<div ' + rowAttrs + '>' +
        '<div class="override-field-label">' + escapeHtml_(f.label) + overriddenBadge + '</div>' +
        inputHtml +
        metaHtml +
        '</div>';
    }).join('');
  }

  async function submitOverrideForm_(e) {
    if (e) e.preventDefault();
    const source = $('#o_source').value;
    const recordId = $('#o_record_id').value;
    const reason = ($('#o_reason').value || '').trim();
    const expires = ($('#o_expires').value || '').trim();

    if (!reason) {
      toast('Reason is required.', 'err');
      return;
    }

    const sourceRecords = source === 'Pipeline' ? State.opportunities : State.deployments;
    const sourceRecord = sourceRecords.find(function (r) {
      return (r.opportunity_id || r.deployment_id) === recordId;
    }) || {};

    const rows = $$('#overrideFieldsContainer .override-field-row');
    const ops = [];

    rows.forEach(function (rowEl) {
      const fld = rowEl.dataset.field;
      const input = rowEl.querySelector('.override-field-input');
      if (!input) return;
      const inputVal = input.value.trim();
      const overrideId = rowEl.dataset.overrideId || '';
      const modifiedAt = rowEl.dataset.modifiedAt || '';

      const sourceVal = sourceRecord[fld] != null ? String(sourceRecord[fld]) : '';

      if (inputVal === '' && overrideId) {
        ops.push({ type: 'delete', override_id: overrideId });
      } else if (inputVal !== '' && inputVal !== sourceVal) {
        ops.push({
          type: 'save',
          payload: {
            override_id:    overrideId || undefined,
            source:         source,
            record_id:      recordId,
            field:          fld,
            original_value: sourceVal,
            override_value: inputVal,
            reason:         reason,
            expires_at:     expires || '',
            modified_at:    modifiedAt || undefined
          }
        });
      }
    });

    if (!ops.length) {
      toast('No changes to save.', 'info');
      return;
    }

    const panel = $('#overrideDrawer .drawer-panel') || $('#overrideDrawer');
    const spinner = panel?.querySelector('.drawer-spinner');
    if (panel) panel.classList.add('is-submitting');
    if (spinner) spinner.textContent = 'Saving...';

    try {
      for (let i = 0; i < ops.length; i++) {
        const op = ops[i];
        if (op.type === 'delete') {
          await call('api_deleteOverride', op.override_id, reason);
        } else {
          await call('api_saveOverride', op.payload);
        }
      }
      toast('Overrides saved', 'ok');
      _overridableFieldsCache_ = null;
      $('#overrideDrawer').hidden = true;
      reloadCurrentView_();
    } catch (err) {
      toast('Save failed: ' + err.message, 'err');
    } finally {
      if (panel) panel.classList.remove('is-submitting');
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    const overrideDrawer = $('#overrideDrawer');
    if (!overrideDrawer) return;

    overrideDrawer.addEventListener('click', function (e) {
      if (e.target.dataset && e.target.dataset.close !== undefined) {
        overrideDrawer.hidden = true;
      }
    });

    $('#saveOverrideBtn')?.addEventListener('click', async function(e) {
      await withLoading_(this, () => submitOverrideForm_(e), { label: 'Saving...' });
    });
    $('#overrideForm')?.addEventListener('submit', async function(e) {
      await withLoading_($('#saveOverrideBtn'), () => submitOverrideForm_(e), { label: 'Saving...' });
    });
  });
</script>

<script>
  // ============================================================
  // Overrides Manager Admin panel (Drop 4)
  // ============================================================
  let _ovAllRows = [];
  let _ovAuditOpen = false;
  let _ovAuditLoaded = false;

  async function loadOverridesAdmin_() {
    await Promise.all([loadOvHygiene_(), loadOvManagerTable_()]);
  }

  async function loadOvHygiene_() {
    try {
      const h = await call('api_getOverrideHygieneSummary');
      const setText = function (id, val) {
        const el = $('#' + id);
        if (el) el.textContent = String(val);
      };
      setText('ovHygActive',   h.activeTotal   || 0);
      setText('ovHygExpiring', h.expiringSoon  || 0);
      setText('ovHygLongRun',  h.longRunning   || 0);
      setText('ovHygStale',    h.stale         || 0);
      const count = (h.expiringSoon || 0) + (h.stale || 0);
      const badge = $('#adminTabBadgeOverrides');
      if (badge) {
        badge.textContent = String(count);
        badge.hidden = count === 0;
      }
    } catch (err) {
      toast('Hygiene load failed: ' + err.message, 'err');
    }
  }

  async function loadOvManagerTable_() {
    try {
      const src    = $('#ovFilterSource')?.value || '';
      const status = $('#ovFilterStatus')?.value || '';
      const filter = {};
      if (src)    filter.source = src;
      if (status) filter.status = status;
      _ovAllRows = await call('api_listOverrides', filter);
      renderOvManagerTable_();
    } catch (err) {
      const body = $('#ovTableBody');
      if (body) body.innerHTML = '<tr><td colspan="11" class="muted" style="padding:12px;">Load failed: ' +
        escapeHtml_(err.message) + '</td></tr>';
    }
  }

  function renderOvManagerTable_() {
    const body = $('#ovTableBody');
    if (!body) return;
    const q = ($('#ovFilterSearch')?.value || '').toLowerCase().trim();
    const filtered = q ? _ovAllRows.filter(function (r) {
      return (String(r.record_id || '') + ' ' + String(r.field || '') + ' ' + String(r.reason || '')).toLowerCase().includes(q);
    }) : _ovAllRows;

    if (!filtered.length) {
      body.innerHTML = '<tr><td colspan="11" class="muted" style="padding:12px;">No overrides found.</td></tr>';
      updateOvBulkButton_();
      return;
    }

    body.innerHTML = filtered.map(function (r) {
      const statusClass = {
        'Active':  'ov-status-active',
        'Expired': 'ov-status-expired',
        'Removed': 'ov-status-removed'
      }[r.status] || '';
      const expires = r.expires_at ? String(r.expires_at).slice(0, 10) : '—';
      const modified = r.modified_at ? String(r.modified_at).slice(0, 10) : '—';
      return '<tr>' +
        '<td><input type="checkbox" class="ov-row-check" data-id="' + escapeHtml_(String(r.override_id || '')) + '"></td>' +
        '<td>' + escapeHtml_(r.source || '') + '</td>' +
        '<td title="' + escapeHtml_(String(r.record_id || '')) + '">' + escapeHtml_(String(r.record_id || '')) + '</td>' +
        '<td>' + escapeHtml_(r.field || '') + '</td>' +
        '<td title="' + escapeHtml_(String(r.original_value || '')) + '">' + escapeHtml_(String(r.original_value || '')) + '</td>' +
        '<td class="ov-cell-wide" title="' + escapeHtml_(String(r.override_value || '')) + '">' + escapeHtml_(String(r.override_value || '')) + '</td>' +
        '<td class="ov-cell-wide" title="' + escapeHtml_(r.reason || '') + '">' + escapeHtml_(r.reason || '') + '</td>' +
        '<td>' + expires + '</td>' +
        '<td class="' + statusClass + '">' + escapeHtml_(r.status || '') + '</td>' +
        '<td>' + escapeHtml_(r.created_by || '') + '</td>' +
        '<td>' + modified + '</td>' +
        '</tr>';
    }).join('');

    body.addEventListener('change', function (e) {
      if (e.target.classList.contains('ov-row-check')) updateOvBulkButton_();
    }, { once: true });

    updateOvBulkButton_();
  }

  function updateOvBulkButton_() {
    const checked = $$('#ovTableBody .ov-row-check:checked');
    const btn = $('#ovBulkRemoveBtn');
    if (!btn) return;
    const n = checked ? checked.length : 0;
    btn.disabled = n === 0;
    btn.textContent = n > 0 ? 'Remove selected (' + n + ')' : 'Remove selected';
  }

  function _csvCell_(v) {
    const s = String(v === null || v === undefined ? '' : v);
    if (/[,"\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function _parseCsv_(text) {
    const rows = [];
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    let i = 0;
    while (i < lines.length) {
      const row = [];
      while (i < lines.length && lines[i] !== '\n') {
        if (lines[i] === '"') {
          i++;
          let cell = '';
          while (i < lines.length) {
            if (lines[i] === '"' && lines[i + 1] === '"') { cell += '"'; i += 2; }
            else if (lines[i] === '"') { i++; break; }
            else { cell += lines[i]; i++; }
          }
          row.push(cell);
          if (lines[i] === ',') i++;
        } else {
          let cell = '';
          while (i < lines.length && lines[i] !== ',' && lines[i] !== '\n') {
            cell += lines[i]; i++;
          }
          row.push(cell);
          if (lines[i] === ',') i++;
        }
      }
      if (lines[i] === '\n') i++;
      if (row.length > 0) rows.push(row);
    }
    return rows;
  }

  async function loadOvAudit_() {
    const body = $('#ovAuditTableBody');
    if (!body) return;
    body.innerHTML = '<tr><td colspan="7" class="muted" style="padding:12px;">Loading…</td></tr>';
    try {
      const filter = {};
      const src    = $('#ovAuditFilterSource')?.value;
      const rec    = ($('#ovAuditFilterRecord')?.value || '').trim();
      const actor  = ($('#ovAuditFilterActor')?.value || '').trim();
      if (src)   filter.source    = src;
      if (rec)   filter.record_id = rec;
      if (actor) filter.actor     = actor;
      filter.limit  = 100;
      filter.offset = 0;
      const result = await call('api_getOverrideAudit', filter);
      const rows   = result.rows || [];
      const total  = result.total || 0;
      const limit  = result.limit || 100;

      const totalEl = $('#ovAuditTotal');
      const limitEl = $('#ovAuditLimit');
      const summEl  = $('#ovAuditSummary');
      if (totalEl) totalEl.textContent = String(total);
      if (limitEl) limitEl.textContent = String(Math.min(limit, total));
      if (summEl)  summEl.textContent  = total > 0 ? '(' + Math.min(rows.length, limit) + ' of ' + total + ')' : '';

      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="7" class="muted" style="padding:12px;">No audit rows match the filter.</td></tr>';
        return;
      }

      body.innerHTML = rows.map(function (r) {
        let beforeAfter = '—';
        try {
          const b = r.before_json ? JSON.parse(r.before_json) : null;
          const a = r.after_json  ? JSON.parse(r.after_json)  : null;
          const bVal = b ? String(b.override_value !== undefined ? b.override_value : '∅') : '∅';
          const aVal = a ? String(a.override_value !== undefined ? a.override_value : '∅') : '∅';
          beforeAfter = escapeHtml_(bVal) + ' → ' + escapeHtml_(aVal);
        } catch (e) {
          beforeAfter = '<span class="muted">(parse error)</span>';
        }
        const when = r.timestamp ? String(r.timestamp).slice(0, 16).replace('T', ' ') : '—';
        return '<tr>' +
          '<td>' + escapeHtml_(when) + '</td>' +
          '<td>' + escapeHtml_(r.actor || '') + '</td>' +
          '<td>' + escapeHtml_(r.action || '') + '</td>' +
          '<td>' + escapeHtml_(r.source || '') + '</td>' +
          '<td>' + escapeHtml_(String(r.record_id || '')) + '</td>' +
          '<td>' + escapeHtml_(r.field || '') + '</td>' +
          '<td>' + beforeAfter + '</td>' +
          '</tr>';
      }).join('');
    } catch (err) {
      body.innerHTML = '<tr><td colspan="7" class="muted" style="padding:12px;">Load failed: ' + escapeHtml_(err.message) + '</td></tr>';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    // Hygiene refresh
    $('#ovHygieneRefreshBtn')?.addEventListener('click', loadOvHygiene_);

    // Manager table filters
    $('#ovFilterSource')?.addEventListener('change', loadOvManagerTable_);
    $('#ovFilterStatus')?.addEventListener('change', loadOvManagerTable_);
    if (typeof debounce_ === 'function') {
      $('#ovFilterSearch')?.addEventListener('input', debounce_(renderOvManagerTable_, 200));
    } else {
      $('#ovFilterSearch')?.addEventListener('input', renderOvManagerTable_);
    }

    // Select all
    $('#ovSelectAll')?.addEventListener('change', function (e) {
      $$('#ovTableBody .ov-row-check').forEach(function (cb) { cb.checked = e.target.checked; });
      updateOvBulkButton_();
    });

    // Bulk remove
    $('#ovBulkRemoveBtn')?.addEventListener('click', async function () {
      const btn = this;
      const checked = $$('#ovTableBody .ov-row-check:checked');
      if (!checked || !checked.length) return;
      const ids = Array.from(checked).map(function (cb) { return cb.dataset.id; });
      const reason = prompt('Reason for removing ' + ids.length + ' override(s):');
      if (!reason || !reason.trim()) return;
      await withLoading_(btn, async function() {
        try {
          const results = await call('api_bulkDeleteOverrides', ids, reason.trim());
          const failed = results.filter(function (r) { return !r.ok; }).length;
          if (failed > 0) {
            toast('Removed ' + (ids.length - failed) + ', failed ' + failed, 'err');
          } else {
            toast('Removed ' + ids.length + ' override(s)', 'ok');
          }
          await loadOvManagerTable_();
          await loadOvHygiene_();
        } catch (err) {
          toast('Bulk remove failed: ' + err.message, 'err');
        }
      }, { label: 'Removing...' });
    });

    // Export CSV
    $('#ovExportBtn')?.addEventListener('click', async function () {
      try {
        const src    = $('#ovFilterSource')?.value || '';
        const status = $('#ovFilterStatus')?.value || '';
        const filter = {};
        if (src)    filter.source = src;
        if (status) filter.status = status;
        const matrix = await call('api_exportOverridesCsv', filter);
        const csvText = matrix.map(function (row) {
          return row.map(_csvCell_).join(',');
        }).join('\n');
        const blob = new Blob([csvText], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const ts = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        a.href = url;
        a.download = 'overrides_' + ts + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      } catch (err) {
        toast('Export failed: ' + err.message, 'err');
      }
    });

    // Import CSV
    $('#ovImportBtn')?.addEventListener('click', function () {
      $('#ovImportFile')?.click();
    });

    $('#ovImportFile')?.addEventListener('change', async function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const matrix = _parseCsv_(text);
        if (matrix.length < 2) { toast('CSV has no data rows', 'err'); return; }
        const dataRows = matrix.length - 1;
        const importOk = await confirmAction_({
          title: 'Import overrides?',
          body: 'Import ' + dataRows + ' row(s) as new overrides?',
          confirmLabel: 'Import',
          confirmStyle: 'primary'
        });
        if (!importOk) return;
        const result = await call('api_importOverridesCsv', matrix);
        if (result.skipped && result.skipped.length > 0) {
          toast('Imported ' + result.created + ', skipped ' + result.skipped.length, 'err');
          console.warn('Skipped rows:', result.skipped);
        } else {
          toast('Imported ' + result.created + ' override(s)', 'ok');
        }
        e.target.value = '';
        await loadOvManagerTable_();
        await loadOvHygiene_();
      } catch (err) {
        toast('Import failed: ' + err.message, 'err');
      }
    });

    // Audit log collapsible
    const auditHeader = $('#ovAuditHeader');
    if (auditHeader) {
      auditHeader.addEventListener('click', function () {
        _ovAuditOpen = !_ovAuditOpen;
        const body = $('#ovAuditBody');
        const chev = $('#ovAuditChev');
        if (body) body.hidden = !_ovAuditOpen;
        if (chev) chev.classList.toggle('open', _ovAuditOpen);
        if (_ovAuditOpen && !_ovAuditLoaded) {
          _ovAuditLoaded = true;
          loadOvAudit_();
        }
      });
    }

    $('#ovAuditApplyBtn')?.addEventListener('click', function () {
      _ovAuditLoaded = true;
      loadOvAudit_();
    });

    // ---- Adjustment Audit Log collapsible ----
    let _cadjAuditOpen   = false;
    let _cadjAuditLoaded = false;

    const cadjAuditHeader = $('#cadjAuditHeader');
    if (cadjAuditHeader) {
      cadjAuditHeader.addEventListener('click', function () {
        _cadjAuditOpen = !_cadjAuditOpen;
        const body = $('#cadjAuditBody');
        const chev = $('#cadjAuditChev');
        if (body) body.hidden = !_cadjAuditOpen;
        if (chev) chev.classList.toggle('open', _cadjAuditOpen);
        if (_cadjAuditOpen && !_cadjAuditLoaded) {
          _cadjAuditLoaded = true;
          loadCadjAudit_();
        }
      });
    }

    $('#cadjAuditApplyBtn')?.addEventListener('click', function () {
      _cadjAuditLoaded = true;
      loadCadjAudit_();
    });
  });

  async function loadCadjAudit_() {
    const body = $('#cadjAuditTableBody');
    if (!body) return;
    body.innerHTML = '<tr><td colspan="6" class="muted" style="padding:12px;">Loading\u2026</td></tr>';
    try {
      const filter = {};
      const worker = ($('#cadjAuditFilterWorker')?.value || '').trim();
      const action = ($('#cadjAuditFilterAction')?.value || '').trim();
      const actor  = ($('#cadjAuditFilterActor')?.value  || '').trim();
      if (worker) filter.resource_name = worker;
      if (action) filter.action        = action;
      if (actor)  filter.actor         = actor;
      filter.limit = 100;
      const rows = await call('api_listCapacityAdjustmentAudit', filter);

      const limitEl = $('#cadjAuditLimit');
      const totalEl = $('#cadjAuditTotal');
      const summEl  = $('#cadjAuditSummary');
      if (limitEl) limitEl.textContent = String(rows.length);
      if (totalEl) totalEl.textContent = String(rows.length);
      if (summEl)  summEl.textContent  = rows.length > 0 ? '(' + rows.length + ')' : '';

      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="6" class="muted" style="padding:12px;">No audit rows match the filter.</td></tr>';
        return;
      }
      body.innerHTML = rows.map(function (r) {
        const when = r.timestamp ? String(r.timestamp).slice(0, 16).replace('T', ' ') : '\u2014';
        return '<tr>' +
          '<td>' + escapeHtml_(when) + '</td>' +
          '<td>' + escapeHtml_(r.actor || '') + '</td>' +
          '<td>' + escapeHtml_(r.action || '') + '</td>' +
          '<td>' + escapeHtml_(r.resource_name || '') + '</td>' +
          '<td>' + escapeHtml_(r.deployment_id || '') + '</td>' +
          '<td>' + escapeHtml_(r.notes || '') + '</td>' +
          '</tr>';
      }).join('');
    } catch (err) {
      body.innerHTML = '<tr><td colspan="6" class="muted" style="padding:12px;">Load failed: ' + escapeHtml_(err.message) + '</td></tr>';
    }
  }
</script>

<script>
  // ============================================================
  // WFM.25 — Unified UX Stage 1
  // Role-aware landing · Utilization aggregate · Zoom-in-place
  //
  // Reuses: call(), State, cellColor, fmtPct, escapeHtml_,
  //         buildServerParams_, fiscalQuarterKey_, applyAutoManagerDefaults_,
  //         toast, $, $$  — all defined earlier in this file.
  // No server math or api_* endpoints are added or changed.
  // ============================================================

  // ── Team identity color map (spec §6) ────────────────────────
  function wfm25TeamColor_(teamLabel) {
    if (!teamLabel) return 'var(--staple)';
    const lc = teamLabel.toLowerCase();
    if (lc.indexOf('functional') >= 0) return 'var(--team-functional)';
    if (lc.indexOf('technical')  >= 0) return 'var(--team-technical)';
    if (lc.indexOf('delivery')   >= 0) return 'var(--team-delivery)';
    return 'var(--staple)';
  }

  // WFM.25 worker-panel Status tile — over-allocated ceiling (current-quarter attainment ratio).
  // Under/approaching floor thresholds are intentionally deferred (leadership review).
  const WFM25_OVER_ALLOCATED_CEILING = 1.10;

  // ── WFM.25 client state ───────────────────────────────────────
  const WFM25State = {
    scorecardData:    null,          // last api_getQuarterlyScorecard result
    historyData:      null,          // last api_getWorkerTypeHistory result
    xorgForecastData: null,          // last api_getXorgForecast result
    historyReqId:     0,             // race-guard for history fetch
    mixTrendReqId:    0,             // race-guard for mix-trend render
    mixTrendSelected: null,          // selected bar descriptor or null
    mixTrendSelectedCategory: null,  // 'SLG' | 'Workday Regions' | 'Contractor' | null
    specialtyDemandData:  null,      // last api_getSpecialtyDemand result
    specialtyActualsData: null,      // last api_getSpecialtyActuals result
    specialtyDemandReqId: 0,         // race-guard for specialty-demand fetch
    specialtyDemandUnit: 'hours',    // 'hours' | 'share' | 'qoq'
    specialtyDemandCollapsedTeams: new Set(),
    expandedTeam:     null,          // teamLabel string currently expanded, or null
    activeTab:        'utilization', // 'utilization' | 'hours-budget' | 'mix-trend' | 'specialty-demand'
    groupBy:          'team',        // 'team' | 'role'
    landingBreadcrumb: 'SLG Org',
    activeView:       'capacity',     // 'capacity' | 'admin'
    selectedWorker:   null,          // worker name when panel is open
    selectedWorkerTeam: null,       // team label for breadcrumb + live aggregate shift
    selectedWorkerDetail: null,     // last api_getResourceDetailV2 result
    workerReqId:      0,             // race-guard for worker detail fetch
    utilAllocFilter:  null,          // null | 'over' | 'under' — tile filter within scope
    expandedWeekKey:  null           // weekKey for open weekly bar breakdown, or null
  };

  // ── Breadcrumb helpers ────────────────────────────────────────

  /**
   * Derive the landing breadcrumb text from State.ref.
   * Admin or unrecognized user → 'SLG Org'.
   * Matched manager → resolvedTeam of first direct report, else 'SLG Org'.
   * @param {Object} ref  State.ref
   * @returns {string}
   */
  function wfm25LandingBreadcrumb_(ref) {
    if (!ref || ref.userIsAdmin || !ref.matchedManager) return 'SLG Org';
    const resources = Array.isArray(ref.resources) ? ref.resources : [];
    const report = resources.find(function (r) {
      return r.manager === ref.matchedManager && r.resolvedTeam;
    });
    return (report && report.resolvedTeam) ? report.resolvedTeam : 'SLG Org';
  }

  /**
   * Set #wfm25Breadcrumb content.
   * @param {string|string[]} segments  Single string or array joined with ' › '.
   */
  function wfm25SetBreadcrumb_(segments) {
    const el = document.getElementById('wfm25Breadcrumb');
    if (!el) return;
    if (Array.isArray(segments)) {
      el.innerHTML = segments.map(function (s, i) {
        return (i > 0 ? '<span class="wfm25-breadcrumb-sep"> \u203a </span>' : '') +
               escapeHtml_(s);
      }).join('');
    } else {
      el.textContent = segments || 'SLG Org';
    }
  }

  // ── Tab switching ─────────────────────────────────────────────

  /**
   * Activate a capacity tab by key.
   * @param {string} tabKey  'utilization' | 'hours-budget' | 'mix-trend' | 'specialty-demand'
   */
  function wfm25ActivateTab_(tabKey) {
    if (WFM25State.selectedWorker) {
      wfm25CloseWorkerPanel_();
    }
    const prevTab = WFM25State.activeTab;
    WFM25State.activeTab = tabKey;
    $$('.wfm25-tab').forEach(function (btn) {
      const on = btn.dataset.wfm25Tab === tabKey;
      btn.classList.toggle('active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });

    function applyPanelVisibility_() {
      $$('.wfm25-tab-panel').forEach(function (panel) {
        panel.hidden = (panel.dataset.wfm25Panel !== tabKey);
      });
    }

    function loadTabData_() {
      if (tabKey === 'hours-budget') {
        if (WFM25State.scorecardData && WFM25State.xorgForecastData) {
          renderWFM25HoursCapacityTable_(WFM25State.scorecardData);
        } else {
          loadWFM25HoursCapacity_();
        }
      } else if (tabKey === 'mix-trend') {
        loadWFM25MixTrend_();
      } else if (tabKey === 'specialty-demand') {
        loadWFM25SpecialtyDemand_();
      }
    }

    const panels = $$('.wfm25-tab-panel');
    const outgoing = panels.find(function (p) { return p.dataset.wfm25Panel === prevTab && !p.hidden; });
    const incoming = panels.find(function (p) { return p.dataset.wfm25Panel === tabKey; });

    if (!outgoing || !incoming || outgoing === incoming || prevTab === tabKey || wfm25MotionReduced_()) {
      applyPanelVisibility_();
      loadTabData_();
      return;
    }

    incoming.hidden = false;
    outgoing.classList.add('wfm25-motion-tab-exit');
    incoming.classList.add('wfm25-motion-tab-enter');
    let finished = 0;
    const finish = function () {
      finished++;
      if (finished < 2) return;
      outgoing.hidden = true;
      outgoing.classList.remove('wfm25-motion-tab-exit');
      incoming.classList.remove('wfm25-motion-tab-enter');
      loadTabData_();
    };
    outgoing.addEventListener('animationend', finish, { once: true });
    incoming.addEventListener('animationend', finish, { once: true });
    setTimeout(finish, wfm25MotionDurationMs_() + 40);
  }

  /**
   * Compare fiscal-quarter keys chronologically (client mirror of server helper).
   * @param {string} a
   * @param {string} b
   * @returns {number}
   */
  function compareFiscalQuarterKeys_(a, b) {
    const ma = String(a || '').match(/^FY(\d{2})-(Q[1-4])$/);
    const mb = String(b || '').match(/^FY(\d{2})-(Q[1-4])$/);
    if (!ma || !mb) return String(a).localeCompare(String(b));
    const ya = parseInt(ma[1], 10);
    const yb = parseInt(mb[1], 10);
    if (ya !== yb) return ya - yb;
    return parseInt(ma[2].charAt(1), 10) - parseInt(mb[2].charAt(1), 10);
  }

  // ── Draft util cell helpers (committed + projected overlay) ──

  /**
   * Build draft delta arrow for util change.
   * @param {number} baseUtil
   * @param {number} projUtil
   * @returns {string}
   */
  function wfm25DraftArrow_(baseUtil, projUtil) {
    const b = Number(baseUtil) || 0;
    const p = Number(projUtil) || 0;
    if (p > b + 0.0001) return '\u2191';
    if (p < b - 0.0001) return '\u2193';
    return '\u2192';
  }

  /**
   * Render a utilization cell with optional draft overlay.
   * Committed stays neutral; draft is bright orange when softBookings exist.
   * @param {number|null} baseUtil committed icpUtil
   * @param {number|null} projUtil projected icpUtil (null = committed only)
   * @param {number} icpTarget
   * @param {string} [extraCls]
   * @returns {string}
   */
  function wfm25RenderUtilCell_(baseUtil, projUtil, icpTarget, extraCls) {
    const hasDraft = State.softBookings && State.softBookings.length &&
      projUtil != null && baseUtil != null;
    if (!hasDraft) {
      const color = (baseUtil != null)
        ? cellColor(baseUtil, icpTarget)
        : { bg: 'var(--business-card)', fg: 'var(--staple)' };
      return '<td class="wfm25-util-cell' + (extraCls ? ' ' + extraCls : '') +
        '" style="background:' + color.bg + ';color:' + color.fg + '">' +
        (baseUtil != null ? fmtPct(baseUtil) : '\u2014') + '</td>';
    }
    const arrow = wfm25DraftArrow_(baseUtil, projUtil);
    return '<td class="wfm25-util-cell has-draft' + (extraCls ? ' ' + extraCls : '') + '">' +
      '<span class="wfm25-util-committed">' + fmtPct(baseUtil) + '</span>' +
      '<span class="wfm25-util-draft">' +
        '<span class="wfm25-draft-label">Your draft</span>' +
        '<span class="wfm25-draft-value">' + fmtPct(baseUtil) + ' \u2192 ' +
          fmtPct(projUtil) + ' ' + arrow + '</span>' +
      '</span></td>';
  }

  /**
   * Look up projected/baseline weekly cells from api_projectSoftBookings payload.
   * @param {Object|null} projection
   * @param {string} workerName
   * @param {boolean} projected
   * @returns {Array|null}
   */
  function wfm25ProjectionWeeks_(projection, workerName, projected) {
    if (!projection) return null;
    const bucket = projected ? projection.projected : projection.baseline;
    if (!bucket) return null;
    const key = String(workerName || '').trim();
    const row = (bucket.worker || []).find(function (w) {
      return String(w.resourceName || '').trim() === key;
    });
    return row && row.weeks ? row.weeks : null;
  }

  /**
   * Index projection weekly cells by weekKey (no index-alignment assumptions).
   * @param {Array|null} weeks
   * @returns {Object<string, Object>}
   */
  function wfm25WeekMapByKey_(weeks) {
    const map = {};
    (weeks || []).forEach(function (w) {
      if (!w || !w.weekKey) return;
      map[String(w.weekKey)] = w;
    });
    return map;
  }

  /**
   * Look up projected/baseline icpUtil from api_projectSoftBookings payload.
   * @param {Object|null} projection
   * @param {'worker'|'team'|'orgTeam'} level
   * @param {string} key resourceName or teamLabel
   * @param {string} quarterKey
   * @param {boolean} projected
   * @returns {number|null}
   */
  function wfm25ProjectionUtil_(projection, level, key, quarterKey, projected) {
    if (!projection) return null;
    const bucket = projected ? projection.projected : projection.baseline;
    if (!bucket) return null;
    let row = null;
    if (level === 'worker') {
      row = (bucket.worker || []).find(function (w) { return w.resourceName === key; });
    } else if (level === 'team') {
      row = bucket.team;
    } else if (level === 'orgTeam') {
      row = (bucket.orgTeams || []).find(function (o) { return o.teamLabel === key; });
    }
    if (!row) return null;
    const q = (row.quarters || []).find(function (qq) { return qq.quarterKey === quarterKey; });
    return q && q.icpUtil != null ? q.icpUtil : null;
  }

  /**
   * Count workers in a team (or all teams when teamLabel null) matching scope + alloc filter.
   * @param {string|null} teamLabel
   * @param {Object} data api_getQuarterlyScorecard result
   * @param {number} qi current-quarter index
   * @returns {number}
   */
  function wfm25CountScopedTeamWorkers_(teamLabel, data, qi) {
    const workers = (data && data.workers) || [];
    let count = 0;
    workers.forEach(function (w) {
      const tl = w.teamLabel || 'Unknown';
      if (teamLabel && tl !== teamLabel) return;
      if (WFM25State.utilAllocFilter && !wfm25WorkerMatchesAllocFilter_(w, qi)) return;
      count++;
    });
    return count;
  }

  /**
   * Sum a project's hours within the current fiscal quarter.
   * @param {Object} project
   * @param {Array} weeks detail.weeks (with fiscalQuarterKey)
   * @param {string} curQk
   * @returns {number}
   */
  function wfm25ProjectCurQuarterHours_(project, weeks, curQk) {
    const curWeekKeys = {};
    (weeks || []).forEach(function (w) {
      if (w.fiscalQuarterKey === curQk) curWeekKeys[w.weekKey] = true;
    });
    let sum = 0;
    (project.weekly || []).forEach(function (wk) {
      if (curWeekKeys[wk.weekKey]) sum += Number(wk.hours) || 0;
    });
    return sum;
  }

  /**
   * Whether a project row is non-productive (display-only, excluded from util/attainment).
   * @param {Object} project
   * @returns {boolean}
   */
  function wfm25IsDisplayOnlyProject_(project) {
    const proj = String(project.project_name || project.project || '').trim().toLowerCase();
    if (proj === 'pto/holiday' || proj === '(blank)') return true;
    if (/travel/i.test(proj)) return true;
    return false;
  }

  /**
   * Human label for a non-productive project row.
   * @param {Object} project
   * @returns {string}
   */
  function wfm25DisplayOnlyProjectLabel_(project) {
    const proj = String(project.project_name || project.project || '').trim();
    if (/travel/i.test(proj)) return 'Travel';
    return 'PTO / Holiday';
  }

  /**
   * Primary display label for a worker-panel project row (full account + project).
   * @param {Object} project
   * @returns {string}
   */
  function wfm25ProjectFullLabel_(project) {
    if (wfm25IsDisplayOnlyProject_(project)) {
      return wfm25DisplayOnlyProjectLabel_(project);
    }
    const acct = String(project.account_name || '').trim();
    const proj = String(project.project_name || project.project || '').trim() || 'Unclassified';
    return acct ? (acct + ' \u2014 ' + proj) : proj;
  }

  /** @deprecated use wfm25ProjectFullLabel_ — kept for Explorer paths */
  function wfm25ProjectPrimaryLabel_(project) {
    return wfm25ProjectFullLabel_(project);
  }

  /**
   * Extract SOW number from project name when present.
   * @param {Object} project
   * @returns {string}
   */
  function wfm25ExtractSowNum_(project) {
    const name = String(project.project_name || project.project || '');
    const m = name.match(/\bSOW\s*#?\s*(\d[\d.-]*)/i);
    if (m) return m[1];
    const m2 = name.match(/#\s*(\d{4,})/);
    return m2 ? m2[1] : '';
  }

  /**
   * Compact single-line identity: Account — SOW #n (Pass 2).
   * @param {Object} project
   * @returns {string}
   */
  function wfm25ProjectCompactIdentity_(project) {
    if (wfm25IsDisplayOnlyProject_(project)) {
      return wfm25DisplayOnlyProjectLabel_(project);
    }
    const acct = String(project.account_name || '').trim() || 'Unclassified';
    const sow = wfm25ExtractSowNum_(project);
    if (sow) return acct + ' \u2014 SOW #' + sow;
    const proj = String(project.project_name || project.project || '').trim();
    return proj ? (acct + ' \u2014 ' + proj) : acct;
  }

  /**
   * Hours for one project in a single week.
   * @param {Object} project
   * @param {string} weekKey
   * @returns {number}
   */
  function wfm25ProjectWeekHours_(project, weekKey) {
    const wk = (project.weekly || []).find(function (w) { return w.weekKey === weekKey; });
    return wk ? (Number(wk.hours) || 0) : 0;
  }

  /**
   * Whether a week may show reduction draft overlay (forward forecast weeks only).
   * @param {Object} week detail.weeks cell
   * @param {string} curQk
   * @returns {boolean}
   */
  function wfm25WeekAllowsReduceDraft_(week, curQk) {
    if (!week || week.isActual) return false;
    if (week.fiscalQuarterKey === curQk) return false;
    return compareFiscalQuarterKeys_(week.fiscalQuarterKey, curQk) > 0;
  }

  /**
   * Baseline/projected hours for a week from api_projectSoftBookings (no client recompute).
   * @param {Object} cell detail week cell (or projection week cell for weekKey/label)
   * @param {Object|null} baseWeekMap weekKey → baseline projection cell
   * @param {Object|null} projWeekMap weekKey → projected projection cell
   * @returns {{base:number, projected:number}}
   */
  function wfm25WeekDraftHours_(cell, baseWeekMap, projWeekMap) {
    const fallback = Number(cell.hours) || 0;
    const wk = String(cell.weekKey || '');
    const bw = baseWeekMap ? baseWeekMap[wk] : null;
    const pw = projWeekMap ? projWeekMap[wk] : null;
    const baseH = bw != null ? (Number(bw.hours) || 0) : fallback;
    const projectedH = pw != null ? (Number(pw.hours) || 0) : baseH;
    return { base: baseH, projected: projectedH };
  }

  /**
   * Current-quarter attainment ratio for worker-panel KPI tiles (bonusAttainment).
   * @param {Object|null} curQ
   * @returns {number}
   */
  function wfm25WorkerPanelCurQAttainment_(curQ) {
    return curQ ? (Number(curQ.bonusAttainment) || 0) : 0;
  }

  /**
   * Heat color for Current Qtr Attainment tile (unified util band scale).
   * @param {Object|null} curQ
   * @returns {{bg:string, fg:string}}
   */
  function wfm25WorkerPanelAttainmentTileColor_(curQ) {
    return utilBandColor_(wfm25WorkerPanelCurQAttainment_(curQ));
  }

  /**
   * Heat color for signed tracking-hours KPI — follows unified ratio band, not hour sign.
   * @param {number} trackingHours
   * @param {Object|null} curQuarter
   * @returns {{bg:string, fg:string}}
   */
  function wfm25TrackingKpiColor_(trackingHours, curQuarter) {
    return utilBandColor_(wfm25WorkerPanelCurQAttainment_(curQuarter));
  }

  /**
   * Sum forward-quarter productive hours from existing quarter payload (reduction-rule basis).
   * @param {Array} quarters
   * @returns {number}
   */
  function wfm25ForwardForecastRemaining_(quarters) {
    const curQk = fiscalQuarterKey_(new Date());
    let sum = 0;
    (quarters || []).forEach(function (q) {
      if (q.isCurrentQuarter) return;
      if (compareFiscalQuarterKeys_(q.quarterKey, curQk) <= 0) return;
      sum += Number(q.productiveHours) || 0;
    });
    return sum;
  }

  /**
   * Worker-panel Status label/class from current-quarter attainment (same ratio as Current Qtr Attainment tile).
   * @param {Object|null} curQ quarters[isCurrentQuarter] from api_getResourceDetailV2
   * @returns {{label: string, className: string}}
   */
  function wfm25WorkerPanelStatus_(curQ) {
    const ratio = wfm25WorkerPanelCurQAttainment_(curQ);
    if (ratio > WFM25_OVER_ALLOCATED_CEILING) {
      return { label: 'Over-allocated', className: 'explorer-status-over' };
    }
    if (ratio < 0.75) {
      return { label: 'Under target', className: 'explorer-status-under' };
    }
    return { label: 'On track', className: 'explorer-status-ok' };
  }

  /**
   * WFM.25 worker-panel KPI tiles (current-quarter metrics + trend sparkline).
   * @param {Object} detail api_getResourceDetailV2 result
   * @param {number} icpTarget
   * @returns {string}
   */
  function renderWFM25WorkerKpiTiles_(detail, icpTarget) {
    const quarters = detail.quarters || [];
    const curQ = quarters.find(function (q) { return q.isCurrentQuarter; }) || null;

    const attainment = curQ ? curQ.bonusAttainment : 0;
    const attainColor = wfm25WorkerPanelAttainmentTileColor_(curQ);
    const tracking = curQ ? curQ.trackingHours : 0;
    const trackColor = wfm25TrackingKpiColor_(tracking, curQ);
    const trackSign = tracking >= 0 ? '+' : '';
    const forecastRemaining = wfm25ForwardForecastRemaining_(quarters);

    const status = wfm25WorkerPanelStatus_(curQ);
    const statusLabel = status.label;
    const statusColor = utilBandColor_(wfm25WorkerPanelCurQAttainment_(curQ));

    const curQk = fiscalQuarterKey_(new Date());
    const curWeeks = (detail.weeks || []).filter(function (w) {
      return w.fiscalQuarterKey === curQk;
    });
    const icpSeries = curWeeks.map(function (w) { return w.icpUtil; });
    const sparkBase = curQ ? curQ.icpUtil : (icpTarget || 0.75);
    const sparkColor = cellColor(sparkBase, icpTarget).fg;
    const spark = wfm25MixTrendSparklineSvg_(icpSeries, sparkColor, 72, 26);

    return '<div class="wfm25-worker-kpi-strip qs-summary-strip" role="group" aria-label="Worker KPIs">' +
      '<div class="wfm25-worker-kpi-tile" style="background:' + attainColor.bg + ';color:' + attainColor.fg + '">' +
        '<div class="wfm25-worker-kpi-label">Current Qtr Attainment</div>' +
        '<div class="wfm25-worker-kpi-value">' + fmtPct(attainment) + '</div>' +
      '</div>' +
      '<div class="wfm25-worker-kpi-tile" style="background:' + trackColor.bg + ';color:' + trackColor.fg + '">' +
        '<div class="wfm25-worker-kpi-label">Tracking to Target</div>' +
        '<div class="wfm25-worker-kpi-value">' + trackSign + Math.round(tracking) + 'h</div>' +
      '</div>' +
      '<div class="wfm25-worker-kpi-tile wfm25-worker-kpi-tile--neutral">' +
        '<div class="wfm25-worker-kpi-label">Forecast Remaining</div>' +
        '<div class="wfm25-worker-kpi-value">' + Math.round(forecastRemaining).toLocaleString() + 'h</div>' +
      '</div>' +
      '<div class="wfm25-worker-kpi-tile" style="background:' + statusColor.bg + ';color:' + statusColor.fg + '">' +
        '<div class="wfm25-worker-kpi-label">Status</div>' +
        '<div class="wfm25-worker-kpi-value">' + escapeHtml_(statusLabel) + '</div>' +
      '</div>' +
      '<div class="wfm25-worker-kpi-tile wfm25-worker-kpi-tile--trend">' +
        '<div class="wfm25-worker-kpi-label">Current Qtr Trend</div>' +
        '<div class="wfm25-worker-kpi-value wfm25-worker-kpi-spark">' + spark + '</div>' +
      '</div>' +
    '</div>';
  }

  /**
   * WFM.25 worker-panel Projects card — compact single-line rows (Pass 2).
   * @param {Object} detail api_getResourceDetailV2 result
   * @returns {string}
   */
  function renderWFM25WorkerProjectsSection_(detail) {
    const curQk = fiscalQuarterKey_(new Date());
    const weeks = detail.weeks || [];
    const rows = (detail.projects || []).map(function (p) {
      return {
        project: p,
        curHours: wfm25ProjectCurQuarterHours_(p, weeks, curQk),
        roleCategory: p.roleCategory || 'Unclassified',
        displayOnly: wfm25IsDisplayOnlyProject_(p)
      };
    }).filter(function (row) { return row.curHours > 0; });

    const productive = rows.filter(function (r) { return !r.displayOnly; })
      .sort(function (a, b) { return b.curHours - a.curHours; });
    const displayOnly = rows.filter(function (r) { return r.displayOnly; })
      .sort(function (a, b) { return b.curHours - a.curHours; });

    let html = '<div class="wfm25-chrome-card wfm25-worker-projects-card">' +
      '<div class="wfm25-worker-projects-head">' +
        '<span class="wfm25-worker-projects-title">Projects</span>' +
        '<span class="muted wfm25-worker-projects-qtr">' + escapeHtml_(curQk) + '</span>' +
      '</div>';
    if (!productive.length && !displayOnly.length) {
      html += '<div class="muted wfm25-worker-projects-empty">No project hours this quarter.</div>';
    } else {
      html += '<ul class="wfm25-worker-projects-list" aria-label="Projects this quarter">';
      productive.forEach(function (row) {
        html += wfm25WorkerProjectRowHtml_(row);
      });
      if (displayOnly.length) {
        html += '<li class="wfm25-worker-projects-divider" aria-hidden="true"></li>';
        displayOnly.forEach(function (row) {
          html += wfm25WorkerProjectRowHtml_(row, true);
        });
      }
      html += '</ul>';
    }
    html += '</div>';
    return html;
  }

  /**
   * One compact project row for the worker panel.
   * @param {Object} row mapped project row
   * @param {boolean} [muted]
   * @returns {string}
   */
  function wfm25WorkerProjectRowHtml_(row, muted) {
    const p = row.project;
    const identity = wfm25ProjectCompactIdentity_(p);
    const fullLabel = wfm25ProjectFullLabel_(p);
    const hrsLabel = Math.round(row.curHours).toLocaleString() + 'h';
    const rowCls = 'wfm25-worker-projects-row' +
      (muted || row.displayOnly ? ' wfm25-worker-projects-row--display-only' : '');
    const displayNote = row.displayOnly
      ? '<span class="wfm25-worker-projects-display-note">display only</span>'
      : '';
    return '<li class="' + rowCls + '">' +
      '<span class="wfm25-projects-col wfm25-projects-col--identity" title="' +
        escapeHtml_(fullLabel) + '">' + escapeHtml_(identity) + '</span>' +
      '<span class="wfm25-projects-col wfm25-projects-col--role" title="' +
        escapeHtml_(row.roleCategory) + '">' + escapeHtml_(row.roleCategory) + displayNote + '</span>' +
      '<span class="wfm25-projects-col wfm25-projects-col--hours">' + hrsLabel + '</span>' +
    '</li>';
  }

  /**
   * WFM.25 worker-panel Specialty Practice card — current-quarter hours by specialty (Pass 3A).
   * @param {Object} detail api_getResourceDetailV2 result
   * @returns {string}
   */
  function renderWFM25WorkerSpecialtySection_(detail) {
    const curQk = fiscalQuarterKey_(new Date());
    const rollup = (detail.specialtyPracticeRollup || []).filter(function (row) {
      return Number(row.currentQuarterHours) > 0;
    });
    const total = rollup.reduce(function (sum, row) {
      return sum + (Number(row.currentQuarterHours) || 0);
    }, 0);

    let html = '<div class="wfm25-chrome-card wfm25-worker-specialty-card">' +
      '<div class="wfm25-worker-specialty-head">' +
        '<span class="wfm25-worker-specialty-title">SPECIALTY PRACTICE \u00b7 ' +
          escapeHtml_(curQk) + '</span>' +
      '</div>';
    if (!rollup.length) {
      html += '<div class="muted wfm25-worker-specialty-empty">No specialty hours this quarter.</div>';
    } else {
      html += '<ul class="wfm25-worker-specialty-list" aria-label="Specialty practice hours this quarter">';
      rollup.forEach(function (row) {
        html += wfm25WorkerSpecialtyRowHtml_(row, total);
      });
      html += '</ul>';
    }
    html += '</div>';
    return html;
  }

  /**
   * One compact specialty-practice row for the worker panel.
   * @param {Object} row { specialtyPractice, currentQuarterHours }
   * @param {number} total total hours for share-bar scaling
   * @returns {string}
   */
  function wfm25WorkerSpecialtyRowHtml_(row, total) {
    const sp = String(row.specialtyPractice || 'Unclassified');
    const hrs = Number(row.currentQuarterHours) || 0;
    const isUnclassified = sp === 'Unclassified';
    const share = total > 0 ? hrs / total : 0;
    const hrsLabel = Math.round(hrs).toLocaleString() + 'h';
    const rowCls = 'wfm25-worker-specialty-row' +
      (isUnclassified ? ' wfm25-worker-specialty-row--unclassified' : '');
    return '<li class="' + rowCls + '">' +
      '<span class="wfm25-specialty-col wfm25-specialty-col--label" title="' +
        escapeHtml_(sp) + '">' + escapeHtml_(sp) + '</span>' +
      '<span class="wfm25-specialty-col wfm25-specialty-col--bar" aria-hidden="true">' +
        '<span class="wfm25-worker-specialty-bar-wrap">' +
          '<span class="wfm25-worker-specialty-bar" style="width:' +
            (share * 100).toFixed(1) + '%"></span>' +
        '</span>' +
      '</span>' +
      '<span class="wfm25-specialty-col wfm25-specialty-col--hours">' + hrsLabel + '</span>' +
    '</li>';
  }

  /**
   * WFM.25 worker-panel weekly capacity bar chart with draft overlay (Pass 2).
   * @param {Array} weeks detail.weeks
   * @param {Object|null} projection api_projectSoftBookings result
   * @param {string} workerName
   * @param {Object} detail full api_getResourceDetailV2 result
   * @returns {string}
   */
  function renderWFM25WeeklyBarChart_(weeks, projection, workerName, detail) {
    const curQk = fiscalQuarterKey_(new Date());
    const detailWeeks = weeks || [];
    const hasDraft = State.softBookings && State.softBookings.length && projection && workerName;
    const projWeeks = hasDraft ? wfm25ProjectionWeeks_(projection, workerName, true) : null;
    const baseWeeks = hasDraft ? wfm25ProjectionWeeks_(projection, workerName, false) : null;
    const baseWeekMap = wfm25WeekMapByKey_(baseWeeks);
    const projWeekMap = wfm25WeekMapByKey_(projWeeks);
    const showDraft = !!(hasDraft && projWeeks && projWeeks.length);

    const detailByKey = {};
    detailWeeks.forEach(function (w) {
      if (!w || !w.weekKey) return;
      detailByKey[String(w.weekKey)] = w;
    });

    let chartWeeks = detailWeeks.filter(function (w) { return w.fiscalQuarterKey === curQk; });
    if (showDraft) {
      const seen = {};
      chartWeeks.forEach(function (w) { seen[String(w.weekKey)] = true; });
      (projWeeks || []).forEach(function (pw) {
        const wk = String(pw.weekKey || '');
        if (!wk || seen[wk]) return;
        const hrs = wfm25WeekDraftHours_(pw, baseWeekMap, projWeekMap);
        if (Math.abs(hrs.projected - hrs.base) <= 0.05) return;
        const meta = detailByKey[wk] || pw;
        if (meta.fiscalQuarterKey && meta.fiscalQuarterKey !== curQk) return;
        chartWeeks.push(meta);
        seen[wk] = true;
      });
      chartWeeks.sort(function (a, b) {
        const ak = String(a.weekKey || '');
        const bk = String(b.weekKey || '');
        if (ak < bk) return -1;
        if (ak > bk) return 1;
        return 0;
      });
    }

    if (!chartWeeks.length) {
      return '<div class="wfm25-chrome-card wfm25-weekly-card">' +
        '<div class="wfm25-weekly-head">' +
          '<span class="wfm25-weekly-title">Weekly Capacity (all dates are week ending)</span>' +
        '</div>' +
        '<div class="muted wfm25-weekly-empty">No weeks in current quarter.</div></div>';
    }

    let yMax = 0;
    chartWeeks.forEach(function (cell) {
      const hrs = wfm25WeekDraftHours_(cell, baseWeekMap, projWeekMap);
      let top = hrs.base;
      if (showDraft) {
        if (hrs.projected > hrs.base) top = hrs.projected;
        else if (hrs.projected < hrs.base && wfm25WeekAllowsReduceDraft_(cell, curQk)) top = hrs.base;
      }
      yMax = Math.max(yMax, top);
    });
    yMax = Math.max(yMax, 1);
    const plotH = 140;

    let barsHtml = '';
    chartWeeks.forEach(function (cell) {
      const hrs = wfm25WeekDraftHours_(cell, baseWeekMap, projWeekMap);
      const baseH = hrs.base;
      const projH = hrs.projected;
      const allowReduce = wfm25WeekAllowsReduceDraft_(cell, curQk);
      let draftDelta = 0;
      let draftKind = '';
      if (showDraft) {
        if (projH > baseH + 0.05) {
          draftDelta = projH - baseH;
          draftKind = 'add';
        } else if (projH < baseH - 0.05 && allowReduce) {
          draftDelta = baseH - projH;
          draftKind = 'reduce';
        }
      }
      const committedH = draftKind === 'reduce' ? projH : baseH;
      const committedPct = (committedH / yMax) * 100;
      const addPct = draftKind === 'add' ? (draftDelta / yMax) * 100 : 0;
      const ghostPct = draftKind === 'reduce' ? (draftDelta / yMax) * 100 : 0;
      const forecastCls = cell.isActual ? '' : ' wfm25-weekly-bar-committed--forecast';
      const isOpen = WFM25State.expandedWeekKey === cell.weekKey;
      const tip = [
        workerName + ' \u00b7 ' + cell.label,
        cell.isActual ? 'Actual' : 'Forecast',
        'Committed: ' + Math.round(baseH) + 'h'
      ];
      if (draftKind) tip.push('Draft: ' + (draftKind === 'add' ? '+' : '\u2212') +
        Math.round(draftDelta) + 'h \u2192 ' + Math.round(projH) + 'h');
      let draftLabel = '';
      if (draftKind === 'add') {
        draftLabel = '<span class="wfm25-weekly-draft-label wfm25-weekly-draft-label--add">+' +
          Math.round(draftDelta) + 'h</span>';
      } else if (draftKind === 'reduce') {
        draftLabel = '<span class="wfm25-weekly-draft-label wfm25-weekly-draft-label--reduce">\u2212' +
          Math.round(draftDelta) + 'h</span>';
      }
      barsHtml += '<div class="wfm25-weekly-bar-slot' + (isOpen ? ' is-expanded' : '') + '">' +
        '<button type="button" class="wfm25-weekly-bar-btn" data-week-key="' + escapeHtml_(cell.weekKey) + '"' +
          ' aria-expanded="' + (isOpen ? 'true' : 'false') + '"' +
          ' aria-label="Week ending ' + escapeHtml_(cell.label) + ', ' + Math.round(committedH) + ' hours"' +
          ' title="' + escapeHtml_(tip.join('\n')) + '">' +
          '<div class="wfm25-weekly-bar-stack" style="height:' + plotH + 'px">' +
            (ghostPct > 0
              ? '<div class="wfm25-weekly-bar-ghost" style="height:' + ghostPct.toFixed(2) + '%"' +
                  ' aria-hidden="true"></div>'
              : '') +
            (addPct > 0
              ? '<div class="wfm25-weekly-bar-draft-add" style="height:' + addPct.toFixed(2) + '%"' +
                  ' aria-hidden="true"></div>'
              : '') +
            '<div class="wfm25-weekly-bar-committed' + forecastCls + '" style="height:' +
              committedPct.toFixed(2) + '%" aria-hidden="true"></div>' +
          '</div>' +
          draftLabel +
        '</button>' +
        '<span class="wfm25-weekly-bar-label">' + escapeHtml_(cell.label) + '</span>' +
      '</div>';
    });

    const expandedWeek = WFM25State.expandedWeekKey
      ? chartWeeks.find(function (w) { return w.weekKey === WFM25State.expandedWeekKey; })
      : null;
    const breakdownHtml = expandedWeek
      ? renderWFM25WeeklyBreakdown_(expandedWeek, detail, baseWeekMap, projWeekMap, showDraft, curQk)
      : '';

    return '<div class="wfm25-chrome-card wfm25-weekly-card" id="wfm25WeeklyChart">' +
      '<div class="wfm25-weekly-head">' +
        '<span class="wfm25-weekly-title">Weekly Capacity (all dates are week ending)</span>' +
      '</div>' +
      '<div class="wfm25-weekly-legend" aria-hidden="true">' +
        '<span class="wfm25-weekly-legend-item"><span class="wfm25-weekly-legend-swatch wfm25-weekly-legend-swatch--actual"></span>Actual</span>' +
        '<span class="wfm25-weekly-legend-item"><span class="wfm25-weekly-legend-swatch wfm25-weekly-legend-swatch--forecast"></span>Forecast</span>' +
        '<span class="wfm25-weekly-legend-item"><span class="wfm25-weekly-legend-swatch wfm25-weekly-legend-swatch--draft-add"></span>Draft add</span>' +
        '<span class="wfm25-weekly-legend-item"><span class="wfm25-weekly-legend-swatch wfm25-weekly-legend-swatch--draft-reduce"></span>Draft reduce</span>' +
      '</div>' +
      '<div class="wfm25-weekly-scroll">' +
        '<div class="wfm25-weekly-bars" role="group" aria-label="Weekly capacity bars">' + barsHtml + '</div>' +
      '</div>' +
      '<div class="wfm25-collapse-host wfm25-weekly-breakdown' +
        (expandedWeek ? '' : ' wfm25-collapse-hidden') + '" id="wfm25WeeklyBreakdown"' +
        ' aria-hidden="' + (expandedWeek ? 'false' : 'true') + '">' +
        '<div class="wfm25-collapse-inner">' +
          '<div class="wfm25-weekly-breakdown-content">' + breakdownHtml + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  /**
   * Per-week project breakdown panel (Pass 2).
   * @param {Object} weekMeta
   * @param {Object} detail
   * @param {Object|null} baseWeekMap
   * @param {Object|null} projWeekMap
   * @param {boolean} showDraft
   * @param {string} curQk
   * @returns {string}
   */
  function renderWFM25WeeklyBreakdown_(weekMeta, detail, baseWeekMap, projWeekMap, showDraft, curQk) {
    const weekKey = weekMeta.weekKey;
    const hrs = wfm25WeekDraftHours_(weekMeta, baseWeekMap, projWeekMap);
    const allowReduce = wfm25WeekAllowsReduceDraft_(weekMeta, curQk);
    let draftAdd = 0;
    let draftReduce = 0;
    if (showDraft) {
      if (hrs.projected > hrs.base + 0.05) draftAdd = hrs.projected - hrs.base;
      else if (hrs.projected < hrs.base - 0.05 && allowReduce) draftReduce = hrs.base - hrs.projected;
    }

    const projRows = (detail.projects || []).map(function (p) {
      return {
        project: p,
        hours: wfm25ProjectWeekHours_(p, weekKey),
        displayOnly: wfm25IsDisplayOnlyProject_(p)
      };
    }).filter(function (r) { return r.hours > 0; });

    const productive = projRows.filter(function (r) { return !r.displayOnly; })
      .sort(function (a, b) { return b.hours - a.hours; });
    const displayOnly = projRows.filter(function (r) { return r.displayOnly; })
      .sort(function (a, b) { return b.hours - a.hours; });

    let html = '<div class="wfm25-weekly-breakdown-head">' +
      '<span class="wfm25-weekly-breakdown-title">Week ending ' + escapeHtml_(weekMeta.label) + '</span>' +
      '<span class="wfm25-weekly-breakdown-total muted">' + Math.round(hrs.base) + 'h committed</span>' +
    '</div>';
    if (!productive.length && !displayOnly.length && !draftAdd && !draftReduce) {
      html += '<div class="muted">No project hours this week.</div>';
    } else {
      html += '<ul class="wfm25-weekly-breakdown-list">';
      productive.forEach(function (row) {
        html += wfm25WeeklyBreakdownRowHtml_(row);
      });
      displayOnly.forEach(function (row) {
        html += wfm25WeeklyBreakdownRowHtml_(row, true);
      });
      if (draftAdd > 0.05) {
        html += '<li class="wfm25-weekly-breakdown-row wfm25-weekly-breakdown-row--draft">' +
          '<span class="wfm25-weekly-breakdown-identity">Draft adjustment</span>' +
          '<span class="wfm25-weekly-breakdown-hours wfm25-weekly-draft-label--add">+' +
            Math.round(draftAdd) + 'h</span></li>';
      } else if (draftReduce > 0.05) {
        html += '<li class="wfm25-weekly-breakdown-row wfm25-weekly-breakdown-row--draft">' +
          '<span class="wfm25-weekly-breakdown-identity">Draft adjustment</span>' +
          '<span class="wfm25-weekly-breakdown-hours wfm25-weekly-draft-label--reduce">\u2212' +
            Math.round(draftReduce) + 'h</span></li>';
      }
      html += '</ul>';
    }
    return html;
  }

  /**
   * One row in the per-week project breakdown.
   * @param {Object} row
   * @param {boolean} [muted]
   * @returns {string}
   */
  function wfm25WeeklyBreakdownRowHtml_(row, muted) {
    const p = row.project;
    const identity = wfm25ProjectCompactIdentity_(p);
    const fullLabel = wfm25ProjectFullLabel_(p);
    const note = row.displayOnly
      ? ' <span class="wfm25-worker-projects-display-note">display only</span>'
      : '';
    const cls = 'wfm25-weekly-breakdown-row' +
      (muted || row.displayOnly ? ' wfm25-weekly-breakdown-row--display-only' : '');
    return '<li class="' + cls + '">' +
      '<span class="wfm25-weekly-breakdown-identity" title="' + escapeHtml_(fullLabel) + '">' +
        escapeHtml_(identity) + note + '</span>' +
      '<span class="wfm25-weekly-breakdown-hours">' + Math.round(row.hours) + 'h</span>' +
    '</li>';
  }

  /**
   * Wire worker-panel bar chart interactions (click, keyboard, outside close).
   * @param {Object} detail
   */
  function wfm25BindWorkerPanelInteractions_(detail) {
    const body = document.getElementById('wfm25WorkerPanelBody');
    if (!body) return;
    body.querySelectorAll('.wfm25-weekly-bar-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        const wk = btn.dataset.weekKey || '';
        WFM25State.expandedWeekKey = (WFM25State.expandedWeekKey === wk) ? null : wk;
        paintWFM25WorkerPanel_(State.explorerProjection);
        if (WFM25State.expandedWeekKey) {
          const breakdown = document.getElementById('wfm25WeeklyBreakdown');
          if (breakdown) {
            breakdown.scrollIntoView({
              block: 'nearest',
              behavior: wfm25MotionReduced_() ? 'auto' : 'smooth'
            });
          }
        }
      });
      btn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          btn.click();
        }
      });
    });
  }

  /**
   * Render quarter strip cells for the worker panel header.
   * @param {Array} quarters from api_getResourceDetailV2
   * @param {number} icpTarget
   * @param {Object|null} projection
   * @param {string} workerName
   */
  function renderWFM25WorkerQuarterStrip_(quarters, icpTarget, projection, workerName) {
    const strip = document.getElementById('wfm25WorkerQuarterStrip');
    if (!strip) return;
    if (!quarters || !quarters.length) {
      strip.hidden = true;
      return;
    }
    strip.hidden = false;
    const hasDraft = State.softBookings && State.softBookings.length;
    const headerCells = quarters.map(function (q) {
      const curTag = q.isCurrentQuarter ? ' \u25c6' : '';
      return '<th>' + escapeHtml_(q.quarterLabel || q.quarterKey) + curTag + '</th>';
    }).join('');
    const bodyCells = quarters.map(function (q) {
      const qk = q.quarterKey;
      let baseUtil = q.icpUtil;
      const projUtil = hasDraft
        ? wfm25ProjectionUtil_(projection, 'worker', workerName, qk, true)
        : null;
      if (hasDraft && projUtil != null) {
        const projBase = wfm25ProjectionUtil_(projection, 'worker', workerName, qk, false);
        if (projBase != null) baseUtil = projBase;
      }
      if (!hasDraft || projUtil == null) {
        const color = utilBandColor_(wfm25QuarterIcpColorRatio_(q, icpTarget));
        return '<td class="wfm25-worker-qstrip-cell" style="background:' + color.bg +
          ';color:' + color.fg + '">' + fmtPct(baseUtil) + '</td>';
      }
      const arrow = wfm25DraftArrow_(baseUtil, projUtil);
      return '<td class="wfm25-worker-qstrip-cell has-draft">' +
        '<div class="wfm25-worker-qstrip-committed">' + fmtPct(baseUtil) + '</div>' +
        '<div class="wfm25-draft-label">Your draft</div>' +
        '<div class="wfm25-worker-qstrip-draft">' + fmtPct(baseUtil) +
          ' \u2192 ' + fmtPct(projUtil) + ' ' + arrow + '</div></td>';
    }).join('');
    strip.innerHTML = '<table class="wfm25-worker-qstrip-table"><thead><tr>' +
      headerCells + '</tr></thead><tbody><tr>' + bodyCells + '</tr></tbody></table>';
  }

  /**
   * Render worker panel body from api_getResourceDetailV2 (reuses Explorer renderers).
   * @param {Object} detail
   * @param {Object|null} projection api_projectSoftBookings result
   * @param {string} workerName
   */
  function renderWFM25WorkerPanelBody_(detail, projection, workerName) {
    const body = document.getElementById('wfm25WorkerPanelBody');
    if (!body) return;
    if (!detail || !detail.found) {
      body.innerHTML = '<div class="muted" style="padding:12px">This worker is not in the current filter scope.</div>';
      return;
    }
    const icpTarget = (detail.weeks && detail.weeks[0]) ? detail.weeks[0].icpTarget : 0.72;
    body.innerHTML =
      renderWFM25WorkerKpiTiles_(detail, icpTarget) +
      renderWFM25WorkerProjectsSection_(detail) +
      renderWFM25WorkerSpecialtySection_(detail) +
      renderWFM25WeeklyBarChart_(detail.weeks || [], projection, workerName, detail);
    wfm25BindWorkerPanelInteractions_(detail);
  }

  /**
   * Spinner markup for WFM.25 loading states (reuses .explorer-loading-spinner).
   * @returns {string}
   */
  function wfm25LoadingSpinnerHtml_() {
    return '<div class="wfm25-panel-loading" role="status" aria-live="polite">' +
      '<div class="explorer-loading-spinner" aria-hidden="true"></div>' +
      '<div class="explorer-loading-label">Loading\u2026</div></div>';
  }

  /**
   * Set worker panel header synchronously from click-time row data (never waits on API).
   * @param {string} workerName
   * @param {string|null} teamLabel
   */
  function setWFM25WorkerPanelHeader_(workerName, teamLabel) {
    const nameEl = document.getElementById('wfm25WorkerPanelName');
    const metaEl = document.getElementById('wfm25WorkerPanelMeta');
    if (nameEl) nameEl.textContent = workerName || '\u2014';
    if (metaEl) {
      const meta = (State.ref && State.ref.resources || []).find(function (r) {
        return r.name === workerName;
      }) || {};
      const parts = [
        meta.job_profile || '',
        meta.manager_org || '',
        teamLabel || meta.resolvedTeam || ''
      ].filter(Boolean);
      metaEl.textContent = parts.join(' \u00b7 ');
    }
  }

  /**
   * Paint worker panel body + quarter strip from cached detail + optional projection.
   * Header is set synchronously on row click via setWFM25WorkerPanelHeader_.
   * @param {Object|null} projection api_projectSoftBookings result
   */
  function paintWFM25WorkerPanel_(projection) {
    const detail = WFM25State.selectedWorkerDetail;
    if (!detail || !WFM25State.selectedWorker) return;
    const icpTarget = (detail.weeks && detail.weeks[0]) ? detail.weeks[0].icpTarget : 0.72;
    renderWFM25WorkerQuarterStrip_(detail.quarters || [], icpTarget, projection, detail.resource);
    renderWFM25WorkerPanelBody_(detail, projection, detail.resource);
    wfm25UpdatePendingIndicator_();
  }

  /**
   * Update the minimal pending-draft count in panel footer + draft handle + tray title.
   */
  function wfm25UpdatePendingIndicator_() {
    const count = (State.softBookings || []).length;
    const footer = document.getElementById('wfm25WorkerPanelFooter');
    const ind = document.getElementById('wfm25PendingIndicator');
    const handle = document.getElementById('draftTrayHandle');
    const handleLabel = handle ? handle.querySelector('.wfm25-draft-handle-label') : null;
    const tray = document.getElementById('wfm25DraftTray');
    const trayTitle = document.getElementById('wfm25DraftTrayTitle');
    if (footer) footer.hidden = count === 0;
    if (ind) ind.textContent = count + ' pending';
    if (handleLabel) handleLabel.textContent = 'Pending changes (' + count + ')';
    if (trayTitle) trayTitle.textContent = 'Pending changes (' + count + ')';
    if (tray) tray.classList.toggle('has-drafts', count > 0);
    renderWFM25DraftTray_();
  }

  /**
   * Paint draft-tray rows from State.softBookings.
   */
  function renderWFM25DraftTray_() {
    const body = document.getElementById('wfm25DraftTrayBody');
    if (!body) return;
    const bookings = State.softBookings || [];
    if (!bookings.length) {
      body.innerHTML = '<div class="wfm25-draft-empty muted">No pending drafts</div>';
      return;
    }
    body.innerHTML = bookings.map(function (b, idx) {
      const isReduce = String(b.direction || 'add') === 'reduce';
      const dirCls = isReduce ? 'is-reduce' : 'is-add';
      const effHrs = isReduce ? getReductionClampEffectiveHours_(b.resource_name) : null;
      const showEff = isReduce && effHrs != null && Math.abs(effHrs - Number(b.total_hours)) > 0.05;
      const dirLabel = showEff
        ? softBookDirectionLabel_(Object.assign({}, b, { total_hours: effHrs })) + ' forward'
        : softBookDirectionLabel_(b);
      const spanNote = isReduce && reductionRangeSpansCurrentAndForward_(b.start_date, b.end_date)
        ? ' <span class="muted">(current quarter excluded)</span>' : '';
      return '<div class="wfm25-draft-tray-row">' +
        '<div class="wfm25-draft-tray-row-main">' +
          '<div class="wfm25-draft-tray-worker">' + escapeHtml_(b.resource_name) + '</div>' +
          '<div class="wfm25-draft-tray-meta">' +
            '<span class="wfm25-draft-tray-direction ' + dirCls + '">' +
              escapeHtml_(dirLabel) + '</span>' + spanNote +
            '<span class="wfm25-draft-tray-span muted">' + escapeHtml_(formatSoftBookSpan_(b)) + '</span>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="btn-ghost wfm25-draft-tray-remove" data-idx="' + idx +
          '" aria-label="Remove draft">\u2715</button>' +
      '</div>';
    }).join('');
    $$('.wfm25-draft-tray-remove', body).forEach(function (btn) {
      btn.addEventListener('click', function () {
        const i = Number(btn.dataset.idx);
        State.softBookings.splice(i, 1);
        onWFM25SoftBookingsChanged_();
      });
    });
  }

  /**
   * Open or close the WFM.25 draft tray slide-out.
   * @param {boolean} [open] force open/close; omit to toggle
   */
  function setWFM25DraftTrayOpen_(open) {
    const tray = document.getElementById('wfm25DraftTray');
    const handle = document.getElementById('draftTrayHandle');
    if (!tray) return;
    const isOpen = open !== undefined ? !!open : !tray.classList.contains('is-open');
    tray.classList.toggle('is-open', isOpen);
    tray.setAttribute('aria-hidden', isOpen ? 'false' : 'true');
    if (handle) handle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
  }

  /**
   * Wire draft-tray handle, footer actions, and initial render.
   */
  function initWFM25DraftTray_() {
    const handle = document.getElementById('draftTrayHandle');
    const closeBtn = document.getElementById('wfm25DraftTrayClose');
    const discardBtn = document.getElementById('wfm25DraftDiscardAll');
    const commitBtn = document.getElementById('wfm25DraftCommit');
    if (handle) {
      handle.addEventListener('click', function () {
        setWFM25DraftTrayOpen_();
      });
    }
    if (closeBtn) {
      closeBtn.addEventListener('click', function () {
        setWFM25DraftTrayOpen_(false);
      });
    }
    if (discardBtn) {
      discardBtn.addEventListener('click', function () {
        if (!(State.softBookings || []).length) return;
        clearWFM25SoftBookings_('discard');
        setWFM25DraftTrayOpen_(false);
      });
    }
    if (commitBtn) {
      commitBtn.addEventListener('click', openSoftBookCommitModal_);
    }
    renderWFM25DraftTray_();
  }

  /**
   * After soft-book commit in WFM.25, refresh aggregate + worker panel from server
   * so newly committed assignments are visible in the committed view.
   * Fetches scorecard and worker detail in parallel, then paints both in one tick.
   */
  async function wfm25AfterSoftBookCommitRefresh_() {
    wfm25UpdatePendingIndicator_();
    if (!State.softBookings.length) {
      State.explorerProjection = null;
    }

    const workerName = WFM25State.selectedWorker;
    const reqId = workerName ? ++WFM25State.workerReqId : null;

    const panelBody = document.getElementById('wfm25WorkerPanelBody');
    if (workerName && panelBody) {
      panelBody.innerHTML = wfm25LoadingSpinnerHtml_();
    }

    const scorecardPromise = call(
      'api_getQuarterlyScorecard',
      buildServerParams_({ workerScope: 'SLG' })
    );
    const workerPromise = workerName
      ? call(
          'api_getResourceDetailV2',
          buildServerParams_({ resource: workerName, workerScope: 'SLG' })
        )
      : null;

    let scorecardData = null;
    let scorecardErr = null;
    let workerDetail = null;
    let workerErr = null;

    const fetchPromises = [
      scorecardPromise
        .then(function (data) { scorecardData = data; })
        .catch(function (e) { scorecardErr = e; }),
      call('api_getXorgForecast', buildServerParams_())
        .then(function (data) { WFM25State.xorgForecastData = data; })
        .catch(function () { WFM25State.xorgForecastData = null; }),
    ];
    if (workerPromise) {
      fetchPromises.push(
        workerPromise
          .then(function (data) { workerDetail = data; })
          .catch(function (e) { workerErr = e; })
      );
    }
    await Promise.all(fetchPromises);

    if (workerName && reqId !== WFM25State.workerReqId) return;

    if (scorecardData) {
      renderWFM25UtilTable_(scorecardData);
      if (WFM25State.activeTab === 'hours-budget') {
        renderWFM25HoursCapacityTable_(scorecardData);
      }
    } else if (scorecardErr) {
      const body = document.getElementById('wfm25UtilBody');
      if (body) {
        body.innerHTML = '<tr><td colspan="5" class="muted" style="padding:14px;color:var(--thumbtack)">' +
          'Failed to load utilization data: ' + escapeHtml_(scorecardErr.message || String(scorecardErr)) +
          '</td></tr>';
      }
      console.error('[WFM.25] wfm25AfterSoftBookCommitRefresh_ scorecard failed:', scorecardErr);
    }

    if (workerName) {
      if (workerDetail) {
        WFM25State.selectedWorkerDetail = workerDetail;
        if (State.softBookings.length) {
          scheduleWFM25Projection_();
        } else {
          paintWFM25WorkerPanel_(null);
        }
      } else if (workerErr) {
        toast('Failed to refresh worker detail: ' + workerErr.message, 'err');
      }
    } else if (State.softBookings.length) {
      scheduleWFM25Projection_();
    }

    wfm25UpdatePendingIndicator_();
  }

  /**
   * Open the right-side worker panel and load detail from api_getResourceDetailV2.
   * @param {string} workerName
   * @param {string} teamLabel
   */
  async function wfm25OpenWorkerPanel_(workerName, teamLabel) {
    ExplorerQuarterState.metric = 'icp';
    WFM25State.selectedWorker = workerName;
    WFM25State.selectedWorkerTeam = teamLabel || null;
    WFM25State.selectedWorkerDetail = null;
    WFM25State.expandedWeekKey = null;
    State.selectedResource = workerName;

    const panel = document.getElementById('wfm25WorkerPanel');
    const body = document.getElementById('wfm25CapacityBody');
    const addBtn = document.getElementById('wfm25AdjustHoursBtn');
    if (panel) {
      panel.hidden = false;
      if (!wfm25MotionReduced_()) {
        panel.classList.remove('wfm25-motion-panel-exit');
        panel.classList.add('wfm25-motion-panel-enter');
        panel.addEventListener('animationend', function onEnterEnd() {
          panel.classList.remove('wfm25-motion-panel-enter');
          panel.removeEventListener('animationend', onEnterEnd);
        });
      }
    }
    if (body) body.classList.add('wfm25-panel-open');
    if (addBtn) addBtn.hidden = false;

    wfm25CollapseSetVisible_(document.getElementById('wfm25UtilBannerCollapse'), false);

    setWFM25WorkerPanelHeader_(workerName, teamLabel);

    const crumbs = [WFM25State.landingBreadcrumb];
    if (teamLabel) crumbs.push(teamLabel);
    crumbs.push(workerName);
    wfm25SetBreadcrumb_(crumbs);

    const panelBody = document.getElementById('wfm25WorkerPanelBody');
    if (panelBody) panelBody.innerHTML = wfm25LoadingSpinnerHtml_();
    const strip = document.getElementById('wfm25WorkerQuarterStrip');
    if (strip) {
      strip.hidden = true;
      strip.innerHTML = '';
    }

    const reqId = ++WFM25State.workerReqId;
    try {
      const detail = await call(
        'api_getResourceDetailV2',
        buildServerParams_({ resource: workerName, workerScope: 'SLG' })
      );
      if (reqId !== WFM25State.workerReqId) return;
      WFM25State.selectedWorkerDetail = detail;
      paintWFM25WorkerPanel_(State.explorerProjection);
      if (State.softBookings && State.softBookings.length) {
        scheduleWFM25Projection_();
      }
    } catch (err) {
      if (reqId !== WFM25State.workerReqId) return;
      if (panelBody) {
        panelBody.innerHTML = '<div class="muted" style="padding:12px;color:var(--thumbtack)">Failed to load: ' +
          escapeHtml_(err.message || String(err)) + '</div>';
      }
    }
  }

  /**
   * Close the worker panel and return to full-width aggregate.
   */
  function wfm25CloseWorkerPanelCore_() {
    WFM25State.workerReqId++;
    WFM25State.selectedWorker = null;
    WFM25State.selectedWorkerTeam = null;
    WFM25State.selectedWorkerDetail = null;
    WFM25State.expandedWeekKey = null;
    State.selectedResource = null;

    const panel = document.getElementById('wfm25WorkerPanel');
    const body = document.getElementById('wfm25CapacityBody');
    const addBtn = document.getElementById('wfm25AdjustHoursBtn');
    if (panel) panel.hidden = true;
    if (body) body.classList.remove('wfm25-panel-open');
    if (addBtn) addBtn.hidden = true;
    closeWFM25SoftBookOverlay_();

    if (WFM25State.scorecardData) {
      renderWFM25UtilTable_(WFM25State.scorecardData);
      if (WFM25State.activeTab === 'hours-budget') {
        renderWFM25HoursCapacityTable_(WFM25State.scorecardData);
      }
    } else {
      wfm25CollapseSetVisible_(document.getElementById('wfm25UtilBannerCollapse'), true);
    }

    if (WFM25State.expandedTeam) {
      wfm25SetBreadcrumb_([WFM25State.landingBreadcrumb, WFM25State.expandedTeam]);
    } else {
      wfm25SetBreadcrumb_(WFM25State.landingBreadcrumb);
    }
  }

  /**
   * Close the worker panel with optional slide-out motion.
   */
  function wfm25CloseWorkerPanel_() {
    const panel = document.getElementById('wfm25WorkerPanel');
    if (panel && !panel.hidden && !wfm25MotionReduced_()) {
      panel.classList.remove('wfm25-motion-panel-enter');
      panel.classList.add('wfm25-motion-panel-exit');
      const onEnd = function () {
        panel.removeEventListener('animationend', onEnd);
        panel.classList.remove('wfm25-motion-panel-exit');
        wfm25CloseWorkerPanelCore_();
      };
      panel.addEventListener('animationend', onEnd);
      setTimeout(onEnd, wfm25MotionDurationMs_() + 40);
      return;
    }
    wfm25CloseWorkerPanelCore_();
  }

  // ── WFM.25 soft-booking overlay + live projection ─────────────

  function closeWFM25SoftBookOverlay_() {
    const overlay = document.getElementById('wfm25SoftBookOverlay');
    if (overlay) overlay.hidden = true;
  }

  function openWFM25SoftBookOverlay_(resourceName) {
    const overlay = document.getElementById('wfm25SoftBookOverlay');
    if (!overlay) return;
