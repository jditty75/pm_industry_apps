    const workerInput = document.getElementById('wfm25SbWorker');
    const startInput = document.getElementById('wfm25SbStart');
    const endInput = document.getElementById('wfm25SbEnd');
    const hoursInput = document.getElementById('wfm25SbHours');
    if (workerInput) workerInput.value = resourceName || '';
    const today = new Date().toISOString().slice(0, 10);
    if (startInput) startInput.value = today;
    if (endInput) endInput.value = today;
    if (hoursInput) hoursInput.value = '';
    wfm25SetSoftBookDirection_('add');
    overlay.hidden = false;
    if (hoursInput) hoursInput.focus();
  }

  function wfm25GetEmployeeId_(resourceName) {
    const proj = State.explorerProjection || State.explorerBaselineProjection;
    if (proj && proj.baseline) {
      const w = (proj.baseline.worker || []).find(function (x) {
        return x.resourceName === resourceName;
      });
      if (w && w.employeeId) return w.employeeId;
    }
    const r = (State.ref && State.ref.resources || []).find(function (x) {
      return x.name === resourceName;
    });
    return r ? (r.employee_id || '') : '';
  }

  function addWFM25SoftBooking_() {
    const resourceName = WFM25State.selectedWorker ||
      (document.getElementById('wfm25SbWorker') && document.getElementById('wfm25SbWorker').value);
    if (!resourceName) return;
    const start = (document.getElementById('wfm25SbStart') && document.getElementById('wfm25SbStart').value) || '';
    const end = (document.getElementById('wfm25SbEnd') && document.getElementById('wfm25SbEnd').value) || '';
    const hours = Number(document.getElementById('wfm25SbHours') && document.getElementById('wfm25SbHours').value);
    if (!start || !end || !hours || hours <= 0) {
      toast('Enter start date, end date, and total hours.', 'err');
      return;
    }
    if (new Date(start) > new Date(end)) {
      toast('Start date must be on or before end date.', 'err');
      return;
    }
    const direction = wfm25GetSoftBookDirection_();
    if (direction === 'reduce' && isRangeEntirelyInCurrentQuarter_(start, end)) {
      toast('Current-quarter hours are actuals and cannot be reduced. Reduce forward-quarter hours instead.', 'err');
      return;
    }
    State.softBookings.push({
      employee_id: wfm25GetEmployeeId_(resourceName),
      resource_name: resourceName,
      start_date: start,
      end_date: end,
      total_hours: hours,
      direction: direction
    });
    closeWFM25SoftBookOverlay_();
    onWFM25SoftBookingsChanged_();
    toast(direction === 'reduce'
      ? (reductionRangeSpansCurrentAndForward_(start, end)
        ? 'Reduction draft added — forward weeks only (current quarter excluded).'
        : 'Reduction draft added — watch utilization fall.')
      : 'Draft added — watch the numbers shift.', '');
  }

  function clearWFM25SoftBookings_(reason) {
    State.explorerProjectionReqId++;
    State.softBookings = [];
    State.explorerProjection = null;
    closeWFM25SoftBookOverlay_();
    if (WFM25State.scorecardData) {
      renderWFM25UtilTable_(WFM25State.scorecardData);
      if (WFM25State.activeTab === 'hours-budget') {
        renderWFM25HoursCapacityTable_(WFM25State.scorecardData);
      }
    }
    if (WFM25State.selectedWorkerDetail) {
      paintWFM25WorkerPanel_(null);
    }
    wfm25UpdatePendingIndicator_();
  }

  function onWFM25SoftBookingsChanged_() {
    wfm25UpdatePendingIndicator_();
    scheduleWFM25Projection_();
  }

  async function fetchWFM25Projection_() {
    if (!State.softBookings.length) {
      clearWFM25SoftBookings_('empty');
      return;
    }
    const reqId = ++State.explorerProjectionReqId;
    try {
      const result = await call(
        'api_projectSoftBookings',
        buildServerParams_({ workerScope: 'SLG' }),
        State.softBookings
      );
      if (reqId !== State.explorerProjectionReqId) return;
      State.explorerProjection = result;
      showReductionClampWarnings_(result.clampWarnings);
      if (WFM25State.scorecardData) {
        renderWFM25UtilTable_(WFM25State.scorecardData);
        if (WFM25State.activeTab === 'hours-budget') {
          renderWFM25HoursCapacityTable_(WFM25State.scorecardData);
        }
      }
      if (WFM25State.selectedWorkerDetail) {
        paintWFM25WorkerPanel_(result);
      }
    } catch (err) {
      if (reqId !== State.explorerProjectionReqId) return;
      toast('Projection failed: ' + err.message, 'err');
    }
  }

  const scheduleWFM25Projection_ = debounce_(fetchWFM25Projection_, 300);


  /**
   * Aggregate api_getQuarterlyScorecard data by teamLabel.
   * Returns quarter keys + team list with per-quarter weighted-avg icpUtil
   * and individual worker rows for zoom-in-place.
   *
   * @param {Object} data  api_getQuarterlyScorecard result
   * @returns {{quarterKeys: string[], teams: Array}}
   */
  function wfm25AggregateByTeam_(data) {
    const quarterKeys = (data && data.quarterKeys) || [];
    const workers = (data && data.workers) || [];

    // Group workers by teamLabel
    var teamMap = {};
    workers.forEach(function (w) {
      const tl = w.teamLabel || 'Unknown';
      if (!teamMap[tl]) {
        teamMap[tl] = {
          label:      tl,
          color:      wfm25TeamColor_(tl),
          icpTarget:  w.icpTarget || 0.75,
          workerRows: []
        };
      }
      teamMap[tl].workerRows.push(w);
    });

    // Sort teams: Functional → Technical → Delivery → others
    const ORDER = ['functional', 'technical', 'delivery'];
    const teamList = Object.values(teamMap);
    teamList.sort(function (a, b) {
      const ai = ORDER.findIndex(function (k) { return a.label.toLowerCase().indexOf(k) >= 0; });
      const bi = ORDER.findIndex(function (k) { return b.label.toLowerCase().indexOf(k) >= 0; });
      return ((ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi)) || a.label.localeCompare(b.label);
    });

    // Compute per-quarter weighted-avg utilization for each team
    teamList.forEach(function (team) {
      team.quarters = quarterKeys.map(function (qk, qi) {
        var sumProd = 0, sumAvail = 0, count = 0;
        team.workerRows.forEach(function (w) {
          const q = (w.quarters || [])[qi];
          if (!q) return;
          sumProd  += Number(q.productiveHours) || 0;
          sumAvail += Number(q.icpAvailableHours) || 0;
          count++;
        });
        const util = (count > 0 && sumAvail > 0) ? (sumProd / sumAvail) : null;
        return { qk: qk, util: util };
      });

      // Build worker list for zoom-in-place
      team.workers = team.workerRows.map(function (w) {
        return {
          name:      w.worker || '\u2014',
          manager:   w.manager || '',
          icpTarget: w.icpTarget || team.icpTarget,
          quarters:  (w.quarters || []).map(function (q) {
            return { util: (q && q.icpUtil != null) ? q.icpUtil : null };
          })
        };
      });
      team.workers.sort(function (a, b) { return a.name.localeCompare(b.name); });
    });

    return { quarterKeys: quarterKeys, teams: teamList };
  }

  /**
   * Count allocation bands for workers in current scope at current quarter.
   * @param {Object} data
   * @returns {{over:number, under:number, ontrack:number, qi:number, scopeUtil:number|null, tightestTeam:Object|null}}
   */
  function wfm25ComputeAllocationSummary_(data) {
    const quarterKeys = (data && data.quarterKeys) || [];
    const qi = wfm25CurQuarterIndex_(quarterKeys);
    const thresholds = wfm25AllocThresholds_();
    const scopeWorkers = wfm25ScopeWorkers_(data);
    const counts = { over: 0, under: 0, ontrack: 0 };
    let sumProd = 0;
    let sumAvail = 0;

    scopeWorkers.forEach(function (w) {
      const q = (w.quarters || [])[qi];
      if (!q) return;
      const band = wfm25ClassifyAllocation_(q.ratioToTarget, thresholds);
      counts[band]++;
      sumProd += Number(q.productiveHours) || 0;
      sumAvail += Number(q.icpAvailableHours) || 0;
    });

    const scopeUtil = sumAvail > 0 ? sumProd / sumAvail : null;
    let tightestTeam = null;
    let tightestRatio = -Infinity;

    if (!WFM25State.expandedTeam) {
      const agg = wfm25AggregateByTeam_(data);
      agg.teams.forEach(function (team) {
        const tq = team.quarters[qi];
        if (!tq || tq.util == null) return;
        const ratio = team.icpTarget > 0 ? tq.util / team.icpTarget : 0;
        if (ratio > tightestRatio) {
          tightestRatio = ratio;
          tightestTeam = { label: team.label, util: tq.util };
        }
      });
    }

    return {
      over: counts.over,
      under: counts.under,
      ontrack: counts.ontrack,
      qi: qi,
      scopeUtil: scopeUtil,
      tightestTeam: tightestTeam
    };
  }

  /**
   * Update the allocation filter chip below the Utilization banner.
   */
  function wfm25UpdateUtilFilterChip_() {
    const wrap = document.getElementById('wfm25UtilFilterChipWrap');
    const chip = document.getElementById('wfm25UtilFilterChip');
    if (!wrap || !chip) return;
    const filter = WFM25State.utilAllocFilter;
    if (!filter || !WFM25State.scorecardData) {
      wrap.hidden = true;
      return;
    }
    const summary = wfm25ComputeAllocationSummary_(WFM25State.scorecardData);
    const count = filter === 'over' ? summary.over : summary.under;
    const label = filter === 'over' ? 'Over-allocated' : 'Under-allocated';
    chip.textContent = 'Showing: ' + label + ' (' + count + ')';
    wrap.hidden = false;
  }

  /**
   * Render scope-aware Utilization allocation banner (current quarter).
   * @param {Object} data api_getQuarterlyScorecard result
   */
  function renderWFM25UtilAllocationBanner_(data) {
    const grid = document.getElementById('wfm25UtilBannerGrid');
    const collapseHost = document.getElementById('wfm25UtilBannerCollapse');
    if (!grid) return;

    if (WFM25State.selectedWorker) {
      wfm25CollapseSetVisible_(collapseHost, false);
      return;
    }
    wfm25CollapseSetVisible_(collapseHost, true);

    const teamScope = !!WFM25State.expandedTeam;
    const summary = wfm25ComputeAllocationSummary_(data);
    const activeFilter = WFM25State.utilAllocFilter;

    const overPressed = activeFilter === 'over';
    const underPressed = activeFilter === 'under';

    const overTile =
      '<button type="button" class="wfm25-util-banner-tile wfm25-util-banner-tile--interactive wfm25-util-banner-tile--over"' +
        ' data-wfm25-alloc-filter="over" aria-pressed="' + (overPressed ? 'true' : 'false') + '">' +
        '<div class="wfm25-util-banner-label">Over-allocated</div>' +
        '<div class="wfm25-util-banner-value">' + summary.over + '</div>' +
      '</button>';

    const underTile =
      '<button type="button" class="wfm25-util-banner-tile wfm25-util-banner-tile--interactive wfm25-util-banner-tile--under"' +
        ' data-wfm25-alloc-filter="under" aria-pressed="' + (underPressed ? 'true' : 'false') + '">' +
        '<div class="wfm25-util-banner-label">Under-allocated</div>' +
        '<div class="wfm25-util-banner-value">' + summary.under + '</div>' +
      '</button>';

    const onTrackTile =
      '<div class="wfm25-util-banner-tile">' +
        '<div class="wfm25-util-banner-label">On Track</div>' +
        '<div class="wfm25-util-banner-value">' + summary.ontrack + '</div>' +
      '</div>';

    const utilLabel = teamScope ? 'Team Utilization' : 'SLG Utilization';
    const utilTile =
      '<div class="wfm25-util-banner-tile">' +
        '<div class="wfm25-util-banner-label">' + utilLabel + '</div>' +
        '<div class="wfm25-util-banner-value">' +
          (summary.scopeUtil != null ? fmtPct(summary.scopeUtil) : '\u2014') + '</div>' +
      '</div>';

    let tiles = overTile + underTile + onTrackTile + utilTile;

    if (!teamScope && summary.tightestTeam) {
      tiles +=
        '<div class="wfm25-util-banner-tile">' +
          '<div class="wfm25-util-banner-label">Tightest Team</div>' +
          '<div class="wfm25-util-banner-value" style="font-size:16px">' +
            escapeHtml_(summary.tightestTeam.label) + ' \u00b7 ' +
            fmtPct(summary.tightestTeam.util) + '</div>' +
        '</div>';
    }

    grid.className = 'wfm25-util-banner-grid' + (teamScope ? ' wfm25-util-banner-grid--team-scope' : '');
    grid.innerHTML = tiles;

    $$('[data-wfm25-alloc-filter]', grid).forEach(function (btn) {
      btn.addEventListener('click', function () {
        const key = btn.dataset.wfm25AllocFilter;
        WFM25State.utilAllocFilter = (WFM25State.utilAllocFilter === key) ? null : key;
        if (WFM25State.scorecardData) {
          renderWFM25UtilTable_(WFM25State.scorecardData);
        }
      });
    });

    wfm25UpdateUtilFilterChip_();

    const chip = document.getElementById('wfm25UtilFilterChip');
    if (chip && !chip.dataset.wfm25Wired) {
      chip.dataset.wfm25Wired = '1';
      chip.addEventListener('click', function () {
        WFM25State.utilAllocFilter = null;
        if (WFM25State.scorecardData) {
          renderWFM25UtilTable_(WFM25State.scorecardData);
        }
      });
    }
  }

  // ── Render Utilization table ──────────────────────────────────

  /**
   * Render the org-team utilization aggregate table.
   * Rows = teams; columns = fiscal quarter keys from the API.
   * Clicking a team row expands worker rows inline (only one team at a time).
   * Clicking again collapses and resets breadcrumb.
   *
   * @param {Object} data  api_getQuarterlyScorecard result
   */
  function renderWFM25UtilTable_(data) {
    WFM25State.scorecardData = data;
    const headerRow = document.getElementById('wfm25UtilHeaderRow');
    const body      = document.getElementById('wfm25UtilBody');
    if (!headerRow || !body) return;

    renderWFM25UtilAllocationBanner_(data);

    const agg   = wfm25AggregateByTeam_(data);
    const qKeys = agg.quarterKeys;
    const curQk = fiscalQuarterKey_(new Date());
    const allocQi = wfm25CurQuarterIndex_(qKeys);
    const hasAllocFilter = !!WFM25State.utilAllocFilter;

    // ── Header ──
    $$('.wfm25-qth', headerRow).forEach(function (el) { el.remove(); });
    qKeys.forEach(function (qk) {
      const th = document.createElement('th');
      th.className = 'wfm25-qth' + (qk === curQk ? ' wfm25-cur-qth' : '');
      th.textContent = qk + (qk === curQk ? ' \u25c6' : '');
      headerRow.appendChild(th);
    });

    // ── Body ──
    if (!agg.teams.length) {
      body.innerHTML = '<tr><td colspan="' + (1 + qKeys.length) +
        '" class="muted" style="padding:14px">No team data in scope.</td></tr>';
      return;
    }

    const rows = [];
    const projection = State.explorerProjection;
    const hasDraft = State.softBookings && State.softBookings.length;
    const selectedWorker = WFM25State.selectedWorker;
    const selectedTeam = WFM25State.selectedWorkerTeam;

    agg.teams.forEach(function (team) {
      const isExpanded = WFM25State.expandedTeam === team.label;
      const teamGetsDraft = hasDraft && selectedTeam === team.label;
      const teamCount = wfm25CountScopedTeamWorkers_(team.label, data, allocQi);

      // Team aggregate cells
      const teamQCells = team.quarters.map(function (q, qi) {
        const qk = qKeys[qi];
        let baseUtil = q.util;
        const projUtil = teamGetsDraft
          ? wfm25ProjectionUtil_(projection, 'orgTeam', team.label, qk, true)
          : null;
        if (teamGetsDraft && projUtil != null) {
          const projBase = wfm25ProjectionUtil_(projection, 'orgTeam', team.label, qk, false);
          if (projBase != null) baseUtil = projBase;
        }
        return wfm25RenderUtilCell_(baseUtil, projUtil, team.icpTarget);
      }).join('');

      rows.push(
        '<tr class="wfm25-team-row' + (isExpanded ? ' expanded' : '') +
        '" data-wfm25-team="' + escapeHtml_(team.label) + '">' +
        '<td><div class="wfm25-team-name-cell">' +
          '<span class="wfm25-team-swatch" style="background:' + team.color + '"></span>' +
          escapeHtml_(team.label) +
          ' <span class="wfm25-team-count muted">(' + teamCount + ')</span>' +
          '<span class="wfm25-expand-chev">\u25ba</span>' +
        '</div></td>' +
        teamQCells + '</tr>'
      );

      // Worker rows — only injected when this team is expanded
      if (isExpanded) {
        team.workers.forEach(function (w) {
          const workerRow = (data.workers || []).find(function (wr) {
            return wr.worker === w.name;
          });
          if (hasAllocFilter && workerRow && !wfm25WorkerMatchesAllocFilter_(workerRow, allocQi)) {
            return;
          }
          const workerGetsDraft = hasDraft && w.name === selectedWorker;
          const wQCells = w.quarters.map(function (q, qi) {
            const qk = qKeys[qi];
            let baseUtil = q.util;
            const projUtil = workerGetsDraft
              ? wfm25ProjectionUtil_(projection, 'worker', w.name, qk, true)
              : null;
            if (workerGetsDraft && projUtil != null) {
              const projBase = wfm25ProjectionUtil_(projection, 'worker', w.name, qk, false);
              if (projBase != null) baseUtil = projBase;
            }
            return wfm25RenderUtilCell_(baseUtil, projUtil, w.icpTarget);
          }).join('');
          rows.push(
            '<tr class="wfm25-worker-row' +
            (w.name === selectedWorker ? ' wfm25-worker-row-selected' : '') + '"' +
            ' data-wfm25-worker="' + escapeHtml_(w.name) + '"' +
            ' data-wfm25-team="' + escapeHtml_(team.label) + '">' +
            '<td>' + escapeHtml_(w.name) + '</td>' +
            wQCells + '</tr>'
          );
        });
      }
    });

    const totalCount = wfm25CountScopedTeamWorkers_(null, data, allocQi);
    const teamSummary = (data && data.teamSummary) || [];
    const orgIcpTarget = agg.teams.length ? agg.teams[0].icpTarget : 0.75;
    const orgGetsDraft = hasDraft && selectedWorker;
    const orgQCells = qKeys.map(function (qk, qi) {
      const tq = teamSummary[qi];
      let baseUtil = tq ? tq.icpUtil : null;
      let projUtil = null;
      if (orgGetsDraft) {
        const raw = wfm25ProjectionQuarter_(projection, 'org', null, qk, true);
        projUtil = raw && raw.icpUtil != null ? raw.icpUtil : null;
        if (projUtil != null) {
          const rawBase = wfm25ProjectionQuarter_(projection, 'org', null, qk, false);
          if (rawBase && rawBase.icpUtil != null) baseUtil = rawBase.icpUtil;
        }
      }
      return wfm25RenderUtilCell_(baseUtil, projUtil, orgIcpTarget);
    }).join('');
    rows.push(
      '<tr class="wfm25-team-row wfm25-org-total-row">' +
      '<td><div class="wfm25-team-name-cell">' +
        '<span class="wfm25-team-swatch" style="background:var(--ballpoint)"></span>' +
        '<strong>SLG Total</strong>' +
        ' <span class="wfm25-team-count muted">(' + totalCount + ')</span>' +
      '</div></td>' +
      orgQCells + '</tr>'
    );

    const wrap = document.getElementById('wfm25UtilWrap');

    function paintAndWire_() {
      body.innerHTML = rows.join('');

      $$('.wfm25-team-row', body).forEach(function (tr) {
        tr.addEventListener('click', function () {
          if (WFM25State.selectedWorker) {
            wfm25CloseWorkerPanel_();
          }
          const tl = tr.dataset.wfm25Team;
          if (WFM25State.expandedTeam === tl) {
            WFM25State.expandedTeam = null;
            wfm25SetBreadcrumb_(WFM25State.landingBreadcrumb);
          } else {
            WFM25State.expandedTeam = tl;
            wfm25SetBreadcrumb_([WFM25State.landingBreadcrumb, tl]);
          }
          renderWFM25UtilTable_(WFM25State.scorecardData);
        });
      });

      $$('.wfm25-worker-row', body).forEach(function (tr) {
        tr.addEventListener('click', function (e) {
          e.stopPropagation();
          const wName = tr.dataset.wfm25Worker;
          const tName = tr.dataset.wfm25Team;
          wfm25OpenWorkerPanel_(wName, tName);
        });
      });
    }

    if (wrap) {
      wfm25MotionDrillUpdate_(wrap, paintAndWire_);
    } else {
      paintAndWire_();
    }
  }

  /**
   * Show or hide the Utilization panel loading shell (spinner only — no partial content).
   * @param {boolean} loading
   */
  function wfm25SetUtilLoading_(loading) {
    const loadingEl = document.getElementById('wfm25UtilLoading');
    const contentEl = document.getElementById('wfm25UtilContent');
    if (loadingEl) loadingEl.hidden = !loading;
    if (contentEl) contentEl.hidden = loading;
  }

  /**
   * Fetch and render the Utilization tab via existing api_getQuarterlyScorecard.
   * Aggregates by team client-side. No new server endpoint.
   */
  async function loadWFM25Utilization_() {
    wfm25SetUtilLoading_(true);
    try {
      // Use SLG worker scope (same default as Dashboard; directors scoped via State.filters)
      const params = buildServerParams_({ workerScope: 'SLG' });
      const data = await call('api_getQuarterlyScorecard', params);
      renderWFM25UtilTable_(data);

          'Failed to load utilization data: ' + escapeHtml_(err.message || String(err)) + '</td></tr>';
      }
      console.error('[WFM.25] loadWFM25Utilization_ failed:', err);

  // ── Reusable motion / collapse transition primitive ─────────

  /**
   * Whether the user prefers reduced motion.
   * @returns {boolean}
   */
  function wfm25MotionReduced_() {
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  /**
   * Standard motion duration in ms (0 when reduced motion).
   * @returns {number}
   */
  function wfm25MotionDurationMs_() {
    return wfm25MotionReduced_() ? 0 : 220;
  }

  /**
   * Show or hide a collapse host with height + opacity transition.
   * @param {HTMLElement|null} hostEl
   * @param {boolean} visible
   */
  function wfm25CollapseSetVisible_(hostEl, visible) {
    if (!hostEl) return;
    hostEl.classList.toggle('wfm25-collapse-hidden', !visible);
    hostEl.classList.toggle('wfm25-motion-collapse-hidden', !visible);
    hostEl.setAttribute('aria-hidden', visible ? 'false' : 'true');
  }

  /**
   * Run a DOM update with drill zoom-in-place motion on a host element.
   * @param {HTMLElement|null} hostEl
   * @param {function():void} updateFn
   */
  function wfm25MotionDrillUpdate_(hostEl, updateFn) {
    if (!hostEl || wfm25MotionReduced_()) {
      updateFn();
      return;
    }
    hostEl.classList.add('wfm25-motion-drill-exit');
    const finishExit = function (e) {
      if (e && e.propertyName && e.propertyName !== 'opacity') return;
      hostEl.removeEventListener('transitionend', finishExit);
      updateFn();
      hostEl.classList.remove('wfm25-motion-drill-exit');
      hostEl.classList.add('wfm25-motion-drill-enter');
      const finishEnter = function () {
        hostEl.classList.remove('wfm25-motion-drill-enter');
        hostEl.removeEventListener('animationend', finishEnter);
      };
      hostEl.addEventListener('animationend', finishEnter);
    };
    hostEl.addEventListener('transitionend', finishExit);
    setTimeout(function () {
      if (hostEl.classList.contains('wfm25-motion-drill-exit')) finishExit(null);
    }, wfm25MotionDurationMs_() + 40);
  }

  /**
   * Index of the current fiscal quarter in the scorecard window.
   * @param {string[]} quarterKeys
   * @returns {number}
   */
  function wfm25CurQuarterIndex_(quarterKeys) {
    const curQk = fiscalQuarterKey_(new Date());
    const idx = (quarterKeys || []).indexOf(curQk);
    return idx >= 0 ? idx : 1;
  }

  /**
   * Allocation thresholds from api_getReference (Config_Settings fallbacks).
   * @returns {{over:number, under:number}}
   */
  function wfm25AllocThresholds_() {
    const ref = State.ref || {};
    const over = Number(ref.allocOverRatio);
    const under = Number(ref.allocUnderRatio);
    return {
      over: over > 0 ? over : 1.10,
      under: under > 0 ? under : 0.85
    };
  }

  /**
   * Classify a worker's ratio-to-target into allocation bands.
   * @param {number} ratioToTarget
   * @param {{over:number, under:number}} thresholds
   * @returns {'over'|'under'|'ontrack'}
   */
  function wfm25ClassifyAllocation_(ratioToTarget, thresholds) {
    const r = Number(ratioToTarget) || 0;
    if (r >= thresholds.over) return 'over';
    if (r < thresholds.under) return 'under';
    return 'ontrack';
  }

  /**
   * Workers in the current breadcrumb scope (org or expanded team).
   * @param {Object} data api_getQuarterlyScorecard result
   * @returns {Array}
   */
  function wfm25ScopeWorkers_(data) {
    const workers = (data && data.workers) || [];
    const team = WFM25State.expandedTeam;
    if (!team) return workers.slice();
    return workers.filter(function (w) { return (w.teamLabel || 'Unknown') === team; });
  }

  /**
   * Whether a worker matches the active allocation tile filter at current quarter.
   * @param {Object} worker
   * @param {number} qi quarter index
   * @returns {boolean}
   */
  function wfm25WorkerMatchesAllocFilter_(worker, qi) {
    const filter = WFM25State.utilAllocFilter;
    if (!filter) return true;
    const q = (worker.quarters || [])[qi];
    if (!q) return false;
    const thresholds = wfm25AllocThresholds_();
    const band = wfm25ClassifyAllocation_(q.ratioToTarget, thresholds);
    return band === filter;
  }

  /**
   * Hand-rendered utilization bar for Hours & Capacity cells.
   * @param {number|null} util
   * @param {number} icpTarget
   * @returns {string}
   */
  function wfm25HcUtilBarHtml_(util, icpTarget) {
    if (util == null) {
      return '<div class="wfm25-hc-util-bar-wrap"><div class="wfm25-hc-util-bar" style="width:0"></div></div>';
    }
    const color = cellColor(util, icpTarget);
    const widthPct = Math.min(Math.max(Number(util) || 0, 0), 1.25) / 1.25 * 100;
    return '<div class="wfm25-hc-util-bar-wrap">' +
      '<div class="wfm25-hc-util-bar" style="width:' + widthPct.toFixed(1) + '%;background:' +
      color.bg + '"></div></div>';
  }

  // ── Hours & Capacity (Stage 4c) ─────────────────────────────

  /**
   * Look up projected/baseline quarter metrics from api_projectSoftBookings payload.
   * @param {Object|null} projection
   * @param {'worker'|'team'|'orgTeam'|'org'} level
   * @param {string} [key] resourceName or teamLabel
   * @param {string} quarterKey
   * @param {boolean} projected
   * @returns {Object|null}
   */
  function wfm25ProjectionQuarter_(projection, level, key, quarterKey, projected) {
    if (!projection) return null;
    const bucket = projected ? projection.projected : projection.baseline;
    if (!bucket) return null;
    let row = null;
    if (level === 'worker') {
      row = (bucket.worker || []).find(function (w) { return w.resourceName === key; });
    } else if (level === 'team' || level === 'orgTeam') {
      row = (bucket.orgTeams || []).find(function (o) { return o.teamLabel === key; });
    } else if (level === 'org') {
      row = bucket.team;
    }
    if (!row) return null;
    const q = (row.quarters || []).find(function (qq) { return qq.quarterKey === quarterKey; });
    return q || null;
  }

  /**
   * Aggregate scorecard data into planned hours, capacity, utilization, and remaining.
   * Mirrors wfm25AggregateByTeam_ scope and team ordering.
   * @param {Object} data api_getQuarterlyScorecard result
   * @returns {{quarterKeys: string[], orgTotal: Object, teams: Array}}
   */
  function wfm25AggregateHoursAndCapacityByTeam_(data) {
    const agg = wfm25AggregateByTeam_(data);
    const quarterKeys = agg.quarterKeys;
    const workers = (data && data.workers) || [];

    const teams = agg.teams.map(function (team) {
      const quarters = quarterKeys.map(function (qk, qi) {
        let sumProd = 0;
        let sumAvail = 0;
        team.workerRows.forEach(function (w) {
          const q = (w.quarters || [])[qi];
          if (!q) return;
          sumProd += Number(q.productiveHours) || 0;
          sumAvail += Number(q.icpAvailableHours) || 0;
        });
        const util = sumAvail > 0 ? sumProd / sumAvail : null;
        return {
          qk: qk,
          planned: sumProd,
          capacity: sumAvail,
          util: util,
          remaining: sumAvail - sumProd
        };
      });
      return {
        label: team.label,
        color: team.color,
        icpTarget: team.icpTarget,
        quarters: quarters
      };
    });

    const orgTotal = {
      label: 'SLG Total',
      color: 'var(--ballpoint)',
      icpTarget: teams.length ? teams[0].icpTarget : 0.75,
      quarters: quarterKeys.map(function (qk, qi) {
        let sumProd = 0;
        let sumAvail = 0;
        workers.forEach(function (w) {
          const q = (w.quarters || [])[qi];
          if (!q) return;
          sumProd += Number(q.productiveHours) || 0;
          sumAvail += Number(q.icpAvailableHours) || 0;
        });
        const util = sumAvail > 0 ? sumProd / sumAvail : null;
        return {
          qk: qk,
          planned: sumProd,
          capacity: sumAvail,
          util: util,
          remaining: sumAvail - sumProd
        };
      })
    };

    return { quarterKeys: quarterKeys, orgTotal: orgTotal, teams: teams };
  }

  /**
   * Utilization-band CSS class for Hours & Capacity cells (ratio-to-target bands).
   * @param {number|null} util raw utilization (productive ÷ capacity)
   * @param {number} icpTarget
   * @returns {string}
   */
  function wfm25UtilBandClass_(util, icpTarget) {
    if (util == null) return '';
    const ratio = icpTarget > 0 ? util / icpTarget : 1;
    const b = wfm25UtilBands_();
    if (ratio < b.coldMax) return 'wfm25-util-band--cold';
    if (ratio < b.coolMax) return 'wfm25-util-band--cool';
    if (ratio < b.approachingMax) return 'wfm25-util-band--approaching';
    if (ratio < b.ontargetMax) return 'wfm25-util-band--ontarget';
    if (ratio < b.warmMax) return 'wfm25-util-band--warm';
    return 'wfm25-util-band--hot';
  }

  /**
   * Small utilization swatch for compact Hours & Capacity cells.
   * @param {number|null} util
   * @param {number} icpTarget
   * @returns {string}
   */
  function wfm25HcUtilSwatchHtml_(util, icpTarget) {
    if (util == null) {
      return '<span class="wfm25-hc-util-swatch wfm25-hc-util-swatch--empty" aria-hidden="true"></span>';
    }
    const color = cellColor(util, icpTarget);
    return '<span class="wfm25-hc-util-swatch" style="background:' + color.bg + '"' +
      ' aria-hidden="true"></span>';
  }

  /**
   * Quarter header label for Hours & Capacity (key + Previous/Current/Next kind).
   * @param {string} qk
   * @param {number} qi
   * @param {number} curIdx
   * @returns {string}
   */
  function wfm25HcQuarterHeaderLabel_(qk, qi, curIdx) {
    let kind = 'Next (forecast)';
    if (qi < curIdx) kind = 'Previous (actuals)';
    else if (qi === curIdx) kind = 'Current';
    const curTag = qi === curIdx ? ' \u25c6' : '';
    return '<span class="wfm25-hc-qth-key">' + escapeHtml_(qk) + curTag + '</span>' +
      '<span class="wfm25-hc-qth-kind">' + escapeHtml_(kind) + '</span>';
  }

  /**
   * Total delivery hours for one quarter (SLG planned + cross-org groups).
   * @param {Object} hc wfm25AggregateHoursAndCapacityByTeam_ result
   * @param {Array<Object>} xorgRows wfm25BuildXorgHcRows_ result
   * @param {number} qi quarter index
   * @returns {number}
   */
  function wfm25QuarterDeliveryTotalHours_(hc, xorgRows, qi) {
    const orgQ = hc.orgTotal.quarters[qi];
    if (!orgQ) return 0;
    let total = Number(orgQ.planned) || 0;
    (xorgRows || []).forEach(function (row) {
      const hrs = row.quarters[qi];
      if (hrs != null) total += Number(hrs) || 0;
    });
    return total;
  }

  /**
   * Cross-org / contractor forecast hours for one worker group × quarter.
   * @param {Object|null} xorg api_getXorgForecast result
   * @param {string} groupKey 'Workday Regions' | 'Contractor'
   * @param {string} quarterKey
   * @returns {number}
   */
  function wfm25XorgGroupHours_(xorg, groupKey, quarterKey) {
    if (!xorg || !xorg.byGroupQuarter || !xorg.byGroupQuarter[groupKey]) return 0;
    return Number(xorg.byGroupQuarter[groupKey][quarterKey]) || 0;
  }

  /**
   * Sum cross-org + contractor forecast hours for a fiscal quarter.
   * @param {Object|null} xorg api_getXorgForecast result
   * @param {string} quarterKey
   * @returns {number}
   */
  function wfm25XorgQuarterTotal_(xorg, quarterKey) {
    if (!xorg || !xorg.byGroupQuarter) return 0;
    let sum = 0;
    Object.keys(xorg.byGroupQuarter).forEach(function (gk) {
      sum += Number(xorg.byGroupQuarter[gk][quarterKey]) || 0;
    });
    return sum;
  }

  /**
   * Hours-only cell for cross-org aggregate rows (hours + share of quarter total).
   * @param {number|null} hours
   * @param {number|null} [share] fraction of total quarter delivery hours
   * @param {string} [extraCls]
   * @returns {string}
   */
  function wfm25RenderHoursCapacityHoursOnlyCell_(hours, share, extraCls) {
    const h = Number(hours);
    const has = hours != null && !isNaN(h);
    const display = has ? fmtHours(h) + 'h' : '\u2014';
    const shareDisplay = has && share != null ? fmtPct1(share) : '';
    return '<td class="wfm25-hours-capacity-cell wfm25-hours-capacity-hours-only' +
      (extraCls ? ' ' + extraCls : '') + '">' +
      '<div class="wfm25-hc-hours-only-inner">' +
        '<div class="wfm25-hc-xorg-hours">' + display + '</div>' +
        (shareDisplay
          ? '<div class="wfm25-hc-xorg-share muted">' + shareDisplay + '</div>'
          : '') +
      '</div></td>';
  }

  /**
   * Build cross-org Hours & Capacity aggregate rows (Workday Regions + Contractor).
   * Previous quarter hours come from worker-type history actuals; current/next from forecast.
   * @param {Object|null} xorgData api_getXorgForecast result
   * @param {string[]} quarterKeys
   * @param {Object|null} [historyData] api_getWorkerTypeHistory result
   * @returns {Array<{label:string, key:string, quarters:number[]}>}
   */
  function wfm25BuildXorgHcRows_(xorgData, quarterKeys, historyData) {
    const curIdx = wfm25CurQuarterIndex_(quarterKeys);
    const quarterClasses = (historyData && historyData.quarterClasses) || {};
    const groups = [
      { label: 'Workday Regions', key: 'Workday Regions' },
      { label: 'Contractor', key: 'Contractor' }
    ];
    return groups.map(function (g) {
      const quarters = (quarterKeys || []).map(function (qk, qi) {
        if (qi < curIdx) {
          const cls = quarterClasses[qk] || {};
          const val = cls[g.key];
          return val != null ? Number(val) || 0 : null;
        }
        return wfm25XorgGroupHours_(xorgData, g.key, qk);
      });
      return { label: g.label, key: g.key, quarters: quarters };
    });
  }

  /**
   * Fetch worker-type history if not cached (shared by Mix & Trend and Hours & Capacity).
   * @returns {Promise<Object|null>}
   */
  async function wfm25EnsureHistory_() {
    if (WFM25State.historyData) return WFM25State.historyData;
    try {
      const histReq = ++WFM25State.historyReqId;
      const history = await call('api_getWorkerTypeHistory', buildServerParams_());
      if (histReq !== WFM25State.historyReqId) return null;
      WFM25State.historyData = history;
      return history;
    } catch (e) {
      console.error('[WFM.25] api_getWorkerTypeHistory failed:', e);
      return null;
    }
  }

  /**
   * Fetch Xorg forecast aggregate if not cached.
   * @returns {Promise<Object|null>}
   */
  async function wfm25EnsureXorgForecast_() {
    if (WFM25State.xorgForecastData) return WFM25State.xorgForecastData;
    try {
      WFM25State.xorgForecastData = await call('api_getXorgForecast', buildServerParams_());
      return WFM25State.xorgForecastData;
    } catch (e) {
      console.error('[WFM.25] api_getXorgForecast failed:', e);
      return null;
    }
  }

  /**
   * Render one Hours & Capacity cell with optional draft overlay.
   * Calm white cell with health-colored utilization bar (no full-cell wash).
   * @param {Object} committed {planned, capacity, util, remaining}
   * @param {Object|null} projected same shape from projection API
   * @param {number} icpTarget
   * @param {boolean} showDraft
   * @param {string} [extraCls]
   * @returns {string}
   */
  function wfm25RenderHoursCapacityCell_(committed, projected, icpTarget, showDraft, extraCls) {
    const hasDraft = showDraft && projected &&
      committed && projected &&
      (Math.abs((projected.planned || 0) - (committed.planned || 0)) > 0.05 ||
       Math.abs((projected.util || 0) - (committed.util || 0)) > 0.0001);

    const util = committed && committed.util != null ? committed.util : null;
    const plannedStr = committed ? fmtHours(committed.planned) + 'h' : '\u2014';
    const capStr = committed ? fmtHours(committed.capacity) + 'h' : '\u2014';
    const utilStr = util != null ? fmtPct(util) : '\u2014';
    const bandCls = committed ? wfm25UtilBandClass_(util, icpTarget) : '';

    const committedInner =
      '<div class="wfm25-hc-compact-top">' +
        wfm25HcUtilSwatchHtml_(util, icpTarget) +
        '<span class="wfm25-hc-util-pct">' + utilStr + '</span>' +
        wfm25HcUtilBarHtml_(util, icpTarget) +
      '</div>' +
      '<div class="wfm25-hc-detail">' + plannedStr + ' / ' + capStr + '</div>';

    if (!hasDraft) {
      return '<td class="wfm25-hours-capacity-cell' +
        (bandCls ? ' ' + bandCls : '') +
        (extraCls ? ' ' + extraCls : '') + '">' +
        '<div class="wfm25-hc-cell-inner wfm25-hc-cell-inner--compact">' + committedInner + '</div></td>';
    }

    const pUtil = projected.util != null ? projected.util : null;
    const arrow = wfm25DraftArrow_(committed.util, pUtil);
    return '<td class="wfm25-hours-capacity-cell has-draft' +
      (bandCls ? ' ' + bandCls : '') +
      (extraCls ? ' ' + extraCls : '') + '">' +
      '<div class="wfm25-hc-cell-inner wfm25-hc-cell-inner--compact">' +
        '<div class="wfm25-hc-committed">' + committedInner + '</div>' +
        '<div class="wfm25-hc-draft">' +
          '<span class="wfm25-draft-label">Your draft</span>' +
          '<span class="wfm25-draft-value">' +
            fmtHours(projected.planned) + 'h / ' + fmtHours(projected.capacity) + 'h' +
            ' \u2192 ' + (pUtil != null ? fmtPct(pUtil) : '\u2014') + ' ' + arrow +
          '</span>' +
        '</div>' +
      '</div></td>';
  }

  /**
   * Render static Hours & Capacity banner (whole org, current quarter).
   * @param {Object} data api_getQuarterlyScorecard result
   */
  function renderWFM25HoursCapacityBanner_(data) {
    const banner = document.getElementById('wfm25HoursCapacityBanner');
    const grid = document.getElementById('wfm25HoursCapacityBannerGrid');
    if (!banner || !grid) return;

    const hc = wfm25AggregateHoursAndCapacityByTeam_(data);
    const qi = wfm25CurQuarterIndex_(hc.quarterKeys);
    const curQk = hc.quarterKeys[qi] || fiscalQuarterKey_(new Date());
    const orgQ = hc.orgTotal.quarters[qi];
    if (!orgQ) {
      banner.hidden = true;
      grid.innerHTML = '';
      return;
    }

    let tightestTeam = null;
    let tightestRatio = -Infinity;
    hc.teams.forEach(function (team) {
      const tq = team.quarters[qi];
      if (!tq || tq.util == null) return;
      const ratio = team.icpTarget > 0 ? tq.util / team.icpTarget : 0;
      if (ratio > tightestRatio) {
        tightestRatio = ratio;
        tightestTeam = {
          label: team.label,
          util: tq.util,
          ratioToTarget: ratio
        };
      }
    });

    const tightestHtml = tightestTeam
      ? escapeHtml_(tightestTeam.label) + ' \u00b7 ' + fmtPct(tightestTeam.util)
      : '\u2014';

    grid.innerHTML =
      '<div class="wfm25-hours-capacity-banner-tile wfm25-hours-capacity-banner-tile--hero">' +
        '<div class="wfm25-hours-capacity-banner-label">Remaining Capacity (Current Quarter)</div>' +
        '<div class="wfm25-hours-capacity-banner-value">' + fmtHours(orgQ.remaining) + 'h</div>' +
        '<div class="wfm25-hours-capacity-banner-sub">' + escapeHtml_(curQk) + '</div>' +
      '</div>' +
      '<div class="wfm25-hours-capacity-banner-tile">' +
        '<div class="wfm25-hours-capacity-banner-label">SLG Utilization</div>' +
        '<div class="wfm25-hours-capacity-banner-value">' +
          (orgQ.util != null ? fmtPct(orgQ.util) : '\u2014') + '</div>' +
      '</div>' +
      '<div class="wfm25-hours-capacity-banner-tile">' +
        '<div class="wfm25-hours-capacity-banner-label">Planned Hours</div>' +
        '<div class="wfm25-hours-capacity-banner-value">' + fmtHours(orgQ.planned) + 'h</div>' +
      '</div>' +
      '<div class="wfm25-hours-capacity-banner-tile">' +
        '<div class="wfm25-hours-capacity-banner-label">Total Capacity</div>' +
        '<div class="wfm25-hours-capacity-banner-value">' + fmtHours(orgQ.capacity) + 'h</div>' +
      '</div>' +
      '<div class="wfm25-hours-capacity-banner-tile">' +
        '<div class="wfm25-hours-capacity-banner-label">Tightest Team</div>' +
        '<div class="wfm25-hours-capacity-banner-value" style="font-size:16px">' + tightestHtml + '</div>' +
      '</div>';

    banner.hidden = false;
  }

  /**
   * Render the Hours & Capacity table from cached scorecard data.
   * @param {Object} data api_getQuarterlyScorecard result
   */
  function renderWFM25HoursCapacityTable_(data) {
    const headerRow = document.getElementById('wfm25HoursCapacityHeaderRow');
    const body = document.getElementById('wfm25HoursCapacityBody');
    if (!headerRow || !body) return;

    renderWFM25HoursCapacityBanner_(data);

    const hc = wfm25AggregateHoursAndCapacityByTeam_(data);
    const qKeys = hc.quarterKeys;
    const curIdx = wfm25CurQuarterIndex_(qKeys);
    const projection = State.explorerProjection;
    const hasDraft = State.softBookings && State.softBookings.length;
    const selectedTeam = WFM25State.selectedWorkerTeam;
    const selectedWorker = WFM25State.selectedWorker;

    $$('.wfm25-hc-qth', headerRow).forEach(function (el) { el.remove(); });
    qKeys.forEach(function (qk, qi) {
      const th = document.createElement('th');
      th.className = 'wfm25-hc-qth' + (qi === curIdx ? ' wfm25-cur-qth' : '');
      th.innerHTML = wfm25HcQuarterHeaderLabel_(qk, qi, curIdx);
      headerRow.appendChild(th);
    });

    if (!hc.teams.length) {
      body.innerHTML = '<tr><td colspan="' + (1 + qKeys.length) +
        '" class="muted" style="padding:14px">No team data in scope.</td></tr>';
      return;
    }

    const rows = [];

    // SLG total summary row
    const orgDraft = hasDraft && selectedWorker;
    const orgCells = hc.orgTotal.quarters.map(function (q, qi) {
      const qk = qKeys[qi];
      let projQ = null;
      if (orgDraft) {
        const raw = wfm25ProjectionQuarter_(projection, 'org', null, qk, true);
        if (raw) {
          projQ = {
            planned: Number(raw.productiveHours) || 0,
            capacity: Number(raw.icpAvailableHours) || 0,
            util: raw.icpUtil != null ? raw.icpUtil : null,
            remaining: (Number(raw.icpAvailableHours) || 0) - (Number(raw.productiveHours) || 0)
          };
        }
      }
      return wfm25RenderHoursCapacityCell_(q, projQ, hc.orgTotal.icpTarget, orgDraft);
    }).join('');
    rows.push(
      '<tr class="wfm25-hours-capacity-total-row">' +
      '<td><div class="wfm25-team-name-cell">' +
        '<span class="wfm25-team-swatch" style="background:' + hc.orgTotal.color + '"></span>' +
        '<strong>' + escapeHtml_(hc.orgTotal.label) + '</strong>' +
      '</div></td>' + orgCells + '</tr>'
    );

    hc.teams.forEach(function (team) {
      const teamDraft = hasDraft && selectedTeam === team.label;
      const teamCells = team.quarters.map(function (q, qi) {
        const qk = qKeys[qi];
        let projQ = null;
        if (teamDraft) {
          const raw = wfm25ProjectionQuarter_(projection, 'orgTeam', team.label, qk, true);
          if (raw) {
            projQ = {
              planned: Number(raw.productiveHours) || 0,
              capacity: Number(raw.icpAvailableHours) || 0,
              util: raw.icpUtil != null ? raw.icpUtil : null,
              remaining: (Number(raw.icpAvailableHours) || 0) - (Number(raw.productiveHours) || 0)
            };
          }
        }
        return wfm25RenderHoursCapacityCell_(q, projQ, team.icpTarget, teamDraft);
      }).join('');
      rows.push(
        '<tr class="wfm25-hours-capacity-team-row">' +
        '<td><div class="wfm25-team-name-cell">' +
          '<span class="wfm25-team-swatch" style="background:' + team.color + '"></span>' +
          escapeHtml_(team.label) +
        '</div></td>' + teamCells + '</tr>'
      );
    });

    const xorgRows = wfm25BuildXorgHcRows_(WFM25State.xorgForecastData, qKeys, WFM25State.historyData);
    const quarterTotals = qKeys.map(function (_qk, qi) {
      return wfm25QuarterDeliveryTotalHours_(hc, xorgRows, qi);
    });
    xorgRows.forEach(function (xorgRow) {
      const cells = xorgRow.quarters.map(function (hrs, qi) {
        const total = quarterTotals[qi];
        const share = hrs != null && total > 0 ? (Number(hrs) || 0) / total : null;
        return wfm25RenderHoursCapacityHoursOnlyCell_(hrs, share);
      }).join('');
      rows.push(
        '<tr class="wfm25-hours-capacity-xorg-row">' +
        '<td><div class="wfm25-team-name-cell wfm25-xorg-name-cell">' +
          '<span class="wfm25-team-swatch wfm25-xorg-swatch" aria-hidden="true"></span>' +
          '<span class="wfm25-xorg-label">' + escapeHtml_(xorgRow.label) + '</span>' +
          '<span class="wfm25-xorg-caption muted">cross-org / contractor forecast</span>' +
        '</div></td>' + cells + '</tr>'
      );
    });

    body.innerHTML = rows.join('');
  }

  /**
   * Fetch scorecard if needed and render Hours & Capacity tab.
   */
  async function loadWFM25HoursCapacity_() {
    const body = document.getElementById('wfm25HoursCapacityBody');
    if (body) {
      body.innerHTML = '<tr><td colspan="5" class="wfm25-util-loading-cell">' +
        wfm25LoadingSpinnerHtml_() + '</td></tr>';
    }
    try {
      if (!WFM25State.scorecardData) {
        const params = buildServerParams_({ workerScope: 'SLG' });
        WFM25State.scorecardData = await call('api_getQuarterlyScorecard', params);
      }
      await wfm25EnsureXorgForecast_();
      await wfm25EnsureHistory_();
      renderWFM25HoursCapacityTable_(WFM25State.scorecardData);
    } catch (err) {
      if (body) {
        body.innerHTML = '<tr><td colspan="5" class="muted" style="padding:14px;color:var(--thumbtack)">' +
          'Failed to load hours &amp; capacity: ' + escapeHtml_(err.message || String(err)) + '</td></tr>';
      }
      console.error('[WFM.25] loadWFM25HoursCapacity_ failed:', err);
    }
  }

  // ── Specialty Demand (WFM.25 redesign) ───────────────────────

  const WFM25_SPECIALTY_TEAM_ORDER_ = [
    'Functional Consulting',
    'Technical Consulting',
    'Delivery',
    'Other / Unmapped'
  ];

  const WFM25_SD_OTHER_UNMAPPED_TIP_ =
    'Productive demand hours whose specialty didn\u2019t map to a team \u2014 e.g. ' +
    'Student-segment work or specialty values not in the mapping config. ' +
    'Excludes PTO / Holiday and internal time, which are not demand.';

  const WFM25_SD_SCOPE_CAPTION_ =
    'SLG delivery only \u2014 Corporate & cross-org (Workday Regions) resources are ' +
    'excluded. See Mix & Trend for those.';

  /**
   * Resolve a specialty practice to a leadership team label using config map.
   * @param {string} specialtyPractice
   * @param {Object<string,string>} teamMap
   * @returns {string}
   */
  function wfm25ResolveSpecialtyTeam_(specialtyPractice, teamMap) {
    const sp = String(specialtyPractice || '').trim();
    if (!sp || sp === 'Unclassified' || sp === 'Student') return 'Other / Unmapped';
    if (!teamMap) return 'Other / Unmapped';
    let team = teamMap[sp];
    if (!team) {
      const lower = sp.toLowerCase();
      Object.keys(teamMap).forEach(function (k) {
        if (!team && k.toLowerCase() === lower) team = teamMap[k];
      });
    }
    if (!team || team === 'Unclassified') return 'Other / Unmapped';
    return team;
  }

  /**
   * Whether a specialty row is unmapped (excluded from KPI hero / biggest mover).
   * @param {string} specialtyPractice
   * @param {Object<string,string>} teamMap
   * @returns {boolean}
   */
  function wfm25IsSpecialtyDemandUnmappedForKpi_(specialtyPractice, teamMap) {
    const sp = String(specialtyPractice || '').trim();
    if (!sp || sp === 'Unclassified' || sp === 'Student') return true;
    return wfm25ResolveSpecialtyTeam_(sp, teamMap) === 'Other / Unmapped';
  }

  /**
   * Group specialty demand rows under leadership teams with per-column subtotals.
   * @param {Array} rows
   * @param {string[]} colKeys
   * @param {Object<string,string>} teamMap
   * @param {string[]} histQKeys completed historical quarters for team hist-avg rollup
   * @param {number} histCount
   * @returns {Array<{label:string, rows:Array, hoursByCol:Object, totalHours:number}>}
   */
  function wfm25GroupSpecialtyRowsByTeam_(rows, colKeys, teamMap, histQKeys, histCount) {
    const histAvgKey = colKeys[0];
    const groups = {};
    (rows || []).forEach(function (row) {
      const team = wfm25ResolveSpecialtyTeam_(row.specialtyPractice, teamMap);
      if (!groups[team]) {
        groups[team] = {
          label: team,
          rows: [],
          hoursByCol: {},
          histQuarterSums: {},
          totalHours: 0
        };
        colKeys.forEach(function (ck) { groups[team].hoursByCol[ck] = 0; });
        (histQKeys || []).forEach(function (qk) {
          groups[team].histQuarterSums[qk] = 0;
        });
      }
      groups[team].rows.push(row);
      groups[team].totalHours += Number(row.totalHours) || 0;
      colKeys.forEach(function (ck, ci) {
        if (ci === 0) return;
        const h = Number(row.hoursByCol && row.hoursByCol[ck]) || 0;
        groups[team].hoursByCol[ck] += h;
      });
      (histQKeys || []).forEach(function (qk) {
        const h = Number(row.hoursByQuarter && row.hoursByQuarter[qk]) || 0;
        groups[team].histQuarterSums[qk] += h;
      });
    });

    Object.keys(groups).forEach(function (label) {
      const g = groups[label];
      if (histCount > 0 && histQKeys && histQKeys.length) {
        let histSum = 0;
        histQKeys.forEach(function (qk) {
          histSum += Number(g.histQuarterSums[qk]) || 0;
        });
        g.hoursByCol[histAvgKey] = histSum / histCount;
      }
    });

    const ordered = [];
    WFM25_SPECIALTY_TEAM_ORDER_.forEach(function (label) {
      if (groups[label] && groups[label].rows.length) {
        ordered.push(groups[label]);
        delete groups[label];
      }
    });
    Object.keys(groups).sort().forEach(function (label) {
      ordered.push(groups[label]);
    });
    return ordered;
  }

  const WFM25_SD_HIST_AVG_KEY_ = 'histAvg';

  /**
   * Merge forecast + actuals into a 3-column matrix model (Historical Avg | Previous | Current).
   * @param {Object|null} forecastData api_getSpecialtyDemand result
   * @param {Object|null} actualsData api_getSpecialtyActuals result
   * @returns {Object|null}
   */
  function wfm25BuildSpecialtyDemandMerged_(forecastData, actualsData) {
    const forecast = forecastData || {};
    const actuals = actualsData || {};
    const windowKeys = forecast.quarters || [];
    if (windowKeys.length < 2) return null;

    const prevQk = windowKeys[0];
    const curQk = windowKeys[1];
    const histQKeys = (actuals.quarters || []).filter(function (qk) {
      return compareFiscalQuarterKeys_(qk, curQk) < 0;
    });
    if (!histQKeys.length) return null;
    const histCount = histQKeys.length;
    const colKeys = [WFM25_SD_HIST_AVG_KEY_, prevQk, curQk];
    const colKinds = ['benchmark', 'previous', 'current'];

    const rowMap = {};
    function ensureRow_(sp) {
      if (!rowMap[sp]) {
        rowMap[sp] = {
          specialtyPractice: sp,
          hoursByCol: {},
          hoursByQuarter: {},
          subRows: [],
          totalHours: 0
        };
        colKeys.forEach(function (ck) { rowMap[sp].hoursByCol[ck] = 0; });
        histQKeys.forEach(function (qk) { rowMap[sp].hoursByQuarter[qk] = 0; });
      }
      return rowMap[sp];
    }

    (actuals.rows || []).forEach(function (row) {
      const sp = String(row.specialtyPractice || 'Unclassified');
      const entry = ensureRow_(sp);
      let histSum = 0;
      histQKeys.forEach(function (qk) {
        const h = Number(row.hoursByQuarter && row.hoursByQuarter[qk]) || 0;
        entry.hoursByQuarter[qk] = h;
        histSum += h;
      });
      entry.hoursByCol[WFM25_SD_HIST_AVG_KEY_] = histCount > 0 ? histSum / histCount : 0;
      entry.hoursByCol[prevQk] = Number(row.hoursByQuarter && row.hoursByQuarter[prevQk]) || 0;
      if (row.subRows && row.subRows.length) entry.subRows = row.subRows;
    });

    (forecast.rows || []).forEach(function (row) {
      const sp = String(row.specialtyPractice || 'Unclassified');
      const entry = ensureRow_(sp);
      entry.hoursByCol[curQk] = Number(row.hoursByQuarter && row.hoursByQuarter[curQk]) || 0;
    });

    const rows = Object.keys(rowMap).map(function (sp) {
      const entry = rowMap[sp];
      const totalHours = (Number(entry.hoursByCol[prevQk]) || 0) +
        (Number(entry.hoursByCol[curQk]) || 0);
      entry.totalHours = totalHours;
      return entry;
    });
    rows.sort(function (a, b) {
      if (a.specialtyPractice === 'Unclassified' && b.specialtyPractice !== 'Unclassified') return 1;
      if (b.specialtyPractice === 'Unclassified' && a.specialtyPractice !== 'Unclassified') return -1;
      return b.totalHours - a.totalHours;
    });

    const grandByCol = {};
    colKeys.forEach(function (ck) { grandByCol[ck] = 0; });
    rows.forEach(function (row) {
      colKeys.forEach(function (ck, ci) {
        if (ci === 0) return;
        grandByCol[ck] += Number(row.hoursByCol[ck]) || 0;
      });
    });
    let histGrandSum = 0;
    histQKeys.forEach(function (qk) {
      histGrandSum += Number(actuals.grandTotalByQuarter && actuals.grandTotalByQuarter[qk]) || 0;
    });
    grandByCol[WFM25_SD_HIST_AVG_KEY_] = histCount > 0 ? histGrandSum / histCount : 0;

    const grandTotal = Number(grandByCol[prevQk]) || 0;

    return {
      colKeys: colKeys,
      colKinds: colKinds,
      histAvgKey: WFM25_SD_HIST_AVG_KEY_,
      histQKeys: histQKeys,
      histCount: histCount,
      prevQk: prevQk,
      curQk: curQk,
      rows: rows,
      grandByCol: grandByCol,
      grandTotal: grandTotal,
      teamMap: forecast.specialtyTeamMap || actuals.specialtyTeamMap || {}
    };
  }

  /**
   * Format demand hours for specialty matrix (tabular numerals, rounded).
   * @param {number} hrs
   * @returns {string}
   */
  function wfm25FormatDemandHours_(hrs) {
    return Math.round(Number(hrs) || 0).toLocaleString();
  }

  /**
   * QoQ % between two hour values.
   * @param {number} curr
   * @param {number} prev
   * @returns {number|null}
   */
  function wfm25SpecialtyDemandQoqPct_(curr, prev) {
    const c = Number(curr) || 0;
    const p = Number(prev) || 0;
    if (!p) return null;
    return ((c - p) / p) * 100;
  }

  /**
   * Format a matrix cell value for the active unit.
   * @param {number} hrs raw hours
   * @param {number} grandH quarter grand total hours
   * @param {number|null} qoqPct quarter-over-quarter %
   * @param {string} unit 'hours' | 'share' | 'qoq'
   * @returns {string}
   */
  function wfm25SpecialtyDemandFormatValue_(hrs, grandH, qoqPct, unit) {
    if (unit === 'share') {
      const share = grandH > 0 ? (Number(hrs) || 0) / grandH : 0;
      return fmtPct1(share);
    }
    if (unit === 'qoq') {
      if (qoqPct == null) return '\u2014';
      const sign = qoqPct > 0 ? '+' : '';
      return sign + qoqPct.toFixed(1) + '%';
    }
    return wfm25FormatDemandHours_(hrs);
  }

  /**
   * QoQ directional arrow HTML (calm colors).
   * @param {number|null} qoqPct
   * @returns {string}
   */
  function wfm25SpecialtyDemandQoqArrow_(qoqPct) {
    if (qoqPct == null) return '';
    const eps = 0.05;
    const cls = qoqPct > eps ? 'up' : (qoqPct < -eps ? 'down' : 'flat');
    const arrow = cls === 'up' ? '\u2191' : (cls === 'down' ? '\u2193' : '\u2192');
    return '<span class="wfm25-specialty-demand-qoq-arrow wfm25-specialty-demand-qoq-arrow--' +
      cls + '" aria-hidden="true">' + arrow + '</span>';
  }

  /**
   * Resolve bar visual kind for a matrix cell.
   * @param {string} rowKind 'team' | 'specialty' | 'total'
   * @param {string} colKind 'benchmark' | 'previous' | 'current'
   * @returns {string}
   */
  function wfm25SpecialtyDemandBarKind_(rowKind, colKind) {
    if (colKind === 'benchmark') return 'benchmark';
    if (rowKind === 'team' || rowKind === 'total') {
      return colKind === 'current' ? 'team-current' : 'team';
    }
    return colKind === 'current' ? 'specialty-current' : 'specialty';
  }

  /**
   * QoQ % for a matrix column (Current vs Previous; Previous vs Historical Avg).
   * @param {number} colIdx
   * @param {string[]} colKeys
   * @param {Object} hoursByCol
   * @returns {number|null}
   */
  function wfm25SpecialtyDemandColQoqPct_(colIdx, colKeys, hoursByCol) {
    if (colIdx <= 0) return null;
    const curKey = colKeys[colIdx];
    const prevKey = colKeys[colIdx - 1];
    const h = Number(hoursByCol[curKey]) || 0;
    const prevH = Number(hoursByCol[prevKey]) || 0;
    return wfm25SpecialtyDemandQoqPct_(h, prevH);
  }

  /**
   * Render one specialty-demand matrix cell with proportional bar.
   * @param {Object} opts
   * @returns {string}
   */
  function wfm25SpecialtyDemandCellHtml_(opts) {
    const hrs = Number(opts.hrs) || 0;
    const maxHrs = Number(opts.maxHrs) || 0;
    const grandH = Number(opts.grandH) || 0;
    const qoqPct = opts.qoqPct;
    const unit = opts.unit || 'hours';
    const barKind = opts.barKind || 'specialty';
    const colKind = opts.colKind || 'previous';

    let barHtml = '';
    if (unit === 'qoq') {
      if (qoqPct != null) {
        const cap = 50;
        const pct = Math.max(-cap, Math.min(cap, qoqPct));
        const width = (Math.abs(pct) / cap) * 50;
        const pos = pct >= 0 ? 'right' : 'left';
        const qoqBarCls = barKind.indexOf('team') >= 0 ? ' wfm25-specialty-demand-bar--team' : '';
        barHtml =
          '<span class="wfm25-specialty-demand-bar-wrap wfm25-specialty-demand-bar-wrap--qoq' +
            (barKind.indexOf('team') >= 0 ? ' wfm25-specialty-demand-bar-wrap--team' : '') +
            '" aria-hidden="true">' +
            '<span class="wfm25-specialty-demand-bar-center"></span>' +
            '<span class="wfm25-specialty-demand-bar wfm25-specialty-demand-bar--qoq' +
              ' wfm25-specialty-demand-bar--qoq-' + pos + qoqBarCls +
              '" style="width:' + width.toFixed(1) + '%"></span>' +
          '</span>';
      } else {
        barHtml = '<span class="wfm25-specialty-demand-bar-wrap wfm25-specialty-demand-bar-wrap--qoq" aria-hidden="true"></span>';
      }
    } else if (colKind === 'benchmark') {
      let share = 0;
      if (unit === 'share') {
        share = grandH > 0 ? Math.min(1, hrs / grandH) : 0;
      } else {
        share = maxHrs > 0 ? Math.min(1, hrs / maxHrs) : 0;
      }
      if (share > 0.02) {
        barHtml =
          '<span class="wfm25-specialty-demand-bar-wrap wfm25-specialty-demand-bar-wrap--benchmark" aria-hidden="true">' +
            '<span class="wfm25-specialty-demand-bar wfm25-specialty-demand-bar--benchmark" style="width:' +
              (share * 100).toFixed(1) + '%"></span>' +
          '</span>';
      }
    } else {
      let share = 0;
      if (unit === 'share') {
        share = grandH > 0 ? Math.min(1, hrs / grandH) : 0;
      } else {
        share = maxHrs > 0 ? Math.min(1, hrs / maxHrs) : 0;
      }
      const wrapCls = 'wfm25-specialty-demand-bar-wrap' +
        (barKind === 'team' || barKind === 'team-current'
          ? ' wfm25-specialty-demand-bar-wrap--team' : '') +
        (barKind === 'specialty-current' ? ' wfm25-specialty-demand-bar-wrap--specialty-current' : '');
      const barCls = 'wfm25-specialty-demand-bar' +
        (barKind === 'team' ? ' wfm25-specialty-demand-bar--team' : '') +
        (barKind === 'team-current' ? ' wfm25-specialty-demand-bar--team-current' : '') +
        (barKind === 'specialty-current' ? ' wfm25-specialty-demand-bar--specialty-current' : '');
      barHtml =
        '<span class="' + wrapCls + '" aria-hidden="true">' +
          '<span class="' + barCls + '" style="width:' + (share * 100).toFixed(1) + '%"></span>' +
        '</span>';
    }

    const displayVal = wfm25SpecialtyDemandFormatValue_(hrs, grandH, qoqPct, unit);
    const qoqArrow = unit === 'qoq' ? wfm25SpecialtyDemandQoqArrow_(qoqPct) : '';
    const qoqCls = (unit === 'qoq' && qoqPct != null)
      ? ' wfm25-specialty-demand-hours--qoq-' +
        (qoqPct > 0.05 ? 'up' : (qoqPct < -0.05 ? 'down' : 'flat'))
      : '';

    return '<td class="wfm25-specialty-demand-cell">' +
      '<div class="wfm25-specialty-demand-cell-inner">' +
        barHtml +
        '<span class="wfm25-specialty-demand-hours' + qoqCls + '">' +
          qoqArrow + displayVal +
        '</span>' +
      '</div></td>';
  }

  /**
   * Compute per-column max display magnitude for bar scaling.
   * @param {string[]} colKeys
   * @param {Object} grandByCol
   * @param {Array} rows
   * @param {string} unit
   * @returns {Object<string,number>}
   */
  function wfm25SpecialtyDemandMaxByCol_(colKeys, grandByCol, rows, unit) {
    const maxByCol = {};
    colKeys.forEach(function (ck, ci) {
      let max = 0;
      if (unit === 'share') {
        max = 1;
      } else if (unit === 'qoq') {
        if (ci === 0) {
          max = 0;
        } else {
          let maxAbs = 0;
          (rows || []).forEach(function (row) {
            const pct = wfm25SpecialtyDemandColQoqPct_(ci, colKeys, row.hoursByCol || {});
            if (pct != null && Math.abs(pct) > maxAbs) maxAbs = Math.abs(pct);
          });
          max = maxAbs || 50;
        }
      } else {
        max = Number(grandByCol[ck]) || 0;
        (rows || []).forEach(function (row) {
          const h = Number(row.hoursByCol && row.hoursByCol[ck]) || 0;
          if (h > max) max = h;
        });
      }
      maxByCol[ck] = max;
    });
    return maxByCol;
  }

  /**
   * Build 3-column header cells for the matrix.
   * @param {HTMLElement} headerRow
   * @param {Object} merged
   */
  function wfm25SpecialtyDemandHeaderCells_(headerRow, merged) {
    if (!headerRow || !merged) return;
    $$('.wfm25-specialty-demand-qth', headerRow).forEach(function (el) { el.remove(); });

    const colKeys = merged.colKeys || [];
    const colKinds = merged.colKinds || [];
    const prevQk = merged.prevQk;
    const curQk = merged.curQk;

    colKeys.forEach(function (ck, i) {
      const th = document.createElement('th');
      let label = ck;
      if (ck === WFM25_SD_HIST_AVG_KEY_) label = 'Historical Avg';
      else if (ck === prevQk) label = 'Previous (' + prevQk + ')';
      else if (ck === curQk) label = 'Current (' + curQk + ') \u25c6';

      let cls = 'wfm25-specialty-demand-qth';
      if (colKinds[i] === 'benchmark') cls += ' wfm25-specialty-demand-qth--benchmark';
      if (colKinds[i] === 'current') cls += ' wfm25-cur-qth';
      th.className = cls;
      th.scope = 'col';
      th.innerHTML =
        '<div class="wfm25-specialty-demand-th-inner">' +
          '<span class="wfm25-specialty-demand-th-bar-spacer" aria-hidden="true"></span>' +
          '<span class="wfm25-specialty-demand-th-label">' + escapeHtml_(label) + '</span>' +
        '</div>';
      headerRow.appendChild(th);
    });
  }

  /**
   * Info tooltip button for Other / Unmapped group.
   * @returns {string}
   */
  function wfm25SpecialtyDemandOtherInfoBtn_() {
    return '<button type="button" class="wfm25-specialty-demand-info-btn"' +
      ' aria-label="About Other / Unmapped"' +
      ' title="' + escapeHtml_(WFM25_SD_OTHER_UNMAPPED_TIP_) + '">' +
      '<span aria-hidden="true">i</span></button>';
  }

  /**
   * Render team-grouped specialty demand matrix body rows (3 columns).
   * @param {Object} opts
   * @returns {string}
   */
  function wfm25SpecialtyDemandBodyHtml_(opts) {
    const colKeys = opts.colKeys || [];
    const colKinds = opts.colKinds || [];
    const rows = opts.rows || [];
    const grandByCol = opts.grandByCol || {};
    const teamMap = opts.teamMap || {};
    const collapsedTeams = opts.collapsedTeams || new Set();
    const unit = opts.unit || 'hours';
    const histQKeys = opts.histQKeys || [];
    const histCount = opts.histCount || 0;
    const maxByCol = wfm25SpecialtyDemandMaxByCol_(colKeys, grandByCol, rows, unit);
    const teamGroups = wfm25GroupSpecialtyRowsByTeam_(
      rows, colKeys, teamMap, histQKeys, histCount
    );
    const html = [];

    const totalRowCells = colKeys.map(function (ck, ci) {
      const colKind = colKinds[ci] || 'previous';
      const h = unit === 'qoq'
        ? (Number(grandByCol[ck]) || 0)
        : (Number(grandByCol[ck]) || 0);
      const qoqPct = unit === 'qoq'
        ? wfm25SpecialtyDemandColQoqPct_(ci, colKeys, grandByCol)
        : null;
      const displayHrs = unit === 'qoq' ? 0 : h;
      return wfm25SpecialtyDemandCellHtml_({
        hrs: displayHrs,
        maxHrs: maxByCol[ck],
        grandH: Number(grandByCol[ck]) || 0,
        qoqPct: qoqPct,
        unit: unit,
        barKind: wfm25SpecialtyDemandBarKind_('total', colKind),
        colKind: colKind
      });
    }).join('');
    html.push(
      '<tr class="wfm25-specialty-demand-total-row">' +
        '<td><strong>Total demand</strong></td>' + totalRowCells + '</tr>'
    );

    teamGroups.forEach(function (group) {
      const isCollapsed = collapsedTeams.has(group.label);
      const isOther = group.label === 'Other / Unmapped';
      const teamCls = 'wfm25-specialty-demand-team-row' +
        (isOther ? ' wfm25-specialty-demand-team-row--other' : '');
      const teamColor = wfm25TeamColor_(group.label);
      const teamCells = colKeys.map(function (ck, ci) {
        const colKind = colKinds[ci] || 'previous';
        const h = Number(group.hoursByCol[ck]) || 0;
        const qoqPct = unit === 'qoq'
          ? wfm25SpecialtyDemandColQoqPct_(ci, colKeys, group.hoursByCol)
          : null;
        const displayHrs = unit === 'qoq' ? 0 : h;
        return wfm25SpecialtyDemandCellHtml_({
          hrs: displayHrs,
          maxHrs: maxByCol[ck],
          grandH: Number(grandByCol[ck]) || 0,
          qoqPct: qoqPct,
          unit: unit,
          barKind: wfm25SpecialtyDemandBarKind_('team', colKind),
          colKind: colKind
        });
      }).join('');

      const infoBtn = isOther ? wfm25SpecialtyDemandOtherInfoBtn_() : '';
      html.push(
        '<tr class="' + teamCls + '">' +
          '<td class="wfm25-specialty-demand-team-label">' +
            '<div class="wfm25-specialty-demand-team-label-inner">' +
              '<button type="button" class="wfm25-specialty-demand-team-btn"' +
                ' data-wfm25-sd-team="' + escapeHtml_(group.label) + '"' +
                ' aria-expanded="' + (!isCollapsed) + '"' +
                ' aria-label="Toggle ' + escapeHtml_(group.label) + ' specialties">' +
                '<span class="wfm25-team-swatch" style="background:' + teamColor + '"></span>' +
                '<span class="wfm25-specialty-demand-team-chev" aria-hidden="true">' +
                  (isCollapsed ? '\u25b6' : '\u25bc') + '</span>' +
                '<span class="wfm25-specialty-demand-team-name">' +
                  escapeHtml_(group.label) + '</span>' +
              '</button>' +
              infoBtn +
            '</div>' +
          '</td>' +
          teamCells +
        '</tr>'
      );

      if (!isCollapsed) {
        group.rows.forEach(function (row) {
          const sp = String(row.specialtyPractice || 'Unclassified');
          const isUnclassified = sp === 'Unclassified' || sp === 'Student';
          const rowCls = 'wfm25-specialty-demand-row' +
            (isUnclassified ? ' wfm25-specialty-demand-row--unclassified' : '');
          const cells = colKeys.map(function (ck, ci) {
            const colKind = colKinds[ci] || 'previous';
            const h = Number(row.hoursByCol && row.hoursByCol[ck]) || 0;
            const qoqPct = unit === 'qoq'
              ? wfm25SpecialtyDemandColQoqPct_(ci, colKeys, row.hoursByCol)
              : null;
            const displayHrs = unit === 'qoq' ? 0 : h;
            return wfm25SpecialtyDemandCellHtml_({
              hrs: displayHrs,
              maxHrs: maxByCol[ck],
              grandH: Number(grandByCol[ck]) || 0,
              qoqPct: qoqPct,
              unit: unit,
              barKind: wfm25SpecialtyDemandBarKind_('specialty', colKind),
              colKind: colKind
            });
          }).join('');

          html.push(
            '<tr class="' + rowCls + '">' +
              '<td class="wfm25-specialty-demand-label">' + escapeHtml_(sp) + '</td>' +
              cells +
            '</tr>'
          );
        });
      }
    });

    return html.join('');
  }

  /**
   * Build actuals-based KPI banner metrics (previous quarter vs historical avg only).
   * @param {Object} merged
   * @returns {Object}
   */
  function wfm25BuildSpecialtyDemandBanner_(merged) {
    const prevQk = merged.prevQk;
    const histAvgKey = merged.histAvgKey;
    const teamMap = merged.teamMap || {};
    const grandPrev = Number(merged.grandByCol[prevQk]) || 0;
    const grandHistAvg = Number(merged.grandByCol[histAvgKey]) || 0;

    let topSp = '';
    let topH = 0;
    (merged.rows || []).forEach(function (row) {
      if (wfm25IsSpecialtyDemandUnmappedForKpi_(row.specialtyPractice, teamMap)) return;
      const h = Number(row.hoursByCol[prevQk]) || 0;
      if (h > topH) {
        topH = h;
        topSp = row.specialtyPractice;
      }
    });

    let biggestMoverSp = '';
    let biggestMoverPct = 0;
    (merged.rows || []).forEach(function (row) {
      if (wfm25IsSpecialtyDemandUnmappedForKpi_(row.specialtyPractice, teamMap)) return;
      const h = Number(row.hoursByCol[prevQk]) || 0;
      const hist = Number(row.hoursByCol[histAvgKey]) || 0;
      const pct = wfm25SpecialtyDemandQoqPct_(h, hist);
      if (pct != null && Math.abs(pct) > Math.abs(biggestMoverPct)) {
        biggestMoverPct = pct;
        biggestMoverSp = row.specialtyPractice;
      }
    });

    const vsHistAvgPct = wfm25SpecialtyDemandQoqPct_(grandPrev, grandHistAvg);

    return {
      topPractice: topSp,
      topPracticeHours: topH,
      totalDemand: grandPrev,
      biggestMoverSp: biggestMoverSp,
      biggestMoverPct: biggestMoverPct,
      vsHistAvgPct: vsHistAvgPct,
      prevQk: prevQk
    };
  }

  /**
   * Wire matrix interactions: team collapse + unit toggle.
   * @param {HTMLElement} body
   */
  function wfm25WireSpecialtyDemandEvents_(body) {
    if (!body) return;

    $$('.wfm25-specialty-demand-team-btn', body).forEach(function (btn) {
      btn.addEventListener('click', function () {
        const team = btn.getAttribute('data-wfm25-sd-team');
        const collapsedSet = WFM25State.specialtyDemandCollapsedTeams;
        if (collapsedSet.has(team)) {
          collapsedSet.delete(team);
        } else {
          collapsedSet.add(team);
        }
        renderWFM25SpecialtyDemand_();
      });
    });

    const toggle = document.getElementById('wfm25SpecialtyDemandUnitToggle');
    if (toggle && !toggle.dataset.wfm25SdWired) {
      toggle.dataset.wfm25SdWired = '1';
      $$('button[data-wfm25-sd-unit]', toggle).forEach(function (btn) {
        btn.addEventListener('click', function () {
          WFM25State.specialtyDemandUnit = btn.getAttribute('data-wfm25-sd-unit');
          renderWFM25SpecialtyDemand_();
        });
      });
    }
  }

    const matrixCard = document.querySelector('.wfm25-specialty-demand-matrix-card');

  function wfm25SyncSpecialtyDemandUnitToggle_() {
    const unit = WFM25State.specialtyDemandUnit || 'hours';
    const toggle = document.getElementById('wfm25SpecialtyDemandUnitToggle');

  /**
   * Render unified Specialty Demand tab (actuals KPI strip + 3-column matrix).
   * @param {Object|null} forecastData api_getSpecialtyDemand result
   * @param {Object|null} actualsData api_getSpecialtyActuals result
   */
  function renderWFM25SpecialtyDemand_(forecastData, actualsData) {
    const empty = document.getElementById('wfm25SpecialtyDemandEmpty');
    const layout = document.getElementById('wfm25SpecialtyDemandLayout');
    const headerRow = document.getElementById('wfm25SpecialtyDemandHeaderRow');
    const body = document.getElementById('wfm25SpecialtyDemandBody');
    const caption = document.getElementById('wfm25SpecialtyDemandCaption');

    const forecast = forecastData || WFM25State.specialtyDemandData;
    const actuals = actualsData || WFM25State.specialtyActualsData;
    const merged = wfm25BuildSpecialtyDemandMerged_(forecast, actuals);

    if (!merged || !merged.rows.length || !merged.grandTotal) {
      if (empty) empty.hidden = false;
      if (layout) layout.hidden = true;
      return;
    }

    if (empty) empty.hidden = true;
    if (layout) layout.hidden = false;

    wfm25EnsureSpecialtyDemandScopeCaption_();
    wfm25SyncSpecialtyDemandUnitToggle_();
    renderWFM25SpecialtyDemandBanner_(merged);

    if (headerRow && body) {
      wfm25SpecialtyDemandHeaderCells_(headerRow, merged);
      body.innerHTML = wfm25SpecialtyDemandBodyHtml_({
        colKeys: merged.colKeys,
        colKinds: merged.colKinds,
        rows: merged.rows,
        grandByCol: merged.grandByCol,
        teamMap: merged.teamMap,
        collapsedTeams: WFM25State.specialtyDemandCollapsedTeams,
        unit: WFM25State.specialtyDemandUnit || 'hours',
        histQKeys: merged.histQKeys,
        histCount: merged.histCount
      });
      wfm25WireSpecialtyDemandEvents_(body);
    }

    if (caption) caption.hidden = false;
  }

  /**
   * Lazy-load api_getSpecialtyDemand + api_getSpecialtyActuals and render (cached).
   */
  async function loadWFM25SpecialtyDemand_() {
    const loading = document.getElementById('wfm25SpecialtyDemandLoading');
    const empty = document.getElementById('wfm25SpecialtyDemandEmpty');
    const layout = document.getElementById('wfm25SpecialtyDemandLayout');
    const reqId = ++WFM25State.specialtyDemandReqId;

    if (empty) empty.hidden = true;
    if (layout) layout.hidden = true;
    if (loading) loading.hidden = false;

    if (WFM25State.specialtyDemandData && WFM25State.specialtyActualsData) {
      if (reqId !== WFM25State.specialtyDemandReqId) return;
      if (loading) loading.hidden = true;
      renderWFM25SpecialtyDemand_();
      return;
    }

    try {
      const params = buildServerParams_({ workerScope: 'SLG' });
      const results = await Promise.all([
        WFM25State.specialtyDemandData
          ? Promise.resolve(WFM25State.specialtyDemandData)
          : call('api_getSpecialtyDemand', params),
        WFM25State.specialtyActualsData
          ? Promise.resolve(WFM25State.specialtyActualsData)
          : call('api_getSpecialtyActuals', params)
      ]);
      if (reqId !== WFM25State.specialtyDemandReqId) return;
      WFM25State.specialtyDemandData = results[0];
      WFM25State.specialtyActualsData = results[1];
      if (loading) loading.hidden = true;
      renderWFM25SpecialtyDemand_();
    } catch (err) {
      if (reqId !== WFM25State.specialtyDemandReqId) return;
      if (loading) loading.hidden = true;
      if (empty) {
        empty.hidden = false;
        empty.textContent = 'Failed to load specialty demand: ' + (err.message || String(err));
        empty.style.color = 'var(--thumbtack)';
      }
      console.error('[WFM.25] loadWFM25SpecialtyDemand_ failed:', err);
    }
  }

  const WFM25_MIX_CLASSES_ = ['SLG', 'Workday Regions', 'Contractor'];

  /**
   * CSS suffix for a Mix & Trend display category.
   * @param {string} cls
   * @returns {string}
   */
  function wfm25MixTrendCatCss_(cls) {
    if (cls === 'SLG') return 'slg';
    if (cls === 'Workday Regions') return 'wd-regions';
    if (cls === 'Contractor') return 'contractor';
    return '';
  }

  /**
   * Stroke/fill color token for a Mix & Trend display category.
   * @param {string} cls
   * @returns {string}
   */
  function wfm25MixTrendCatColor_(cls) {
    if (cls === 'SLG') return 'var(--wc-slg)';
    if (cls === 'Workday Regions') return 'var(--wc-nonslg)';
    if (cls === 'Contractor') return 'var(--wc-partner)';
    return 'var(--staple)';
  }

  /**
   * Lightweight inline SVG sparkline (no charting library).
   * @param {number[]} values
   * @param {string} color
   * @param {number} [width]
   * @param {number} [height]
   * @returns {string}
   */
  function wfm25MixTrendSparklineSvg_(values, color, width, height) {
    if (!values || !values.length) return '';
    const w = width || 80;
    const h = height || 22;
    const pad = 2;
    const min = Math.min.apply(null, values);
    const max = Math.max.apply(null, values);
    const range = max - min || 1;
    const denom = Math.max(values.length - 1, 1);
    const pts = values.map(function (v, i) {
      const x = pad + (i / denom) * (w - 2 * pad);
      const y = pad + (1 - ((Number(v) || 0) - min) / range) * (h - 2 * pad);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    return '<svg class="wfm25-mix-trend-sparkline" width="' + w + '" height="' + h + '" aria-hidden="true">' +
      '<polyline fill="none" stroke="' + color + '" stroke-width="1.5" points="' + pts + '"/></svg>';
  }

  /**
   * Drift arrow comparing earliest vs latest value in a series.
   * @param {number[]} series
   * @returns {string}
   */
  function wfm25MixTrendDriftHtml_(series) {
    if (!series || series.length < 2) {
      return '<span class="wfm25-mix-trend-drift wfm25-mix-trend-drift--flat" aria-hidden="true">\u2192</span>';
    }
    const first = Number(series[0]) || 0;
    const last = Number(series[series.length - 1]) || 0;
    const eps = 0.0005;
    if (last > first + eps) {
      return '<span class="wfm25-mix-trend-drift wfm25-mix-trend-drift--up" aria-label="Trending up">\u2191</span>';
    }
    if (last < first - eps) {
      return '<span class="wfm25-mix-trend-drift wfm25-mix-trend-drift--down" aria-label="Trending down">\u2193</span>';
    }
    return '<span class="wfm25-mix-trend-drift wfm25-mix-trend-drift--flat" aria-label="Flat trend">\u2192</span>';
  }

  /**
   * QoQ change line for the hero banner tile.
   * @param {number} qoqAbs
   * @param {number} qoqPct
   * @returns {string}
   */
  function wfm25MixTrendQoqHtml_(qoqAbs, qoqPct) {
    const eps = 0.5;
    const cls = qoqAbs > eps ? 'up' : (qoqAbs < -eps ? 'down' : 'flat');
    const arrow = cls === 'up' ? '\u2191' : (cls === 'down' ? '\u2193' : '\u2192');
    const sign = qoqAbs > 0 ? '+' : '';
    const pctSign = qoqPct >= 0 ? '+' : '';
    return '<span class="wfm25-mix-trend-qoq wfm25-mix-trend-qoq--' + cls + '">' +
      '<span aria-hidden="true">' + arrow + '</span> ' +
      sign + fmtHours(qoqAbs) + 'h (' + pctSign + fmtPct1(qoqPct) + ')' +
    '</span>';
  }

  function renderWFM25MixTrendBanner_(bannerSummary) {

    const shareTiles = [

      { key: 'Workday Regions', label: 'Workday Regions Share', share: bs.pooledShareWorkdayRegions,
