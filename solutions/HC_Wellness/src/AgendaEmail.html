                      <?= agendaItemsLabel ?>
                    </td>
                  </tr>
                </table>

                  <tr>
                    <td style="background-color:#1d4ed8;color:#ffffff;padding:10px 14px;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.02em;">

                                  <span style="display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500;<?= item.healthChipStyle ?>"><?= item.healthStatus ?></span>
                                  <? } ?>

                              </tr>

                                      </td>
                                    </tr>
                                  </table>
                                </td>
                              </tr>
                              <? } ?>

                                  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#ffffff;border:1px solid #e5e7eb;">

                                        <div style="font-size:12px;color:#374151;line-height:1.4;white-space:pre-wrap;"><?= item.desiredOutcome ?></div>
                                      </td>
                                    </tr>
                                  </table>
                                </td>
                              </tr>
                              <? } ?>
