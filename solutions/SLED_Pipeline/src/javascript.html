<script>
'use strict';

// ===== CONSTANTS =====
var ACCENT = ['#FFB000','#F46821','#F43256','#F757C1','#29BEFD','#47E6C1','#A259EA','#78D64B','#6A7FDB','#777777'];

// ===== FILTER STATE =====
var state = {
  scope:          'SLED',
  studentFilter:  'all',
  pipelineStatus: 'active',
  fiscalWindow:   null,
  startWindow:    { daysAhead: 60 }
};
var activeTabId = 'overview';

// ===== CLIENT UTILITIES =====
function fmtM(n) {
  function addCommas(s) {
    var parts = s.split('.');
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return parts.join('.');
  }
  if (n >= 1e9) return '$' + addCommas((n / 1e9).toFixed(1)) + 'B';
  if (n >= 1e6) return '$' + addCommas((n / 1e6).toFixed(1)) + 'M';
  if (n >= 1e3) return '$' + addCommas((n / 1e3).toFixed(1)) + 'K';
  return '$' + Math.round(n);
}

function fmtN(n) {
  return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== FILTER WIRING =====
function wireSegControl(id, onChange) {
  var el = document.getElementById(id);
  if (!el) return;
  el.querySelectorAll('.seg-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      el.querySelectorAll('.seg-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      onChange(btn.getAttribute('data-value'));
    });
  });
}

function setupFilters() {
  wireSegControl('filter-scope', function(v) {
    state.scope = v;
    refreshActiveTab();
  });
  wireSegControl('filter-student', function(v) {
    state.studentFilter = v;
    refreshActiveTab();
  });
  wireSegControl('filter-pipeline', function(v) {
    state.pipelineStatus = v;
    var startsGroup = document.getElementById('filter-starts-group');
    if (startsGroup) startsGroup.style.display = (v === 'closedWon') ? 'flex' : 'none';
    refreshActiveTab();
  });
  wireSegControl('filter-starts', function(v) {
    state.startWindow = { daysAhead: parseInt(v, 10) || 60 };
    refreshActiveTab();
  });
}

// ===== TAB WIRING =====
function setupTabs() {
  document.querySelectorAll('.tab').forEach(function(btn) {
    btn.addEventListener('click', function() {
      activateTab(btn.getAttribute('data-tab'));
    });
  });
}

function activateTab(tabId) {
  activeTabId = tabId;
  document.querySelectorAll('.tab').forEach(function(b) {
    b.classList.toggle('active', b.getAttribute('data-tab') === tabId);
  });
  document.querySelectorAll('.tab-panel').forEach(function(p) {
    p.classList.toggle('active', p.id === 'panel-' + tabId);
  });
  if (tabId === 'overview')    loadOverview();
  if (tabId === 'subServices') loadSubServices();
}

function refreshActiveTab() {
  if (activeTabId === 'overview')    loadOverview();
  if (activeTabId === 'subServices') loadSubServices();
}

// ===== OVERVIEW DATA LOAD =====
function loadOverview() {
  var container = document.getElementById('overview-content');
  if (!container) return;
  container.innerHTML = '<div class="report-loading"><div class="spinner-large"></div></div>';
  var payload = {
    scope:          state.scope,
    studentFilter:  state.studentFilter,
    pipelineStatus: state.pipelineStatus,
    fiscalWindow:   state.fiscalWindow,
    startWindow:    state.startWindow
  };
  google.script.run
    .withSuccessHandler(renderOverview)
    .withFailureHandler(function(err) {
      container.innerHTML = '<div class="empty-state">\u26a0 Error: ' +
        esc(err.message || String(err)) + '</div>';
    })
    .getOverviewSummary(payload);
}

// ===== OVERVIEW RENDER =====
function renderOverview(data) {
  var container = document.getElementById('overview-content');
  if (!container) return;
  var m  = data.metrics;
  var ps = data.meta.pipelineStatus;

  var countLabel = ps === 'closedWon' ? 'Won Opportunities' :
                   ps === 'active'    ? 'Active Opportunities' : 'Opportunities';
  var countVal   = ps === 'closedWon' ? m.wonOpps :
                   ps === 'active'    ? m.activeOpps : m.totalOpps;
  var acvLabel   = ps === 'closedWon' ? 'Won ACV' :
                   ps === 'active'    ? 'Active ACV' : 'Total ACV';

  var html = '';

  // Morning-coffee bullets
  html += '<div class="coffee-panel"><ul>';
  (data.bullets || []).forEach(function(b) { html += '<li>' + esc(b) + '</li>'; });
  html += '</ul></div>';

  // KPI tiles
  html += '<div class="stats-grid">';
  html += statCardHtml(countLabel, fmtN(countVal), null);
  html += statCardHtml(acvLabel,   fmtM(m.totalACV), null);
  html += statCardHtml('Services ACV',      fmtM(m.servicesACV),     m.servicesSharePct + '% of total');
  html += statCardHtml('Subscription ACV',  fmtM(m.subscriptionACV), m.subsSharePct     + '% of total');
  if (m.studentOpps > 0) {
    html += statCardHtml('Student Opportunities', fmtN(m.studentOpps), m.studentSharePct + '% of ACV');
  }
  html += '</div>';

  // Charts
  html += '<div class="charts-row">';
  html += '<div class="chart-card">' + buildBarChart(data.charts.acvByStage)          + '</div>';
  html += '<div class="chart-card">' + buildDonutChart(data.charts.acvByIndustryGroup) + '</div>';
  html += '</div>';

  container.innerHTML = html;
}

function statCardHtml(label, value, sub) {
  return '<div class="stat-card">' +
    '<div class="stat-label">' + esc(label) + '</div>' +
    '<div class="stat-value">' + esc(value) + '</div>' +
    (sub ? '<div class="stat-sub">' + esc(sub) + '</div>' : '') +
    '</div>';
}

// ===== SVG BAR CHART (ACV by Stage) =====
function buildBarChart(data) {
  if (!data || !data.length) {
    return '<div class="empty-state" style="min-height:180px">No stage data</div>';
  }

  var W = 480, H = 300;
  var padL = 52, padR = 16, padT = 28, padB = 82;
  var cW = W - padL - padR;
  var cH = H - padT - padB;

  var maxACV = Math.max.apply(null, data.map(function(d) { return d.acv; }));
  if (!maxACV) maxACV = 1;

  var barSlot = cW / data.length;
  var barW    = Math.max(6, Math.floor(barSlot * 0.60));
  var svg     = '';

  // Soft horizontal gridlines + y-axis labels (3 levels)
  for (var g = 1; g <= 3; g++) {
    var gy = padT + cH - Math.round(cH * g / 3);
    svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (padL + cW) +
      '" y2="' + gy + '" stroke="#E5E7EB" stroke-width="1"/>';
    svg += '<text x="' + (padL - 4) + '" y="' + (gy + 4) + '"' +
      ' text-anchor="end" font-size="9" fill="#94a3b8">' + esc(fmtM(maxACV * g / 3)) + '</text>';
  }

  data.forEach(function(d, i) {
    var barH  = Math.max(2, Math.round((d.acv / maxACV) * cH));
    var x     = padL + i * barSlot + (barSlot - barW) / 2;
    var y     = padT + cH - barH;
    var color = ACCENT[i % ACCENT.length];
    var cx    = x + barW / 2;

    svg += '<rect x="' + x + '" y="' + y + '" width="' + barW +
      '" height="' + barH + '" fill="' + color + '" rx="3"/>';

    // Value label above bar (skip when bar is tiny to avoid overlap)
    if (barH > 16) {
      svg += '<text x="' + cx + '" y="' + (y - 4) + '"' +
        ' text-anchor="middle" font-size="9" fill="#475569">' + esc(fmtM(d.acv)) + '</text>';
    }

    // Stage label rotated -40° at bottom
    var lx = cx;
    var ly = padT + cH + 10;
    svg += '<text x="' + lx + '" y="' + ly + '"' +
      ' text-anchor="end" font-size="10" fill="#475569"' +
      ' transform="rotate(-40,' + lx + ',' + ly + ')">' + esc(d.stage) + '</text>';
  });

  return '<h3 class="chart-title">ACV by Stage</h3>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-height:300px"' +
    ' role="img" aria-label="ACV by Stage bar chart">' + svg + '</svg>';
}

// ===== SVG DONUT CHART (ACV by Industry Group) =====
function buildDonutChart(data) {
  if (!data || !data.length) {
    return '<div class="empty-state" style="min-height:180px">No industry data</div>';
  }

  var totalACV = data.reduce(function(s, d) { return s + d.acv; }, 0);
  if (!totalACV) return '<div class="empty-state" style="min-height:180px">No ACV data</div>';

  var CX = 100, CY = 100, R = 82, r = 48;
  var paths = '';
  var startAngle = -Math.PI / 2;

  data.forEach(function(d, i) {
    var sweep    = (d.acv / totalACV) * 2 * Math.PI;
    var endAngle = startAngle + sweep;
    var color    = ACCENT[i % ACCENT.length];

    // Guard: near-full circle — split into two half-arcs
    if (Math.abs(sweep - 2 * Math.PI) < 0.0001) {
      var midAngle = startAngle + Math.PI;
      paths += arcPath(CX, CY, R, r, startAngle, midAngle, 0, color);
      paths += arcPath(CX, CY, R, r, midAngle,   endAngle, 0, color);
    } else {
      var largeArc = sweep > Math.PI ? 1 : 0;
      paths += arcPath(CX, CY, R, r, startAngle, endAngle, largeArc, color);
    }
    startAngle = endAngle;
  });

  // Center label
  var center =
    '<text x="' + CX + '" y="' + (CY - 7) + '" text-anchor="middle"' +
    ' font-size="14" font-weight="700" fill="#0F172A">' + esc(fmtM(totalACV)) + '</text>' +
    '<text x="' + CX + '" y="' + (CY + 11) + '" text-anchor="middle"' +
    ' font-size="10" fill="#475569">Total ACV</text>';

  var svgEl = '<svg viewBox="0 0 200 200" style="width:170px;flex-shrink:0"' +
    ' role="img" aria-label="ACV by Industry Group donut chart">' +
    paths + center + '</svg>';

  // Legend
  var legend = '<div class="chart-legend">';
  data.forEach(function(d, i) {
    var pct = Math.round(d.acv / totalACV * 100);
    legend += '<div class="legend-item">' +
      '<span class="legend-dot" style="background:' + ACCENT[i % ACCENT.length] + '"></span>' +
      '<span class="legend-label" title="' + esc(d.industryGroup) + '">' + esc(d.industryGroup) + '</span>' +
      '<span class="legend-val">' + esc(fmtM(d.acv)) + '&nbsp;(' + pct + '%)</span>' +
      '</div>';
  });
  legend += '</div>';

  return '<h3 class="chart-title">ACV by Industry Group</h3>' +
    '<div class="donut-wrap">' + svgEl + legend + '</div>';
}

/** Builds a single donut arc path element. */
function arcPath(cx, cy, R, r, start, end, largeArc, color) {
  var x1 = cx + R * Math.cos(start),  y1 = cy + R * Math.sin(start);
  var x2 = cx + R * Math.cos(end),    y2 = cy + R * Math.sin(end);
  var ix1 = cx + r * Math.cos(end),   iy1 = cy + r * Math.sin(end);
  var ix2 = cx + r * Math.cos(start), iy2 = cy + r * Math.sin(start);
  return '<path d="M' + x1 + ',' + y1 +
    ' A' + R + ',' + R + ' 0 ' + largeArc + ',1 ' + x2 + ',' + y2 +
    ' L' + ix1 + ',' + iy1 +
    ' A' + r + ',' + r + ' 0 ' + largeArc + ',0 ' + ix2 + ',' + iy2 +
    ' Z" fill="' + color + '"/>';
}

// ===== SUB+SERVICES STATE =====
var ssData      = null;
var ssSubView   = 'uncovered'; // default per spec

// ===== SUB+SERVICES LOAD =====
function loadSubServices() {
  var container = document.getElementById('panel-subServices');
  if (!container) return;
  ssSubView = 'uncovered';
  container.innerHTML = '<div class="report-loading"><div class="spinner-large"></div></div>';
  var payload = {
    scope:          state.scope,
    studentFilter:  state.studentFilter,
    pipelineStatus: state.pipelineStatus,
    fiscalWindow:   state.fiscalWindow,
    startWindow:    state.startWindow
  };
  google.script.run
    .withSuccessHandler(renderSubServices)
    .withFailureHandler(function(err) {
      container.innerHTML = '<div class="empty-state">\u26a0 Error: ' +
        esc(err.message || String(err)) + '</div>';
    })
    .getSubServicesSummary(payload);
}

// ===== SUB+SERVICES RENDER =====
function renderSubServices(data) {
  ssData = data;
  var container = document.getElementById('panel-subServices');
  if (!container) return;
  var m = data.metrics;

  var html = '';

  // Bullets
  html += '<div class="coffee-panel"><ul>';
  (data.bullets || []).forEach(function(b) { html += '<li>' + esc(b) + '</li>'; });
  html += '</ul></div>';

  // KPI strip
  html += '<div class="stats-grid">';
  html += statCardHtml('Subscription ACV',           fmtM(m.totalSubsACV),         fmtN(m.totalSubsCount) + ' subscriptions');
  html += statCardHtml('Attach Coverage',            m.coveredSubsPct + '%',        fmtN(m.coveredSubsCount) + ' of ' + fmtN(m.totalSubsCount) + ' covered');
  html += statCardHtml('Uncovered Sub ACV',          fmtM(m.uncoveredSubsACV),      fmtN(m.uncoveredSubsCount) + ' uncovered subscriptions');
  html += statCardHtml('Student Subs w/o Services',  fmtN(m.studentUncoveredCount), fmtM(m.studentUncoveredACV) + ' ACV');
  html += '</div>';

  // Charts row
  html += '<div class="charts-row">';
  html += '<div class="chart-card">' + buildCoverageByIndustryChart(data.charts.coverageByIndustry) + '</div>';
  html += '<div class="chart-card">' + buildCoverageByStudentChart(data.charts.coverageByStudent)   + '</div>';
  html += '</div>';

  // In-tab sub-view control
  html += '<div class="tab-subview">' +
    '<span class="tab-subview-label">View:</span>' +
    '<div class="seg-control" id="ss-subview">' +
      '<button class="seg-btn" data-value="covered">Covered (' + fmtN(m.coveredSubsCount) + ')</button>' +
      '<button class="seg-btn active" data-value="uncovered">Uncovered (' + fmtN(m.uncoveredSubsCount) + ')</button>' +
    '</div></div>';

  // Table container (renders uncovered by default)
  html += '<div id="ss-table-container">' + buildSubServicesTableHtml(data.tables.uncovered, 'uncovered') + '</div>';

  container.innerHTML = html;

  // Wire the in-tab sub-view control after DOM is set
  wireSegControl('ss-subview', function(v) {
    ssSubView = v;
    var tc = document.getElementById('ss-table-container');
    if (tc && ssData) tc.innerHTML = buildSubServicesTableHtml(ssData.tables[v], v);
  });
}

// ===== COVERAGE BY INDUSTRY CHART (SVG horizontal bars) =====
function buildCoverageByIndustryChart(data) {
  if (!data || !data.length) return '<div class="empty-state" style="min-height:180px">No data</div>';

  var ROW_H = 30, PAD_T = 10, PAD_B = 8;
  var W = 460, LBL_W = 160, BAR_X = 168, BAR_W = 190, TXT_X = 366;
  var H = PAD_T + data.length * ROW_H + PAD_B;

  var svg = '';
  data.forEach(function(d, i) {
    var y   = PAD_T + i * ROW_H;
    var mid = y + ROW_H / 2 + 4;
    var fillW = Math.round(d.coveredPct / 100 * BAR_W);
    var color = ACCENT[i % ACCENT.length];

    // Industry label (right-aligned)
    svg += '<text x="' + (LBL_W - 4) + '" y="' + mid + '"' +
      ' text-anchor="end" font-size="11" fill="#0F172A">' + esc(d.industryGroup) + '</text>';

    // Bar track
    svg += '<rect x="' + BAR_X + '" y="' + (mid - 5) + '" width="' + BAR_W +
      '" height="10" rx="5" fill="#E5E7EB"/>';

    // Bar fill
    if (fillW > 0) {
      svg += '<rect x="' + BAR_X + '" y="' + (mid - 5) + '" width="' + fillW +
        '" height="10" rx="5" fill="' + color + '"/>';
    }

    // Count/pct label
    svg += '<text x="' + TXT_X + '" y="' + mid + '"' +
      ' text-anchor="start" font-size="11" fill="#475569">' +
      esc(d.coveredCount + '/' + d.subsCount + ' (' + d.coveredPct + '%)') + '</text>';
  });

  return '<h3 class="chart-title">Coverage by Industry Group</h3>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%" role="img"' +
    ' aria-label="Coverage by Industry Group">' + svg + '</svg>';
}

// ===== COVERAGE BY STUDENT CHART (SVG grouped bar) =====
function buildCoverageByStudentChart(data) {
  if (!data || !data.length) return '<div class="empty-state" style="min-height:180px">No data</div>';

  var W = 340, H = 220;
  var padL = 52, padR = 16, padT = 28, padB = 50;
  var cW = W - padL - padR, cH = H - padT - padB;

  var maxVal = 0;
  data.forEach(function(d) {
    maxVal = Math.max(maxVal, d.coveredACV + d.uncoveredACV);
  });
  if (!maxVal) maxVal = 1;

  var groupW  = cW / data.length;
  var barW    = Math.max(20, Math.floor(groupW * 0.38));
  var gap     = 4;
  var svg     = '';

  // Gridlines
  for (var g = 1; g <= 3; g++) {
    var gy = padT + cH - Math.round(cH * g / 3);
    svg += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (padL + cW) +
      '" y2="' + gy + '" stroke="#E5E7EB" stroke-width="1"/>';
    svg += '<text x="' + (padL - 4) + '" y="' + (gy + 4) + '"' +
      ' text-anchor="end" font-size="9" fill="#94a3b8">' + esc(fmtM(maxVal * g / 3)) + '</text>';
  }

  data.forEach(function(d, i) {
    var gx    = padL + i * groupW + (groupW - 2 * barW - gap) / 2;
    var covH  = Math.max(2, Math.round((d.coveredACV / maxVal) * cH));
    var uncH  = Math.max(2, Math.round((d.uncoveredACV / maxVal) * cH));

    // Covered bar (green)
    svg += '<rect x="' + gx + '" y="' + (padT + cH - covH) + '" width="' + barW +
      '" height="' + covH + '" fill="#10B981" rx="3"/>';

    // Uncovered bar (amber)
    svg += '<rect x="' + (gx + barW + gap) + '" y="' + (padT + cH - uncH) + '" width="' + barW +
      '" height="' + uncH + '" fill="#F59E0B" rx="3"/>';

    // Group label
    var cx = gx + barW + gap / 2;
    svg += '<text x="' + cx + '" y="' + (padT + cH + 16) + '"' +
      ' text-anchor="middle" font-size="11" fill="#0F172A">' + esc(d.segment) + '</text>';
  });

  // Legend
  svg += '<rect x="' + padL + '" y="' + (H - 18) + '" width="10" height="10" rx="2" fill="#10B981"/>';
  svg += '<text x="' + (padL + 13) + '" y="' + (H - 9) + '" font-size="10" fill="#475569">Covered</text>';
  svg += '<rect x="' + (padL + 70) + '" y="' + (H - 18) + '" width="10" height="10" rx="2" fill="#F59E0B"/>';
  svg += '<text x="' + (padL + 83) + '" y="' + (H - 9) + '" font-size="10" fill="#475569">Uncovered</text>';

  return '<h3 class="chart-title">Coverage: Student vs Non-Student</h3>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;max-height:240px"' +
    ' role="img" aria-label="Coverage by Student segment">' + svg + '</svg>';
}

// ===== SUB+SERVICES TABLE =====
var SS_ROW_LIMIT = 500;

function buildSubServicesTableHtml(rows, type) {
  if (!rows || !rows.length) {
    return '<div class="empty-state" style="min-height:100px">No ' + type + ' subscriptions in this view.</div>';
  }

  var limited  = rows.length > SS_ROW_LIMIT;
  var display  = limited ? rows.slice(0, SS_ROW_LIMIT) : rows;
  var isCovered = (type === 'covered');

  var html = '<div class="data-table-wrap"><table class="data-table"><thead><tr>';

  if (isCovered) {
    html += th('Name') + th('Type') + th('Stage') + th('ACV', true) +
            th('Industry') + th('Student') + th('Linked Service') + th('Svc Stage') + th('Partner');
  } else {
    html += th('Name') + th('Type') + th('Stage') + th('ACV', true) +
            th('Industry') + th('Student') + th('PS Sub Region');
  }
  html += '</tr></thead><tbody>';

  display.forEach(function(r) {
    html += '<tr>';
    html += '<td title="' + esc(r.name) + '">' + esc(r.name || '—') + '</td>';
    html += '<td>' + esc(shortType(r.recordType)) + '</td>';
    html += '<td>' + esc(r.stage || '—') + '</td>';
    html += '<td class="td-num">' + esc(fmtM(r.amount)) + '</td>';
    html += '<td title="' + esc(r.industryGroup) + '">' + esc(r.industryGroup || '—') + '</td>';
    html += '<td>' + (r.isStudentSlice ? '<span class="status-badge covered">Student</span>' : '') + '</td>';

    if (isCovered) {
      if (r.relatedServicePresentInDataset) {
        html += '<td title="' + esc(r.serviceName) + '">' + esc(r.serviceName || '—') + '</td>';
        html += '<td>' + esc(r.serviceStage || '—') + '</td>';
        html += '<td title="' + esc(r.servicePrimaryPartner) + '">' + esc(r.servicePrimaryPartner || '—') + '</td>';
      } else {
        html += '<td><span class="status-badge outside">Outside dataset</span></td>';
        html += '<td>—</td><td>—</td>';
      }
    } else {
      html += '<td>' + esc(r.psSubRegion || '—') + '</td>';
    }
    html += '</tr>';
  });

  html += '</tbody></table>';
  if (limited) {
    html += '<div class="table-note">Showing first ' + fmtN(SS_ROW_LIMIT) + ' of ' +
      fmtN(rows.length) + ' rows — apply filters to narrow the view.</div>';
  }
  html += '</div>';
  return html;
}

function th(label, isNum) {
  return '<th' + (isNum ? ' style="text-align:right"' : '') + '>' + esc(label) + '</th>';
}

function shortType(t) {
  if (!t) return '—';
  if (t === 'Subscription Opportunity') return 'Subscription';
  if (t === 'Renewals Opportunity')     return 'Renewals';
  return t;
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', function() {
  setupFilters();
  setupTabs();
  loadOverview();
});
</script>
