  function renderReportingDiagnostics_(diag, totals) {
    diag = diag || {};
    const grand = Number((totals || {}).totalHours || 0);
    const unmapped = diag.unmapped || [];
    const blank = diag.blankClassWorkers || { count: 0, totalHours: 0, sampleNames: [] };

    const summaryParts = [];
    if (unmapped.length) summaryParts.push(unmapped.length + ' unmapped categor' + (unmapped.length === 1 ? 'y' : 'ies'));
    if (blank.count) summaryParts.push(blank.count + ' blank-class worker' + (blank.count === 1 ? '' : 's'));
    const summaryText = summaryParts.length ? summaryParts.join(' · ') : 'All clear';
    $('#rpDiagnosticsSummary').textContent = summaryText;

    if (!unmapped.length) {
      $('#rpUnmappedBody').innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">No unmapped categories — all rows classified.</td></tr>';
      $('#rpUnmappedBadge').className = 'badge ghost';
      $('#rpUnmappedBadge').textContent = '0';
    } else {
      const sumUn = unmapped.reduce((s, u) => s + Number(u.hours || 0), 0);
      $('#rpUnmappedBadge').className = 'badge amber';
      $('#rpUnmappedBadge').textContent = fmtHours(sumUn) + ' hrs · ' + unmapped.length;
      $('#rpUnmappedBody').innerHTML = unmapped.map(u => {
        const hrs = Number(u.hours || 0);
        const pct = grand > 0 ? (hrs / grand) : 0;
        return `
          <tr>
            <td><code>${escapeHtml_(u.key || '')}</code></td>
            <td class="num">${fmtHours(hrs)}</td>
            <td class="num">${fmtPct1(pct)}</td>
          </tr>`;
      }).join('');
    }

    if (!blank.count) {
      $('#rpBlankClassBody').innerHTML = '<tr><td colspan="2" class="muted" style="padding:12px">No blank-class workers detected.</td></tr>';
      $('#rpBlankClassBadge').className = 'badge ghost';
      $('#rpBlankClassBadge').textContent = '0';
    } else {
      $('#rpBlankClassBadge').className = 'badge amber';
      $('#rpBlankClassBadge').textContent = fmtHours(blank.totalHours) + ' hrs · ' + blank.count;
      const sample = blank.sampleNames || [];
      $('#rpBlankClassBody').innerHTML = sample.map(s => `
        <tr>
          <td>${escapeHtml_(s.name || '')}</td>
          <td class="num">${fmtHours(s.hours || 0)}</td>
        </tr>`).join('') +
        (blank.count > sample.length
          ? `<tr><td colspan="2" class="muted" style="padding:8px 12px">
               +${blank.count - sample.length} more not shown · resolve in Admin → Worker Exclusions
             </td></tr>`
          : '');
    }
  }

  // Event handlers + modals
  function initReportingHandlers_() {
    document.addEventListener('click', (e) => {
      const banAction = e.target.closest('[data-banner-action]');
      if (banAction) {
        clearSingleFilter_(banAction.dataset.bannerAction);
        return;
      }

      if (e.target.closest('#rpDiagnosticsHeader')) {
        rpToggleDiagnostics_();
        return;
      }

      const showAll = e.target.closest('.rp-drill-showall');
      if (showAll) {
        e.preventDefault();
        openRpDrillModal_({
          scope: showAll.dataset.scope,
          kind: showAll.dataset.kind,
          key: showAll.dataset.key
        });
        return;
      }

      if (e.target.closest('#rpAccountViewAllBtn')) {
        openRpAccountsModal_();
        return;
      }

      const inDrill = e.target.closest('#rpTeamDrillModal, #rpAccountDrillModal');
      if (inDrill && e.target.dataset && e.target.dataset.close !== undefined) {
        closeRpDrillModal_();
        return;
      }

      const inAcctsModal = e.target.closest('#rpAccountsModal');
      if (inAcctsModal && e.target.dataset && e.target.dataset.close !== undefined) {
        closeRpAccountsModal_();
        return;
      }

      const teamRow = e.target.closest('tr.rp-team-row');
      if (teamRow && !e.target.closest('tr.team-drill-row')) {
        const t = teamRow.dataset.team;
        if (t) rpToggleTeam_(t);
        return;
      }

      const acctRow = e.target.closest('tr.rp-account-row');
      if (acctRow && !e.target.closest('tr.team-drill-row')) {
        const a = acctRow.dataset.account;
        if (a) rpToggleAccount_(a);
        return;
      }
    });

    const _debouncedRpAccountsSearch_ = debounce_((value) => {
      renderRpAccountsModalRows_(State.rpAccountsAll || [], State.rpHoursTotal || 0, value);
    }, 200);
    const _debouncedRpDrillSearch_ = debounce_(() => renderRpDrillModalRows_(), 200);

    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'rpAccountsModalSearch') {
        _debouncedRpAccountsSearch_(e.target.value);
      }
      if (e.target && (e.target.id === 'rpTeamDrillSearch' || e.target.id === 'rpAccountDrillSearch')) {
        _debouncedRpDrillSearch_();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      [['rpTeamDrillModal', closeRpDrillModal_],
       ['rpAccountDrillModal', closeRpDrillModal_],
       ['rpAccountsModal', closeRpAccountsModal_]].forEach(([id, closer]) => {
        const m = document.getElementById(id);
        if (m && !m.hidden) closer();
      });
    });

    $('#rpDiagnosticsHeader')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        rpToggleDiagnostics_();
      }
    });
  }

  function rpToggleDiagnostics_() {
    State.rpDiagnosticsOpen = !State.rpDiagnosticsOpen;
    const body = $('#rpDiagnosticsBody');
    const chev = $('#rpDiagnosticsChev');
    if (!body) return;
    body.hidden = !State.rpDiagnosticsOpen;
    if (chev) chev.classList.toggle('open', State.rpDiagnosticsOpen);
  }

    function rpToggleTeam_(teamName) {
    if (!State.rpExpandedTeams) State.rpExpandedTeams = new Set();
    if (State.rpExpandedTeams.has(teamName)) State.rpExpandedTeams.delete(teamName);
    else State.rpExpandedTeams.add(teamName);
    if (State.reporting) {
      renderReportingTeamTable_(State.reporting.byTeam || [], State.reporting.totals || {});
    }
  }

  function rpToggleAccount_(account) {
    if (!State.rpExpandedAccounts) State.rpExpandedAccounts = new Set();
    if (State.rpExpandedAccounts.has(account)) State.rpExpandedAccounts.delete(account);
    else State.rpExpandedAccounts.add(account);
    if (State.reporting) {
      renderReportingAccountTable_(State.reporting.byAccount || [], State.reporting.totals || {});
    }
  }

  function openRpDrillModal_(ctx) {
    if (!State.reporting) return;
    let list = []; let title = ''; let sub = '';
    let labelHeader = 'Label'; let modal = null;

    if (ctx.scope === 'team') {
      const team = (State.reporting.byTeam || []).find(t => t.team === ctx.key);
      if (!team) return;
      if (ctx.kind === 'roleCategories') { list = team.allRoleCategories || []; labelHeader = 'Role Category'; title = team.team + ' — All role categories'; }
      else if (ctx.kind === 'accounts')   { list = team.allAccounts || [];        labelHeader = 'Account';       title = team.team + ' — All accounts'; }
      else if (ctx.kind === 'projects')   { list = team.allProjects || [];        labelHeader = 'Project';       title = team.team + ' — All projects'; }
      modal = $('#rpTeamDrillModal');
      sub = (list.length || 0) + ' items';
    } else if (ctx.scope === 'account') {
      const acct = (State.reporting.byAccount || []).find(a => a.account === ctx.key);
      if (!acct) return;
      if (ctx.kind === 'roles')    { list = acct.allRoles || [];    labelHeader = 'Role';    title = acct.account + ' — All roles'; }
      else if (ctx.kind === 'projects') { list = acct.allProjects || []; labelHeader = 'Project'; title = acct.account + ' — All projects'; }
      modal = $('#rpAccountDrillModal');
      sub = (list.length || 0) + ' items';
    }

    if (!modal) return;
    State.rpActiveDrill = { ctx: ctx, list: list, modal: modal };

    if (ctx.scope === 'team') {
      $('#rpTeamDrillTitle').textContent = title;
      $('#rpTeamDrillSub').textContent = sub;
      $('#rpTeamDrillLabelHeader').textContent = labelHeader;
      const search = $('#rpTeamDrillSearch');
      if (search) search.value = '';
    } else {
      $('#rpAccountDrillTitle').textContent = title;
      $('#rpAccountDrillSub').textContent = sub;
      $('#rpAccountDrillLabelHeader').textContent = labelHeader;
      const search = $('#rpAccountDrillSearch');
      if (search) search.value = '';
    }

    renderRpDrillModalRows_();
    modal.hidden = false;
  }

  function renderRpDrillModalRows_() {
    if (!State.rpActiveDrill) return;
    const { ctx, list } = State.rpActiveDrill;
    const isTeam = ctx.scope === 'team';
    const searchEl = isTeam ? $('#rpTeamDrillSearch') : $('#rpAccountDrillSearch');
    const bodyEl = isTeam ? $('#rpTeamDrillBody') : $('#rpAccountDrillBody');
    const totalHrsEl = isTeam ? $('#rpTeamDrillTotalHours') : $('#rpAccountDrillTotalHours');
    const totalPctEl = isTeam ? $('#rpTeamDrillTotalPct') : $('#rpAccountDrillTotalPct');

    const q = String((searchEl && searchEl.value) || '').toLowerCase().trim();
    const filtered = q
      ? list.filter(x => String(x.label || '').toLowerCase().indexOf(q) >= 0)
      : list.slice();

    const grand = filtered.reduce((s, x) => s + Number(x.hours || 0), 0);

    bodyEl.innerHTML = filtered.length
      ? filtered.map((x, i) => {
          const hrs = Number(x.hours || 0);
          const pct = grand > 0 ? (hrs / grand) : 0;
          return `
            <tr>
              <td class="num">${i + 1}</td>
              <td>${escapeHtml_(x.label || '')}</td>
              <td class="num">${fmtHours(hrs)}</td>
              <td class="num">${fmtPct1(pct)}</td>
            </tr>`;
        }).join('')
      : '<tr><td colspan="4" class="muted" style="padding:12px">No matches.</td></tr>';

    totalHrsEl.textContent = fmtHours(grand);
    totalPctEl.textContent = grand > 0 ? '100%' : '—';
  }

  function closeRpDrillModal_() {
    const team = $('#rpTeamDrillModal');
    const acct = $('#rpAccountDrillModal');
    if (team) team.hidden = true;
    if (acct) acct.hidden = true;
    State.rpActiveDrill = null;
  }

  function openRpAccountsModal_() {
    const modal = $('#rpAccountsModal');
    if (!modal) return;
    const list = State.rpAccountsAll || [];
    const total = State.rpHoursTotal || 0;
    $('#rpAccountsModalSub').textContent = list.length + ' accounts in scope';
    const search = $('#rpAccountsModalSearch');
    if (search) search.value = '';
    renderRpAccountsModalRows_(list, total, '');
    modal.hidden = false;
  }

  function renderRpAccountsModalRows_(list, total, query) {
    const body = $('#rpAccountsModalBody');
    const totalHrsEl = $('#rpAccountsModalTotalHours');
    const totalPctEl = $('#rpAccountsModalTotalPct');
    if (!body) return;

    const q = String(query || '').toLowerCase().trim();
    const filtered = q
      ? list.filter(r => String(r.account || '').toLowerCase().indexOf(q) >= 0)
      : list.slice();

    const sumFiltered = filtered.reduce((s, r) => s + Number(r.hours || 0), 0);
    const grand = total > 0 ? total : sumFiltered;

    body.innerHTML = filtered.length
      ? filtered.map((r, i) => {
          const hrs = Number(r.hours || 0);
          const pct = grand > 0 ? (hrs / grand) : 0;
          return `
            <tr>
              <td class="num">${i + 1}</td>
              <td>${escapeHtml_(r.account || 'Unspecified')}</td>
              <td class="num">${fmtHours(hrs)}</td>
              <td class="num">${fmtPct1(pct)}</td>
            </tr>`;
        }).join('')
      : '<tr><td colspan="4" class="muted" style="padding:12px">No matches.</td></tr>';

    totalHrsEl.textContent = fmtHours(sumFiltered);
    totalPctEl.textContent = grand > 0 ? fmtPct1(sumFiltered / grand) : '—';
  }

  function closeRpAccountsModal_() {
    const modal = $('#rpAccountsModal');
    if (modal) modal.hidden = true;
  }
</script>

<script>
  // ============================================================
  // Capacity Explorer
  //
  // Priority 3: resource list now respects Worker Scope (defaults
  // to SLG for this view) + Team filter + Manager filter. All
  // filtering is client-side against State.ref.resources (which
  // includes pre-computed resolvedTeam) and the search box.
  // Auto-updates on filter change because reloadCurrentView_
  // calls renderResourceList() when current view is 'explorer'.
  // ============================================================
  function renderResourceList() {
    const list = $('#resourceList');
    const search = ($('#resourceSearch').value || '').toLowerCase();
    const resources = (State.ref && State.ref.resources) || [];
    const f = State.filters;

    // Build effective manager set (Manager + descendants if include-reports)
    const managerDescendants = (State.ref && State.ref.managerDescendants) || {};
    let effectiveManagers = null;
    if (f.managers && f.managers.length && !f.teamLabel) {
      effectiveManagers = {};
      const selected = f.managers[0];
      effectiveManagers[selected] = true;
      if (f.includeMyManagers && managerDescendants[selected]) {
        managerDescendants[selected].forEach(m => { effectiveManagers[m] = true; });
      }
    }

    function workerInScope_(wc) {
      const cls = String(wc || '');
      const scope = String(f.workerScope || 'All');
      switch (scope) {
        case 'SLG':         return cls === 'SLG_Real' || cls === 'SLG_Generic';
        case 'NonSLG':      return cls === 'External_NonSLG';
        case 'Partners':    return cls === 'External_Contractor';
        case 'WorkdayOnly': return cls === 'SLG_Real' || cls === 'SLG_Generic' || cls === 'External_NonSLG';
        case 'All':
        case 'Both':        return cls === 'SLG_Real' || cls === 'SLG_Generic' || cls === 'External_NonSLG' || cls === 'External_Contractor';
        case 'External':    return cls === 'External_NonSLG' || cls === 'External_Contractor';
        default:            return false;
      }
    }

    const filtered = resources.filter(r => {
      // Search filter
      if (search && r.name.toLowerCase().indexOf(search) < 0) return false;

      // Worker Scope filter
      if (!workerInScope_(r.worker_class)) return false;

      // Team filter (overrides Manager)
      if (f.teamLabel) {
        if (r.resolvedTeam !== f.teamLabel) return false;
        return true;
      }

      // Manager filter (only when Team is not set)
      if (effectiveManagers) {
        if (!effectiveManagers[r.manager_org]) return false;
      }

      return true;
    });

    if (!filtered.length) {
      list.innerHTML = '<div class="muted" style="padding:16px;text-align:center;">No resources match the current filters.</div>';
      return;
    }

    list.innerHTML = filtered.map(r => `
      <div class="resource-item" data-resource="${escapeHtml_(r.name)}">
        <div>
          <div class="resource-name">${escapeHtml_(r.name)}</div>
          <div class="resource-meta">${escapeHtml_(r.manager_org || '—')} · ${escapeHtml_(r.resolvedTeam || r.icp || '—')}</div>
        </div>
      </div>
    `).join('');

    $$('#resourceList .resource-item').forEach(el => {
      el.addEventListener('click', () => {
        $$('#resourceList .resource-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        State.selectedResource = el.dataset.resource;
        loadResourceDetail_(State.selectedResource);
      });
    });
  }

  $('#resourceSearch')?.addEventListener('input', debounce_(renderResourceList, 200));

  async function loadResourceDetail_(name) {
    if (!name) return;
    try {
      const detail = await call('api_getResourceDetail', {
        resource: name,
        viewMode: State.filters.viewMode,
        scenarioId: State.filters.scenarioId
      });
      renderResourceChart_(name, detail);
    } catch (err) {
      toast('Resource detail failed: ' + err.message, 'err');
    }
  }

  function renderResourceChart_(name, months) {
    $('#resourceTitle').textContent = name;
    const meta = (State.ref.resources || []).find(r => r.name === name);
    $('#resourceSub').textContent = meta
      ? (meta.manager_org || '—') + ' · ' + (meta.resolvedTeam || meta.icp || meta.role_category || '—')
      : '';

    const ctx = $('#resourceChart').getContext('2d');
    if (State.charts.resource) State.charts.resource.destroy();
    State.charts.resource = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: months.map(m => fmtMonth(m.monthKey)),
        datasets: [
          { label: 'Billable', data: months.map(m => m.billable), backgroundColor: cssVar_('--ballpoint') },
          { label: 'Internal', data: months.map(m => m.internal), backgroundColor: cssVar_('--water-cooler') },
          { label: 'Education', data: months.map(m => m.education), backgroundColor: cssVar_('--tack') },
          { label: 'PTO/Holiday', data: months.map(m => m.pto), backgroundColor: cssVar_('--pencil') },
          { label: 'Scenario', data: months.map(m => m.scenario), backgroundColor: cssVar_('--happy-hour') }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { position: 'bottom' } },
        scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, beginAtZero: true } }
      }
    });
  }
</script>

<script>
  // ============================================================
  // Pipeline / Deployments / Scenarios
  // ============================================================
  async function loadOpportunities() {
    try {
      State.opportunities = await call('api_listOpportunities', {
        segment: $('#segmentFilter').value || '',
        stageMin: $('#stageFilter').value || '',
        search: $('#oppSearch').value || ''
      });
      renderOpportunities_();
    } catch (err) {
      toast('Pipeline load failed: ' + err.message, 'err');
    }
  }
  ['#segmentFilter', '#stageFilter'].forEach(sel => {
    const el = $(sel);
    if (el) el.addEventListener('change', loadOpportunities);
  });
  const _oppSearchEl = $('#oppSearch');
  if (_oppSearchEl) _oppSearchEl.addEventListener('input', debounce_(loadOpportunities, 200));

  function _renderCellWithOverride_(row, fieldName, displayValue) {
    if (!row._overrides) return escapeHtml_(String(displayValue == null ? '—' : displayValue));
    const ov = row._overrides.find(function (o) { return o.field === fieldName; });
    if (!ov) return escapeHtml_(String(displayValue == null ? '—' : displayValue));
    const tooltipParts = [
      'Original: ' + ov.original_value,
      'Reason: ' + ov.reason,
      'By: ' + ov.created_by
    ];
    if (ov.expires_at) tooltipParts.push('Expires: ' + ov.expires_at.slice(0, 10));
    const title = tooltipParts.join('\n');
    return '<span class="override-badge" title="' + escapeHtml_(title) + '">' +
      escapeHtml_(String(displayValue == null ? '—' : displayValue)) +
      '<span class="override-dot" aria-label="overridden"></span>' +
      '</span>';
  }

  function renderOpportunities_() {
    const body = $('#oppBody');
    body.innerHTML = State.opportunities.map(o => `
      <tr>
        <td>${escapeHtml_(o.opportunity_name)}</td>
        <td>${escapeHtml_(o.account)}</td>
        <td>${_renderCellWithOverride_(o, 'segment', o.segment || '—')}</td>
        <td>${_renderCellWithOverride_(o, 'stage', o.stage)}</td>
        <td class="num">${_renderCellWithOverride_(o, 'probability', fmtPct(o.probability / 100))}</td>
        <td class="num">${_renderCellWithOverride_(o, 'acv', fmtMoney(o.acv))}</td>
        <td>${_renderCellWithOverride_(o, 'expected_start', fmtDate(o.expected_start))}</td>
        <td>${_renderCellWithOverride_(o, 'expected_end', fmtDate(o.expected_end))}</td>
        <td class="num">${_renderCellWithOverride_(o, 'ee_count', o.ee_count || '—')}</td>
        <td>
          <button class="btn-ghost row-btn" data-opp="${o.opportunity_id}">Assign</button>
          <button class="btn-ghost row-btn" data-edit-opp="${escapeHtml_(o.opportunity_id)}" style="margin-left:4px;">Edit</button>
        </td>
      </tr>
    `).join('');

    $$('#oppBody button[data-opp]').forEach(btn => {
      btn.addEventListener('click', () => openAssignDrawer_(btn.dataset.opp));
    });
    $$('#oppBody button[data-edit-opp]').forEach(btn => {
      btn.addEventListener('click', () => openOverrideDrawer_('Pipeline', btn.dataset.editOpp));
    });
  }

  async function loadDeployments() {
    try {
      State.deployments = await call('api_listDeployments');
      renderDeployments_();
    } catch (err) {
      toast('Deployments load failed: ' + err.message, 'err');
    }
  }
  $('#deploySearch')?.addEventListener('input', debounce_(renderDeployments_, 200));

  function renderDeployments_() {
    const body = $('#deployBody');
    const q = ($('#deploySearch').value || '').toLowerCase();
    const filtered = State.deployments.filter(d =>
      d.deployment_name.toLowerCase().indexOf(q) >= 0 ||
      d.account_name.toLowerCase().indexOf(q) >= 0
    );
    body.innerHTML = filtered.map(d => `
      <tr>
        <td>${escapeHtml_(d.deployment_name)}</td>
        <td>${escapeHtml_(d.account_name)}</td>
        <td>${_renderCellWithOverride_(d, 'deployment_stage', d.deployment_stage)}</td>
        <td>${_renderCellWithOverride_(d, 'deployment_health', d.deployment_health)}</td>
        <td>${_renderCellWithOverride_(d, 'current_mtp_date', fmtDate(d.current_mtp_date))}</td>
        <td>${_renderCellWithOverride_(d, 'em_name', d.em_name)}</td>
        <td>${_renderCellWithOverride_(d, 'dam_name', d.dam_name)}</td>
        <td>
          <button class="btn-ghost row-btn" data-dep="${d.deployment_id}">Assign</button>
          <button class="btn-ghost row-btn" data-edit-dep="${escapeHtml_(d.deployment_id)}" style="margin-left:4px;">Edit</button>
        </td>
      </tr>
    `).join('');

    $$('#deployBody button[data-dep]').forEach(btn => {
      btn.addEventListener('click', () => openAssignDrawer_(btn.dataset.dep, 'deployment'));
    });
    $$('#deployBody button[data-edit-dep]').forEach(btn => {
      btn.addEventListener('click', () => openOverrideDrawer_('Deployments', btn.dataset.editDep));
    });
  }

  async function loadScenariosList() {
  State.scenarios = await call('api_listScenarios');
  }

  async function loadScenarios() {
    await loadScenariosList();
    const list = $('#scenarioList');
    list.innerHTML = State.scenarios.map(s => `
      <div class="scenario-item ${s.scenario_id === State.selectedScenario ? 'active' : ''}" data-id="${s.scenario_id}">
        <div>
          <div class="resource-name">${escapeHtml_(s.name)}</div>
          <div class="resource-meta">${escapeHtml_(s.status)} · ${fmtDate(s.modified_at)}</div>
        </div>
      </div>
    `).join('');

    $$('#scenarioList .scenario-item').forEach(el => {
      el.addEventListener('click', () => {
        State.selectedScenario = el.dataset.id;
        loadScenarios();
        loadScenarioAssignments_(el.dataset.id);
      });
    });

    $('#newScenarioBtn')?.addEventListener('click', () => openScenarioModal_());
    $('#commitScenarioBtn')?.addEventListener('click', () => commitSelectedScenario_());
    $('#archiveScenarioBtn')?.addEventListener('click', () => archiveSelectedScenario_());
  }

    async function loadScenarioAssignments_(scenarioId) {
    const assigns = await call('api_listAssignments', { scenario_id: scenarioId });
    const body = $('#scenarioAssignmentsBody');
    // Priority 4: Role column displays resource_type (the user's literal
    // dropdown selection). Falls back to a.role (ICP role) for any rows
    // saved before the schema change — though that data is wiped per the
    // demo prep step.
    body.innerHTML = assigns.map(a => `
      <tr>
        <td>${escapeHtml_(a.opportunity_id)}</td>
        <td>${escapeHtml_(a.resource_type || a.role || '—')}</td>
        <td>${escapeHtml_(a.resource_name || '—')}</td>
        <td>${fmtDate(a.start_date)}</td>
        <td>${fmtDate(a.end_date)}</td>
        <td class="num">${a.estimated_hours}</td>
        <td>${escapeHtml_(a.distribution)}</td>
        <td>${escapeHtml_(a.status)}</td>
      </tr>
    `).join('');

    const sel = State.scenarios.find(s => s.scenario_id === scenarioId);
    if (sel) {
      $('#scenarioTitle').textContent = sel.name;
      $('#commitScenarioBtn').disabled = sel.status === 'Archived';
      $('#archiveScenarioBtn').disabled = sel.status === 'Archived';
    }
  }

  function openScenarioModal_(scenario) {
    const modal = $('#scenarioModal');
    $('#s_id').value = scenario ? scenario.scenario_id : '';
    $('#s_name').value = scenario ? scenario.name : '';
    $('#s_desc').value = scenario ? (scenario.description || '') : '';
    modal.hidden = false;
  }

  $('#scenarioForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      scenario_id: $('#s_id').value || null,
      name: $('#s_name').value,
      description: $('#s_desc').value,
      status: 'Active'
    };
    await call('api_saveScenario', payload);
    $('#scenarioModal').hidden = true;
    await loadScenarios();
  });

  $('#scenarioModal')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      $('#scenarioModal').hidden = true;
    }
  });

  async function commitSelectedScenario_() {
    if (!State.selectedScenario) return;
    if (!confirm('Commit all modeled assignments in this scenario?')) return;
    await call('api_commitScenario', State.selectedScenario);
    toast('Scenario committed', 'ok');
    await loadScenarios();
    if (State.currentView === 'dashboard') loadDashboard();
  }

  async function archiveSelectedScenario_() {
    if (!State.selectedScenario) return;
    if (!confirm('Archive this scenario?')) return;
    await call('api_archiveScenario', State.selectedScenario);
    toast('Scenario archived', 'ok');
    State.selectedScenario = null;
    await loadScenarios();
  }
</script>

<script>
  // ============================================================
  // Assign drawer (Pipeline / Deployments)
  //
  // NOTE: Priority 4 will substantially restructure this drawer
  // (Role dropdown from Config_Resource_Type, Resource filtered
  // to SLG-only, both required, save resource_type + team_label).
  // This block is the pre-Priority-4 implementation, unchanged.
  // ============================================================
    // ============================================================
  // Priority 4: Assign drawer with resource_type-sourced Role
  // dropdown and SLG-only Resource dropdown. Both required.
  //
  // Role:     populated from State.ref.resourceTypeOptions (Config_Resource_Type).
  // Resource: filtered to worker_class in (SLG_Real, SLG_Generic),
  //           including Generic_Resources (which are stamped SLG_Generic
  //           server-side via _resourceIndex_).
  // Both have empty-value placeholders to fail browser native required validation.
  // ============================================================
  async function openAssignDrawer_(opportunityId, source) {
    if (!State.scenarios.length) await loadScenariosList();
    const drawer = $('#assignDrawer');
    const opp = State.opportunities.find(o => o.opportunity_id === opportunityId) ||
                State.deployments.find(d => d.deployment_id === opportunityId);
    if (!opp) return;

    $('#drawerAccount').textContent = opp.account || opp.account_name || '—';
    $('#drawerOppName').textContent = opp.opportunity_name || opp.deployment_name || 'Assign';
    $('#drawerStage').textContent = opp.stage || opp.deployment_stage || '—';
    $('#drawerProb').textContent = opp.probability ? fmtPct(opp.probability / 100) : '—';
    $('#drawerSegment').textContent = opp.segment || opp.industry || '—';

    $('#f_assignment_id').value = '';
    $('#f_opportunity_id').value = opportunityId;

    // Priority 4: Role dropdown sourced from Config_Resource_Type.
    // resourceTypeOptions is sorted alphabetically server-side.
    const roleSel = $('#f_role');
    const resourceTypeOptions = (State.ref && State.ref.resourceTypeOptions) || [];
    roleSel.innerHTML = '<option value="">— Select role —</option>' +
      resourceTypeOptions
        .map(rt => `<option value="${escapeHtml_(rt)}">${escapeHtml_(rt)}</option>`)
        .join('');

    // Priority 4: Resource dropdown filtered to SLG workers only
    // (SLG_Real + SLG_Generic, including Generic_Resources).
    const resSel = $('#f_resource');
    const allResources = (State.ref && State.ref.resources) || [];
    const slgResources = allResources.filter(r =>
      r.worker_class === 'SLG_Real' || r.worker_class === 'SLG_Generic'
    );
    resSel.innerHTML = '<option value="">— Select resource —</option>' +
      slgResources
        .map(r => `<option value="${escapeHtml_(r.name)}">${escapeHtml_(r.name)}</option>`)
        .join('');

    // Populate scenarios (unchanged)
    const scenSel = $('#f_scenario');
    scenSel.innerHTML = '<option value="">— No scenario —</option>' +
      (State.scenarios || [])
        .filter(s => s.status !== 'Archived')
        .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`).join('');

    $('#f_start').value = '';
    $('#f_end').value = '';
    $('#f_hours').value = '';
    $('#f_notes').value = '';
    $$('#f_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === 'Even'));

    drawer.hidden = false;
  }

  $('#assignDrawer')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      $('#assignDrawer').hidden = true;
    }
  });

  $$('#f_distribution button').forEach(b => {
    b.addEventListener('click', () => {
      $$('#f_distribution button').forEach(x => x.classList.toggle('on', x === b));
    });
  });

  $('#f_newScenarioBtn')?.addEventListener('click', () => {
    openScenarioModal_();
  });

  $('#assignForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    await saveAssignment_('Modeled');
  });

  $('#commitNowBtn')?.addEventListener('click', async () => {
    await saveAssignment_('Committed');
  });

    // ============================================================
  // Priority 4: required-field validation + resource_type payload.
  //
  // Client sends the user's literal Role-dropdown selection as
  // resource_type. Server enriches team_label, role (ICP), and team
  // via saveAssignment_ in Assignments.gs. Whatever the client sends
  // for role/team/team_label is overwritten server-side; we send role
  // as an empty string to be explicit about this.
  //
  // Both Role and Resource are required. Client-side validation
  // catches both the form-submit path (Save as Modeled) and the
  // direct button-click path (Commit Now) which bypasses native
  // browser required validation.
  // ============================================================
  async function saveAssignment_(status) {
    const resourceType = $('#f_role').value;
    const resourceName = $('#f_resource').value;

    // Required-field validation (covers Commit Now bypass of native required)
    if (!resourceType) {
      toast('Role is required.', 'err');
      return;
    }
    if (!resourceName) {
      toast('Resource is required.', 'err');
      return;
    }

        const dist = $$('#f_distribution button').find(b => b.classList.contains('on'));
    const distVal = dist ? dist.dataset.val : 'Even';
    // Custom Distribution: serialize per-month inputs into custom_monthly_json.
    // Server's expandAssignmentToMonthly_ will use these literal values
    // instead of computing weights. Empty for non-Custom distributions.
    const customJson = (distVal === 'Custom') ? collectCustomMonthsJson_() : '';

    if (distVal === 'Custom') {
      const _customInputs = $$('.custom-month-input');
      const _sumOfMonths = _customInputs.reduce((s, el) => s + (Number(el.value) || 0), 0);
      const _estHours = Number($('#f_hours').value) || 0;
      if (Math.abs(_sumOfMonths - _estHours) > 0.5) {
        toast('Custom distribution total must equal Estimated Hours before saving.', 'err');
        return;
      }
    }

    const payload = {
      assignment_id: $('#f_assignment_id').value || null,
      opportunity_id: $('#f_opportunity_id').value,
      resource_type: resourceType,              // Priority 4: canonical role field
      role: '',                                  // Priority 4: server derives from team_label
      resource_name: resourceName,
      start_date: $('#f_start').value,
      end_date: $('#f_end').value,
      estimated_hours: Number($('#f_hours').value) || 0,
      distribution: distVal,
      custom_monthly_json: customJson,           // Custom Distribution v1
      scenario_id: $('#f_scenario').value || null,
      notes: $('#f_notes').value,
      status: status
    };
    try {
      await call('api_saveAssignment', payload);
      toast('Assignment saved as ' + status, 'ok');
      $('#assignDrawer').hidden = true;
      if (State.currentView === 'dashboard') loadDashboard();
      else if (State.currentView === 'scenarios') loadScenarios();
    } catch (err) {
      toast('Save failed: ' + err.message, 'err');
    }
  }

    // ============================================================
  // Priority 4 patch: restore Monthly Load Preview chart.
  //
  // Wires the drawer's #previewChart canvas to api_previewAssignment.
  // Triggered on distribution change OR debounced input on start/end/
  // hours fields. Chart is destroyed on drawer close to prevent
  // duplicate instances on re-open.
  //
  // collectFormForPreview_ sends only what api_previewAssignment needs
  // (dates, hours, distribution). It does NOT mirror the save-time
  // payload — Priority 4's resource_type/role/team_label enrichment is
  // server-side at save time and irrelevant to monthly preview math.
  // ============================================================
  function closeDrawer_() {
    $('#assignDrawer').hidden = true;
    if (State.charts.preview) {
      State.charts.preview.destroy();
      State.charts.preview = null;
    }
  }

    function collectFormForPreview_() {
    const dist = $$('#f_distribution button').find(b => b.classList.contains('on'));
    const distVal = dist ? dist.dataset.val : 'Even';
    // Custom Distribution: send the per-month inputs to the server so
    // the preview chart reflects exactly what the user is editing.
    const customJson = (distVal === 'Custom') ? collectCustomMonthsJson_() : '';
    return {
      start_date: $('#f_start').value,
      end_date: $('#f_end').value,
      estimated_hours: Number($('#f_hours').value) || 0,
      distribution: distVal,
      custom_monthly_json: customJson
    };
  }

  async function updatePreview_() {
    const a = collectFormForPreview_();
    if (!a.start_date || !a.end_date || !a.estimated_hours) return;
    try {
      const months = await call('api_previewAssignment', a);
      renderPreviewChart_(months);
    } catch (err) {
      // silent during typing
    }
  }

    function renderPreviewChart_(months) {
    const filtered = months.filter(m => monthKeyOnOrAfterToday(m.monthKey));
    const src = filtered.length ? filtered : months;
    const ctx = $('#previewChart').getContext('2d');
    if (State.charts.preview) State.charts.preview.destroy();
    const cs = getComputedStyle(document.documentElement);
    State.charts.preview = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: src.map(m => fmtMonth(m.monthKey)),
        datasets: [{
          label: 'Hours',
          data: src.map(m => Math.round(m.hours)),
          backgroundColor: cs.getPropertyValue('--ballpoint').trim()
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: false, resizeDelay: 100,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false } },
          y: { grid: { color: '#ECEEF1' }, title: { display: true, text: 'Hours' } }
        }
      }
    });
  }

  // ============================================================
  // Custom Distribution per-month inputs
  //
  // Rendered when Distribution = Custom. Pre-fills with Even
  // distribution. User edits any month; live total updates
  // immediately, chart updates debounced. Resets to Even on
  // date/hours change (with toast warning) or on Reset button.
  // ============================================================

  /**
   * Generate the list of month keys between f_start and f_end.
   * Returns array of {monthKey, monthLabel} pairs.
   * Empty array if either date is missing or invalid.
   */
  function customMonthsRange_() {
    const startStr = $('#f_start').value;
    const endStr = $('#f_end').value;
    if (!startStr || !endStr) return [];
    const start = new Date(startStr);
    const end = new Date(endStr);
    if (isNaN(start.getTime()) || isNaN(end.getTime())) return [];
    if (end < start) return [];
    const out = [];
    let cur = new Date(start.getFullYear(), start.getMonth(), 1);
    const last = new Date(end.getFullYear(), end.getMonth(), 1);
    while (cur <= last) {
      const mk = cur.getFullYear() + '-' + String(cur.getMonth() + 1).padStart(2, '0');
      out.push({ monthKey: mk, monthLabel: fmtMonth(mk) });
      cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    }
    return out;
  }

  /**
   * Render per-month input rows into #customMonthsList.
   * Pre-fills inputs with Even distribution (estimated_hours / monthCount,
   * with remainder added to the last month to keep total exact).
   */
  function renderCustomMonths_() {
    const list = $('#customMonthsList');
    if (!list) return;
    const months = customMonthsRange_();
    const estHours = Number($('#f_hours').value) || 0;

    $('#customMonthsTarget').textContent = String(estHours);

    if (!months.length) {
      list.innerHTML = '<div class="muted" style="padding:8px 0;">' +
        'Set Start date and End date above to define month rows.</div>';
      $('#customMonthsTotal').textContent = '0';
      $('#customMonthsDelta').textContent = '';
      $('#customMonthsDelta').className = 'custom-months-delta';
      return;
    }

    // Even distribution: floor(estHours / n) per month, remainder on last month.
    const n = months.length;
    const evenBase = Math.floor(estHours / n);
    const remainder = estHours - (evenBase * n);

    list.innerHTML = months.map(function (m, i) {
      const initialValue = (i === n - 1) ? (evenBase + remainder) : evenBase;
      return '' +
        '<div class="custom-month-row">' +
          '<span class="custom-month-label">' + escapeHtml_(m.monthLabel) + '</span>' +
          '<input type="number" min="0" step="1" ' +
            'class="input custom-month-input" ' +
            'data-month-key="' + escapeHtml_(m.monthKey) + '" ' +
            'value="' + initialValue + '">' +
          '<span class="muted custom-month-hrs">hrs</span>' +
        '</div>';
    }).join('');

    updateCustomMonthsTotal_();
  }

  /**
   * Read all per-month inputs, compute total, update footer display.
   * Color-codes the delta indicator: green (matched), amber (mismatch).
   */
  function updateCustomMonthsTotal_() {
    const inputs = $$('.custom-month-input');
    const total = inputs.reduce(function (sum, el) {
      return sum + (Number(el.value) || 0);
    }, 0);
    const target = Number($('#f_hours').value) || 0;
    const delta = total - target;

    $('#customMonthsTotal').textContent = String(total);
    $('#customMonthsTarget').textContent = String(target);

    const deltaEl = $('#customMonthsDelta');
    if (delta === 0) {
      deltaEl.textContent = '✓ matched';
      deltaEl.className = 'custom-months-delta matched';
    } else if (delta > 0) {
      deltaEl.textContent = '(+' + delta + ' over)';
      deltaEl.className = 'custom-months-delta mismatch';
    } else {
      deltaEl.textContent = '(' + delta + ' short)';
      deltaEl.className = 'custom-months-delta mismatch';
    }
    const _saveBtn = $('#saveModeledBtn');
    const _commitBtn = $('#commitNowBtn');
    if (_saveBtn) _saveBtn.disabled = delta !== 0;
    if (_commitBtn) _commitBtn.disabled = delta !== 0;
  }

  /**
   * Read per-month inputs, return JSON-stringified {monthKey: hours} map.
   * Returns empty string if no inputs exist (e.g., dates not set).
   */
  function collectCustomMonthsJson_() {
    const inputs = $$('.custom-month-input');
    if (!inputs.length) return '';
    const obj = {};
    inputs.forEach(function (el) {
      const mk = el.dataset.monthKey;
      const hrs = Number(el.value) || 0;
      if (mk) obj[mk] = hrs;
    });
    return JSON.stringify(obj);
  }

  /**
   * Show or hide the Custom Months section.
   * On show, regenerates the rows from current dates and hours.
   */
  function showCustomMonthsSection_(show) {
    const field = $('#customMonthsField');
    if (!field) return;
    if (show) {
      renderCustomMonths_();
      field.hidden = false;
    } else {
      field.hidden = true;
      const _saveBtn = $('#saveModeledBtn');
      const _commitBtn = $('#commitNowBtn');
      if (_saveBtn) _saveBtn.disabled = false;
      if (_commitBtn) _commitBtn.disabled = false;
    }
  }

  /**
   * Reset all per-month inputs to Even distribution. Wired to the
   * "Reset to Even" button inside the Custom Months section.
   */
  function resetCustomMonthsToEven_() {
    renderCustomMonths_();
    updatePreview_();
    toast('Custom hours reset to Even distribution', 'ok');
  }

    // Event wiring — distribution segmented control change
  $('#f_distribution')?.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    // The visual .on toggle is already handled elsewhere (in the
    // existing $$('#f_distribution button').forEach handler).
    // Show/hide Custom Months section based on selection.
    const isCustom = (b.dataset.val === 'Custom');
    showCustomMonthsSection_(isCustom);
    updatePreview_();
  });

  // Custom Months inline event wiring — input changes update total
  // immediately and trigger debounced preview chart refresh.
  document.addEventListener('input', (e) => {
    if (e.target && e.target.classList && e.target.classList.contains('custom-month-input')) {
      updateCustomMonthsTotal_();
      clearTimeout(window._previewTimer);
      window._previewTimer = setTimeout(updatePreview_, 200);
    }
  });

  // Reset to Even button inside Custom Months section
  $('#customMonthsResetBtn')?.addEventListener('click', resetCustomMonthsToEven_);

    // Event wiring — date and hours inputs (debounced 200ms).
  // If Distribution is Custom, regenerate the per-month rows
  // (resets to Even) and toast a warning.
  ['f_start', 'f_end', 'f_hours'].forEach(id => {
    $('#' + id)?.addEventListener('input', () => {
      // Check if Custom is currently active
      const activeBtn = $$('#f_distribution button').find(b => b.classList.contains('on'));
      const isCustom = activeBtn && activeBtn.dataset.val === 'Custom';
      if (isCustom) {
        // Regenerate rows on date/hours change. Warn user that custom
        // entries were reset (only when there's been actual user input).
        renderCustomMonths_();
        toast('Custom hours reset — date or hours changed', 'warn');
      }
      clearTimeout(window._previewTimer);
      window._previewTimer = setTimeout(updatePreview_, 200);
    });
  });

  // Drawer close — destroy chart instance to prevent leaks on re-open
  $('#assignDrawer')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      if (State.charts.preview) {
        State.charts.preview.destroy();
        State.charts.preview = null;
      }
    }
  });
</script>

<script>
  // ============================================================
  // Admin
  // ============================================================
  async function loadAdmin() {
    try {
      const ref = State.ref;
      const icpBody = $('#icpBody');
      icpBody.innerHTML = (ref.icp || []).map(r => `
        <tr>
          <td><input type="text" class="input" data-icp-role value="${escapeHtml_(r.role)}"></td>
          <td><input type="number" step="0.01" class="input num" data-icp-target value="${r.target_utilization}"></td>
          <td><input type="number" step="0.01" class="input num" data-icp-red value="${r.red_threshold}"></td>
        </tr>
      `).join('');

      const rolesBody = $('#rolesBody');
      rolesBody.innerHTML = (ref.roles || []).map(r => `
        <tr>
          <td><input type="text" class="input" data-role-name value="${escapeHtml_(r.role)}"></td>
          <td><input type="number" step="1" class="input num" data-role-hours value="${r.monthly_capacity_hours}"></td>
        </tr>
      `).join('');

      const log = await call('api_getRefreshLog');
      $('#refreshLogBody').innerHTML = log.map(l => `
        <tr>
          <td>${fmtDateTime(l.timestamp)}</td>
          <td>${escapeHtml_(l.source)}</td>
          <td class="num">${l.rows_in}</td>
          <td class="num">${l.rows_out}</td>
          <td class="num">${l.months_detected}</td>
          <td>${escapeHtml_(l.user)}</td>
        </tr>
      `).join('');

      const pipeLog = await call('api_getPipelineRefreshLog');
      $('#pipelineLogBody').innerHTML = (pipeLog || []).map(l => `
        <tr>
          <td>${fmtDateTime(l['Refresh Time'])}</td>
          <td>${escapeHtml_(l['Sheet'])}</td>
          <td>${escapeHtml_(l['Operation'])}</td>
          <td>${escapeHtml_(l['Status'])}</td>
          <td>${escapeHtml_(l['User'])}</td>
        </tr>
      `).join('');

      const generics = await call('api_listGenericResources');
      const gBody = $('#genericBody');
      if (generics.length) {
        gBody.innerHTML = generics.map(g => `
          <tr>
            <td>${escapeHtml_(g.name)}</td>
            <td>${escapeHtml_(g.resource_type)}</td>
            <td>${escapeHtml_(g.project_role)}</td>
            <td>${escapeHtml_(g.manager_org)}</td>
            <td>${escapeHtml_(g.team)}</td>
            <td>${escapeHtml_(g.practice)}</td>
            <td class="num">${g.capacity_hours}</td>
            <td>${escapeHtml_(g.status)}</td>
          </tr>
        `).join('');
      }

      const excl = await call('api_getExclusions');
      $('#exclusionsBody').innerHTML = (excl || []).map(w => `
        <tr>
          <td><input type="checkbox" data-excl-active ${String(w.active).toLowerCase() === 'yes' ? 'checked' : ''}></td>
          <td>${escapeHtml_(w.worker_name)}</td>
          <td>${escapeHtml_(w.manager_org)}</td>
          <td>${escapeHtml_(w.reason || '')}</td>
        </tr>
      `).join('');
    } catch (err) {
      toast('Admin load failed: ' + err.message, 'err');
    }
  }

  $('#saveIcpBtn')?.addEventListener('click', async () => {
    const rows = $$('#icpBody tr').map(tr => ({
      role: tr.querySelector('[data-icp-role]').value,
      target_utilization: Number(tr.querySelector('[data-icp-target]').value),
      red_threshold: Number(tr.querySelector('[data-icp-red]').value)
    }));
    await call('api_saveIcp', rows);
    toast('ICP saved', 'ok');
  });

  $('#saveRolesBtn')?.addEventListener('click', async () => {
    const rows = $$('#rolesBody tr').map(tr => ({
      role: tr.querySelector('[data-role-name]').value,
      monthly_capacity_hours: Number(tr.querySelector('[data-role-hours]').value)
    }));
    await call('api_saveRoles', rows);
    toast('Roles saved', 'ok');
  });

  $('#flushCachesBtn')?.addEventListener('click', async () => {
    await call('api_flushCaches');
    toast('Caches flushed', 'ok');
    State.ref = await call('api_getReference');
    reloadCurrentView_();
  });

  $('#refreshOppsBtn')?.addEventListener('click', async () => {
    await call('api_refreshOpportunities');
    toast('Opportunities refreshed', 'ok');
    loadAdmin();
  });

  // ============================================================
  // Admin tab navigation (Drop 2)
  // ============================================================
  const ADMIN_TAB_KEY = 'capacityPlanner.adminTab';

  function initAdminTabs_() {
    document.addEventListener('click', (e) => {
      const tab = e.target.closest('[data-admin-tab]');
      if (!tab) return;
      activateAdminTab_(tab.dataset.adminTab);
    });
  }

  function activateAdminTab_(tabName) {
    $$('[data-admin-tab]').forEach(btn => {
      const isActive = btn.dataset.adminTab === tabName;
      btn.classList.toggle('on', isActive);
      btn.setAttribute('aria-selected', String(isActive));
    });
    $$('[data-admin-panel]').forEach(panel => {
      panel.hidden = panel.dataset.adminPanel !== tabName;
    });
    try { localStorage.setItem(ADMIN_TAB_KEY, tabName); } catch (e) {}
    if (tabName === 'planning') loadAdminSettings_();
    if (tabName === 'overrides') loadOverridesAdmin_();
  }

  async function loadAdminSettings_() {
    const body = $('#settingsBody');
    if (!body) return;
    try {
      const settings = await call('api_listSettings');
      body.innerHTML = settings.map(s => `
        <tr>
          <td>
            <div style="font-weight:500">${escapeHtml_(s.label)}</div>
            <div class="muted" style="font-size:12px">${escapeHtml_(s.description)}</div>
          </td>
          <td>
            <input type="text" class="input settings-input" data-key="${escapeHtml_(s.key)}" value="${escapeHtml_(s.value)}" style="width:100%;">
            ${s.isDefault ? '<span class="badge ghost" style="margin-left:6px;font-size:11px;">(default)</span>' : ''}
          </td>
          <td class="muted" style="font-size:12px">${escapeHtml_(s.key)}</td>
        </tr>
      `).join('');
    } catch (err) {
      body.innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">Failed to load settings: ' + escapeHtml_(err.message) + '</td></tr>';
    }
  }

  $('#saveSettingsBtn')?.addEventListener('click', async () => {
    const inputs = $$('.settings-input');
    if (!inputs.length) { toast('No settings loaded', 'info'); return; }
    const rows = Array.from(inputs).map(input => ({
      key:   input.dataset.key,
      value: input.value
    }));
    try {
      await call('api_saveSettings', rows);
      await call('api_flushCaches');
      toast('Settings saved', 'ok');
    } catch (err) {
      toast('Save failed: ' + err.message, 'err');
    }
  });

  // PSA upload
  const uploadZone = $('#uploadZone');
  const staffFile = $('#staffFile');
  $('#browseBtn')?.addEventListener('click', () => staffFile.click());
  uploadZone?.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone?.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone?.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('drag');
    if (e.dataTransfer.files.length) handleStaffFile_(e.dataTransfer.files[0]);
  });
  staffFile?.addEventListener('change', () => {
    if (staffFile.files.length) handleStaffFile_(staffFile.files[0]);
  });

  function handleStaffFile_(file) {
    const status = $('#uploadStatus');
    status.hidden = false;
    status.className = 'status info';
    status.textContent = 'Uploading ' + file.name + '…';
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(',')[1];
        const result = await call('api_uploadStaffFile', base64, file.name);
        status.className = 'status ok';
        status.textContent = 'Uploaded: ' + result.rowsOut + ' rows normalized · ' + result.monthsDetected + ' months';
        State.ref = await call('api_getReference');
        if (State.currentView === 'dashboard') loadDashboard();
      } catch (err) {
        status.className = 'status err';
        status.textContent = 'Upload failed: ' + err.message;
      }
    };
    reader.readAsDataURL(file);
  }
</script>

<script>
  // ============================================================
  // Override Drawer (Drop 3)
  // ============================================================
  let _overridableFieldsCache_ = null;

  async function loadOverridableFields_() {
    if (!_overridableFieldsCache_) {
      _overridableFieldsCache_ = await call('api_listOverridableFields');
    }
    return _overridableFieldsCache_;
  }

  async function openOverrideDrawer_(source, recordId) {
    const drawer = $('#overrideDrawer');
    if (!drawer) return;

    $('#overrideDrawerSource').textContent = source;
    $('#overrideDrawerTitle').textContent =
      'Edit ' + (source === 'Pipeline' ? 'opportunity' : 'deployment') + ' overrides';
    $('#overrideDrawerRecordId').textContent = String(recordId || '');
    $('#o_source').value = source;
    $('#o_record_id').value = recordId;
    $('#o_reason').value = '';
    $('#o_expires').value = '';

    try {
      const [fields, existingOverrides] = await Promise.all([
        loadOverridableFields_(),
        call('api_listOverrides', { source: source, record_id: recordId, status: 'Active' })
      ]);
      renderOverrideFields_(fields, existingOverrides, source, recordId);
    } catch (err) {
      $('#overrideFieldsContainer').innerHTML =
        '<div class="muted" style="padding:8px 0;">Failed to load field definitions: ' +
        escapeHtml_(err.message) + '</div>';
    }

    drawer.hidden = false;
  }

  function renderOverrideFields_(fields, currentOverrides, source, recordId) {
    const container = $('#overrideFieldsContainer');
    if (!container) return;

    const sourceFields = (fields || []).filter(function (f) { return f.source === source; });
    const overrideByField = {};
    (currentOverrides || []).forEach(function (o) { overrideByField[o.field] = o; });

    const sourceRecords = source === 'Pipeline' ? State.opportunities : State.deployments;
    const sourceRecord = sourceRecords.find(function (r) {
      return (r.opportunity_id || r.deployment_id) === recordId;
    }) || {};

    if (!sourceFields.length) {
      container.innerHTML = '<div class="muted" style="padding:8px 0;">No overridable fields configured for ' + escapeHtml_(source) + '.</div>';
      return;
    }

    container.innerHTML = sourceFields.map(function (f) {
      const existing = overrideByField[f.field];
      const sourceValue = sourceRecord[f.field] != null ? String(sourceRecord[f.field]) : '';
      const currentValue = existing ? String(existing.override_value || '') : '';

      let inputHtml;
      switch (f.data_type) {
        case 'date':
          inputHtml = '<input type="date" class="input override-field-input" data-field="' +
            escapeHtml_(f.field) + '" value="' + escapeHtml_(currentValue) + '">';
          break;
        case 'number':
        case 'currency':
        case 'percent':
          inputHtml = '<input type="number" step="any" class="input override-field-input" data-field="' +
            escapeHtml_(f.field) + '" placeholder="' + escapeHtml_(sourceValue) + '" value="' +
            escapeHtml_(currentValue) + '">';
          break;
        default:
          inputHtml = '<input type="text" class="input override-field-input" data-field="' +
            escapeHtml_(f.field) + '" placeholder="' + escapeHtml_(sourceValue) + '" value="' +
            escapeHtml_(currentValue) + '">';
      }

      const isOverridden = !!existing;
      const overriddenBadge = isOverridden
        ? '<span class="badge amber" style="font-size:10px;padding:1px 5px;margin-left:4px;">overridden</span>'
        : '';
      const metaHtml = isOverridden
        ? '<div class="override-field-meta">Original: ' + escapeHtml_(String(existing.original_value || '')) +
          ' · By ' + escapeHtml_(existing.created_by || '') +
          ' · ' + (existing.created_at ? existing.created_at.slice(0, 10) : '') + '</div>'
        : '';

      const rowAttrs = [
        'class="override-field-row"',
        'data-field="' + escapeHtml_(f.field) + '"',
        existing ? 'data-override-id="' + escapeHtml_(String(existing.override_id || '')) + '"' : '',
        existing ? 'data-modified-at="' + escapeHtml_(String(existing.modified_at || '')) + '"' : ''
      ].filter(Boolean).join(' ');

      return '<div ' + rowAttrs + '>' +
        '<div class="override-field-label">' + escapeHtml_(f.label) + overriddenBadge + '</div>' +
        inputHtml +
        metaHtml +
        '</div>';
    }).join('');
  }

  async function submitOverrideForm_(e) {
    if (e) e.preventDefault();
    const source = $('#o_source').value;
    const recordId = $('#o_record_id').value;
    const reason = ($('#o_reason').value || '').trim();
    const expires = ($('#o_expires').value || '').trim();

    if (!reason) {
      toast('Reason is required.', 'err');
      return;
    }

    const sourceRecords = source === 'Pipeline' ? State.opportunities : State.deployments;
    const sourceRecord = sourceRecords.find(function (r) {
      return (r.opportunity_id || r.deployment_id) === recordId;
    }) || {};

    const rows = $$('#overrideFieldsContainer .override-field-row');
    const ops = [];

    rows.forEach(function (rowEl) {
      const fld = rowEl.dataset.field;
      const input = rowEl.querySelector('.override-field-input');
      if (!input) return;
      const inputVal = input.value.trim();
      const overrideId = rowEl.dataset.overrideId || '';
      const modifiedAt = rowEl.dataset.modifiedAt || '';

      const sourceVal = sourceRecord[fld] != null ? String(sourceRecord[fld]) : '';

      if (inputVal === '' && overrideId) {
        ops.push({ type: 'delete', override_id: overrideId });
      } else if (inputVal !== '' && inputVal !== sourceVal) {
        ops.push({
          type: 'save',
          payload: {
            override_id:    overrideId || undefined,
            source:         source,
            record_id:      recordId,
            field:          fld,
            original_value: sourceVal,
            override_value: inputVal,
            reason:         reason,
            expires_at:     expires || '',
            modified_at:    modifiedAt || undefined
          }
        });
      }
    });

    if (!ops.length) {
      toast('No changes to save.', 'info');
      return;
    }

    const saveBtn = $('#saveOverrideBtn');
    if (saveBtn) saveBtn.disabled = true;

    try {
      for (let i = 0; i < ops.length; i++) {
        const op = ops[i];
        if (op.type === 'delete') {
          await call('api_deleteOverride', op.override_id, reason);
        } else {
          await call('api_saveOverride', op.payload);
        }
      }
      toast('Overrides saved', 'ok');
      _overridableFieldsCache_ = null;
      $('#overrideDrawer').hidden = true;
      reloadCurrentView_();
    } catch (err) {
      toast('Save failed: ' + err.message, 'err');
    } finally {
      if (saveBtn) saveBtn.disabled = false;
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    const overrideDrawer = $('#overrideDrawer');
    if (!overrideDrawer) return;

    overrideDrawer.addEventListener('click', function (e) {
      if (e.target.dataset && e.target.dataset.close !== undefined) {
        overrideDrawer.hidden = true;
      }
    });

    $('#saveOverrideBtn')?.addEventListener('click', submitOverrideForm_);
    $('#overrideForm')?.addEventListener('submit', submitOverrideForm_);
  });
</script>

<script>
  // ============================================================
  // Overrides Manager Admin panel (Drop 4)
  // ============================================================
  let _ovAllRows = [];
  let _ovAuditOpen = false;
  let _ovAuditLoaded = false;

  async function loadOverridesAdmin_() {
    await Promise.all([loadOvHygiene_(), loadOvManagerTable_()]);
  }

  async function loadOvHygiene_() {
    try {
      const h = await call('api_getOverrideHygieneSummary');
      const setText = function (id, val) {
        const el = $('#' + id);
        if (el) el.textContent = String(val);
      };
      setText('ovHygActive',   h.activeTotal   || 0);
      setText('ovHygExpiring', h.expiringSoon  || 0);
      setText('ovHygLongRun',  h.longRunning   || 0);
      setText('ovHygStale',    h.stale         || 0);
      const count = (h.expiringSoon || 0) + (h.stale || 0);
      const badge = $('#adminTabBadgeOverrides');
      if (badge) {
        badge.textContent = String(count);
        badge.hidden = count === 0;
      }
    } catch (err) {
      toast('Hygiene load failed: ' + err.message, 'err');
    }
  }

  async function loadOvManagerTable_() {
    try {
      const src    = $('#ovFilterSource')?.value || '';
      const status = $('#ovFilterStatus')?.value || '';
      const filter = {};
      if (src)    filter.source = src;
      if (status) filter.status = status;
      _ovAllRows = await call('api_listOverrides', filter);
      renderOvManagerTable_();
    } catch (err) {
      const body = $('#ovTableBody');
      if (body) body.innerHTML = '<tr><td colspan="11" class="muted" style="padding:12px;">Load failed: ' +
        escapeHtml_(err.message) + '</td></tr>';
    }
  }

  function renderOvManagerTable_() {
    const body = $('#ovTableBody');
    if (!body) return;
    const q = ($('#ovFilterSearch')?.value || '').toLowerCase().trim();
    const filtered = q ? _ovAllRows.filter(function (r) {
      return (String(r.record_id || '') + ' ' + String(r.field || '') + ' ' + String(r.reason || '')).toLowerCase().includes(q);
    }) : _ovAllRows;

    if (!filtered.length) {
      body.innerHTML = '<tr><td colspan="11" class="muted" style="padding:12px;">No overrides found.</td></tr>';
      updateOvBulkButton_();
      return;
    }

    body.innerHTML = filtered.map(function (r) {
      const statusClass = {
        'Active':  'ov-status-active',
        'Expired': 'ov-status-expired',
        'Removed': 'ov-status-removed'
      }[r.status] || '';
      const expires = r.expires_at ? String(r.expires_at).slice(0, 10) : '—';
      const modified = r.modified_at ? String(r.modified_at).slice(0, 10) : '—';
      return '<tr>' +
        '<td><input type="checkbox" class="ov-row-check" data-id="' + escapeHtml_(String(r.override_id || '')) + '"></td>' +
        '<td>' + escapeHtml_(r.source || '') + '</td>' +
        '<td title="' + escapeHtml_(String(r.record_id || '')) + '">' + escapeHtml_(String(r.record_id || '')) + '</td>' +
        '<td>' + escapeHtml_(r.field || '') + '</td>' +
        '<td title="' + escapeHtml_(String(r.original_value || '')) + '">' + escapeHtml_(String(r.original_value || '')) + '</td>' +
        '<td class="ov-cell-wide" title="' + escapeHtml_(String(r.override_value || '')) + '">' + escapeHtml_(String(r.override_value || '')) + '</td>' +
        '<td class="ov-cell-wide" title="' + escapeHtml_(r.reason || '') + '">' + escapeHtml_(r.reason || '') + '</td>' +
        '<td>' + expires + '</td>' +
        '<td class="' + statusClass + '">' + escapeHtml_(r.status || '') + '</td>' +
        '<td>' + escapeHtml_(r.created_by || '') + '</td>' +
        '<td>' + modified + '</td>' +
        '</tr>';
    }).join('');

    body.addEventListener('change', function (e) {
      if (e.target.classList.contains('ov-row-check')) updateOvBulkButton_();
    }, { once: true });

    updateOvBulkButton_();
  }

  function updateOvBulkButton_() {
    const checked = $$('#ovTableBody .ov-row-check:checked');
    const btn = $('#ovBulkRemoveBtn');
    if (!btn) return;
    const n = checked ? checked.length : 0;
    btn.disabled = n === 0;
    btn.textContent = n > 0 ? 'Remove selected (' + n + ')' : 'Remove selected';
  }

  function _csvCell_(v) {
    const s = String(v === null || v === undefined ? '' : v);
    if (/[,"\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function _parseCsv_(text) {
    const rows = [];
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    let i = 0;
    while (i < lines.length) {
      const row = [];
      while (i < lines.length && lines[i] !== '\n') {
        if (lines[i] === '"') {
          i++;
          let cell = '';
          while (i < lines.length) {
            if (lines[i] === '"' && lines[i + 1] === '"') { cell += '"'; i += 2; }
            else if (lines[i] === '"') { i++; break; }
            else { cell += lines[i]; i++; }
          }
          row.push(cell);
          if (lines[i] === ',') i++;
        } else {
          let cell = '';
          while (i < lines.length && lines[i] !== ',' && lines[i] !== '\n') {
            cell += lines[i]; i++;
          }
          row.push(cell);
          if (lines[i] === ',') i++;
        }
      }
      if (lines[i] === '\n') i++;
      if (row.length > 0) rows.push(row);
    }
    return rows;
  }

  async function loadOvAudit_() {
    const body = $('#ovAuditTableBody');
    if (!body) return;
    body.innerHTML = '<tr><td colspan="7" class="muted" style="padding:12px;">Loading…</td></tr>';
    try {
      const filter = {};
      const src    = $('#ovAuditFilterSource')?.value;
      const rec    = ($('#ovAuditFilterRecord')?.value || '').trim();
      const actor  = ($('#ovAuditFilterActor')?.value || '').trim();
      if (src)   filter.source    = src;
      if (rec)   filter.record_id = rec;
      if (actor) filter.actor     = actor;
      filter.limit  = 100;
      filter.offset = 0;
      const result = await call('api_getOverrideAudit', filter);
      const rows   = result.rows || [];
      const total  = result.total || 0;
      const limit  = result.limit || 100;

      const totalEl = $('#ovAuditTotal');
      const limitEl = $('#ovAuditLimit');
      const summEl  = $('#ovAuditSummary');
      if (totalEl) totalEl.textContent = String(total);
      if (limitEl) limitEl.textContent = String(Math.min(limit, total));
      if (summEl)  summEl.textContent  = total > 0 ? '(' + Math.min(rows.length, limit) + ' of ' + total + ')' : '';

      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="7" class="muted" style="padding:12px;">No audit rows match the filter.</td></tr>';
        return;
      }

      body.innerHTML = rows.map(function (r) {
        let beforeAfter = '—';
        try {
          const b = r.before_json ? JSON.parse(r.before_json) : null;
          const a = r.after_json  ? JSON.parse(r.after_json)  : null;
          const bVal = b ? String(b.override_value !== undefined ? b.override_value : '∅') : '∅';
          const aVal = a ? String(a.override_value !== undefined ? a.override_value : '∅') : '∅';
          beforeAfter = escapeHtml_(bVal) + ' → ' + escapeHtml_(aVal);
        } catch (e) {
          beforeAfter = '<span class="muted">(parse error)</span>';
        }
        const when = r.timestamp ? String(r.timestamp).slice(0, 16).replace('T', ' ') : '—';
        return '<tr>' +
          '<td>' + escapeHtml_(when) + '</td>' +
          '<td>' + escapeHtml_(r.actor || '') + '</td>' +
          '<td>' + escapeHtml_(r.action || '') + '</td>' +
          '<td>' + escapeHtml_(r.source || '') + '</td>' +
          '<td>' + escapeHtml_(String(r.record_id || '')) + '</td>' +
          '<td>' + escapeHtml_(r.field || '') + '</td>' +
          '<td>' + beforeAfter + '</td>' +
          '</tr>';
      }).join('');
    } catch (err) {
      body.innerHTML = '<tr><td colspan="7" class="muted" style="padding:12px;">Load failed: ' + escapeHtml_(err.message) + '</td></tr>';
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    // Hygiene refresh
    $('#ovHygieneRefreshBtn')?.addEventListener('click', loadOvHygiene_);

    // Manager table filters
    $('#ovFilterSource')?.addEventListener('change', loadOvManagerTable_);
    $('#ovFilterStatus')?.addEventListener('change', loadOvManagerTable_);
    if (typeof debounce_ === 'function') {
      $('#ovFilterSearch')?.addEventListener('input', debounce_(renderOvManagerTable_, 200));
    } else {
      $('#ovFilterSearch')?.addEventListener('input', renderOvManagerTable_);
    }

    // Select all
    $('#ovSelectAll')?.addEventListener('change', function (e) {
      $$('#ovTableBody .ov-row-check').forEach(function (cb) { cb.checked = e.target.checked; });
      updateOvBulkButton_();
    });

    // Bulk remove
    $('#ovBulkRemoveBtn')?.addEventListener('click', async function () {
      const checked = $$('#ovTableBody .ov-row-check:checked');
      if (!checked || !checked.length) return;
      const ids = Array.from(checked).map(function (cb) { return cb.dataset.id; });
      const reason = prompt('Reason for removing ' + ids.length + ' override(s):');
      if (!reason || !reason.trim()) return;
      try {
        const results = await call('api_bulkDeleteOverrides', ids, reason.trim());
        const failed = results.filter(function (r) { return !r.ok; }).length;
        if (failed > 0) {
          toast('Removed ' + (ids.length - failed) + ', failed ' + failed, 'err');
        } else {
          toast('Removed ' + ids.length + ' override(s)', 'ok');
        }
        await loadOvManagerTable_();
        await loadOvHygiene_();
      } catch (err) {
        toast('Bulk remove failed: ' + err.message, 'err');
      }
    });

    // Export CSV
    $('#ovExportBtn')?.addEventListener('click', async function () {
      try {
        const src    = $('#ovFilterSource')?.value || '';
        const status = $('#ovFilterStatus')?.value || '';
        const filter = {};
        if (src)    filter.source = src;
        if (status) filter.status = status;
        const matrix = await call('api_exportOverridesCsv', filter);
        const csvText = matrix.map(function (row) {
          return row.map(_csvCell_).join(',');
        }).join('\n');
        const blob = new Blob([csvText], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const ts = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        a.href = url;
        a.download = 'overrides_' + ts + '.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      } catch (err) {
        toast('Export failed: ' + err.message, 'err');
      }
    });

    // Import CSV
    $('#ovImportBtn')?.addEventListener('click', function () {
      $('#ovImportFile')?.click();
    });

    $('#ovImportFile')?.addEventListener('change', async function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const matrix = _parseCsv_(text);
        if (matrix.length < 2) { toast('CSV has no data rows', 'err'); return; }
        const dataRows = matrix.length - 1;
        if (!confirm('Import ' + dataRows + ' row(s) as new overrides?')) return;
        const result = await call('api_importOverridesCsv', matrix);
        if (result.skipped && result.skipped.length > 0) {
          toast('Imported ' + result.created + ', skipped ' + result.skipped.length, 'err');
          console.warn('Skipped rows:', result.skipped);
        } else {
          toast('Imported ' + result.created + ' override(s)', 'ok');
        }
        e.target.value = '';
        await loadOvManagerTable_();
        await loadOvHygiene_();
      } catch (err) {
        toast('Import failed: ' + err.message, 'err');
      }
    });

    // Audit log collapsible
    const auditHeader = $('#ovAuditHeader');
    if (auditHeader) {
      auditHeader.addEventListener('click', function () {
        _ovAuditOpen = !_ovAuditOpen;
        const body = $('#ovAuditBody');
        const chev = $('#ovAuditChev');
        if (body) body.hidden = !_ovAuditOpen;
        if (chev) chev.classList.toggle('open', _ovAuditOpen);
        if (_ovAuditOpen && !_ovAuditLoaded) {
          _ovAuditLoaded = true;
          loadOvAudit_();
        }
      });
    }

    $('#ovAuditApplyBtn')?.addEventListener('click', function () {
      _ovAuditLoaded = true;
      loadOvAudit_();
    });
  });
</script>
