<style>
/* ===== DESIGN TOKENS ===== */
:root {
  --color-primary:       #0F4C81;
  --color-primary-dark:  #0A3359;
  --color-primary-tint:  #E8EFF6;
  --color-surface:       #FFFFFF;
  --color-surface-alt:   #F8FAFC;
  --color-border:        #E5E7EB;
  --color-text:          #0F172A;
  --color-text-muted:    #475569;
  --color-success:       #10B981;
  --color-warning:       #F59E0B;
  --color-danger:        #EF4444;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;

  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px;
  --radius-xl: 16px; --radius-pill: 999px;

  --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
                "Helvetica", "Arial", sans-serif;

  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.10);
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family:      var(--font-stack);
  background:       var(--color-surface-alt);
  color:            var(--color-text);
  font-size:        14px;
  line-height:      1.5;
  min-height:       100vh;
}

/* ===== HEADER ===== */
.header {
  background:  var(--color-primary);
  color:       #fff;
  padding:     var(--sp-3) var(--sp-8);
  box-shadow:  var(--shadow-md);
  position:    sticky;
  top:         0;
  z-index:     100;
}
.header-inner {
  max-width:   1400px;
  margin:      0 auto;
  display:     flex;
  align-items: center;
  gap:         var(--sp-3);
}
.header-title {
  font-size:      18px;
  font-weight:    700;
  letter-spacing: -.3px;
}
.header-subtitle {
  font-size: 13px;
  opacity:   .70;
}

/* ===== FILTER BAR ===== */
.filter-bar {
  background:    var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  padding:       var(--sp-2) var(--sp-8);
  position:      sticky;
  top:           49px;
  z-index:       90;
}
.filter-bar-inner {
  max-width:   1400px;
  margin:      0 auto;
  display:     flex;
  align-items: center;
  flex-wrap:   wrap;
  gap:         var(--sp-4);
}
.filter-group {
  display:     flex;
  align-items: center;
  gap:         var(--sp-2);
}
.filter-label {
  font-size:   12px;
  font-weight: 600;
  color:       var(--color-text-muted);
  white-space: nowrap;
}

/* ===== SEGMENTED CONTROL ===== */
.seg-control {
  display:       flex;
  background:    var(--color-surface-alt);
  border:        1px solid var(--color-border);
  border-radius: var(--radius-pill);
  padding:       2px;
  gap:           2px;
}
.seg-btn {
  background:    transparent;
  border:        none;
  cursor:        pointer;
  font-size:     12px;
  font-family:   var(--font-stack);
  font-weight:   500;
  color:         var(--color-text-muted);
  padding:       4px 12px;
  border-radius: var(--radius-pill);
  transition:    background .15s, color .15s;
  white-space:   nowrap;
}
.seg-btn:hover {
  background: var(--color-primary-tint);
  color:      var(--color-primary);
}
.seg-btn.active {
  background: var(--color-primary);
  color:      #fff;
}

/* ===== FILTER CHIP ===== */
.filter-chip {
  display:       inline-flex;
  align-items:   center;
  gap:           var(--sp-1);
  background:    var(--color-primary-tint);
  color:         var(--color-primary);
  border-radius: var(--radius-pill);
  padding:       3px 10px;
  font-size:     12px;
  font-weight:   500;
}

/* ===== TABS ===== */
.tabs-container {
  max-width: 1400px;
  margin:    0 auto;
  padding:   0 var(--sp-8);
}
.tab-nav {
  display:       flex;
  border-bottom: 2px solid var(--color-border);
  margin-top:    var(--sp-4);
  gap:           0;
}
.tab {
  background:      none;
  border:          none;
  cursor:          pointer;
  font-size:       14px;
  font-family:     var(--font-stack);
  font-weight:     500;
  color:           var(--color-text-muted);
  padding:         var(--sp-3) var(--sp-4);
  border-bottom:   2px solid transparent;
  margin-bottom:   -2px;
  transition:      color .15s, border-color .15s;
  white-space:     nowrap;
}
.tab:hover   { color: var(--color-primary); }
.tab.active  { color: var(--color-primary); border-bottom-color: var(--color-primary); }

.tab-panel          { display: none; padding: var(--sp-6) 0; }
.tab-panel.active   { display: block; }

/* ===== KPI TILES ===== */
.stats-grid {
  display:               grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap:                   var(--sp-4);
  margin-bottom:         var(--sp-6);
}
.stat-card {
  background:    var(--color-surface);
  border:        1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding:       var(--sp-4) var(--sp-6);
  box-shadow:    var(--shadow-sm);
}
.stat-label {
  font-size:      11px;
  font-weight:    600;
  color:          var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: .5px;
  margin-bottom:  var(--sp-2);
}
.stat-value {
  font-size:   28px;
  font-weight: 700;
  color:       var(--color-text);
  text-align:  right;
  line-height: 1.1;
}
.stat-sub {
  font-size:  12px;
  color:      var(--color-text-muted);
  text-align: right;
  margin-top: 2px;
}

/* ===== MORNING COFFEE PANEL ===== */
.coffee-panel {
  background:     var(--color-primary-tint);
  border-left:    4px solid var(--color-primary);
  border-radius:  var(--radius-md);
  padding:        var(--sp-4) var(--sp-6);
  margin-bottom:  var(--sp-6);
}
.coffee-panel ul  { list-style: none; padding: 0; }
.coffee-panel li  {
  padding:       5px 0;
  font-size:     14px;
  color:         var(--color-text);
  line-height:   1.55;
  border-bottom: 1px solid rgba(15,76,129,.10);
}
.coffee-panel li:last-child { border-bottom: none; }
.coffee-panel li::before {
  content:    '▸ ';
  color:      var(--color-primary);
  font-size:  11px;
}

/* ===== CHART CARDS ===== */
.charts-row {
  display:               grid;
  grid-template-columns: 1fr 1fr;
  gap:                   var(--sp-4);
  margin-bottom:         var(--sp-6);
}
.chart-card {
  background:    var(--color-surface);
  border:        1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding:       var(--sp-4) var(--sp-6);
  box-shadow:    var(--shadow-sm);
  min-width:     0;
}
.chart-title {
  font-size:     14px;
  font-weight:   600;
  color:         var(--color-text);
  margin-bottom: var(--sp-4);
}

/* ===== DONUT CHART ===== */
.donut-wrap {
  display:     flex;
  align-items: flex-start;
  gap:         var(--sp-4);
  flex-wrap:   wrap;
}
.chart-legend    { flex: 1; min-width: 150px; }
.legend-item     {
  display:       flex;
  align-items:   center;
  gap:           var(--sp-2);
  margin-bottom: 6px;
  font-size:     12px;
}
.legend-dot      {
  width:       10px;
  height:      10px;
  border-radius: 50%;
  flex-shrink:   0;
}
.legend-label    {
  flex:          1;
  color:         var(--color-text);
  overflow:      hidden;
  text-overflow: ellipsis;
  white-space:   nowrap;
  max-width:     160px;
}
.legend-val      {
  color:       var(--color-text-muted);
  white-space: nowrap;
  font-weight: 500;
}

/* ===== LOADING / SPINNER ===== */
.report-loading {
  display:         flex;
  justify-content: center;
  align-items:     center;
  padding:         var(--sp-12) 0;
  min-height:      200px;
}
.spinner-large {
  width:        44px;
  height:       44px;
  border:       4px solid var(--color-border);
  border-top-color: var(--color-primary);
  border-radius:    50%;
  animation:        spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== EMPTY STATE ===== */
.empty-state {
  display:         flex;
  flex-direction:  column;
  align-items:     center;
  justify-content: center;
  padding:         var(--sp-12) var(--sp-8);
  color:           var(--color-text-muted);
  font-size:       16px;
  font-weight:     500;
  min-height:      200px;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .charts-row { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .tabs-container, .filter-bar, .header { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .filter-bar { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .stats-grid { grid-template-columns: 1fr 1fr; }
}
</style>
