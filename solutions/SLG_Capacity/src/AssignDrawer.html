<!-- AssignDrawer.html — Opportunity assignment drawer (pipeline / deployments / soft-book commit).
     Included from Index.html. Wired in JavaScript.html (#assignDrawer). -->

<div class="drawer" id="assignDrawer" hidden>
  <div class="drawer-backdrop" data-close></div>
  <div class="drawer-panel">
    <div class="drawer-spinner" aria-hidden="true"></div>
    <header class="drawer-header">
      <div>
        <div class="muted" id="drawerAccount">—</div>
        <div class="drawer-title" id="drawerOppName">Assign</div>
        <div class="drawer-meta">
          <span class="badge ghost" id="drawerStage">—</span>
          <span class="badge ghost" id="drawerProb">—</span>
          <span class="badge ghost" id="drawerSegment">—</span>
        </div>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close">✕</button>
    </header>
    <form class="drawer-form" id="assignForm">
      <input type="hidden" id="f_assignment_id">
      <input type="hidden" id="f_opportunity_id">
      <label class="field"><span>Role</span>
        <select class="select" id="f_role" required></select>
      </label>
      <label class="field"><span>Resource</span>
        <select class="select" id="f_resource" required></select>
      </label>
      <label class="field"><span>Start date</span>
        <input type="date" class="input" id="f_start" required>
      </label>
      <label class="field"><span>End date</span>
        <input type="date" class="input" id="f_end" required>
      </label>
      <label class="field"><span>Estimated hours</span>
        <input type="number" class="input" id="f_hours" min="0" step="0.1" required>
      </label>
      <label class="field"><span>Distribution</span>
        <div class="seg" id="f_distribution" role="group" aria-label="Distribution">
          <button type="button" class="on" data-val="Even">Even</button>
          <button type="button" data-val="Front-loaded">Front-loaded</button>
          <button type="button" data-val="Back-loaded">Back-loaded</button>
          <button type="button" data-val="Custom">Custom by week</button>
        </div>
      </label>
      <div id="assignCustomWeeklyMount" class="custom-weekly-mount" hidden></div>
      <label class="field" id="softBookWhatField" hidden><span>Commit to</span>
        <select class="select" id="f_softbook_what"></select>
      </label>
      <label class="field"><span>Scenario</span>
        <select class="select" id="f_scenario">
          <option value="">— No scenario —</option>
        </select>
      </label>
      <label class="field"><span>Notes</span>
        <textarea class="input" id="f_notes" rows="2"></textarea>
      </label>
      <div class="field">
        <span>Monthly preview</span>
        <div style="height:160px;position:relative">
          <canvas id="previewChart"></canvas>
        </div>
      </div>
      <div class="drawer-actions">
        <button type="button" class="btn-ghost" data-close>Cancel</button>
        <button type="button" class="btn-ghost" id="f_newScenarioBtn">New scenario</button>
        <button type="submit" class="btn-ghost" id="saveModeledBtn">Save as Modeled</button>
        <button type="button" class="btn-primary" id="commitNowBtn">Commit now</button>
      </div>
    </form>
  </div>
</div>
