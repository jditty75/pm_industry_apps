  function formatSoftBookSpan_(booking) {
    const s = booking.start_date || '';
    const e = booking.end_date || '';
    if (!s || !e) return '—';
    return s + ' \u2192 ' + e;
  }

  function closeSoftBookPopover_() {
    const pop = $('#explorerSoftBookPopover');
    if (pop) pop.hidden = true;
    State.explorerPopoverWorker = null;
  }

  function openSoftBookPopover_(resourceName, anchorEl) {
    const pop = $('#explorerSoftBookPopover');
    if (!pop) return;
    State.explorerPopoverWorker = resourceName;
    const workerInput = $('#sbPopoverWorker');
    if (workerInput) workerInput.value = resourceName;
    const today = new Date().toISOString().slice(0, 10);
    const startInput = $('#sbPopoverStart');
    const endInput = $('#sbPopoverEnd');
    const hoursInput = $('#sbPopoverHours');
    if (startInput) startInput.value = today;
    if (endInput) endInput.value = today;
    if (hoursInput) hoursInput.value = '';
    pop.hidden = false;
    if (anchorEl && anchorEl.getBoundingClientRect) {
      const rect = anchorEl.getBoundingClientRect();
      pop.style.top = (rect.bottom + window.scrollY + 4) + 'px';
      pop.style.left = Math.min(rect.left + window.scrollX, window.innerWidth - 300) + 'px';
    }
    if (hoursInput) hoursInput.focus();
  }

  function addSoftBookingFromPopover_() {
    const resourceName = State.explorerPopoverWorker;
    if (!resourceName) return;
    const start = ($('#sbPopoverStart') && $('#sbPopoverStart').value) || '';
    const end = ($('#sbPopoverEnd') && $('#sbPopoverEnd').value) || '';
    const hours = Number($('#sbPopoverHours') && $('#sbPopoverHours').value);
    if (!start || !end || !hours || hours <= 0) {
      toast('Enter start date, end date, and total hours.', 'err');
      return;
    }
    if (new Date(start) > new Date(end)) {
      toast('Start date must be on or before end date.', 'err');
      return;
    }
    const baseline = getExplorerWorkerBaseline_(resourceName);
    State.softBookings.push({
      employee_id: baseline ? (baseline.employeeId || '') : '',
      resource_name: resourceName,
      start_date: start,
      end_date: end,
      total_hours: hours
    });
    closeSoftBookPopover_();
    onSoftBookingsChanged_();
    toast('Soft booking added to basket.', '');
  }

  function clearExplorerSoftBookings_(reason) {
    State.explorerProjectionReqId++;
    State.softBookings = [];
    State.explorerPopoverWorker = null;
    State.explorerProjection = null;
    State.explorerImpactOrgReady = false;
    closeSoftBookPopover_();
    renderExplorerSoftBookBasket_();
    hideExplorerProjectionPending_();
    const band = $('#explorerImpactBand');
    if (band) {
      band.hidden = true;
      band.classList.remove('is-computing');
    }
    const body = $('#explorerImpactBody');
    if (body) body.innerHTML = '';
  }

  function onSoftBookingsChanged_() {
    renderExplorerSoftBookBasket_();
    scheduleExplorerProjection_();
    if (WFM25_SHELL) {
      wfm25AfterSoftBookCommitRefresh_();
    }
  }

  function renderExplorerSoftBookBasket_() {
    const basket = $('#explorerSoftBookBasket');
    const body = $('#explorerBasketBody');
    const countEl = $('#explorerBasketCount');
    if (!basket || !body) return;
    const bookings = State.softBookings || [];
    if (!bookings.length) {
      basket.hidden = true;
      body.innerHTML = '';
      if (countEl) countEl.textContent = '0';
      return;
    }
    basket.hidden = false;
    if (countEl) countEl.textContent = String(bookings.length);
    body.innerHTML = bookings.map(function (b, idx) {
      const isReduce = String(b.direction || 'add') === 'reduce';
      const dirCls = isReduce ? 'is-reduce' : 'is-add';
      return '<div class="explorer-basket-row">' +
        '<div class="explorer-basket-row-main">' +
          '<div class="explorer-basket-worker">' + escapeHtml_(b.resource_name) + '</div>' +
          '<div class="explorer-basket-meta muted">' +
            '<span class="wfm25-draft-tray-direction ' + dirCls + '">' +
              escapeHtml_(softBookDirectionLabel_(b)) + '</span>' +
            escapeHtml_(formatSoftBookSpan_(b)) + '</div>' +
        '</div>' +
        '<button type="button" class="btn-ghost explorer-basket-remove" data-idx="' + idx +
          '" aria-label="Remove booking">\u2715</button>' +
      '</div>';
    }).join('');
    $$('#explorerBasketBody .explorer-basket-remove').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const i = Number(btn.dataset.idx);
        State.softBookings.splice(i, 1);
        onSoftBookingsChanged_();
      });
    });
    const commitW = $('#explorerCommitWorker');
    const commitAll = $('#explorerCommitAll');
    if (commitW) commitW.disabled = false;
    if (commitAll) commitAll.disabled = false;
  }

  function softBookCommitKey_(b) {
    return [b.resource_name, String(b.direction || 'add'), b.start_date, b.end_date,
      String(b.total_hours)].join('|');
  }

  /**
   * Direction label for draft tray / basket (arrow + signed hours).
   * @param {Object} b soft booking
   * @returns {string}
   */
  function softBookDirectionLabel_(b) {
    const isReduce = String(b.direction || 'add') === 'reduce';
    const arrow = isReduce ? '\u2193' : '\u2191';
    const sign = isReduce ? '-' : '+';
    return arrow + ' ' + sign + fmtHours(b.total_hours) + 'h';
  }

  function wfm25GetSoftBookDirection_() {
    const reduceBtn = document.getElementById('wfm25SbDirReduce');
    return (reduceBtn && reduceBtn.classList.contains('on')) ? 'reduce' : 'add';
  }

  function wfm25SetSoftBookDirection_(direction) {
    const isReduce = direction === 'reduce';
    const addBtn = document.getElementById('wfm25SbDirAdd');
    const reduceBtn = document.getElementById('wfm25SbDirReduce');
    const title = document.getElementById('wfm25SoftBookTitle');
    const submitBtn = document.getElementById('wfm25SbAdd');
    if (addBtn) {
      addBtn.classList.toggle('on', !isReduce);
      addBtn.setAttribute('aria-pressed', !isReduce ? 'true' : 'false');
    }
    if (reduceBtn) {
      reduceBtn.classList.toggle('on', isReduce);
      reduceBtn.setAttribute('aria-pressed', isReduce ? 'true' : 'false');
    }
    if (title) title.textContent = 'Adjust hours';
    const reduceNote = document.getElementById('wfm25SbReduceNote');
    if (reduceNote) reduceNote.hidden = !isReduce;
    if (submitBtn) {
      submitBtn.textContent = isReduce ? 'Reduce to draft' : 'Add to draft';
    }
  }

  function showReductionClampWarnings_(warnings) {
    if (!warnings || !warnings.length) return;
    warnings.forEach(function (w) {
      const req = Number(w.requested_hours) || 0;
      const eff = Number(w.effective_hours) || 0;
      if (req > eff + 0.05) {
        let msg = 'Reduction for ' + (w.resource_name || 'worker') +
          ' clamped to ' + Math.round(eff) + 'h forward (requested ' + Math.round(req) + 'h).';
        msg += ' Current-quarter weeks are excluded.';
        toast(msg, 'warn');
      }
    });
    (State.softBookings || []).forEach(function (b) {
      if (String(b.direction || 'add') !== 'reduce') return;
      if (!reductionRangeSpansCurrentAndForward_(b.start_date, b.end_date)) return;
      const eff = getReductionClampEffectiveHours_(b.resource_name);
      if (eff != null && eff > 0.05 && Math.abs(eff - Number(b.total_hours)) <= 0.05) {
        toast('Reduction for ' + b.resource_name + ' applies ' + Math.round(eff) +
          'h to forward weeks only (current quarter excluded).', 'warn');
      }
    });
  }

  function getResourceTypeForWorker_(resourceName) {
    const resources = (State.ref && State.ref.resources) || [];
    const r = resources.find(function (x) { return x.name === resourceName; });
    return r ? (r.resource_type || '') : '';
  }

  function getSoftBookingForPerWorkerCommit_() {
    const bookings = State.softBookings || [];
    if (!bookings.length) return null;
    if (State.selectedResource) {
      const match = bookings.find(function (b) { return b.resource_name === State.selectedResource; });
      if (match) return match;
    }
    return bookings[0];
  }

  function hideSoftBookAssignFields_() {
    const field = $('#softBookWhatField');
    if (field) field.hidden = true;
    State.softBookCommitKey = null;
  }

  function populateSoftBookWhatSelect_() {
    const sel = $('#f_softbook_what');
    if (!sel) return;
    const opps = State.opportunities || [];
    const deps = State.deployments || [];
    let html = '<option value="">— Select opportunity or deployment —</option>';
    if (opps.length) {
      html += '<optgroup label="Opportunities">';
      opps.forEach(function (o) {
        const label = (o.account || o.account_name || '') + ' — ' + (o.opportunity_name || o.opportunity_id);
        html += '<option value="' + escapeHtml_(o.opportunity_id) + '" data-account="' +
          escapeHtml_(o.account || o.account_name || '') + '" data-name="' +
          escapeHtml_(o.opportunity_name || '') + '">' + escapeHtml_(label) + '</option>';
      });
      html += '</optgroup>';
    }
    if (deps.length) {
      html += '<optgroup label="Deployments">';
      deps.forEach(function (d) {
        const label = (d.account_name || d.account || '') + ' — ' + (d.deployment_name || d.deployment_id);
        html += '<option value="' + escapeHtml_(d.deployment_id) + '" data-account="' +
          escapeHtml_(d.account_name || d.account || '') + '" data-name="' +
          escapeHtml_(d.deployment_name || '') + '">' + escapeHtml_(label) + '</option>';
      });
      html += '</optgroup>';
    }
    sel.innerHTML = html;
  }

  function removeSoftBookCommitIfDone_() {
    const key = State.softBookCommitKey;
    if (!key) return false;
    const before = State.softBookings.length;
    State.softBookings = State.softBookings.filter(function (b) {
      return softBookCommitKey_(b) !== key;
    });
    State.softBookCommitKey = null;
    hideSoftBookAssignFields_();
    if (State.softBookings.length !== before) {
      onSoftBookingsChanged_();
      return true;
    }
    return false;
  }

  async function commitExplorerWorkerSoftBooking_() {
    const booking = getSoftBookingForPerWorkerCommit_();
    if (!booking) {
      toast('No pending soft booking to commit.', 'err');
      return;
    }
    await openAssignDrawerFromSoftBooking_(booking);
  }

  function getSoftBookLinkRecords_(whatType) {
    if (whatType === 'deployment') return State.deployments || [];
    return State.opportunities || [];
  }

  function formatSoftBookLinkLabel_(whatType, item) {
    if (!item) return '';
    if (whatType === 'deployment') {
      return (item.account_name || item.account || '') + ' — ' + (item.deployment_name || item.deployment_id || '');
    }
    return (item.account || item.account_name || '') + ' — ' + (item.opportunity_name || item.opportunity_id || '');
  }

  function getSoftBookLinkId_(whatType, item) {
    if (!item) return '';
    return whatType === 'deployment'
      ? String(item.deployment_id || '')
      : String(item.opportunity_id || '');
  }

  function filterSoftBookLinkRecords_(whatType, filterText) {
    const f = String(filterText || '').toLowerCase().trim();
    return getSoftBookLinkRecords_(whatType).filter(function (item) {
      const label = formatSoftBookLinkLabel_(whatType, item).toLowerCase();
      return !f || label.indexOf(f) >= 0;
    });
  }

  function populateSoftBookLinkSelect_(sel, whatType, filterText, selectedId) {
    if (!sel) return;
    const items = filterSoftBookLinkRecords_(whatType, filterText);
    let html = '<option value="">— Select —</option>';
    items.forEach(function (item) {
      const id = getSoftBookLinkId_(whatType, item);
      const label = formatSoftBookLinkLabel_(whatType, item);
      html += '<option value="' + escapeHtml_(id) + '">' + escapeHtml_(label) + '</option>';
    });
    sel.innerHTML = html;
    if (selectedId) sel.value = selectedId;
  }

  function syncSoftBookCommitRowWhatUi_(rowEl, row) {
    if (!rowEl || !row) return;
    const linkWrap = rowEl.querySelector('.sb-commit-link-wrap');
    const search = rowEl.querySelector('.sb-commit-search');
    const linkSel = rowEl.querySelector('.sb-commit-link');
    const labelInput = rowEl.querySelector('.sb-commit-label');
    const isLabel = row.whatType === 'label';
    if (linkWrap) linkWrap.hidden = isLabel;
    if (labelInput) {
      labelInput.hidden = !isLabel;
      labelInput.value = row.label || '';
    }
    if (!isLabel) {
      populateSoftBookLinkSelect_(linkSel, row.whatType, search ? search.value : '', row.linkId);
    }
    rowEl.querySelectorAll('.sb-commit-what-seg button').forEach(function (btn) {
      btn.classList.toggle('on', btn.dataset.val === row.whatType);
    });
  }

  function renderSoftBookCommitGrid_() {
    const body = $('#sbCommitGridBody');
    if (!body) return;
    const rows = State.softBookCommitDraft || [];
    body.innerHTML = rows.map(function (row, idx) {
      return '<tr class="sb-commit-row" data-idx="' + idx + '">' +
        '<td><button type="button" class="sb-commit-worker-link" data-worker="' +
          escapeHtml_(row.resource_name) + '">' + escapeHtml_(row.resource_name) + '</button></td>' +
        '<td class="muted">' + escapeHtml_(formatSoftBookSpan_(row)) + '</td>' +
        '<td class="num">' + escapeHtml_(softBookDirectionLabel_(row)) + '</td>' +
        '<td class="sb-commit-what-cell">' +
          '<div class="seg seg-sm sb-commit-what-seg">' +
            '<button type="button" data-val="deployment">Deployment</button>' +
            '<button type="button" data-val="opportunity" class="on">Opportunity</button>' +
            '<button type="button" data-val="label">Manual label</button>' +
          '</div>' +
          '<div class="sb-commit-link-wrap">' +
            '<input type="text" class="input sb-commit-search" placeholder="Filter…">' +
            '<select class="select sb-commit-link"></select>' +
          '</div>' +
          '<input type="text" class="input sb-commit-label" placeholder="Manual label text">' +
        '</td>' +
        '<td><button type="button" class="btn-ghost sb-commit-remove" aria-label="Remove row">\u2715</button></td>' +
      '</tr>';
    }).join('');

    $$('#sbCommitGridBody .sb-commit-row').forEach(function (rowEl) {
      const idx = Number(rowEl.dataset.idx);
      const row = State.softBookCommitDraft[idx];
      syncSoftBookCommitRowWhatUi_(rowEl, row);

      rowEl.querySelector('.sb-commit-worker-link')?.addEventListener('click', function () {
        selectExplorerResource_(row.resource_name);
      });
      rowEl.querySelectorAll('.sb-commit-what-seg button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          row.whatType = btn.dataset.val;
          row.linkId = '';
          row.label = '';
          syncSoftBookCommitRowWhatUi_(rowEl, row);
        });
      });
      const search = rowEl.querySelector('.sb-commit-search');
      const linkSel = rowEl.querySelector('.sb-commit-link');
      const labelInput = rowEl.querySelector('.sb-commit-label');
      if (search) {
        search.addEventListener('input', debounce_(function () {
          populateSoftBookLinkSelect_(linkSel, row.whatType, search.value, row.linkId);
        }, 150));
      }
      if (linkSel) {
        linkSel.addEventListener('change', function () {
          row.linkId = linkSel.value || '';
        });
      }
      if (labelInput) {
        labelInput.addEventListener('input', function () {
          row.label = labelInput.value;
        });
      }
      rowEl.querySelector('.sb-commit-remove')?.addEventListener('click', function () {
        State.softBookCommitDraft.splice(idx, 1);
        if (!State.softBookCommitDraft.length) {
          closeSoftBookCommitModal_();
        } else {
          renderSoftBookCommitGrid_();
        }
      });
    });
  }

  function syncSoftBookCommitApplyBar_() {
    const whatType = $$('#sbCommitApplyWhatSeg button').find(function (b) {
      return b.classList.contains('on');
    });
    const type = whatType ? whatType.dataset.val : 'opportunity';
    const isLabel = type === 'label';
    const search = $('#sbCommitApplySearch');
    const linkSel = $('#sbCommitApplyLink');
    const labelInput = $('#sbCommitApplyLabel');
    if (search) search.hidden = isLabel;
    if (linkSel) linkSel.hidden = isLabel;
    if (labelInput) labelInput.hidden = !isLabel;
    if (!isLabel) {
      populateSoftBookLinkSelect_(linkSel, type, search ? search.value : '', linkSel ? linkSel.value : '');
    }
  }

  function closeSoftBookCommitModal_() {
    const modal = $('#softBookCommitModal');
    if (modal) modal.hidden = true;
    State.softBookCommitDraft = null;
    const err = $('#sbCommitError');
    if (err) err.hidden = true;
  }

  async function openSoftBookCommitModal_() {
    const bookings = State.softBookings || [];
    if (!bookings.length) {
      toast('No pending soft bookings.', 'err');
      return;
    }
    if (!State.opportunities || !State.opportunities.length) {
      try { State.opportunities = await call('api_listOpportunities', {}); } catch (e) {}
    }
    if (!State.deployments || !State.deployments.length) {
      try { State.deployments = await call('api_listDeployments'); } catch (e) {}
    }
    State.softBookCommitDraft = bookings.map(function (b) {
      return {
        employee_id: b.employee_id || '',
        resource_name: b.resource_name,
        start_date: b.start_date,
        end_date: b.end_date,
        total_hours: b.total_hours,
        direction: b.direction || 'add',
        whatType: 'opportunity',
        linkId: '',
        label: ''
      };
    });
    const nameEl = $('#sbCommitScenarioName');
    if (nameEl) nameEl.value = '';
    $$('#sbCommitApplyWhatSeg button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.val === 'opportunity');
    });
    const applySearch = $('#sbCommitApplySearch');
    if (applySearch) applySearch.value = '';
    const applyLabel = $('#sbCommitApplyLabel');
    if (applyLabel) applyLabel.value = '';
    syncSoftBookCommitApplyBar_();
    renderSoftBookCommitGrid_();
    const modal = $('#softBookCommitModal');
    if (modal) modal.hidden = false;
  }

  function applySoftBookCommitWhatToAll_() {
    const whatBtn = $$('#sbCommitApplyWhatSeg button').find(function (b) {
      return b.classList.contains('on');
    });
    const whatType = whatBtn ? whatBtn.dataset.val : 'opportunity';
    const linkId = $('#sbCommitApplyLink') ? $('#sbCommitApplyLink').value : '';
    const label = $('#sbCommitApplyLabel') ? $('#sbCommitApplyLabel').value : '';
    (State.softBookCommitDraft || []).forEach(function (row) {
      row.whatType = whatType;
      row.linkId = whatType === 'label' ? '' : linkId;
      row.label = whatType === 'label' ? label : '';
    });
    renderSoftBookCommitGrid_();
  }

  async function submitSoftBookCommitAll_() {
    const errEl = $('#sbCommitError');
    if (errEl) { errEl.hidden = true; errEl.textContent = ''; }
    const scenarioName = ($('#sbCommitScenarioName') && $('#sbCommitScenarioName').value || '').trim();
    const draft = State.softBookCommitDraft || [];
    if (!draft.length) {
      if (errEl) { errEl.textContent = 'No bookings to commit.'; errEl.hidden = false; }
      return;
    }
    for (let i = 0; i < draft.length; i++) {
      const row = draft[i];
      if (row.whatType === 'label') {
        if (!String(row.label || '').trim()) {
          if (errEl) {
            errEl.textContent = 'Row ' + (i + 1) + ' (' + row.resource_name + '): enter a manual label.';
            errEl.hidden = false;
          }
          return;
        }
      } else if (!row.linkId) {
        if (errEl) {
          errEl.textContent = 'Row ' + (i + 1) + ' (' + row.resource_name + '): select a ' + row.whatType + '.';
          errEl.hidden = false;
        }
        return;
      }
    }
    const committedKeys = draft.map(function (r) {
      return softBookCommitKey_(r);
    });
    const bookings = draft.map(function (row) {
      const what = { type: row.whatType };
      if (row.whatType === 'opportunity') what.opportunity_id = row.linkId;
      else if (row.whatType === 'deployment') what.deployment_id = row.linkId;
      else if (row.whatType === 'label') what.label = String(row.label || '').trim();
      return {
        employee_id: row.employee_id,
        resource_name: row.resource_name,
        start_date: row.start_date,
        end_date: row.end_date,
        total_hours: row.total_hours,
        direction: row.direction || 'add',
        resource_type: getResourceTypeForWorker_(row.resource_name),
        what: what
      };
    });
    const btn = $('#sbCommitSubmitBtn');
    try {
      await withLoading_(btn, async function () {
        await call('api_commitSoftBookings', scenarioName, bookings);
      }, { label: 'Committing...' });
      State.softBookings = (State.softBookings || []).filter(function (b) {
        return committedKeys.indexOf(softBookCommitKey_(b)) < 0;
      });
      closeSoftBookCommitModal_();
      if (WFM25_SHELL) {
        renderExplorerSoftBookBasket_();
        State.explorerProjection = null;
        WFM25State.scorecardData = null;
        WFM25State.xorgForecastData = null;
        WFM25State.specialtyDemandData = null;
        WFM25State.specialtyActualsData = null;
        await wfm25AfterSoftBookCommitRefresh_();
      } else {
        onSoftBookingsChanged_();
        refreshExplorer_({ reason: 'softbook-commit-all' });
      }
      const toastMsg = scenarioName
        ? 'Committed ' + bookings.length + ' change(s) to scenario "' + scenarioName + '".'
        : 'Committed ' + bookings.length + ' change(s).';
      toast(toastMsg, 'ok');
    } catch (e) {
      if (errEl) {
        errEl.textContent = 'Submit failed: ' + (e.message || e);
        errEl.hidden = false;
      }
    }
  }

  function initSoftBookCommitModal_() {
    const modal = $('#softBookCommitModal');
    if (modal) {
      const titleEl = modal.querySelector('.drawer-title');
      if (titleEl) titleEl.textContent = 'Commit changes';
      const subtitleEl = titleEl && titleEl.parentElement
        ? titleEl.parentElement.querySelector('.muted')
        : null;
      if (subtitleEl) {
        subtitleEl.textContent = 'Promotes drafts to committed assignments (optionally grouped in a scenario)';
      }
    }
    const scenarioInput = $('#sbCommitScenarioName');
    if (scenarioInput) {
      scenarioInput.removeAttribute('required');
      scenarioInput.placeholder = 'e.g. Q3 capacity plan (optional)';
      const labelSpan = scenarioInput.closest('label') && scenarioInput.closest('label').querySelector('span');
      if (labelSpan) labelSpan.textContent = 'Scenario name (optional)';
    }

  function showExplorerProjectionPending_(show) {
    const el = $('#explorerImpactPending');
    const band = $('#explorerImpactBand');
    if (el) el.hidden = !show;
    if (band) band.classList.toggle('is-computing', !!show);

    showExplorerProjectionPending_(false);
    if (_explorerProjPendingTimer) {
      clearTimeout(_explorerProjPendingTimer);
      _explorerProjPendingTimer = null;
    }
  }

  function getImpactQuarterKey_() {
    const curQ = getExplorerCurQuarter_();
    const bookings = State.softBookings || [];
    if (!bookings.length) return curQ;
    const keys = {};
    bookings.forEach(function (b) {
      if (b.start_date) keys[fiscalQuarterKey_(new Date(b.start_date + 'T12:00:00'))] = true;
      if (b.end_date) keys[fiscalQuarterKey_(new Date(b.end_date + 'T12:00:00'))] = true;
    });
    if (keys[curQ]) return curQ;
    const sorted = Object.keys(keys).sort();
    return sorted[0] || curQ;
  }

  function renderImpactCompareHtml_(baseUtil, projUtil, approx) {
    const b = Number(baseUtil) || 0;
    const p = Number(projUtil) || 0;
    const arrow = p > b + 0.0001 ? '\u2191' : (p < b - 0.0001 ? '\u2193' : '\u2192');
    let html = '<span class="impact-baseline muted">' + fmtPct1(b) + '</span>' +
      '<span class="impact-arrow" aria-hidden="true">' + arrow + '</span>' +
      '<span class="impact-projected">' + fmtPct1(p) + '</span>';
    if (approx) {
      html += '<span class="explorer-approx-tag">approximate — holidays not yet set</span>';
    }
    return html;
  }

  function renderExplorerImpactBand_(data, opts) {
    opts = opts || {};
    if (opts.reqId != null && opts.reqId !== State.explorerProjectionReqId) return;
    const body = $('#explorerImpactBody');
    const band = $('#explorerImpactBand');
    const qLabel = $('#explorerImpactQuarter');
    if (!body || !band) return;
    if (!State.softBookings.length) {
      band.hidden = true;
      body.innerHTML = '';
      return;
    }
    band.hidden = false;
    const qk = getImpactQuarterKey_();
    if (qLabel) qLabel.textContent = qk;
    const base = data.baseline || {};
    const proj = data.projected || {};
    let html = '';

    const workerNames = {};
    State.softBookings.forEach(function (b) { workerNames[b.resource_name] = true; });
    html += '<div class="explorer-impact-section"><div class="explorer-impact-section-title">Worker</div>';
    Object.keys(workerNames).sort().forEach(function (name) {
      const bw = (base.worker || []).find(function (w) { return w.resourceName === name; });
      const pw = (proj.worker || []).find(function (w) { return w.resourceName === name; });
      const bq = bw && (bw.quarters || []).find(function (q) { return q.quarterKey === qk; });
      const pq = pw && (pw.quarters || []).find(function (q) { return q.quarterKey === qk; });
      if (!bq || !pq) return;
      html += '<div class="explorer-impact-row"><span class="explorer-impact-row-label">' +
        escapeHtml_(name) + '</span><span class="explorer-impact-row-values">' +
        renderImpactCompareHtml_(bq.icpUtil, pq.icpUtil, pq.approximate) + '</span></div>';
    });
    html += '</div>';

    const bt = (base.team && base.team.quarters || []).find(function (q) { return q.quarterKey === qk; });
    const pt = (proj.team && proj.team.quarters || []).find(function (q) { return q.quarterKey === qk; });
    if (bt && pt) {
      html += '<div class="explorer-impact-section"><div class="explorer-impact-section-title">Manager team</div>' +
        '<div class="explorer-impact-row"><span class="explorer-impact-row-label">All in scope</span>' +
        '<span class="explorer-impact-row-values">' +
        renderImpactCompareHtml_(bt.icpUtil, pt.icpUtil, pt.approximate) + '</span></div></div>';
    }

    if (opts.tier === 'full') {
      html += '<div class="explorer-impact-section explorer-impact-org"><div class="explorer-impact-section-title">Org team</div>';
      (base.orgTeams || []).forEach(function (ot) {
        const po = (proj.orgTeams || []).find(function (o) { return o.teamLabel === ot.teamLabel; });
        const bq = (ot.quarters || []).find(function (q) { return q.quarterKey === qk; });
        const pq = po && (po.quarters || []).find(function (q) { return q.quarterKey === qk; });
        if (!bq || !pq) return;
        html += '<div class="explorer-impact-row"><span class="explorer-impact-row-label">' +
          escapeHtml_(ot.teamLabel) + '</span><span class="explorer-impact-row-values">' +
          renderImpactCompareHtml_(bq.icpUtil, pq.icpUtil, pq.approximate) + '</span></div>';
      });
      html += '</div>';
    } else {
      html += '<div class="explorer-impact-section explorer-impact-org is-settling">' +
        '<div class="explorer-impact-section-title">Org team</div>' +
        '<div class="muted explorer-impact-settling">Settling…</div></div>';
    }

    body.innerHTML = html;
  }

  async function fetchExplorerProjection_() {
    if (!State.softBookings.length) {
      clearExplorerSoftBookings_('empty');
      return;
    }
    const reqId = ++State.explorerProjectionReqId;
    State.explorerImpactOrgReady = false;
    hideExplorerProjectionPending_();
    _explorerProjPendingTimer = setTimeout(function () {
      if (reqId === State.explorerProjectionReqId) showExplorerProjectionPending_(true);
    }, 350);

    const band = $('#explorerImpactBand');
    if (band) band.hidden = false;

    try {
      const result = await call('api_projectSoftBookings', buildServerParams_(), State.softBookings);
      if (reqId !== State.explorerProjectionReqId) return;
      hideExplorerProjectionPending_();
      State.explorerProjection = result;
      showReductionClampWarnings_(result.clampWarnings);
      renderExplorerImpactBand_(result, { tier: 'fast', reqId: reqId });
      setTimeout(function () {
        if (reqId !== State.explorerProjectionReqId) return;
        State.explorerImpactOrgReady = true;
        renderExplorerImpactBand_(result, { tier: 'full', reqId: reqId });
      }, 120);
    } catch (err) {
      if (reqId !== State.explorerProjectionReqId) return;
      hideExplorerProjectionPending_();
      toast('Projection failed: ' + err.message, 'err');
    }
  }

  const scheduleExplorerProjection_ = debounce_(fetchExplorerProjection_, 300);

  function getFilteredExplorerResources_() {
    const search = ($('#resourceSearch') && $('#resourceSearch').value || '').toLowerCase();
    const resources = (State.ref && State.ref.resources) || [];
    const f = State.filters;
    const managerDescendants = (State.ref && State.ref.managerDescendants) || {};
    let effectiveManagers = null;
    if (f.managers && f.managers.length && !f.teamLabel) {
      effectiveManagers = {};
      const selected = f.managers[0];
      effectiveManagers[selected] = true;
      if (f.includeMyManagers && managerDescendants[selected]) {
        managerDescendants[selected].forEach(function (m) { effectiveManagers[m] = true; });
      }
    }

    function workerInScope_(wc) {
      const cls = String(wc || '');
      const scope = String(f.workerScope || 'All');
      switch (scope) {
        case 'SLG':         return cls === 'SLG_Real' || cls === 'SLG_Generic';
        case 'NonSLG':      return cls === 'External_NonSLG';
        case 'Partners':    return cls === 'External_Contractor';
        case 'WorkdayOnly': return cls === 'SLG_Real' || cls === 'SLG_Generic' || cls === 'External_NonSLG';
        case 'All':
        case 'Both':        return cls === 'SLG_Real' || cls === 'SLG_Generic' || cls === 'External_NonSLG' || cls === 'External_Contractor';
        case 'External':    return cls === 'External_NonSLG' || cls === 'External_Contractor';
        default:            return false;
      }
    }

    return resources.filter(function (r) {
      if (search && r.name.toLowerCase().indexOf(search) < 0) return false;
      if (!workerInScope_(r.worker_class)) return false;
      if (f.teamLabel) return r.resolvedTeam === f.teamLabel;
      if (effectiveManagers && !effectiveManagers[r.manager_org]) return false;
      return true;
    });
  }

  /**
   * Drop stale Explorer detail selection when the worker is no longer in the
   * filtered roster (e.g. Team filter changed).
   * @return {boolean} true if selection was cleared
   */
  function revalidateExplorerSelection_() {
    const selected = State.selectedResource;
    if (!selected) return false;
    const inScope = getFilteredExplorerResources_().some(function (r) {
      return r.name === selected;
    });
    if (inScope) return false;
    State.explorerReqId++;
    _hidePlanningCard_();
    return true;
  }

    if (grid) grid.classList.toggle('explorer-list-collapsed', collapsed);

  function updateExplorerWorkerPicker_() {
    const picker = $('#explorerWorkerPicker');
    if (!picker) return;
    const filtered = getFilteredExplorerResources_();

    picker.innerHTML = '<option value="">Select a worker…</option>' +

      _hidePlanningCard_();

  function explorerStepWorker_(delta) {
    const names = getFilteredExplorerResources_().map(function (r) { return r.name; });
    const idx = names.indexOf(State.selectedResource);
    if (idx < 0) return;
    const next = names[idx + delta];

  function renderExplorerWeeklyStrip_(weeks, projection, workerName) {
    if (!weeks || !weeks.length) {
      return '<div class="explorer-section"><div class="explorer-section-head">' +
        '<div class="explorer-section-title">Weekly Capacity (all dates are week ending)</div>' +
        '</div><div class="muted">No weeks in scope.</div></div>';
    }
    const hasDraft = State.softBookings && State.softBookings.length && projection && workerName;
    const projWeeks = hasDraft ? wfm25ProjectionWeeks_(projection, workerName, true) : null;
    const baseWeeks = hasDraft ? wfm25ProjectionWeeks_(projection, workerName, false) : null;
    const showDraft = hasDraft && projWeeks && projWeeks.length;
    let seamWeekKey = '';
    weeks.forEach(function (w) { if (w.isActual) seamWeekKey = w.weekKey; });
    let seamIdx = -1;
    weeks.forEach(function (w, idx) { if (w.weekKey === seamWeekKey) seamIdx = idx; });
    const seamColIdx = seamIdx >= 0 ? seamIdx + 1 : -1;
    const actualSpan = seamColIdx >= 0 ? seamColIdx : 0;
    const forecastSpan = seamColIdx >= 0 ? weeks.length - seamColIdx : weeks.length;

    let html = '<div class="explorer-section"><div class="explorer-section-head">' +
      '<div class="explorer-section-title">Weekly Capacity (all dates are week ending)</div>' +
      '</div><div class="explorer-weekly-scroll"><table class="data-table explorer-weekly-table"><thead>';
    if (seamWeekKey && seamColIdx > 0) {
      html += '<tr class="wf-zone-header">' +
        (actualSpan ? '<th class="wf-zone-actual" colspan="' + actualSpan + '">actual</th>' : '') +
        (forecastSpan ? '<th class="wf-zone-forecast" colspan="' + forecastSpan + '">forecast</th>' : '') +
        '</tr>';
    }
    html += '<tr>';
    weeks.forEach(function (w, idx) {
      const seamCls = idx === seamIdx ? ' wf-seam-divider' : '';
      const zoneTag = seamColIdx >= 0
        ? (idx < seamColIdx ? '<span class="wf-header-tag">actual</span>' : '<span class="wf-header-tag">forecast</span>')
        : '';
      html += '<th class="wf-col-week' + seamCls + '">' + escapeHtml_(w.label) +
        (w.fiscalQuarter ? ' · ' + escapeHtml_(w.fiscalQuarter) : '') +
        (zoneTag ? '<br>' + zoneTag : '') + '</th>';
    });
    html += '</tr></thead><tbody><tr>';
    weeks.forEach(function (cell, idx) {
      const seamCls = idx === seamIdx ? ' wf-seam-divider' : '';
      const forecastCls = cell.isActual ? '' : ' wf-cell-forecast';
      if (showDraft && !cell.isActual) {
        const pw = projWeeks.find(function (w) { return w.weekKey === cell.weekKey; });
        if (pw) {
          const bw = baseWeeks
            ? (baseWeeks.find(function (w) { return w.weekKey === cell.weekKey; }) || cell)
            : cell;
          const baseHours = Number(bw.hours) || 0;
          const projHours = Number(pw.hours) || 0;
          const baseUtil = Number(bw.icpUtil != null ? bw.icpUtil : cell.icpUtil) || 0;
          const projUtil = Number(pw.icpUtil) || 0;
          const arrow = wfm25DraftArrow_(baseUtil, projUtil);
          const tip = [
            (State.selectedResource || workerName || '') + ' · ' + cell.label,
            'Forecast',
            'Committed: ' + Math.round(baseHours) + 'h (' + fmtPct(baseUtil) + ')',
            'Your draft: ' + Math.round(projHours) + 'h (' + fmtPct(projUtil) + ')',
            'ICP available: ' + Math.round(pw.icpAvailable || cell.icpAvailable) + 'h'
          ].join('\n');
          html += '<td class="wf-col-week wf-cell has-draft' + seamCls + forecastCls + '" title="' +
            escapeHtml_(tip) + '">' +
            '<div class="wfm25-worker-qstrip-committed">' + Math.round(baseHours) + 'h</div>' +
            '<div class="wfm25-draft-label">Your draft</div>' +
            '<div class="wfm25-worker-qstrip-draft">' + Math.round(baseHours) + ' \u2192 ' +
              Math.round(projHours) + 'h ' + arrow + '</div></td>';
          return;
        }
      }
      const color = cellColor(cell.icpUtil, cell.icpTarget);
      const rawCap = Number(cell.icpAvailable || 0) + Number(cell.holidayHours || 0);
      const holidayNote = cell.holidayHours
        ? ' (raw ' + Math.round(rawCap) + 'h − ' + Math.round(cell.holidayHours) + 'h holiday)'
        : '';
      const actualLabel = cell.isActual ? 'Actual' : 'Forecast';
      const title = [
        (State.selectedResource || workerName || '') + ' · ' + cell.label,
        actualLabel,
        'Hours: ' + Math.round(cell.hours) + 'h',
        'ICP available: ' + Math.round(cell.icpAvailable) + 'h' + holidayNote,
        'ICP utilization: ' + fmtPct(cell.icpUtil),
        'ICP target: ' + fmtPct(cell.icpTarget),
        'Finance utilization: ' + fmtPct(cell.financeUtil)
      ].join('\n');
      html += '<td class="wf-col-week wf-cell' + seamCls + forecastCls + '" style="background:' +
        color.bg + ';color:' + color.fg + '" title="' + escapeHtml_(title) + '">' +
        Math.round(cell.hours) + '</td>';
    });
    html += '</tr></tbody></table></div></div>';
    return html;
  }

  /**
   * Three-quarter planning scorecard (Explorer + WFM.25 worker panel).
   * @param {Array} quarters
   * @param {number} icpTarget
   * @param {Object|null} [projection] api_projectSoftBookings result (WFM.25 draft overlay)
   * @param {string} [workerName] resource name for projection lookup
   */
  function renderExplorerQuarterSection_(quarters, icpTarget, projection, workerName, scorecardOpts) {
    const opts = scorecardOpts || {};
    const metric = opts.lockIcpView ? 'icp' : ExplorerQuarterState.metric;
    const hasDraft = State.softBookings && State.softBookings.length && projection && workerName;
    let cells = (quarters || []).map(function (q) {
      const curTag = q.isCurrentQuarter ? ' <span class="qs-cur-tag">current</span>' : '';
      if (metric === 'bonus') {
        if (!q.targetHours) {
          return '<td class="qs-cell qs-cell-neutral" title="No target">—</td>';
        }
        const color = utilBandColor_(q.bonusAttainment);
        const tip = [
          'Projected/productive: ' + q.productiveHours.toFixed(1) + 'h',
          'Quarter target: ' + q.targetHours.toFixed(1) + 'h',
          'Tracking: ' + (q.trackingHours >= 0 ? '+' : '') + q.trackingHours.toFixed(1) + 'h',
          'Bonus attainment: ' + fmtPct(q.bonusAttainment)
        ].join('\n');
        return '<td class="qs-cell" style="background:' + color.bg + ';color:' + color.fg + '" title="' +
          escapeHtml_(tip) + '">' + fmtPct(q.bonusAttainment) + '</td>';
      }
      const qk = q.quarterKey;
      let baseUtil = q.icpUtil;
      const projUtil = hasDraft
        ? wfm25ProjectionUtil_(projection, 'worker', workerName, qk, true)
        : null;
      if (hasDraft && projUtil != null) {
        const projBase = wfm25ProjectionUtil_(projection, 'worker', workerName, qk, false);
        if (projBase != null) baseUtil = projBase;
      }
      if (!hasDraft || projUtil == null) {
        const color = utilBandColor_(wfm25QuarterIcpColorRatio_(q, icpTarget));
        const tip = [
          'Productive: ' + q.productiveHours.toFixed(1) + 'h',
          'ICP available: ' + q.icpAvailableHours.toFixed(1) + 'h',
          'ICP target: ' + fmtPct(icpTarget),
          'Ratio to target: ' + (q.ratioToTarget * 100).toFixed(1) + '%',
          'Tracking: ' + (q.trackingHours >= 0 ? '+' : '') + q.trackingHours.toFixed(1) + 'h'
        ].join('\n');
        return '<td class="qs-cell" style="background:' + color.bg + ';color:' + color.fg + '" title="' +
          escapeHtml_(tip) + '">' + fmtPct(q.icpUtil) + '</td>';
      }
      const arrow = wfm25DraftArrow_(baseUtil, projUtil);
      const tip = [
        'Committed: ' + fmtPct(baseUtil),
        'Your draft: ' + fmtPct(projUtil),
        'Productive: ' + q.productiveHours.toFixed(1) + 'h',
        'ICP available: ' + q.icpAvailableHours.toFixed(1) + 'h',
        'ICP target: ' + fmtPct(icpTarget),
        'Tracking: ' + (q.trackingHours >= 0 ? '+' : '') + q.trackingHours.toFixed(1) + 'h'
      ].join('\n');
      return '<td class="qs-cell has-draft" title="' + escapeHtml_(tip) + '">' +
        '<div class="wfm25-worker-qstrip-committed">' + fmtPct(baseUtil) + '</div>' +
        '<div class="wfm25-draft-label">Your draft</div>' +
        '<div class="wfm25-worker-qstrip-draft">' + fmtPct(baseUtil) +
          ' \u2192 ' + fmtPct(projUtil) + ' ' + arrow + '</div></td>';
    }).join('');

    const headerCells = (quarters || []).map(function (q) {
      const curTag = q.isCurrentQuarter ? ' <span class="qs-cur-tag">current</span>' : '';
      return '<th class="qs-col-quarter">' + escapeHtml_(q.quarterLabel || q.quarterKey) + curTag + '</th>';
    }).join('');

    let metricControl;
    if (opts.lockIcpView) {
      // WFM.25 Stage 4: Bonus Attainment intentionally hidden pending keep/cut decision (Stage 6).
      // Calculation/render path for bonus remains; only the toggle is suppressed and ICP is locked.
      metricControl = '<span class="wfm25-scorecard-view-label">ICP Utilization</span>';
    } else {
      const activeIcp = metric === 'icp' ? ' active' : '';
      const activeBonus = metric === 'bonus' ? ' active' : '';
      metricControl =
        '<div class="metric-toggle" id="explorerQsMetricToggle">' +
          '<button type="button" class="btn-toggle' + activeIcp + '" data-metric="icp">ICP Utilization</button>' +
          '<button type="button" class="btn-toggle' + activeBonus + '" data-metric="bonus">Bonus Attainment</button>' +
        '</div>';
    }

    return '<div class="explorer-section explorer-quarter-section">' +
      '<div class="explorer-section-head">' +
        '<div class="explorer-section-title">Three-quarter planning scorecard</div>' +
        metricControl + '</div>' +
      '<div class="explorer-quarter-scroll"><table class="data-table quarterly-scorecard-table explorer-quarter-table">' +
        '<thead><tr>' + headerCells + '</tr></thead>' +
        '<tbody><tr>' + cells + '</tr></tbody></table></div></div>';
  }

  function renderExplorerProjectsSection_(projects, weeks) {
    const worker = State.selectedResource || '';
    const isOpen = ExplorerProjectState.expanded.has(worker);
    let html = '<div class="explorer-section explorer-projects-section">' +
      '<div class="explorer-section-head">' +
        '<button type="button" class="wf-expand-toggle explorer-projects-toggle" aria-expanded="' + isOpen + '">' +
          '<span class="wf-expand-chev">' + (isOpen ? '▾' : '▸') + '</span> Projects</button>' +
      '</div>';
    if (!isOpen) {
      html += '<div class="muted explorer-projects-collapsed">Expand to view week-keyed project hours.</div>';
    } else if (!projects || !projects.length) {
      html += '<div class="muted">No project hours in scope.</div>';
    } else {
      html += '<div class="explorer-weekly-scroll"><table class="data-table explorer-weekly-table"><thead><tr>' +
        '<th class="explorer-project-col">Project</th>';
      (weeks || []).forEach(function (w) {
        html += '<th class="wf-col-week">' + escapeHtml_(w.label) + '</th>';
      });
      html += '</tr></thead><tbody>';
      projects.forEach(function (p) {
        const projByKey = {};
        (p.weekly || []).forEach(function (w) { projByKey[w.weekKey] = w; });
        html += '<tr><td class="wf-project-name explorer-project-col">↳ ' + escapeHtml_(p.project) + '</td>';
        (weeks || []).forEach(function (w) {
          const cell = projByKey[w.weekKey];
          const hrs = cell ? Math.round(cell.hours) : 0;
          html += '<td class="wf-col-week wf-cell-project">' + (hrs || '—') + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';
    return html;
  }

  function renderExplorerDetailPane_(detail) {
    const pane = $('#explorerDetailPane');
    if (!pane) return;
    if (!detail || !detail.found) {
      pane.innerHTML = '<div class="muted explorer-empty-msg">This worker is not in the current filter scope.</div>';
      return;
    }
    const meta = (State.ref && State.ref.resources || []).find(function (r) {
      return r.name === detail.resource;
    }) || {};
    const icpTarget = (detail.weeks && detail.weeks[0]) ? detail.weeks[0].icpTarget : 0.72;
    const html =
      renderExplorerSummaryStrip_(detail, meta) +
      renderExplorerWeeklyStrip_(detail.weeks || []) +
      renderExplorerQuarterSection_(detail.quarters || [], icpTarget) +
      renderExplorerProjectsSection_(detail.projects || [], detail.weeks || []);
    pane.innerHTML = html;

    const toggle = $('#explorerQsMetricToggle');
    if (toggle) {
      toggle.querySelectorAll('.btn-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          ExplorerQuarterState.metric = btn.dataset.metric || 'icp';
          renderExplorerDetailPane_(State.selectedResourceDetail);
        });
      });
    }
    const projToggle = pane.querySelector('.explorer-projects-toggle');
    if (projToggle) {
      projToggle.addEventListener('click', function () {
        const w = State.selectedResource || '';
        if (ExplorerProjectState.expanded.has(w)) ExplorerProjectState.expanded.delete(w);
        else ExplorerProjectState.expanded.add(w);
        renderExplorerDetailPane_(State.selectedResourceDetail);
      });
    }
  }

  function renderExplorerResourceHeader_(name, detail) {
    const meta = (State.ref && State.ref.resources || []).find(function (r) { return r.name === name; });
    const title = $('#resourceTitle');
    const sub = $('#resourceSub');
    if (title) title.textContent = name || 'Select a resource';
    if (sub) {
      if (!meta) {
        sub.textContent = '';
      } else {
        const parts = [
          meta.job_profile || meta.level || '',
          meta.manager_org || '—',
          meta.resolvedTeam || meta.icp || '—'
        ].filter(Boolean);
        sub.textContent = parts.join(' · ');
      }
    }
  }

  const EXPLORER_LOAD_MIN_MS = 350;

  function explorerLoadingHtml_(compact) {
    const compactCls = compact ? ' explorer-loading-compact' : '';
    return '<div class="explorer-loading' + compactCls + '" role="status" aria-live="polite">' +
      '<div class="explorer-loading-spinner" aria-hidden="true"></div>' +
      '<div class="explorer-loading-label">Loading worker…</div>' +
      '</div>';
  }

  /**
   * Show unified Explorer loading state across detail, Planning, and (when
   * expanded) the worker list. Returns timestamp for minimum-display timing.
   * @return {number}
   */
  function showExplorerSkeleton_() {
    const loadingHtml = explorerLoadingHtml_(false);
    const listLoadingHtml = explorerLoadingHtml_(true);

    const pane = $('#explorerDetailPane');
    if (pane) pane.innerHTML = loadingHtml;

    const list = $('#resourceList');
    if (list && !State.explorerListCollapsed) {
      list.innerHTML = listLoadingHtml;
    }

    // Planning card: clear stale content and show unified loading
    State.workerPlanning = null;
    const planCard = $('#workerPlanningCard');
    if (planCard) {
      planCard.hidden = false;
      const nameEl = $('#planningWorkerName');
      if (nameEl) nameEl.textContent = '…';
      const sub = $('#planningSubtitle');
      if (sub) sub.textContent = '';
      const footer = $('#planningFooter');
      if (footer) footer.hidden = true;
      const body = $('#workerPlanningBody');
      if (body) {
        body.innerHTML = '<tr><td colspan="8" class="explorer-loading-planning-cell">' +
          loadingHtml + '</td></tr>';
      }
    }

    return Date.now();
  }

  /**
   * Defer paint until minimum load duration elapses; stale reqId never paints.
   * @param {number} loadShownAt
   * @param {number} reqId
   * @param {function(): void} paintFn
   */
  function explorerDeferPaint_(loadShownAt, reqId, paintFn) {
    const waitMs = Math.max(0, EXPLORER_LOAD_MIN_MS - (Date.now() - loadShownAt));
    const run = function () {
      if (reqId !== State.explorerReqId) return;
      paintFn();
    };
    if (waitMs > 0) setTimeout(run, waitMs);
    else run();
  }

  /**
   * Single orchestrator for Explorer roster + detail refresh.
   * Shows unified skeleton, fetches once, paints detail atomically.
   * @param {{ reason?: string }} opts
   */
  async function refreshExplorer_({ reason } = {}) {
    if (State.currentView !== 'explorer') return;

    revalidateExplorerSelection_();

    const reqId = ++State.explorerReqId;
    const resource = State.selectedResource;

    if (!resource) {
      renderResourceList();
      const pane = $('#explorerDetailPane');
      if (pane) {
        pane.innerHTML = '<div class="muted explorer-empty-msg">Select a resource to view capacity detail.</div>';
      }
      State.workerPlanning = null;
      const planCard = $('#workerPlanningCard');
      if (planCard) planCard.hidden = true;
      return;
    }

    const loadShownAt = showExplorerSkeleton_();
    updateExplorerLayout_();
    updateExplorerWorkerPicker_();

    try {
      const [detail, planningRows, planningSummary] = await Promise.all([
        call('api_getResourceDetailV2', buildServerParams_({ resource: resource })),
        call('api_getWorkerPlanning', resource, {}),
        call('api_getWorkerPlanningSummary', resource)
      ]);
      if (reqId !== State.explorerReqId) return;

      explorerDeferPaint_(loadShownAt, reqId, function () {
        State.selectedResourceDetail = detail;
        if (State.charts.resource) {
          State.charts.resource.destroy();
          State.charts.resource = null;
        }
        renderResourceList();
        renderExplorerResourceHeader_(resource, detail);
        const adjustBtn = $('#adjustHoursBtn');
        if (adjustBtn) {
          adjustBtn.hidden = !detail.found;
          adjustBtn.onclick = function () { openAdjustHoursDrawer_(null, resource); };
        }
        renderExplorerDetailPane_(detail);
        if (detail.found) {
          applyWorkerPlanning_(resource, planningRows, planningSummary);
        } else {
          State.workerPlanning = null;
          const planCard = $('#workerPlanningCard');
          if (planCard) planCard.hidden = true;
        }
      });
    } catch (err) {
      if (reqId !== State.explorerReqId) return;
      explorerDeferPaint_(loadShownAt, reqId, function () {
        State.selectedResourceDetail = null;
        State.workerPlanning = null;
        const planCard = $('#workerPlanningCard');
        if (planCard) planCard.hidden = true;
        renderResourceList();
        const pane = $('#explorerDetailPane');
        if (pane) {
          pane.innerHTML = '<div class="muted explorer-empty-msg" style="color:var(--thumbtack)">Failed to load: ' +
            escapeHtml_(err.message || String(err)) + '</div>';
        }
        toast('Resource detail failed: ' + err.message, 'err');
      });
    }
  }

  (function initExplorerControls_() {
    const listToggle = $('#explorerListToggle');
    if (listToggle) {
      listToggle.addEventListener('click', function () {
        State.explorerListCollapsed = !State.explorerListCollapsed;
        updateExplorerLayout_();
        refreshExplorer_({ reason: 'layout' });
      });
    }
    const picker = $('#explorerWorkerPicker');
    if (picker) {
      picker.addEventListener('change', function () {
        if (picker.value) selectExplorerResource_(picker.value);
      });
    }
    const prevBtn = $('#explorerPrevWorker');
    if (prevBtn) prevBtn.addEventListener('click', function () { explorerStepWorker_(-1); });
    const nextBtn = $('#explorerNextWorker');
    if (nextBtn) nextBtn.addEventListener('click', function () { explorerStepWorker_(1); });

    const sbCancel = $('#sbPopoverCancel');
    if (sbCancel) sbCancel.addEventListener('click', closeSoftBookPopover_);
    const sbAdd = $('#sbPopoverAdd');
    if (sbAdd) sbAdd.addEventListener('click', addSoftBookingFromPopover_);
    const sbHours = $('#sbPopoverHours');
    if (sbHours) {
      sbHours.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addSoftBookingFromPopover_();
      });
    }
    const sbEnd = $('#sbPopoverEnd');
    if (sbEnd) {
      sbEnd.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addSoftBookingFromPopover_();
      });
    }
    const basketWipe = $('#explorerBasketWipe');
    if (basketWipe) {
      basketWipe.addEventListener('click', function () {
        clearExplorerSoftBookings_('wipe');
      });
    }
    const commitW = $('#explorerCommitWorker');
    if (commitW) commitW.addEventListener('click', commitExplorerWorkerSoftBooking_);
    const commitAll = $('#explorerCommitAll');
    if (commitAll) commitAll.addEventListener('click', openSoftBookCommitModal_);

    document.addEventListener('click', function (e) {
      const pop = $('#explorerSoftBookPopover');
      if (!pop || pop.hidden) return;
      if (pop.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.explorer-softbook-btn')) return;
      closeSoftBookPopover_();
    });

    updateExplorerLayout_();
    initSoftBookCommitModal_();
  })();

  async function loadProjectAllocationCard_(resourceName, monthKey) {
    const card  = $('#projectAllocationCard');
    const title = $('#projectAllocationTitle');
    const sub   = $('#projectAllocationSub');
    const body  = $('#projectAllocationBody');
    const total = $('#projectAllocationTotal');

    title.textContent = 'Project Allocation \u2014 ' + fmtMonth(monthKey);
    sub.textContent   = 'Billable hours \u00b7 ' + resourceName;
    body.innerHTML    = '<tr><td colspan="3" class="muted" style="padding:12px">Loading\u2026</td></tr>';
    total.textContent = '\u2014';
    card.hidden = false;

    try {
      const result = await call('api_getWorkerBillableByAccount', {
        resource_name: resourceName,
        monthKey: monthKey
      });
      if (!result.rows || result.rows.length === 0) {
        body.innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">No billable allocations.</td></tr>';
        total.textContent = '0h';
      } else {
        body.innerHTML = result.rows.map(function (r) {
          const hasAdj = !!(r.adjustment);
          const badge  = hasAdj
            ? '<span class="badge amber" title="' + escapeHtml_(r.adjustment.reason) + '" style="margin-left:6px;font-size:10px;">adjusted</span>'
            : '';
          const adjIdsJson = hasAdj ? escapeHtml_(JSON.stringify(r.adjustment.adjustment_ids || [])) : '[]';
          const clearBtn = hasAdj
            ? '<button class="btn-ghost row-btn danger" data-pa-clear' +
                ' data-account="' + escapeHtml_(r.account_name) + '"' +
                ' data-worker="' + escapeHtml_(resourceName) + '"' +
                ' data-month="' + escapeHtml_(monthKey) + '"' +
                ' data-direction="' + escapeHtml_(r.adjustment.direction || 'reduce') + '"' +
                ' data-magnitude="' + escapeHtml_(String(Math.round(r.adjustment.magnitude || 0))) + '"' +
                ' data-adjustment-ids="' + adjIdsJson + '"' +
                ' style="margin-left:4px;">Clear</button>'
            : '';
          return '<tr>' +
            '<td>' + escapeHtml_(r.account_name) + badge + '</td>' +
            '<td class="num">' + fmtHours(r.hours) + 'h</td>' +
            '<td>' +
              '<button class="btn-ghost row-btn" data-pa-edit' +
                ' data-account="' + escapeHtml_(r.account_name) + '"' +
                ' data-worker="' + escapeHtml_(resourceName) + '"' +
                ' data-month="' + escapeHtml_(monthKey) + '">Edit</button>' +
              clearBtn +
            '</td>' +
            '</tr>';
        }).join('');
        total.textContent = fmtHours(result.totalHours) + 'h';

        // Wire Edit button click handlers
        $$('#projectAllocationBody [data-pa-edit]').forEach(function (btn) {
          btn.addEventListener('click', async function (e) {
            e.stopPropagation();
            const accountName = btn.dataset.account;
            const workerName  = btn.dataset.worker;
            const mk          = btn.dataset.month;
            try {
              const deployments = await call('api_getDeploymentsForWorkerAccount', {
                resource_name: workerName,
                account_name:  accountName,
                monthKey:      mk
              });
              if (!deployments || !deployments.length) {
                toast('No matching deployment found for this allocation.', 'err');
                return;
              }
              openQuickAdjustModal_({ workerName: workerName, accountName: accountName, monthKey: mk, deployments: deployments });
            } catch (err) {
              toast('Failed to load deployments: ' + err.message, 'err');
            }
          });
        });

        // Wire Clear button click handlers
        $$('#projectAllocationBody [data-pa-clear]').forEach(function (btn) {
          btn.addEventListener('click', async function (e) {
            e.stopPropagation();
            const accountName   = btn.dataset.account;
            const workerName    = btn.dataset.worker;
            const mk            = btn.dataset.month;
            const direction     = btn.dataset.direction || 'reduce';
            const magnitude     = Number(btn.dataset.magnitude) || 0;
            const adjIds        = JSON.parse(btn.dataset.adjustmentIds || '[]');

            const verb = direction === 'add' ? 'added' : 'reduced';
            const bodyText = 'This will remove the adjustment of ' + magnitude + 'h ' + verb +
              ' for ' + workerName + ' on ' + accountName + ' in ' + fmtMonth(mk) +
              '. The Project Allocation will revert to PSA\u2019s reported value.';

            const ok = await confirmAction_({
              title:        'Clear adjustment?',
              body:         bodyText,
              confirmLabel: 'Clear',
              confirmStyle: 'danger',
              asyncHandler: async function () {
                for (var i = 0; i < adjIds.length; i++) {
                  await call('api_deleteCapacityAdjustment', adjIds[i]);
                }
              }
            });
            if (ok) {
              toast('Adjustment cleared', 'ok');
              refreshExplorerSurfaces_(workerName);
            }
          });
        });
      }
    } catch (err) {
      body.innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">Failed to load.</td></tr>';
    }
  }

  // Alias kept for backward compat within this session
  var showProjectAllocationCard_ = loadProjectAllocationCard_;

  $('#projectAllocationClose')?.addEventListener('click', function() {
    State.projectAllocation = null;
    $('#projectAllocationCard').hidden = true;
  });
</script>

<script>
  // ============================================================
  // Pipeline / Deployments / Scenarios
  // ============================================================
  async function loadOpportunities() {
    try {
      State.opportunities = await call('api_listOpportunities', {
        segment: $('#segmentFilter').value || '',
        stageMin: $('#stageFilter').value || '',
        search: $('#oppSearch').value || ''
      });
      renderOpportunities_();
    } catch (err) {
      toast('Pipeline load failed: ' + err.message, 'err');
    }
  }
  ['#segmentFilter', '#stageFilter'].forEach(sel => {
    const el = $(sel);
    if (el) el.addEventListener('change', loadOpportunities);
  });
  const _oppSearchEl = $('#oppSearch');
  if (_oppSearchEl) _oppSearchEl.addEventListener('input', debounce_(loadOpportunities, 200));

  function _renderCellWithOverride_(row, fieldName, displayValue) {
    if (!row._overrides) return escapeHtml_(String(displayValue == null ? '—' : displayValue));
    const ov = row._overrides.find(function (o) { return o.field === fieldName; });
    if (!ov) return escapeHtml_(String(displayValue == null ? '—' : displayValue));
    const tooltipParts = [
      'Original: ' + ov.original_value,
      'Reason: ' + ov.reason,
      'By: ' + ov.created_by
    ];
    if (ov.expires_at) tooltipParts.push('Expires: ' + ov.expires_at.slice(0, 10));
    const title = tooltipParts.join('\n');
    return '<span class="override-badge" title="' + escapeHtml_(title) + '">' +
      escapeHtml_(String(displayValue == null ? '—' : displayValue)) +
      '<span class="override-dot" aria-label="overridden"></span>' +
      '</span>';
  }

  function renderOpportunities_() {
    const body = $('#oppBody');
    body.innerHTML = State.opportunities.map(o => `
      <tr>
        <td>${escapeHtml_(o.opportunity_name)}</td>
        <td>${escapeHtml_(o.account)}</td>
        <td>${_renderCellWithOverride_(o, 'segment', o.segment || '—')}</td>
        <td>${_renderCellWithOverride_(o, 'stage', o.stage)}</td>
        <td class="num">${_renderCellWithOverride_(o, 'probability', fmtPct(o.probability / 100))}</td>
        <td class="num">${_renderCellWithOverride_(o, 'acv', fmtMoney(o.acv))}</td>
        <td>${_renderCellWithOverride_(o, 'expected_start', fmtDate(o.expected_start))}</td>
        <td>${_renderCellWithOverride_(o, 'expected_end', fmtDate(o.expected_end))}</td>
        <td class="num">${_renderCellWithOverride_(o, 'ee_count', o.ee_count || '—')}</td>
        <td>
          <button class="btn-ghost row-btn" data-opp="${o.opportunity_id}">Assign</button>
          <button class="btn-ghost row-btn" data-edit-opp="${escapeHtml_(o.opportunity_id)}" style="margin-left:4px;">Edit</button>
        </td>
      </tr>
    `).join('');

    $$('#oppBody button[data-opp]').forEach(btn => {
      btn.addEventListener('click', () => openAssignDrawer_(btn.dataset.opp));
    });
    $$('#oppBody button[data-edit-opp]').forEach(btn => {
      btn.addEventListener('click', () => openOverrideDrawer_('Pipeline', btn.dataset.editOpp));
    });
  }

  async function loadDeployments() {
    try {
      State.deployments = await call('api_listDeployments');
      renderDeployments_();
    } catch (err) {
      toast('Deployments load failed: ' + err.message, 'err');
    }
  }
  $('#deploySearch')?.addEventListener('input', debounce_(renderDeployments_, 200));

  function renderDeployments_() {
    const body = $('#deployBody');
    const q = ($('#deploySearch').value || '').toLowerCase();
    const filtered = State.deployments.filter(d =>
      d.deployment_name.toLowerCase().indexOf(q) >= 0 ||
      d.account_name.toLowerCase().indexOf(q) >= 0
    );
    body.innerHTML = filtered.map(d => {
      let adjustDisabledAttr = '';
      if ((d.psa_worker_count || 0) === 0) {
        adjustDisabledAttr = ' disabled title="No workers with PSA allocations on this project."';
      }
      // Small badge for account-level fallback match so Director knows precision
      const approxBadge = ((d.psa_worker_count || 0) > 0 && d.match_type === 'account')
        ? ' <span class="muted" style="font-size:10px;" title="Matched by account (no PSA project name)">~</span>'
        : '';
      return `
      <tr>
        <td>${escapeHtml_(d.deployment_name)}</td>
        <td>${escapeHtml_(d.account_name)}</td>
        <td>${_renderCellWithOverride_(d, 'deployment_stage', d.deployment_stage)}</td>
        <td>${_renderCellWithOverride_(d, 'deployment_health', d.deployment_health)}</td>
        <td>${_renderCellWithOverride_(d, 'current_mtp_date', fmtDate(d.current_mtp_date))}</td>
        <td>${_renderCellWithOverride_(d, 'em_name', d.em_name)}</td>
        <td>${_renderCellWithOverride_(d, 'dam_name', d.dam_name)}</td>
        <td>
          <button class="btn-ghost row-btn" data-dep="${escapeHtml_(d.deployment_id)}">Assign</button>
          <button class="btn-ghost row-btn" data-dep-reduce="${escapeHtml_(d.deployment_id)}" style="margin-left:4px;"${adjustDisabledAttr}>Adjust hours${approxBadge}</button>
          <button class="btn-ghost row-btn" data-edit-dep="${escapeHtml_(d.deployment_id)}" style="margin-left:4px;">Edit</button>
        </td>
      </tr>
    `}).join('');

    $$('#deployBody button[data-dep]').forEach(btn => {
      btn.addEventListener('click', () => openAssignDrawer_(btn.dataset.dep, 'deployment'));
    });
    $$('#deployBody button[data-dep-reduce]').forEach(btn => {
      btn.addEventListener('click', () => openAdjustHoursDrawerForDeployment_(btn.dataset.depReduce));
    });
    $$('#deployBody button[data-edit-dep]').forEach(btn => {
      btn.addEventListener('click', () => openOverrideDrawer_('Deployments', btn.dataset.editDep));
    });
  }

  async function loadScenariosList() {
  State.scenarios = await call('api_listScenarios');
  }

  async function loadScenarios() {
    await loadScenariosList();
    const list = $('#scenarioList');
    const active   = (State.scenarios || []).filter(s => s.status !== 'Archived');
    const archived = (State.scenarios || []).filter(s => s.status === 'Archived');

    const sections = [];

    sections.push('<div class="scenario-section">');
    sections.push('<div class="scenario-section-head">Active Scenarios</div>');
    if (!active.length) {
      sections.push('<div class="muted" style="padding:12px;">No active scenarios.</div>');
    } else {
      active.forEach(s => {
        const isSel = s.scenario_id === State.selectedScenario;
        sections.push(`
          <div class="scenario-item ${isSel ? 'active' : ''}" data-id="${s.scenario_id}">
            <div class="scenario-item-info">
              <div class="resource-name">${escapeHtml_(s.name)}</div>
              <div class="resource-meta">${escapeHtml_(s.status)} · ${fmtDate(s.modified_at)}</div>
            </div>
            <div class="scenario-row-actions">
              <button class="btn-ghost row-btn" data-scenario-edit="${escapeHtml_(s.scenario_id)}">Edit</button>
              <button class="btn-ghost row-btn" data-scenario-commit="${escapeHtml_(s.scenario_id)}">Commit</button>
              <button class="btn-ghost row-btn danger" data-scenario-archive="${escapeHtml_(s.scenario_id)}">Archive</button>
            </div>
          </div>`);
      });
    }
    sections.push('</div>');

    if (archived.length) {
      sections.push('<div class="scenario-section scenario-section-archived">');
      sections.push('<div class="scenario-section-head">Archived Scenarios</div>');
      archived.forEach(s => {
        sections.push(`
          <div class="scenario-item scenario-item-archived" data-id="${s.scenario_id}">
            <div class="scenario-item-info">
              <div class="resource-name">${escapeHtml_(s.name)}</div>
              <div class="resource-meta">Archived · ${fmtDate(s.modified_at)}</div>
            </div>
            <div class="scenario-row-actions">
              <button class="btn-ghost row-btn" data-scenario-restore="${escapeHtml_(s.scenario_id)}">Restore</button>
            </div>
          </div>`);
      });
      sections.push('</div>');
    }

    list.innerHTML = sections.join('');

    $$('#scenarioList .scenario-item-info').forEach(el => {
      el.addEventListener('click', () => {
        const item = el.closest('.scenario-item');
        if (!item) return;
        State.selectedScenario = item.dataset.id;
        loadScenarios();
        loadScenarioAssignments_(item.dataset.id);
      });
    });

    $$('#scenarioList [data-scenario-edit]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const s = (State.scenarios || []).find(x => x.scenario_id === b.dataset.scenarioEdit);
        if (s) openScenarioModal_(s);
      });
    });
    $$('#scenarioList [data-scenario-commit]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        commitScenarioById_(b.dataset.scenarioCommit);
      });
    });
    $$('#scenarioList [data-scenario-archive]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        archiveScenarioById_(b.dataset.scenarioArchive);
      });
    });
    $$('#scenarioList [data-scenario-restore]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        restoreScenarioById_(b.dataset.scenarioRestore);
      });
    });

    $('#newScenarioBtn')?.addEventListener('click', () => openScenarioModal_());
    $('#commitScenarioBtn')?.addEventListener('click', () => commitSelectedScenario_());
    $('#archiveScenarioBtn')?.addEventListener('click', () => archiveSelectedScenario_());
  }

  async function commitScenarioById_(scenarioId) {
    const s = (State.scenarios || []).find(x => x.scenario_id === scenarioId);
    if (!s) return;
    const ok = await confirmAction_({
      title: 'Commit scenario?',
      body: 'Commit all modeled assignments in "' + s.name + '"?',
      confirmLabel: 'Commit',
      confirmStyle: 'primary',
      asyncHandler: async () => { await call('api_commitScenario', scenarioId); }
    });
    if (ok) {
      toast('Scenario committed', 'ok');
      await loadScenarios();
      if (State.currentView === 'dashboard') loadDashboard();
    }
  }

  async function archiveScenarioById_(scenarioId) {
    const s = (State.scenarios || []).find(x => x.scenario_id === scenarioId);
    if (!s) return;
    const ok = await confirmAction_({
      title: 'Archive scenario?',
      body: 'Archive "' + s.name + '"? You can restore it later.',
      confirmLabel: 'Archive',
      confirmStyle: 'danger',
      asyncHandler: async () => { await call('api_archiveScenario', scenarioId); }
    });
    if (ok) {
      toast('Scenario archived', 'ok');
      if (State.selectedScenario === scenarioId) State.selectedScenario = null;
      await loadScenarios();
    }
  }

  async function restoreScenarioById_(scenarioId) {
    const s = (State.scenarios || []).find(x => x.scenario_id === scenarioId);
    if (!s) return;
    const ok = await confirmAction_({
      title: 'Restore scenario?',
      body: 'Restore "' + s.name + '" to active status?',
      confirmLabel: 'Restore',
      confirmStyle: 'primary',
      asyncHandler: async () => { await call('api_restoreScenario', scenarioId); }
    });
    if (ok) {
      toast('Scenario restored', 'ok');
      await loadScenarios();
    }
  }

    async function loadScenarioAssignments_(scenarioId) {
    const assigns = await call('api_listAssignments', { scenario_id: scenarioId });
    const body = $('#scenarioAssignmentsBody');
    // Priority 4: Role column displays resource_type (the user's literal
    // dropdown selection). Falls back to a.role (ICP role) for any rows
    // saved before the schema change — though that data is wiped per the
    // demo prep step.
    body.innerHTML = assigns.map(a => `
      <tr>
        <td>${escapeHtml_(a.opportunity_id)}</td>
        <td>${escapeHtml_(a.resource_type || a.role || '—')}</td>
        <td>${escapeHtml_(a.resource_name || '—')}</td>
        <td>${fmtDate(a.start_date)}</td>
        <td>${fmtDate(a.end_date)}</td>
        <td class="num">${a.estimated_hours}</td>
        <td>${escapeHtml_(a.distribution)}</td>
        <td>${escapeHtml_(a.status)}</td>
      </tr>
    `).join('');

    const sel = State.scenarios.find(s => s.scenario_id === scenarioId);
    if (sel) {
      $('#scenarioTitle').textContent = sel.name;
      $('#commitScenarioBtn').disabled = sel.status === 'Archived';
      $('#archiveScenarioBtn').disabled = sel.status === 'Archived';
    }

    // Drop 6: load reductions table for this scenario
    await loadScenarioReductions_(scenarioId);
    const addReductionBtn = $('#addReductionBtn');
    if (addReductionBtn) {
      addReductionBtn.disabled = false;
      addReductionBtn.onclick = () => openAdjustHoursDrawer_(null, null, scenarioId);
    }
  }

  async function loadScenarioReductions_(scenarioId) {
    const reductBody = $('#scenarioReductionsBody');
    if (!reductBody) return;
    try {
      const adjs = await call('api_listCapacityAdjustments', { scenario_id: scenarioId });
      if (!adjs || !adjs.length) {
        reductBody.innerHTML = '<tr><td colspan="8" class="muted" style="padding:8px">No reductions in this scenario.</td></tr>';
        return;
      }
      reductBody.innerHTML = adjs.map(a => `
        <tr>
          <td>${escapeHtml_(a.resource_name || '—')}</td>
          <td>${fmtDate(a.start_date)}</td>
          <td>${fmtDate(a.end_date)}</td>
          <td class="num">${a.hours_reduction}</td>
          <td>${escapeHtml_(a.distribution)}</td>
          <td>${escapeHtml_(a.reason || '—')}</td>
          <td>${escapeHtml_(a.status)}</td>
          <td>
            <button class="btn-ghost row-btn" data-edit-adj="${escapeHtml_(a.adjustment_id)}">Edit</button>
          </td>
        </tr>
      `).join('');
      // Wire Edit buttons
      reductBody.querySelectorAll('[data-edit-adj]').forEach(btn => {
        btn.addEventListener('click', () => openAdjustHoursDrawer_(btn.dataset.editAdj));
      });
    } catch (err) {
      reductBody.innerHTML = '<tr><td colspan="8" class="muted" style="padding:8px">Failed to load reductions.</td></tr>';
    }
  }

  function openScenarioModal_(scenario) {
    const modal = $('#scenarioModal');
    $('#s_id').value = scenario ? scenario.scenario_id : '';
    $('#s_name').value = scenario ? scenario.name : '';
    $('#s_desc').value = scenario ? (scenario.description || '') : '';
    modal.hidden = false;
  }

  $('#scenarioForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      scenario_id: $('#s_id').value || null,
      name: $('#s_name').value,
      description: $('#s_desc').value,
      status: 'Active'
    };
    await call('api_saveScenario', payload);
    $('#scenarioModal').hidden = true;
    await loadScenarios();
  });

  $('#scenarioModal')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      $('#scenarioModal').hidden = true;
    }
  });

  async function commitSelectedScenario_() {
    if (!State.selectedScenario) return;
    const ok = await confirmAction_({
      title: 'Commit scenario?',
      body: 'Commit all modeled assignments in this scenario?',
      confirmLabel: 'Commit',
      confirmStyle: 'primary',
      asyncHandler: async () => { await call('api_commitScenario', State.selectedScenario); }
    });
    if (ok) {
      toast('Scenario committed', 'ok');
      await loadScenarios();
      if (State.currentView === 'dashboard') loadDashboard();
    }
  }

  async function archiveSelectedScenario_() {
    if (!State.selectedScenario) return;
    const ok = await confirmAction_({
      title: 'Archive scenario?',
      body: 'This will archive the scenario along with any modeled assignments. You can restore it later.',
      confirmLabel: 'Archive',
      confirmStyle: 'danger',
      asyncHandler: async () => { await call('api_archiveScenario', State.selectedScenario); }
    });
    if (ok) {
      toast('Scenario archived', 'ok');
      State.selectedScenario = null;
      await loadScenarios();
    }
  }
</script>

<script>
  // ============================================================
  // Drop 6: Reduction Drawer
  // ============================================================

  /**
   * Open the reduction drawer in create or edit mode.
   * @param {string|null} adjustmentId  — existing adj to edit (null = create)
   * @param {string|null} prefilledResource — worker name pre-selected from CE
   * @param {string|null} prefilledScenario — scenario pre-selected from Scenarios view
   */
  // Tracks the deployment_id locked when the drawer is opened from the Deployments view.
  // null = no lock (Explorer / Scenarios entry points).
  let _reductionDrawerDepLock = null;

  /**
   * Open the adjust-hours drawer from the Deployments view with the deployment
   * pre-selected and locked. Populates the Worker dropdown from
   * api_getWorkersForDeployment (with hours shown per worker).
   * @param {string} deploymentId
   */
  async function openAdjustHoursDrawerForDeployment_(deploymentId) {
    const drawer = $('#reductionDrawer');
    if (!drawer || !deploymentId) return;

    _reductionDrawerDepLock = deploymentId;

    // Reset direction to 'reduce'
    $$('#r_direction button').forEach(b => b.classList.toggle('on', b.dataset.val === 'reduce'));
    _syncAdjustHoursDirectionUI_('reduce');

    // Update drawer header
    const dep = (State.deployments || []).find(d => d.deployment_id === deploymentId);
    const depLabel = dep
      ? (dep.account_name ? dep.account_name + ' \u2014 ' + dep.deployment_name : dep.deployment_name)
      : deploymentId;
    const titleEl = $('#reductionDrawerTitle');
    const ctxEl   = $('#reductionDrawerContext');
    if (titleEl) titleEl.textContent = 'Adjust Hours on Deployment';
    if (ctxEl)   ctxEl.textContent   = depLabel;
    const sub = $('#reductionDrawerWorkerSub');
    if (sub) sub.textContent = '';

    // Reset form fields
    $('#r_adjustment_id').value = '';
    $('#r_start').value = '';
    $('#r_end').value = '';
    $('#r_hours').value = '';
    $('#r_reason').value = '';
    $$('#r_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === 'Even'));

    // Scenario select
    const sSel = $('#r_scenario');
    sSel.innerHTML = '<option value="">— No scenario —</option>' +
      (State.scenarios || []).filter(s => s.status !== 'Archived')
        .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`).join('');

    // Lock + hide the Deployment field; value is set directly
    const depField = $('#r_deployment_field');
    if (depField) depField.hidden = true;
    const depSel = $('#r_deployment_id');
    if (depSel) { depSel.value = deploymentId; depSel.disabled = true; }

    // Fetch workers for this deployment (new shape: { workers, match_type })
    const rSel = $('#r_resource');
    rSel.innerHTML = '<option value="">— Select worker —</option>';
    let workerResult = { workers: [], match_type: 'none' };
    try { workerResult = await call('api_getWorkersForDeployment', deploymentId); } catch (e) {}

    const workers   = workerResult.workers  || [];
    const matchType = workerResult.match_type || 'none';
    // Store match_type on the drawer so baseline panel can use correct labels
    drawer.dataset.depMatchType = matchType;

    // Update drawer header: add a third line based on match_type
    const subEl = $('#reductionDrawerWorkerSub');
    if (subEl) {
      if (matchType === 'project' && dep && dep.psa_project_name) {
        subEl.textContent = '\u2713 Matched by PSA project: ' + dep.psa_project_name;
        subEl.style.color = '';
      } else if (matchType === 'account') {
        // Count WPS deployments for same account to show warning
        const sameAcctCount = (State.deployments || []).filter(function (d2) {
          return d2.account_name === (dep && dep.account_name) &&
                 d2.priming_partner_account === 'Workday Professional Services';
        }).length;
        subEl.textContent = '\u26A0 Matched by account. This account has ' + sameAcctCount + ' active deployment(s). Verify which one you intend to reduce.';
        subEl.style.color = 'var(--lunchBreak, #e8a317)';
      } else {
        subEl.textContent = '';
        subEl.style.color = '';
      }
    }

    if (!workers.length) {
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = '— No matching workers —';
      ph.disabled = true;
      rSel.innerHTML = '';
      rSel.appendChild(ph);
      rSel.disabled = true;
      const saveBtn   = $('#saveReductionModeledBtn');
      const commitBtn = $('#commitReductionNowBtn');
      if (saveBtn)   saveBtn.disabled = true;
      if (commitBtn) commitBtn.disabled = true;
