  }

  // KPIs
  function renderReportingKpis_(totals) {
    totals = totals || {};
    const total = Number(totals.totalHours || 0);
    const slgHours = Number(totals.slgHours || 0);
    const nonSlg = Number(totals.nonSlgHours || 0);
    const partner = Number(totals.partnerHours || 0);
    const slgPct = Number(totals.slgPct || 0);
    const nonSlgPct = Number(totals.nonSlgPct || 0);
    const partPct = Number(totals.partnerPct || 0);
    const util = Number(totals.avgUtilization || 0);
    const months = Number(totals.monthsInScope || 0);
    const headcount = Number(totals.headcount || 0);

    $('#rpKpiTotal').textContent = fmtHours(total);
    $('#rpKpiTotalSub').textContent = headcount + ' workers · ' + months + ' months in scope';
    $('#rpKpiSlg').textContent = fmtHours(slgHours);
    $('#rpKpiSlgPct').textContent = fmtPct1(slgPct) + ' of total';
    $('#rpKpiNonSlg').textContent = fmtHours(nonSlg);
    $('#rpKpiNonSlgPct').textContent = fmtPct1(nonSlgPct) + ' of total';
    $('#rpKpiPartner').textContent = fmtHours(partner);
    $('#rpKpiPartnerPct').textContent = fmtPct1(partPct) + ' of total';
    $('#rpKpiUtil').textContent = fmtPct(util);
    $('#rpKpiUtilSub').textContent = total > 0
      ? 'against ' + fmtHours(Number(totals.capacityHours || 0)) + ' hrs capacity'
      : 'no data in scope';

    const reconCard = $('#rpKpiReconcile').closest('.kpi-card');
    const reconValue = $('#rpKpiReconcile');
    const reconSub = $('#rpKpiReconcileSub');
    if (total === 0) {
      if (reconCard) reconCard.setAttribute('data-state', '');
      reconValue.textContent = 'No data';
      reconSub.textContent = 'No hours in current scope.';
      reconSub.title = '';
    } else if (totals.reconcileOk) {
      if (reconCard) reconCard.setAttribute('data-state', 'ok');
      reconValue.textContent = '✓ Reconciled';
      reconSub.textContent = 'All totals tie';
      const d = totals.reconciliationDetail || {};
      reconSub.title = 'totalHours: ' + fmtHours(d.totalHours) + '\n' +
                      'teamSum: ' + fmtHours(d.teamSum) + '\n' +
                      'accountSum: ' + fmtHours(d.accountSum) + '\n' +
                      'workerClassSum: ' + fmtHours(d.workerClassSum);
    } else {
      if (reconCard) reconCard.setAttribute('data-state', 'warn');
      reconValue.textContent = '⚠ Mismatch';
      reconSub.textContent = 'See diagnostics';
      const d = totals.reconciliationDetail || {};
      const c = d.checks || {};
      const tt = [];
      if (!c.teamMatches) tt.push('team sum ≠ total');
      if (!c.accountMatches) tt.push('account sum ≠ total');
      if (!c.workerClassMatches) tt.push('worker class sum ≠ total');
      reconSub.title = tt.length ? tt.join('; ') : 'See diagnostics';
    }
  }

  // Composition
  function renderReportingComposition_(totals) {
    totals = totals || {};
    const slgReal = Number(totals.slgRealHours || 0);
    const slgGeneric = Number(totals.slgGenericHours || 0);
    const nonSlg = Number(totals.nonSlgHours || 0);
    const partner = Number(totals.partnerHours || 0);
    const total = slgReal + slgGeneric + nonSlg + partner;

    const colSlg = cssVar_('--wc-slg');
    const colSlgGen = cssVar_('--wc-slg-generic');
    const colNonSlg = cssVar_('--wc-nonslg');
    const colPartner = cssVar_('--wc-partner');

    const donutCtx = $('#rpDonutChart').getContext('2d');
    if (State.charts.rpDonut) State.charts.rpDonut.destroy();
    State.charts.rpDonut = new Chart(donutCtx, {
      type: 'doughnut',
      data: {
        labels: ['SLG (Workday SLG)', 'SLG Generic', 'Workday Non-SLG', 'Partner'],
        datasets: [{
          data: [slgReal, slgGeneric, nonSlg, partner],
          backgroundColor: [colSlg, colSlgGen, colNonSlg, colPartner],
          borderWidth: 1, borderColor: '#fff'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        cutout: '62%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed;
                const pct = total > 0 ? (v / total) : 0;
                return ctx.label + ': ' + fmtHours(v) + ' hrs (' + fmtPct1(pct) + ')';
              }
            }
          }
        }
      }
    });

    const legendRows = [
      { label: 'SLG (Workday SLG)', hours: slgReal, color: colSlg, cls: 'slg' },
      { label: 'SLG Generic', hours: slgGeneric, color: colSlgGen, cls: 'slg-generic' },
      { label: 'Workday Non-SLG', hours: nonSlg, color: colNonSlg, cls: 'nonslg' },
      { label: 'Partner', hours: partner, color: colPartner, cls: 'partner' }
    ];
    $('#rpDonutLegendBody').innerHTML = legendRows.map(r => {
      const pct = total > 0 ? (r.hours / total) : 0;
      return `
        <tr>
          <td>
            <span class="wc-swatch ${r.cls}"></span>
            ${escapeHtml_(r.label)}
          </td>
          <td class="num">${fmtHours(r.hours)}</td>
          <td class="num">${fmtPct1(pct)}</td>
        </tr>`;
    }).join('');

    const slgCombined = slgReal + slgGeneric;
    const barCtx = $('#rpHorizontalBarChart').getContext('2d');
    if (State.charts.rpHBar) State.charts.rpHBar.destroy();
    State.charts.rpHBar = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['SLG vs Everyone Else'],
        datasets: [
          { label: 'SLG', data: [slgCombined], backgroundColor: colSlg, stack: 'mix' },
          { label: 'Workday Non-SLG', data: [nonSlg], backgroundColor: colNonSlg, stack: 'mix' },
          { label: 'Partner', data: [partner], backgroundColor: colPartner, stack: 'mix' }
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed.x;
                const pct = total > 0 ? (v / total) : 0;
                return ctx.dataset.label + ': ' + fmtHours(v) + ' hrs (' + fmtPct1(pct) + ')';
              }
            }
          }
        },
        scales: {
          x: { stacked: true, display: false, max: total > 0 ? total : 1 },
          y: { stacked: true, display: false }
        }
      }
    });

    const barLegendRows = [
      { label: 'SLG', hours: slgCombined, cls: 'slg' },
      { label: 'Workday Non-SLG', hours: nonSlg, cls: 'nonslg' },
      { label: 'Partner', hours: partner, cls: 'partner' }
    ];
    $('#rpHorizontalBarLegend').innerHTML = barLegendRows.map(r => {
      const pct = total > 0 ? (r.hours / total) : 0;
      return `
        <div class="lg-row">
          <span class="lg-swatch wc-mix-seg ${r.cls}"></span>
          <span class="lg-label">${escapeHtml_(r.label)}</span>
          <span class="lg-value">${fmtHours(r.hours)} · ${fmtPct1(pct)}</span>
        </div>`;
    }).join('');
  }

  // Worker class mix bar
  function wcMixBarHtml_(wcb, rowTotal) {
    wcb = wcb || {};
    const slg = Number(wcb.slg || 0);
    const slgGen = Number(wcb.slgGeneric || 0);
    const nonSlg = Number(wcb.nonSlg || 0);
    const partner = Number(wcb.partner || 0);
    const sum = slg + slgGen + nonSlg + partner;
    if (sum <= 0) {
      return '<div class="wc-mix-bar" title="No worker class breakdown"></div>';
    }
    const denom = rowTotal > 0 ? rowTotal : sum;
    const seg = (val, cls, name) => {
      if (val <= 0) return '';
      const pct = (val / denom) * 100;
      return `<div class="wc-mix-seg ${cls}" style="width:${pct}%;" title="${name}: ${fmtHours(val)} hrs (${fmtPct1(val/denom)})"></div>`;
    };
    const title = 'SLG: ' + fmtHours(slg) + ' · ' +
                  'SLG Generic: ' + fmtHours(slgGen) + ' · ' +
                  'Workday Non-SLG: ' + fmtHours(nonSlg) + ' · ' +
                  'Partner: ' + fmtHours(partner);
    return `<div class="wc-mix-bar" title="${escapeHtml_(title)}">
      ${seg(slg, 'slg', 'SLG')}
      ${seg(slgGen, 'slg-generic', 'SLG Generic')}
      ${seg(nonSlg, 'nonslg', 'Workday Non-SLG')}
      ${seg(partner, 'partner', 'Partner')}
    </div>`;
  }

  function renderReportingDiagnostics_(diag, totals) {
    diag = diag || {};
    const grand = Number((totals || {}).totalHours || 0);
    const unmapped = diag.unmapped || [];
    const blank = diag.blankClassWorkers || { count: 0, totalHours: 0, sampleNames: [] };

    const summaryParts = [];
    if (unmapped.length) summaryParts.push(unmapped.length + ' unmapped categor' + (unmapped.length === 1 ? 'y' : 'ies'));
    if (blank.count) summaryParts.push(blank.count + ' blank-class worker' + (blank.count === 1 ? '' : 's'));
    const summaryText = summaryParts.length ? summaryParts.join(' · ') : 'All clear';
    $('#rpDiagnosticsSummary').textContent = summaryText;

    if (!unmapped.length) {
      $('#rpUnmappedBody').innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">No unmapped categories — all rows classified.</td></tr>';
      $('#rpUnmappedBadge').className = 'badge ghost';
      $('#rpUnmappedBadge').textContent = '0';
    } else {
      const sumUn = unmapped.reduce((s, u) => s + Number(u.hours || 0), 0);
      $('#rpUnmappedBadge').className = 'badge amber';
      $('#rpUnmappedBadge').textContent = fmtHours(sumUn) + ' hrs · ' + unmapped.length;
      $('#rpUnmappedBody').innerHTML = unmapped.map(u => {
        const hrs = Number(u.hours || 0);
        const pct = grand > 0 ? (hrs / grand) : 0;
        return `
          <tr>
            <td><code>${escapeHtml_(u.key || '')}</code></td>
            <td class="num">${fmtHours(hrs)}</td>
            <td class="num">${fmtPct1(pct)}</td>
          </tr>`;
      }).join('');
    }

    if (!blank.count) {
      $('#rpBlankClassBody').innerHTML = '<tr><td colspan="2" class="muted" style="padding:12px">No blank-class workers detected.</td></tr>';
      $('#rpBlankClassBadge').className = 'badge ghost';
      $('#rpBlankClassBadge').textContent = '0';
    } else {
      $('#rpBlankClassBadge').className = 'badge amber';
      $('#rpBlankClassBadge').textContent = fmtHours(blank.totalHours) + ' hrs · ' + blank.count;
      const sample = blank.sampleNames || [];
      $('#rpBlankClassBody').innerHTML = sample.map(s => `
        <tr>
          <td>${escapeHtml_(s.name || '')}</td>
          <td class="num">${fmtHours(s.hours || 0)}</td>
        </tr>`).join('') +
        (blank.count > sample.length
          ? `<tr><td colspan="2" class="muted" style="padding:8px 12px">
               +${blank.count - sample.length} more not shown · resolve in Admin → Worker Exclusions
             </td></tr>`
          : '');
    }
  }

  // Event handlers + modals
  function initReportingHandlers_() {
    document.addEventListener('click', (e) => {
      const banAction = e.target.closest('[data-banner-action]');
      if (banAction) {
        clearSingleFilter_(banAction.dataset.bannerAction);
        return;
      }

      if (e.target.closest('#rpDiagnosticsHeader')) {
        rpToggleDiagnostics_();
        return;
      }

      const showAll = e.target.closest('.rp-drill-showall');
      if (showAll) {
        e.preventDefault();
        openRpDrillModal_({
          scope: showAll.dataset.scope,
          kind: showAll.dataset.kind,
          key: showAll.dataset.key
        });
        return;
      }

      if (e.target.closest('#rpAccountViewAllBtn')) {
        openRpAccountsModal_();
        return;
      }

      const inDrill = e.target.closest('#rpTeamDrillModal, #rpAccountDrillModal');
      if (inDrill && e.target.dataset && e.target.dataset.close !== undefined) {
        closeRpDrillModal_();
        return;
      }

      const inAcctsModal = e.target.closest('#rpAccountsModal');
      if (inAcctsModal && e.target.dataset && e.target.dataset.close !== undefined) {
        closeRpAccountsModal_();
        return;
      }

      const teamRow = e.target.closest('tr.rp-team-row');
      if (teamRow && !e.target.closest('tr.team-drill-row')) {
        const t = teamRow.dataset.team;
        if (t) rpToggleTeam_(t);
        return;
      }

      const acctRow = e.target.closest('tr.rp-account-row');
      if (acctRow && !e.target.closest('tr.team-drill-row')) {
        const a = acctRow.dataset.account;
        if (a) rpToggleAccount_(a);
        return;
      }
    });

    const _debouncedRpAccountsSearch_ = debounce_((value) => {
      renderRpAccountsModalRows_(State.rpAccountsAll || [], State.rpHoursTotal || 0, value);
    }, 200);
    const _debouncedRpDrillSearch_ = debounce_(() => renderRpDrillModalRows_(), 200);

    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'rpAccountsModalSearch') {
        _debouncedRpAccountsSearch_(e.target.value);
      }
      if (e.target && (e.target.id === 'rpTeamDrillSearch' || e.target.id === 'rpAccountDrillSearch')) {
        _debouncedRpDrillSearch_();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      [['rpTeamDrillModal', closeRpDrillModal_],
       ['rpAccountDrillModal', closeRpDrillModal_],
       ['rpAccountsModal', closeRpAccountsModal_]].forEach(([id, closer]) => {
        const m = document.getElementById(id);
        if (m && !m.hidden) closer();
      });
    });

    $('#rpDiagnosticsHeader')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        rpToggleDiagnostics_();
      }
    });
  }

  function rpToggleDiagnostics_() {
    State.rpDiagnosticsOpen = !State.rpDiagnosticsOpen;
    const body = $('#rpDiagnosticsBody');
    const chev = $('#rpDiagnosticsChev');
    if (!body) return;
    body.hidden = !State.rpDiagnosticsOpen;
    if (chev) chev.classList.toggle('open', State.rpDiagnosticsOpen);
  }

    function rpToggleTeam_(teamName) {
    if (!State.rpExpandedTeams) State.rpExpandedTeams = new Set();
    if (State.rpExpandedTeams.has(teamName)) State.rpExpandedTeams.delete(teamName);
    else State.rpExpandedTeams.add(teamName);
    if (State.reporting) {
      renderReportingTeamTable_(State.reporting.byTeam || [], State.reporting.totals || {});
    }
  }

  function rpToggleAccount_(account) {
    if (!State.rpExpandedAccounts) State.rpExpandedAccounts = new Set();
    if (State.rpExpandedAccounts.has(account)) State.rpExpandedAccounts.delete(account);
    else State.rpExpandedAccounts.add(account);
    if (State.reporting) {
      renderReportingAccountTable_(State.reporting.byAccount || [], State.reporting.totals || {});
    }
  }

  function openRpDrillModal_(ctx) {
    if (!State.reporting) return;
    let list = []; let title = ''; let sub = '';
    let labelHeader = 'Label'; let modal = null;

    if (ctx.scope === 'team') {
      const team = (State.reporting.byTeam || []).find(t => t.team === ctx.key);
      if (!team) return;
      if (ctx.kind === 'roleCategories') { list = team.allRoleCategories || []; labelHeader = 'Role Category'; title = team.team + ' — All role categories'; }
      else if (ctx.kind === 'accounts')   { list = team.allAccounts || [];        labelHeader = 'Account';       title = team.team + ' — All accounts'; }
      else if (ctx.kind === 'projects')   { list = team.allProjects || [];        labelHeader = 'Project';       title = team.team + ' — All projects'; }
      modal = $('#rpTeamDrillModal');
      sub = (list.length || 0) + ' items';
    } else if (ctx.scope === 'account') {
      const acct = (State.reporting.byAccount || []).find(a => a.account === ctx.key);
      if (!acct) return;
      if (ctx.kind === 'roles')    { list = acct.allRoles || [];    labelHeader = 'Role';    title = acct.account + ' — All roles'; }
      else if (ctx.kind === 'projects') { list = acct.allProjects || []; labelHeader = 'Project'; title = acct.account + ' — All projects'; }
      modal = $('#rpAccountDrillModal');
      sub = (list.length || 0) + ' items';
    }

    if (!modal) return;
    State.rpActiveDrill = { ctx: ctx, list: list, modal: modal };

    if (ctx.scope === 'team') {
      $('#rpTeamDrillTitle').textContent = title;
      $('#rpTeamDrillSub').textContent = sub;
      $('#rpTeamDrillLabelHeader').textContent = labelHeader;
      const search = $('#rpTeamDrillSearch');
      if (search) search.value = '';
    } else {
      $('#rpAccountDrillTitle').textContent = title;
      $('#rpAccountDrillSub').textContent = sub;
      $('#rpAccountDrillLabelHeader').textContent = labelHeader;
      const search = $('#rpAccountDrillSearch');
      if (search) search.value = '';
    }

    renderRpDrillModalRows_();
    modal.hidden = false;
  }

  function renderRpDrillModalRows_() {
    if (!State.rpActiveDrill) return;
    const { ctx, list } = State.rpActiveDrill;
    const isTeam = ctx.scope === 'team';
    const searchEl = isTeam ? $('#rpTeamDrillSearch') : $('#rpAccountDrillSearch');
    const bodyEl = isTeam ? $('#rpTeamDrillBody') : $('#rpAccountDrillBody');
    const totalHrsEl = isTeam ? $('#rpTeamDrillTotalHours') : $('#rpAccountDrillTotalHours');
    const totalPctEl = isTeam ? $('#rpTeamDrillTotalPct') : $('#rpAccountDrillTotalPct');

    const q = String((searchEl && searchEl.value) || '').toLowerCase().trim();
    const filtered = q
      ? list.filter(x => String(x.label || '').toLowerCase().indexOf(q) >= 0)
      : list.slice();

    const grand = filtered.reduce((s, x) => s + Number(x.hours || 0), 0);

    bodyEl.innerHTML = filtered.length
      ? filtered.map((x, i) => {
          const hrs = Number(x.hours || 0);
          const pct = grand > 0 ? (hrs / grand) : 0;
          return `
            <tr>
              <td class="num">${i + 1}</td>
              <td>${escapeHtml_(x.label || '')}</td>
              <td class="num">${fmtHours(hrs)}</td>
              <td class="num">${fmtPct1(pct)}</td>
            </tr>`;
        }).join('')
      : '<tr><td colspan="4" class="muted" style="padding:12px">No matches.</td></tr>';

    totalHrsEl.textContent = fmtHours(grand);
    totalPctEl.textContent = grand > 0 ? '100%' : '—';
  }

  function closeRpDrillModal_() {
    const team = $('#rpTeamDrillModal');
    const acct = $('#rpAccountDrillModal');
    if (team) team.hidden = true;
    if (acct) acct.hidden = true;
    State.rpActiveDrill = null;
  }

  function openRpAccountsModal_() {
    const modal = $('#rpAccountsModal');
    if (!modal) return;
    const list = State.rpAccountsAll || [];
    const total = State.rpHoursTotal || 0;
    $('#rpAccountsModalSub').textContent = list.length + ' accounts in scope';
    const search = $('#rpAccountsModalSearch');
    if (search) search.value = '';
    renderRpAccountsModalRows_(list, total, '');
    modal.hidden = false;
  }

  function renderRpAccountsModalRows_(list, total, query) {
    const body = $('#rpAccountsModalBody');
    const totalHrsEl = $('#rpAccountsModalTotalHours');
    const totalPctEl = $('#rpAccountsModalTotalPct');
    if (!body) return;

    const q = String(query || '').toLowerCase().trim();
    const filtered = q
      ? list.filter(r => String(r.account || '').toLowerCase().indexOf(q) >= 0)
      : list.slice();

    const sumFiltered = filtered.reduce((s, r) => s + Number(r.hours || 0), 0);
    const grand = total > 0 ? total : sumFiltered;

    body.innerHTML = filtered.length
      ? filtered.map((r, i) => {
          const hrs = Number(r.hours || 0);
          const pct = grand > 0 ? (hrs / grand) : 0;
          return `
            <tr>
              <td class="num">${i + 1}</td>
              <td>${escapeHtml_(r.account || 'Unspecified')}</td>
              <td class="num">${fmtHours(hrs)}</td>
              <td class="num">${fmtPct1(pct)}</td>
            </tr>`;
        }).join('')
      : '<tr><td colspan="4" class="muted" style="padding:12px">No matches.</td></tr>';

    totalHrsEl.textContent = fmtHours(sumFiltered);
    totalPctEl.textContent = grand > 0 ? fmtPct1(sumFiltered / grand) : '—';
  }

  function closeRpAccountsModal_() {
    const modal = $('#rpAccountsModal');
    if (modal) modal.hidden = true;
  }
</script>

<script>
  // ============================================================
  // Capacity Explorer
  //
  // Priority 3: resource list now respects Worker Scope (defaults
  // to SLG for this view) + Team filter + Manager filter. All
  // filtering is client-side against State.ref.resources (which
  // includes pre-computed resolvedTeam) and the search box.
  // Auto-updates on filter change because reloadCurrentView_
  // calls renderResourceList() when current view is 'explorer'.
  // ============================================================
  function renderResourceList() {
    const list = $('#resourceList');
    const search = ($('#resourceSearch').value || '').toLowerCase();
    const resources = (State.ref && State.ref.resources) || [];
    const f = State.filters;

    // Build effective manager set (Manager + descendants if include-reports)
    const managerDescendants = (State.ref && State.ref.managerDescendants) || {};
    let effectiveManagers = null;
    if (f.managers && f.managers.length && !f.teamLabel) {
      effectiveManagers = {};
      const selected = f.managers[0];
      effectiveManagers[selected] = true;
      if (f.includeMyManagers && managerDescendants[selected]) {
        managerDescendants[selected].forEach(m => { effectiveManagers[m] = true; });
      }
    }

    function workerInScope_(wc) {
      const cls = String(wc || '');
      const scope = String(f.workerScope || 'All');
      switch (scope) {
        case 'SLG':         return cls === 'SLG_Real' || cls === 'SLG_Generic';
        case 'NonSLG':      return cls === 'External_NonSLG';
        case 'Partners':    return cls === 'External_Contractor';
        case 'WorkdayOnly': return cls === 'SLG_Real' || cls === 'SLG_Generic' || cls === 'External_NonSLG';
        case 'All':
        case 'Both':        return cls === 'SLG_Real' || cls === 'SLG_Generic' || cls === 'External_NonSLG' || cls === 'External_Contractor';
        case 'External':    return cls === 'External_NonSLG' || cls === 'External_Contractor';
        default:            return false;
      }
    }

    const filtered = resources.filter(r => {
      // Search filter
      if (search && r.name.toLowerCase().indexOf(search) < 0) return false;

      // Worker Scope filter
      if (!workerInScope_(r.worker_class)) return false;

      // Team filter (overrides Manager)
      if (f.teamLabel) {
        if (r.resolvedTeam !== f.teamLabel) return false;
        return true;
      }

      // Manager filter (only when Team is not set)
      if (effectiveManagers) {
        if (!effectiveManagers[r.manager_org]) return false;
      }

      return true;
    });

    if (!filtered.length) {
      list.innerHTML = '<div class="muted" style="padding:16px;text-align:center;">No resources match the current filters.</div>';
      return;
    }

    list.innerHTML = filtered.map(r => `
      <div class="resource-item" data-resource="${escapeHtml_(r.name)}">
        <div>
          <div class="resource-name">${escapeHtml_(r.name)}</div>
          <div class="resource-meta">${escapeHtml_(r.manager_org || '—')} · ${escapeHtml_(r.resolvedTeam || r.icp || '—')}</div>
        </div>
      </div>
    `).join('');

    $$('#resourceList .resource-item').forEach(el => {
      el.addEventListener('click', () => {
        $$('#resourceList .resource-item').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        State.selectedResource = el.dataset.resource;
        State.projectAllocation = null;
        $('#projectAllocationCard').hidden = true;
        loadResourceDetail_(State.selectedResource);
      });
    });
  }

  $('#resourceSearch')?.addEventListener('input', debounce_(renderResourceList, 200));

  // Hide the planning + summary cards whenever no worker is selected.
  function _hidePlanningCard_() {
    const card = $('#workerPlanningCard');
    if (card) card.hidden = true;
    const sumCard = $('#utilizationSummaryCard');
    if (sumCard) sumCard.hidden = true;
    const allocCard = $('#projectAllocationCard');
    if (allocCard) allocCard.hidden = true;
    State.workerPlanning = null;
    State.selectedResource = null;
    State.projectAllocation = null;
  }

  /**
   * Render the Utilization Summary card from the summary object returned by
   * computeResourceDetail.
   * @param {Object|null} summary
   */
  function renderUtilizationSummary_(summary) {
    const card = $('#utilizationSummaryCard');
    if (!card) return;
    if (!summary) {
      card.hidden = true;
      return;
    }
    card.hidden = false;

    const cap = summary.capacity || {};
    const comm = summary.committed || {};
    const scen = summary.scenario  || {};
    const comp = summary.components || {};
    const flags = summary.flags || {};

    function fmtUtil(v) { return Math.round((v || 0) * 100) + '%'; }
    function utilClass(v) {
      if (v > 1.0) return 'util-red';
      if (v >= 0.85) return 'util-amber';
      return 'util-green';
    }

    // Committed avg
    const cAvgEl = $('#utilCommittedAvg');
    if (cAvgEl) {
      cAvgEl.textContent = fmtUtil(comm.avgUtilization);
      cAvgEl.className = 'util-headline-value ' + utilClass(comm.avgUtilization);
    }
    const cPeakEl = $('#utilCommittedPeak');
    if (cPeakEl) {
      const peakLabel = comm.peakMonthKey ? fmtMonth(comm.peakMonthKey) : '—';
      cPeakEl.textContent = `peak ${fmtUtil(comm.peakUtilization)} (${peakLabel})`;
    }

    // Scenario avg
    const sAvgEl = $('#utilScenarioAvg');
    if (sAvgEl) {
      sAvgEl.textContent = fmtUtil(scen.avgUtilization);
      sAvgEl.className = 'util-headline-value ' + utilClass(scen.avgUtilization);
    }
    const sPeakEl = $('#utilScenarioPeak');
    if (sPeakEl) {
      const peakLabel = scen.peakMonthKey ? fmtMonth(scen.peakMonthKey) : '—';
      sPeakEl.textContent = `peak ${fmtUtil(scen.peakUtilization)} (${peakLabel})`;
    }

    // Capacity
    const capEl = $('#utilCapacity');
    if (capEl) capEl.textContent = (cap.monthlyHours || 0) + 'h/mo';
    const winEl = $('#utilCapacityWindow');
    if (winEl) winEl.textContent = (cap.planningWindowMonths || 0) + ' months';

    // Components
    const incTO = State.filters.includeTimeOff;
    const totalCap = (cap.monthlyHours || 160) * (cap.planningWindowMonths || 1);
    function pct(v) { return totalCap > 0 ? Math.round((v || 0) / totalCap * 100) + '%' : '0%'; }
    function compRow(dot, label, hours, negative) {
      if (!hours) return '';
      const hoursDisplay = negative ? `-${Math.abs(hours)}h` : `${hours}h`;
      return `<div class="util-component-row${negative ? ' reduction' : ''}">
        <span class="util-component-dot" style="background:${dot}"></span>
        <span class="util-component-label">${escapeHtml_(label)}</span>
        <span class="util-component-hours">${hoursDisplay}</span>
        <span class="util-component-pct">${pct(hours)}</span>
      </div>`;
    }

    const compHtml = [
      compRow('var(--ballpoint)',   'PSA Billable',         comp.psaBillable,          false),
      incTO ? compRow('var(--water-cooler)', 'PSA Internal', comp.psaInternal,          false) : '',
      incTO ? compRow('var(--tack)',         'PSA Education', comp.psaEducation,         false) : '',
      incTO ? compRow('var(--pencil)',       'PSA PTO/Holiday', comp.psaPto,             false) : '',
      compRow('var(--smoothie)',    'Committed Assigns',    comp.committedAssignments,  false),
      compRow('var(--happy-hour)', 'Modeled Assigns',      comp.modeledAssignments,    false),
      comp.committedReductions ? compRow('var(--thumbtack)', 'Committed Reductions',  comp.committedReductions, true) : '',
      comp.modeledReductions   ? compRow('var(--thumbtack)', 'Modeled Reductions',    comp.modeledReductions,   true) : ''
    ].join('');
    const compEl = $('#utilComponents');
    if (compEl) compEl.innerHTML = compHtml || '<div class="util-component-row"><span class="util-component-label muted">No data in planning window.</span></div>';

    // Status line
    const statusEl = $('#utilStatus');
    if (statusEl) {
      let statusText = '', statusClass = '';
      if (flags.overCapacityScenario) {
        const mo = scen.peakMonthKey ? fmtMonth(scen.peakMonthKey) : '';
        statusText = `⚠ Over capacity by ${flags.overCapacityHours}h in scenario view — peak ${fmtUtil(scen.peakUtilization)}${mo ? ' in ' + mo : ''}`;
        statusClass = 'warn';
      } else if (flags.overCapacityCommitted) {
        const mo = comm.peakMonthKey ? fmtMonth(comm.peakMonthKey) : '';
        statusText = `⚠ Over capacity by ${flags.overCapacityHours}h in committed view — peak ${fmtUtil(comm.peakUtilization)}${mo ? ' in ' + mo : ''}`;
        statusClass = 'warn';
      } else if (flags.peakIsScenario && scen.peakUtilization > 0.9) {
        const mo = scen.peakMonthKey ? fmtMonth(scen.peakMonthKey) : '';
        statusText = `Near capacity in scenario view — peak ${fmtUtil(scen.peakUtilization)}${mo ? ' in ' + mo : ''}`;
        statusClass = 'amber';
      } else if (flags.isUnderutilized) {
        statusText = `Underutilized — committed avg ${fmtUtil(comm.avgUtilization)}`;
        statusClass = 'info';
      }
      if (statusText) {
        statusEl.textContent = statusText;
        statusEl.className = 'util-status ' + statusClass;
        statusEl.hidden = false;
      } else {
        statusEl.hidden = true;
      }
    }
  }

  async function loadResourceDetail_(name) {
    if (!name) {
      _hidePlanningCard_();
      return;
    }
    try {
      const detail = await call('api_getResourceDetail', {
        resource: name,
        viewMode: State.filters.viewMode,
        scenarioId: State.filters.scenarioId,
        includeTimeOff: State.filters.includeTimeOff
      });
      // Patch: detail now has shape { months, summary }
      const months = detail && detail.months ? detail.months : detail;
      renderResourceChart_(name, months);
      renderUtilizationSummary_(detail && detail.summary ? detail.summary : null);
      // Show "Adjust hours" button now that a resource is selected
      const adjustBtn = $('#adjustHoursBtn');
      if (adjustBtn) {
        adjustBtn.hidden = false;
        adjustBtn.onclick = () => openAdjustHoursDrawer_(null, name);
      }
      // Drop 7: load Worker Planning Detail card in parallel
      loadWorkerPlanning_(name);
    } catch (err) {
      toast('Resource detail failed: ' + err.message, 'err');
    }
  }

  function renderResourceChart_(name, months) {
    $('#resourceTitle').textContent = name;
    const meta = (State.ref.resources || []).find(r => r.name === name);
    $('#resourceSub').textContent = meta
      ? (meta.manager_org || '—') + ' · ' + (meta.resolvedTeam || meta.icp || meta.role_category || '—')
      : '';

    const ctx = $('#resourceChart').getContext('2d');
    if (State.charts.resource) State.charts.resource.destroy();
    // Positive series stacked above x-axis (stack 'a').
    // Reduction series rendered as negative values below x-axis (stack 'b').
    // Two distinct datasets: Committed (solid red) + Modeled (lighter red).
    const datasets = [
      { label: 'Billable',    data: months.map(m => m.billable),   backgroundColor: cssVar_('--ballpoint'),    stack: 'a' },
      { label: 'Internal',    data: months.map(m => m.internal),   backgroundColor: cssVar_('--water-cooler'), stack: 'a' },
      { label: 'Education',   data: months.map(m => m.education),  backgroundColor: cssVar_('--tack'),         stack: 'a' },
      { label: 'PTO/Holiday', data: months.map(m => m.pto),        backgroundColor: cssVar_('--pencil'),       stack: 'a' },
      { label: 'Scenario',    data: months.map(m => m.scenario),   backgroundColor: cssVar_('--happy-hour'),   stack: 'a' },
      {
        label: 'Reductions (Committed)',
        data: months.map(m => -((m.reductionByStatus && m.reductionByStatus.committed) || 0)),
        backgroundColor: cssVar_('--thumbtack'),
        stack: 'b'
      },
      {
        label: 'Reductions (Modeled)',
        data: months.map(m => -((m.reductionByStatus && m.reductionByStatus.modeled) || 0)),
        backgroundColor: '#e74c3c55',
        borderColor: cssVar_('--thumbtack'),
        borderWidth: 1,
        borderDash: [4, 4],
        stack: 'b'
      }
    ];
    State.charts.resource = new Chart(ctx, {
      type: 'bar',
      data: { labels: months.map(m => fmtMonth(m.monthKey)), datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { position: 'bottom' },
          tooltip: { mode: 'index' }
        },
        scales: {
          x: { stacked: true, grid: { display: false } },
          y: { stacked: true, beginAtZero: false }
        },
        onClick: function(event, elements) {
          if (!elements || elements.length === 0) return;
          const el = elements[0];
          const dataset = this.data.datasets[el.datasetIndex];
          if (!dataset || dataset.label !== 'Billable') return;
          const rawValue = dataset.data[el.index];
          if (!rawValue || rawValue <= 0) return;
          const monthKey = months[el.index].monthKey;
          if (
            State.projectAllocation &&
            State.projectAllocation.resource === name &&
            State.projectAllocation.monthKey === monthKey
          ) {
            State.projectAllocation = null;
            $('#projectAllocationCard').hidden = true;
            return;
          }
          State.projectAllocation = { resource: name, monthKey: monthKey };
          loadProjectAllocationCard_(name, monthKey);
        }
      }
    });

    const canvas = $('#resourceChart');
    canvas.addEventListener('mousemove', function(e) {
      const chart = State.charts.resource;
      if (!chart) return;
      const els = chart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, true);
      if (els.length > 0 && chart.data.datasets[els[0].datasetIndex].label === 'Billable') {
        canvas.style.cursor = 'pointer';
      } else {
        canvas.style.cursor = '';
      }
    });
    canvas.addEventListener('mouseleave', function() {
      canvas.style.cursor = '';
    });
  }

  async function loadProjectAllocationCard_(resourceName, monthKey) {
    const card  = $('#projectAllocationCard');
    const title = $('#projectAllocationTitle');
    const sub   = $('#projectAllocationSub');
    const body  = $('#projectAllocationBody');
    const total = $('#projectAllocationTotal');

    title.textContent = 'Project Allocation \u2014 ' + fmtMonth(monthKey);
    sub.textContent   = 'Billable hours \u00b7 ' + resourceName;
    body.innerHTML    = '<tr><td colspan="3" class="muted" style="padding:12px">Loading\u2026</td></tr>';
    total.textContent = '\u2014';
    card.hidden = false;

    try {
      const result = await call('api_getWorkerBillableByAccount', {
        resource_name: resourceName,
        monthKey: monthKey
      });
      if (!result.rows || result.rows.length === 0) {
        body.innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">No billable allocations.</td></tr>';
        total.textContent = '0h';
      } else {
        body.innerHTML = result.rows.map(function (r) {
          const hasAdj = !!(r.adjustment);
          const badge  = hasAdj
            ? '<span class="badge amber" title="' + escapeHtml_(r.adjustment.reason) + '" style="margin-left:6px;font-size:10px;">adjusted</span>'
            : '';
          const adjIdsJson = hasAdj ? escapeHtml_(JSON.stringify(r.adjustment.adjustment_ids || [])) : '[]';
          const clearBtn = hasAdj
            ? '<button class="btn-ghost row-btn danger" data-pa-clear' +
                ' data-account="' + escapeHtml_(r.account_name) + '"' +
                ' data-worker="' + escapeHtml_(resourceName) + '"' +
                ' data-month="' + escapeHtml_(monthKey) + '"' +
                ' data-direction="' + escapeHtml_(r.adjustment.direction || 'reduce') + '"' +
                ' data-magnitude="' + escapeHtml_(String(Math.round(r.adjustment.magnitude || 0))) + '"' +
                ' data-adjustment-ids="' + adjIdsJson + '"' +
                ' style="margin-left:4px;">Clear</button>'
            : '';
          return '<tr>' +
            '<td>' + escapeHtml_(r.account_name) + badge + '</td>' +
            '<td class="num">' + fmtHours(r.hours) + 'h</td>' +
            '<td>' +
              '<button class="btn-ghost row-btn" data-pa-edit' +
                ' data-account="' + escapeHtml_(r.account_name) + '"' +
                ' data-worker="' + escapeHtml_(resourceName) + '"' +
                ' data-month="' + escapeHtml_(monthKey) + '">Edit</button>' +
              clearBtn +
            '</td>' +
            '</tr>';
        }).join('');
        total.textContent = fmtHours(result.totalHours) + 'h';

        // Wire Edit button click handlers
        $$('#projectAllocationBody [data-pa-edit]').forEach(function (btn) {
          btn.addEventListener('click', async function (e) {
            e.stopPropagation();
            const accountName = btn.dataset.account;
            const workerName  = btn.dataset.worker;
            const mk          = btn.dataset.month;
            try {
              const deployments = await call('api_getDeploymentsForWorkerAccount', {
                resource_name: workerName,
                account_name:  accountName,
                monthKey:      mk
              });
              if (!deployments || !deployments.length) {
                toast('No matching deployment found for this allocation.', 'err');
                return;
              }
              openQuickAdjustModal_({ workerName: workerName, accountName: accountName, monthKey: mk, deployments: deployments });
            } catch (err) {
              toast('Failed to load deployments: ' + err.message, 'err');
            }
          });
        });

        // Wire Clear button click handlers
        $$('#projectAllocationBody [data-pa-clear]').forEach(function (btn) {
          btn.addEventListener('click', async function (e) {
            e.stopPropagation();
            const accountName   = btn.dataset.account;
            const workerName    = btn.dataset.worker;
            const mk            = btn.dataset.month;
            const direction     = btn.dataset.direction || 'reduce';
            const magnitude     = Number(btn.dataset.magnitude) || 0;
            const adjIds        = JSON.parse(btn.dataset.adjustmentIds || '[]');

            const verb = direction === 'add' ? 'added' : 'reduced';
            const bodyText = 'This will remove the adjustment of ' + magnitude + 'h ' + verb +
              ' for ' + workerName + ' on ' + accountName + ' in ' + fmtMonth(mk) +
              '. The Project Allocation will revert to PSA\u2019s reported value.';

            const ok = await confirmAction_({
              title:        'Clear adjustment?',
              body:         bodyText,
              confirmLabel: 'Clear',
              confirmStyle: 'danger',
              asyncHandler: async function () {
                for (var i = 0; i < adjIds.length; i++) {
                  await call('api_deleteCapacityAdjustment', adjIds[i]);
                }
              }
            });
            if (ok) {
              toast('Adjustment cleared', 'ok');
              refreshExplorerSurfaces_(workerName);
            }
          });
        });
      }
    } catch (err) {
      body.innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">Failed to load.</td></tr>';
    }
  }

  // Alias kept for backward compat within this session
  var showProjectAllocationCard_ = loadProjectAllocationCard_;

  $('#projectAllocationClose')?.addEventListener('click', function() {
    State.projectAllocation = null;
    $('#projectAllocationCard').hidden = true;
  });
</script>

<script>
  // ============================================================
  // Pipeline / Deployments / Scenarios
  // ============================================================
  async function loadOpportunities() {
    try {
      State.opportunities = await call('api_listOpportunities', {
        segment: $('#segmentFilter').value || '',
        stageMin: $('#stageFilter').value || '',
        search: $('#oppSearch').value || ''
      });
      renderOpportunities_();
    } catch (err) {
      toast('Pipeline load failed: ' + err.message, 'err');
    }
  }
  ['#segmentFilter', '#stageFilter'].forEach(sel => {
    const el = $(sel);
    if (el) el.addEventListener('change', loadOpportunities);
  });
  const _oppSearchEl = $('#oppSearch');
  if (_oppSearchEl) _oppSearchEl.addEventListener('input', debounce_(loadOpportunities, 200));

  function _renderCellWithOverride_(row, fieldName, displayValue) {
    if (!row._overrides) return escapeHtml_(String(displayValue == null ? '—' : displayValue));
    const ov = row._overrides.find(function (o) { return o.field === fieldName; });
    if (!ov) return escapeHtml_(String(displayValue == null ? '—' : displayValue));
    const tooltipParts = [
      'Original: ' + ov.original_value,
      'Reason: ' + ov.reason,
      'By: ' + ov.created_by
    ];
    if (ov.expires_at) tooltipParts.push('Expires: ' + ov.expires_at.slice(0, 10));
    const title = tooltipParts.join('\n');
    return '<span class="override-badge" title="' + escapeHtml_(title) + '">' +
      escapeHtml_(String(displayValue == null ? '—' : displayValue)) +
      '<span class="override-dot" aria-label="overridden"></span>' +
      '</span>';
  }

  function renderOpportunities_() {
    const body = $('#oppBody');
    body.innerHTML = State.opportunities.map(o => `
      <tr>
        <td>${escapeHtml_(o.opportunity_name)}</td>
        <td>${escapeHtml_(o.account)}</td>
        <td>${_renderCellWithOverride_(o, 'segment', o.segment || '—')}</td>
        <td>${_renderCellWithOverride_(o, 'stage', o.stage)}</td>
        <td class="num">${_renderCellWithOverride_(o, 'probability', fmtPct(o.probability / 100))}</td>
        <td class="num">${_renderCellWithOverride_(o, 'acv', fmtMoney(o.acv))}</td>
        <td>${_renderCellWithOverride_(o, 'expected_start', fmtDate(o.expected_start))}</td>
        <td>${_renderCellWithOverride_(o, 'expected_end', fmtDate(o.expected_end))}</td>
        <td class="num">${_renderCellWithOverride_(o, 'ee_count', o.ee_count || '—')}</td>
        <td>
          <button class="btn-ghost row-btn" data-opp="${o.opportunity_id}">Assign</button>
          <button class="btn-ghost row-btn" data-edit-opp="${escapeHtml_(o.opportunity_id)}" style="margin-left:4px;">Edit</button>
        </td>
      </tr>
    `).join('');

    $$('#oppBody button[data-opp]').forEach(btn => {
      btn.addEventListener('click', () => openAssignDrawer_(btn.dataset.opp));
    });
    $$('#oppBody button[data-edit-opp]').forEach(btn => {
      btn.addEventListener('click', () => openOverrideDrawer_('Pipeline', btn.dataset.editOpp));
    });
  }

  async function loadDeployments() {
    try {
      State.deployments = await call('api_listDeployments');
      renderDeployments_();
    } catch (err) {
      toast('Deployments load failed: ' + err.message, 'err');
    }
  }
  $('#deploySearch')?.addEventListener('input', debounce_(renderDeployments_, 200));

  function renderDeployments_() {
    const body = $('#deployBody');
    const q = ($('#deploySearch').value || '').toLowerCase();
    const filtered = State.deployments.filter(d =>
      d.deployment_name.toLowerCase().indexOf(q) >= 0 ||
      d.account_name.toLowerCase().indexOf(q) >= 0
    );
    body.innerHTML = filtered.map(d => {
      let adjustDisabledAttr = '';
      if ((d.psa_worker_count || 0) === 0) {
        adjustDisabledAttr = ' disabled title="No workers with PSA allocations on this project."';
      }
      // Small badge for account-level fallback match so Director knows precision
      const approxBadge = ((d.psa_worker_count || 0) > 0 && d.match_type === 'account')
        ? ' <span class="muted" style="font-size:10px;" title="Matched by account (no PSA project name)">~</span>'
        : '';
      return `
      <tr>
        <td>${escapeHtml_(d.deployment_name)}</td>
        <td>${escapeHtml_(d.account_name)}</td>
        <td>${_renderCellWithOverride_(d, 'deployment_stage', d.deployment_stage)}</td>
        <td>${_renderCellWithOverride_(d, 'deployment_health', d.deployment_health)}</td>
        <td>${_renderCellWithOverride_(d, 'current_mtp_date', fmtDate(d.current_mtp_date))}</td>
        <td>${_renderCellWithOverride_(d, 'em_name', d.em_name)}</td>
        <td>${_renderCellWithOverride_(d, 'dam_name', d.dam_name)}</td>
        <td>
          <button class="btn-ghost row-btn" data-dep="${escapeHtml_(d.deployment_id)}">Assign</button>
          <button class="btn-ghost row-btn" data-dep-reduce="${escapeHtml_(d.deployment_id)}" style="margin-left:4px;"${adjustDisabledAttr}>Adjust hours${approxBadge}</button>
          <button class="btn-ghost row-btn" data-edit-dep="${escapeHtml_(d.deployment_id)}" style="margin-left:4px;">Edit</button>
        </td>
      </tr>
    `}).join('');

    $$('#deployBody button[data-dep]').forEach(btn => {
      btn.addEventListener('click', () => openAssignDrawer_(btn.dataset.dep, 'deployment'));
    });
    $$('#deployBody button[data-dep-reduce]').forEach(btn => {
      btn.addEventListener('click', () => openAdjustHoursDrawerForDeployment_(btn.dataset.depReduce));
    });
    $$('#deployBody button[data-edit-dep]').forEach(btn => {
      btn.addEventListener('click', () => openOverrideDrawer_('Deployments', btn.dataset.editDep));
    });
  }

  async function loadScenariosList() {
  State.scenarios = await call('api_listScenarios');
  }

  async function loadScenarios() {
    await loadScenariosList();
    const list = $('#scenarioList');
    const active   = (State.scenarios || []).filter(s => s.status !== 'Archived');
    const archived = (State.scenarios || []).filter(s => s.status === 'Archived');

    const sections = [];

    sections.push('<div class="scenario-section">');
    sections.push('<div class="scenario-section-head">Active Scenarios</div>');
    if (!active.length) {
      sections.push('<div class="muted" style="padding:12px;">No active scenarios.</div>');
    } else {
      active.forEach(s => {
        const isSel = s.scenario_id === State.selectedScenario;
        sections.push(`
          <div class="scenario-item ${isSel ? 'active' : ''}" data-id="${s.scenario_id}">
            <div class="scenario-item-info">
              <div class="resource-name">${escapeHtml_(s.name)}</div>
              <div class="resource-meta">${escapeHtml_(s.status)} · ${fmtDate(s.modified_at)}</div>
            </div>
            <div class="scenario-row-actions">
              <button class="btn-ghost row-btn" data-scenario-edit="${escapeHtml_(s.scenario_id)}">Edit</button>
              <button class="btn-ghost row-btn" data-scenario-commit="${escapeHtml_(s.scenario_id)}">Commit</button>
              <button class="btn-ghost row-btn danger" data-scenario-archive="${escapeHtml_(s.scenario_id)}">Archive</button>
            </div>
          </div>`);
      });
    }
    sections.push('</div>');

    if (archived.length) {
      sections.push('<div class="scenario-section scenario-section-archived">');
      sections.push('<div class="scenario-section-head">Archived Scenarios</div>');
      archived.forEach(s => {
        sections.push(`
          <div class="scenario-item scenario-item-archived" data-id="${s.scenario_id}">
            <div class="scenario-item-info">
              <div class="resource-name">${escapeHtml_(s.name)}</div>
              <div class="resource-meta">Archived · ${fmtDate(s.modified_at)}</div>
            </div>
            <div class="scenario-row-actions">
              <button class="btn-ghost row-btn" data-scenario-restore="${escapeHtml_(s.scenario_id)}">Restore</button>
            </div>
          </div>`);
      });
      sections.push('</div>');
    }

    list.innerHTML = sections.join('');

    $$('#scenarioList .scenario-item-info').forEach(el => {
      el.addEventListener('click', () => {
        const item = el.closest('.scenario-item');
        if (!item) return;
        State.selectedScenario = item.dataset.id;
        loadScenarios();
        loadScenarioAssignments_(item.dataset.id);
      });
    });

    $$('#scenarioList [data-scenario-edit]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const s = (State.scenarios || []).find(x => x.scenario_id === b.dataset.scenarioEdit);
        if (s) openScenarioModal_(s);
      });
    });
    $$('#scenarioList [data-scenario-commit]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        commitScenarioById_(b.dataset.scenarioCommit);
      });
    });
    $$('#scenarioList [data-scenario-archive]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        archiveScenarioById_(b.dataset.scenarioArchive);
      });
    });
    $$('#scenarioList [data-scenario-restore]').forEach(b => {
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        restoreScenarioById_(b.dataset.scenarioRestore);
      });
    });

    $('#newScenarioBtn')?.addEventListener('click', () => openScenarioModal_());
    $('#commitScenarioBtn')?.addEventListener('click', () => commitSelectedScenario_());
    $('#archiveScenarioBtn')?.addEventListener('click', () => archiveSelectedScenario_());
  }

  async function commitScenarioById_(scenarioId) {
    const s = (State.scenarios || []).find(x => x.scenario_id === scenarioId);
    if (!s) return;
    const ok = await confirmAction_({
      title: 'Commit scenario?',
      body: 'Commit all modeled assignments in "' + s.name + '"?',
      confirmLabel: 'Commit',
      confirmStyle: 'primary',
      asyncHandler: async () => { await call('api_commitScenario', scenarioId); }
    });
    if (ok) {
      toast('Scenario committed', 'ok');
      await loadScenarios();
      if (State.currentView === 'dashboard') loadDashboard();
    }
  }

  async function archiveScenarioById_(scenarioId) {
    const s = (State.scenarios || []).find(x => x.scenario_id === scenarioId);
    if (!s) return;
    const ok = await confirmAction_({
      title: 'Archive scenario?',
      body: 'Archive "' + s.name + '"? You can restore it later.',
      confirmLabel: 'Archive',
      confirmStyle: 'danger',
      asyncHandler: async () => { await call('api_archiveScenario', scenarioId); }
    });
    if (ok) {
      toast('Scenario archived', 'ok');
      if (State.selectedScenario === scenarioId) State.selectedScenario = null;
      await loadScenarios();
    }
  }

  async function restoreScenarioById_(scenarioId) {
    const s = (State.scenarios || []).find(x => x.scenario_id === scenarioId);
    if (!s) return;
    const ok = await confirmAction_({
      title: 'Restore scenario?',
      body: 'Restore "' + s.name + '" to active status?',
      confirmLabel: 'Restore',
      confirmStyle: 'primary',
      asyncHandler: async () => { await call('api_restoreScenario', scenarioId); }
    });
    if (ok) {
      toast('Scenario restored', 'ok');
      await loadScenarios();
    }
  }

    async function loadScenarioAssignments_(scenarioId) {
    const assigns = await call('api_listAssignments', { scenario_id: scenarioId });
    const body = $('#scenarioAssignmentsBody');
    // Priority 4: Role column displays resource_type (the user's literal
    // dropdown selection). Falls back to a.role (ICP role) for any rows
    // saved before the schema change — though that data is wiped per the
    // demo prep step.
    body.innerHTML = assigns.map(a => `
      <tr>
        <td>${escapeHtml_(a.opportunity_id)}</td>
        <td>${escapeHtml_(a.resource_type || a.role || '—')}</td>
        <td>${escapeHtml_(a.resource_name || '—')}</td>
        <td>${fmtDate(a.start_date)}</td>
        <td>${fmtDate(a.end_date)}</td>
        <td class="num">${a.estimated_hours}</td>
        <td>${escapeHtml_(a.distribution)}</td>
        <td>${escapeHtml_(a.status)}</td>
      </tr>
    `).join('');

    const sel = State.scenarios.find(s => s.scenario_id === scenarioId);
    if (sel) {
      $('#scenarioTitle').textContent = sel.name;
      $('#commitScenarioBtn').disabled = sel.status === 'Archived';
      $('#archiveScenarioBtn').disabled = sel.status === 'Archived';
    }

    // Drop 6: load reductions table for this scenario
    await loadScenarioReductions_(scenarioId);
    const addReductionBtn = $('#addReductionBtn');
    if (addReductionBtn) {
      addReductionBtn.disabled = false;
      addReductionBtn.onclick = () => openAdjustHoursDrawer_(null, null, scenarioId);
    }
  }

  async function loadScenarioReductions_(scenarioId) {
    const reductBody = $('#scenarioReductionsBody');
    if (!reductBody) return;
    try {
      const adjs = await call('api_listCapacityAdjustments', { scenario_id: scenarioId });
      if (!adjs || !adjs.length) {
        reductBody.innerHTML = '<tr><td colspan="8" class="muted" style="padding:8px">No reductions in this scenario.</td></tr>';
        return;
      }
      reductBody.innerHTML = adjs.map(a => `
        <tr>
          <td>${escapeHtml_(a.resource_name || '—')}</td>
          <td>${fmtDate(a.start_date)}</td>
          <td>${fmtDate(a.end_date)}</td>
          <td class="num">${a.hours_reduction}</td>
          <td>${escapeHtml_(a.distribution)}</td>
          <td>${escapeHtml_(a.reason || '—')}</td>
          <td>${escapeHtml_(a.status)}</td>
          <td>
            <button class="btn-ghost row-btn" data-edit-adj="${escapeHtml_(a.adjustment_id)}">Edit</button>
          </td>
        </tr>
      `).join('');
      // Wire Edit buttons
      reductBody.querySelectorAll('[data-edit-adj]').forEach(btn => {
        btn.addEventListener('click', () => openAdjustHoursDrawer_(btn.dataset.editAdj));
      });
    } catch (err) {
      reductBody.innerHTML = '<tr><td colspan="8" class="muted" style="padding:8px">Failed to load reductions.</td></tr>';
    }
  }

  function openScenarioModal_(scenario) {
    const modal = $('#scenarioModal');
    $('#s_id').value = scenario ? scenario.scenario_id : '';
    $('#s_name').value = scenario ? scenario.name : '';
    $('#s_desc').value = scenario ? (scenario.description || '') : '';
    modal.hidden = false;
  }

  $('#scenarioForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      scenario_id: $('#s_id').value || null,
      name: $('#s_name').value,
      description: $('#s_desc').value,
      status: 'Active'
    };
    await call('api_saveScenario', payload);
    $('#scenarioModal').hidden = true;
    await loadScenarios();
  });

  $('#scenarioModal')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      $('#scenarioModal').hidden = true;
    }
  });

  async function commitSelectedScenario_() {
    if (!State.selectedScenario) return;
    const ok = await confirmAction_({
      title: 'Commit scenario?',
      body: 'Commit all modeled assignments in this scenario?',
      confirmLabel: 'Commit',
      confirmStyle: 'primary',
      asyncHandler: async () => { await call('api_commitScenario', State.selectedScenario); }
    });
    if (ok) {
      toast('Scenario committed', 'ok');
      await loadScenarios();
      if (State.currentView === 'dashboard') loadDashboard();
    }
  }

  async function archiveSelectedScenario_() {
    if (!State.selectedScenario) return;
    const ok = await confirmAction_({
      title: 'Archive scenario?',
      body: 'This will archive the scenario along with any modeled assignments. You can restore it later.',
      confirmLabel: 'Archive',
      confirmStyle: 'danger',
      asyncHandler: async () => { await call('api_archiveScenario', State.selectedScenario); }
    });
    if (ok) {
      toast('Scenario archived', 'ok');
      State.selectedScenario = null;
      await loadScenarios();
    }
  }
</script>

<script>
  // ============================================================
  // Drop 6: Reduction Drawer
  // ============================================================

  /**
   * Open the reduction drawer in create or edit mode.
   * @param {string|null} adjustmentId  — existing adj to edit (null = create)
   * @param {string|null} prefilledResource — worker name pre-selected from CE
   * @param {string|null} prefilledScenario — scenario pre-selected from Scenarios view
   */
  // Tracks the deployment_id locked when the drawer is opened from the Deployments view.
  // null = no lock (Explorer / Scenarios entry points).
  let _reductionDrawerDepLock = null;

  /**
   * Open the adjust-hours drawer from the Deployments view with the deployment
   * pre-selected and locked. Populates the Worker dropdown from
   * api_getWorkersForDeployment (with hours shown per worker).
   * @param {string} deploymentId
   */
  async function openAdjustHoursDrawerForDeployment_(deploymentId) {
    const drawer = $('#reductionDrawer');
    if (!drawer || !deploymentId) return;

    _reductionDrawerDepLock = deploymentId;

    // Reset direction to 'reduce'
    $$('#r_direction button').forEach(b => b.classList.toggle('on', b.dataset.val === 'reduce'));
    _syncAdjustHoursDirectionUI_('reduce');

    // Update drawer header
    const dep = (State.deployments || []).find(d => d.deployment_id === deploymentId);
    const depLabel = dep
      ? (dep.account_name ? dep.account_name + ' \u2014 ' + dep.deployment_name : dep.deployment_name)
      : deploymentId;
    const titleEl = $('#reductionDrawerTitle');
    const ctxEl   = $('#reductionDrawerContext');
    if (titleEl) titleEl.textContent = 'Adjust Hours on Deployment';
    if (ctxEl)   ctxEl.textContent   = depLabel;
    const sub = $('#reductionDrawerWorkerSub');
    if (sub) sub.textContent = '';

    // Reset form fields
    $('#r_adjustment_id').value = '';
    $('#r_start').value = '';
    $('#r_end').value = '';
    $('#r_hours').value = '';
    $('#r_reason').value = '';
    $$('#r_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === 'Even'));

    // Scenario select
    const sSel = $('#r_scenario');
    sSel.innerHTML = '<option value="">— No scenario —</option>' +
      (State.scenarios || []).filter(s => s.status !== 'Archived')
        .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`).join('');

    // Lock + hide the Deployment field; value is set directly
    const depField = $('#r_deployment_field');
    if (depField) depField.hidden = true;
    const depSel = $('#r_deployment_id');
    if (depSel) { depSel.value = deploymentId; depSel.disabled = true; }

    // Fetch workers for this deployment (new shape: { workers, match_type })
    const rSel = $('#r_resource');
    rSel.innerHTML = '<option value="">— Select worker —</option>';
    let workerResult = { workers: [], match_type: 'none' };
    try { workerResult = await call('api_getWorkersForDeployment', deploymentId); } catch (e) {}

    const workers   = workerResult.workers  || [];
    const matchType = workerResult.match_type || 'none';
    // Store match_type on the drawer so baseline panel can use correct labels
    drawer.dataset.depMatchType = matchType;

    // Update drawer header: add a third line based on match_type
    const subEl = $('#reductionDrawerWorkerSub');
    if (subEl) {
      if (matchType === 'project' && dep && dep.psa_project_name) {
        subEl.textContent = '\u2713 Matched by PSA project: ' + dep.psa_project_name;
        subEl.style.color = '';
      } else if (matchType === 'account') {
        // Count WPS deployments for same account to show warning
        const sameAcctCount = (State.deployments || []).filter(function (d2) {
          return d2.account_name === (dep && dep.account_name) &&
                 d2.priming_partner_account === 'Workday Professional Services';
        }).length;
        subEl.textContent = '\u26A0 Matched by account. This account has ' + sameAcctCount + ' active deployment(s). Verify which one you intend to reduce.';
        subEl.style.color = 'var(--lunchBreak, #e8a317)';
      } else {
        subEl.textContent = '';
        subEl.style.color = '';
      }
    }

    if (!workers.length) {
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = '— No matching workers —';
      ph.disabled = true;
      rSel.innerHTML = '';
      rSel.appendChild(ph);
      rSel.disabled = true;
      const saveBtn   = $('#saveReductionModeledBtn');
      const commitBtn = $('#commitReductionNowBtn');
      if (saveBtn)   saveBtn.disabled = true;
      if (commitBtn) commitBtn.disabled = true;
    } else {
      rSel.disabled = false;
      const locationLabel = matchType === 'project' ? 'on this project' : 'on this account';
      workers.forEach(function (w) {
        const opt = document.createElement('option');
        opt.value = w.resource_name;
        opt.textContent = w.resource_name + ' (' + w.hours + 'h ' + locationLabel + ')';
        rSel.appendChild(opt);
      });
    }

    drawer.hidden = false;
    $('#reductionBaselineCard').hidden = true;
  }

  /**
   * Populate the #r_deployment_id dropdown for the given resource.
   * Pre-selects existingId when editing. Handles empty-allocation disabled state
   * and unmapped legacy deployment_ids.
   * @param {string} resourceName
   * @param {string} [existingId]
   */
  async function _populateDeploymentDropdown_(resourceName, existingId) {
    const sel  = $('#r_deployment_id');
    const hint = $('#r_deployment_hint');
    if (!sel) return;

    sel.disabled = false;
    sel.innerHTML = '<option value="">— No deployment —</option>';
    if (hint) hint.textContent = 'Limited to deployments where this worker has PSA allocations.';

    if (!resourceName) return;

    let options = [];
    try { options = await call('api_getDeploymentsForWorker', resourceName); } catch (e) { options = []; }

    if (!options || !options.length) {
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = '— No allocations to reduce —';
      ph.disabled = true;
      sel.innerHTML = '';
      sel.appendChild(ph);
      sel.value = '';
      sel.disabled = true;
      if (hint) hint.textContent = 'This worker has no PSA allocations to associate with a reduction.';
      return;
    }

    options.forEach(function (o) {
      const opt = document.createElement('option');
      opt.value = o.deployment_id;
      opt.textContent = o.label;
      sel.appendChild(opt);
    });

    if (existingId) {
      const found = options.some(o => o.deployment_id === existingId);
      if (!found) {
        // Prepend option for legacy/orphaned deployment_id
        const unmapped = document.createElement('option');
        unmapped.value = existingId;
        unmapped.textContent = '(no longer active: ' + existingId + ')';
        sel.insertBefore(unmapped, sel.options[1]);
      }
      sel.value = existingId;
    }
  }

  async function openAdjustHoursDrawer_(adjustmentId, prefilledResource, prefilledScenario) {
    const drawer = $('#reductionDrawer');
    if (!drawer) return;

    // Clear deployment lock and restore drawer header to default Explorer/Scenarios mode
    _reductionDrawerDepLock = null;
    const titleEl = $('#reductionDrawerTitle');
    const ctxEl   = $('#reductionDrawerContext');
    if (titleEl) titleEl.textContent = 'Adjust Worker Capacity';
    if (ctxEl)   ctxEl.textContent   = 'Workforce Modeling';
    const depField = $('#r_deployment_field');
    if (depField) depField.hidden = false;

    // Populate resource select
    const rSel = $('#r_resource');
    rSel.disabled = false;
    rSel.innerHTML = '<option value="">— Select worker —</option>' +
      (State.ref.resources || []).map(r =>
        `<option value="${escapeHtml_(r.name)}">${escapeHtml_(r.name)}</option>`
      ).join('');

    // Populate scenario select
    const sSel = $('#r_scenario');
    sSel.innerHTML = '<option value="">— No scenario —</option>' +
      (State.scenarios || []).filter(s => s.status !== 'Archived')
        .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`).join('');

    // Reset form
    $('#r_adjustment_id').value = '';
    $('#r_start').value = '';
    $('#r_end').value = '';
    $('#r_hours').value = '';
    $('#r_reason').value = '';
    $$('#r_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === 'Even'));
    const sub = $('#reductionDrawerWorkerSub');
    if (sub) sub.textContent = '';

    // Default direction to 'reduce'
    $$('#r_direction button').forEach(b => b.classList.toggle('on', b.dataset.val === 'reduce'));
    _syncAdjustHoursDirectionUI_('reduce');

    // Reset deployment dropdown to a neutral state before async populate
    const depSel = $('#r_deployment_id');
    if (depSel) { depSel.innerHTML = '<option value="">— No deployment —</option>'; depSel.disabled = false; }

    if (adjustmentId) {
      // Edit mode: fetch the existing adjustment
      try {
        const adjs = await call('api_listCapacityAdjustments', {});
        const adj = (adjs || []).find(a => a.adjustment_id === adjustmentId);
        if (adj) {
          $('#r_adjustment_id').value = adj.adjustment_id;
          rSel.value = adj.resource_name || '';
          rSel.disabled = false;
          if (adj.start_date) $('#r_start').value = String(adj.start_date).slice(0,10);
          if (adj.end_date)   $('#r_end').value   = String(adj.end_date).slice(0,10);
          // hours_reduction is signed; show magnitude in the input
          $('#r_hours').value  = Math.abs(Number(adj.hours_reduction) || 0) || '';
          $('#r_reason').value = adj.reason || '';
          sSel.value = adj.scenario_id || '';
          // Restore direction from saved adjustment
          const savedDir = adj.direction || (Number(adj.hours_reduction) >= 0 ? 'reduce' : 'add');
          $$('#r_direction button').forEach(b => b.classList.toggle('on', b.dataset.val === savedDir));
          _syncAdjustHoursDirectionUI_(savedDir);
          // Restore saved distribution; fall back to Even if it's not one of
          // the currently-allowed modes (e.g. a legacy 'Custom' row -- removed
          // in WFM.12 -- mirrors the server's defensive default-to-Even).
          const allowedDist = ['Even', 'Front-loaded', 'Back-loaded'];
          const restoredDist = allowedDist.includes(adj.distribution) ? adj.distribution : 'Even';
          $$('#r_distribution button').forEach(b => b.classList.toggle('on', b.dataset.val === restoredDist));
          if (sub) sub.textContent = adj.resource_name || '';
          // Populate deployment dropdown and pre-select saved value
          await _populateDeploymentDropdown_(adj.resource_name || '', String(adj.deployment_id || ''));
        }
      } catch (e) {
        toast('Failed to load adjustment: ' + e.message, 'err');
      }
    } else {
      // Create mode
      if (prefilledResource) {
        rSel.value = prefilledResource;
        rSel.disabled = true;
        if (sub) sub.textContent = prefilledResource;
      } else {
        rSel.disabled = false;
      }
      if (prefilledScenario) sSel.value = prefilledScenario;
      // Populate deployment dropdown for the pre-filled resource (if any)
      if (prefilledResource) await _populateDeploymentDropdown_(prefilledResource, '');
    }

    drawer.hidden = false;

    // Load baseline when resource + dates are already set
    const res = rSel.value;
    const st = $('#r_start').value;
    const en = $('#r_end').value;
    if (res && st && en) loadResourceBaselineForDrawer_(res, st, en);
  }

  // Distribution segmented control for reduction drawer
  $$('#r_distribution button').forEach(b => {
    b.addEventListener('click', () => {
      $$('#r_distribution button').forEach(x => x.classList.toggle('on', x === b));
      updateReductionPreview_();
    });
  });

  // Event wiring — date and hours inputs (debounced 200ms).
  ['r_start', 'r_end', 'r_hours'].forEach(id => {
    $('#' + id)?.addEventListener('input', () => {
      clearTimeout(window._reductionPreviewTimer);
      window._reductionPreviewTimer = setTimeout(updateReductionPreview_, 200);
      // reload baseline when resource is set
      const res = $('#r_resource').value;
      const st  = $('#r_start').value;
      const en  = $('#r_end').value;
      if (res && st && en) loadResourceBaselineForDrawer_(res, st, en);
    });
  });

  $('#r_resource')?.addEventListener('change', () => {
    const res = $('#r_resource').value;
    const st  = $('#r_start').value;
    const en  = $('#r_end').value;
    const sub = $('#reductionDrawerWorkerSub');
    if (sub) sub.textContent = res || '';
    // Re-populate deployment dropdown only in the unlocked (Explorer/Scenarios) flow
    if (!_reductionDrawerDepLock) _populateDeploymentDropdown_(res, '');
    // In deployment-locked mode load baseline on worker change alone (no dates needed for context)
    if (res && (_reductionDrawerDepLock || (st && en))) {
      loadResourceBaselineForDrawer_(res, st || null, en || null);
    }
  });

  /**
   * Load baseline PSA committed hours for a worker and render the
   * baseline context panel inside the reduction drawer.
   * When _reductionDrawerDepLock is set, shows both "Total PSA" and
   * "On this deployment" datasets side-by-side.
   */
  async function loadResourceBaselineForDrawer_(resourceName, startDate, endDate) {
    const card = $('#reductionBaselineCard');
    if (!card) return;
    try {
      const depLock = _reductionDrawerDepLock;
      const start = startDate ? startDate.slice(0,7) : null;
      const end   = endDate   ? endDate.slice(0,7)   : null;
      const hoursReduction = Number($('#r_hours').value) || 0;

      if (depLock) {
        // Deployment-locked mode: fetch two-row baseline (new shape: {months, match_type})
        const resp = await call('api_getResourceBaselineForDeployment', resourceName, depLock);
        const baselineMonths = (resp && resp.months) ? resp.months : (Array.isArray(resp) ? resp : []);
        const depMatchType   = (resp && resp.match_type) || ($('#reductionDrawer').dataset.depMatchType) || 'none';
        if (!baselineMonths.length) { card.hidden = true; return; }
        const filtered = baselineMonths.filter(b =>
          (!start || b.monthKey >= start) && (!end || b.monthKey <= end)
        );
        if (!filtered.length && (start || end)) { card.hidden = true; return; }
        const data = filtered.length ? filtered : baselineMonths;
        const matchedLabel = depMatchType === 'project' ? 'On this project' : 'On this account';
        const ctx2 = $('#reductionBaselineChart').getContext('2d');
        if (window._reductionBaselineChartInst) window._reductionBaselineChartInst.destroy();
        window._reductionBaselineChartInst = new Chart(ctx2, {
          type: 'bar',
          data: {
            labels: data.map(b => fmtMonth(b.monthKey)),
            datasets: [
              { label: 'Total PSA', data: data.map(b => b.total_psa_hours), backgroundColor: cssVar_('--ballpoint') },
              { label: matchedLabel, data: data.map(b => b.matched_hours || 0), backgroundColor: cssVar_('--lunchBreak') }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            plugins: { legend: { position: 'bottom' } },
            scales: { x: { stacked: false, grid: { display: false } }, y: { beginAtZero: true } }
          }
        });
        const totalMatched = data.reduce((s, b) => s + (b.matched_hours || 0), 0);
        const noteEl = $('#reductionBaselineNote');
        if (noteEl) noteEl.textContent = `${matchedLabel}: ${Math.round(totalMatched)}h PSA`;
        card.hidden = false;
      } else {
        // Standard mode: single "PSA Committed" row
        const baseline = await call('api_getResourceBaseline', resourceName);
        if (!baseline || !baseline.length) { card.hidden = true; return; }
        const filtered = baseline.filter(b =>
          (!start || b.monthKey >= start) && (!end || b.monthKey <= end)
        );
        if (!filtered.length) { card.hidden = true; return; }

        const n = filtered.length;
        const perMonth = n > 0 ? hoursReduction / n : 0;

        const ctx = $('#reductionBaselineChart').getContext('2d');
        if (window._reductionBaselineChartInst) window._reductionBaselineChartInst.destroy();
        window._reductionBaselineChartInst = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: filtered.map(b => fmtMonth(b.monthKey)),
            datasets: [
              { label: 'PSA Committed', data: filtered.map(b => b.committed_hours), backgroundColor: cssVar_('--ballpoint') },
              { label: 'Proposed Reduction', data: filtered.map(() => perMonth), backgroundColor: '#e74c3c88' }
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: false,
            plugins: { legend: { position: 'bottom' } },
            scales: { x: { stacked: false, grid: { display: false } }, y: { beginAtZero: true } }
          }
        });

        const totalBaseline = filtered.reduce((s, b) => s + b.committed_hours, 0);
        const net = totalBaseline - hoursReduction;
        const noteEl = $('#reductionBaselineNote');
        if (noteEl) noteEl.textContent = `Baseline: ${Math.round(totalBaseline)}h — Reduction: ${Math.round(hoursReduction)}h — Net: ${Math.round(net)}h`;
        card.hidden = false;
      }
    } catch (e) {
      card.hidden = true;
    }
  }

  /** Refresh the reduction preview chart. */
  async function updateReductionPreview_() {
    const resource = $('#r_resource').value;
    const start    = $('#r_start').value;
    const end      = $('#r_end').value;
    const hours    = Number($('#r_hours').value) || 0;
    if (!start || !end || !hours) return;
    const activeBtn = $$('#r_distribution button').find(b => b.classList.contains('on'));
    const dist = activeBtn ? activeBtn.dataset.val : 'Even';
    const adj = {
      start_date: start, end_date: end,
      hours_reduction: hours, distribution: dist
    };
    try {
      const preview = await call('api_previewCapacityAdjustment', adj);
      const ctx = $('#reductionPreviewChart').getContext('2d');
      if (window._reductionPreviewChartInst) window._reductionPreviewChartInst.destroy();
      window._reductionPreviewChartInst = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: (preview || []).map(m => fmtMonth(m.monthKey)),
          datasets: [{ label: 'Reduction (hrs)', data: (preview || []).map(m => m.hours_reduction), backgroundColor: '#e74c3c88' }]
        },
        options: {
          responsive: true, maintainAspectRatio: false, animation: false,
          plugins: { legend: { position: 'bottom' } },
          scales: { x: { grid: { display: false } }, y: { beginAtZero: true } }
        }
      });
    } catch (e) { /* preview is best-effort */ }
  }

  /**
   * Sync the hours label and preview chart color to the selected direction.
   * @param {'reduce'|'add'} dir
   */
  function _syncAdjustHoursDirectionUI_(dir) {
    const labelEl = $('#r_hoursLabel');
    if (labelEl) {
      labelEl.innerHTML = dir === 'add'
        ? 'Hours to add <span style="color:var(--thumbtack);">*</span>'
        : 'Hours to reduce <span style="color:var(--thumbtack);">*</span>';
    }
  }

  // Wire direction segmented control
  $$('#r_direction button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      $$('#r_direction button').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      _syncAdjustHoursDirectionUI_(btn.dataset.val);
    });
  });

  // Submit reduction form
  $('#reductionForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    await withLoading_($('#saveReductionModeledBtn') || e.submitter, () => submitReductionForm_(false), { label: 'Saving...' });
  });

  $('#commitReductionNowBtn')?.addEventListener('click', async function() {
    await withLoading_(this, () => submitReductionForm_(true), { label: 'Committing...' });
  });

  async function submitReductionForm_(commitNow) {
    const resource = $('#r_resource').value;
    const start    = $('#r_start').value;
    const end      = $('#r_end').value;
    const hours    = Number($('#r_hours').value) || 0;
    const reason   = $('#r_reason').value.trim();
    const scenario = $('#r_scenario').value;
    const adjId    = $('#r_adjustment_id').value;

    if (!resource) { toast('Worker is required', 'err'); return; }
    if (!start || !end) { toast('Date range is required', 'err'); return; }
    if (hours <= 0) { toast('Hours must be > 0', 'err'); return; }
    if (!reason) { toast('Reason is required', 'err'); return; }

    const dirBtn = $$('#r_direction button').find(b => b.classList.contains('on'));
    const direction = dirBtn ? dirBtn.dataset.val : 'reduce';

    const activeBtn = $$('#r_distribution button').find(b => b.classList.contains('on'));
    const dist = activeBtn ? activeBtn.dataset.val : 'Even';

    const adj = {
      adjustment_id:     adjId || null,
      resource_name:     resource,
      start_date:        start,
      end_date:          end,
      hours_reduction:   hours,
      direction:         direction,
      distribution:      dist,
      reason:            reason,
      scenario_id:       scenario || '',
      deployment_id:     ($('#r_deployment_id') && !$('#r_deployment_id').disabled) ? ($('#r_deployment_id').value || '') : '',
      status:            commitNow ? 'Committed' : 'Modeled'
    };

    const panel = $('#reductionDrawer .drawer-panel') || $('#reductionDrawer');
    const spinner = panel?.querySelector('.drawer-spinner');
    if (panel) panel.classList.add('is-submitting');
    if (spinner) spinner.textContent = commitNow ? 'Committing...' : 'Saving...';
    try {
      await call('api_saveCapacityAdjustment', adj);
      toast(commitNow ? 'Adjustment committed' : 'Adjustment saved as modeled', 'ok');
      $('#reductionDrawer').hidden = true;

      // Refresh relevant views
      if (State.currentView === 'scenarios' && State.selectedScenario) {
        await loadScenarioAssignments_(State.selectedScenario);
      }
      refreshExplorerSurfaces_(resource);
    } catch (err) {
      toast('Save failed: ' + err.message, 'err');
    } finally {
      if (panel) panel.classList.remove('is-submitting');
    }
  }

  // Reduction drawer close — also clear the deployment lock
  $('#reductionDrawer')?.addEventListener('click', (e) => {
    if (e.target.dataset && e.target.dataset.close !== undefined) {
      $('#reductionDrawer').hidden = true;
      _reductionDrawerDepLock = null;
    }
  });
</script>

<script>
// ============================================================
// Capacity Explorer — unified three-surface refresh
// ============================================================

/**
 * Refresh all three Capacity Explorer surfaces for a given worker.
 * Guards on both State.currentView and State.selectedResource so
 * saves from other views don't trigger wasted fetches.
 * @param {string} workerName
 */
function refreshExplorerSurfaces_(workerName) {
  if (State.currentView === 'explorer' && State.selectedResource === workerName) {
    loadResourceDetail_(workerName);
  }
  if (State.projectAllocation && State.projectAllocation.resource === workerName) {
