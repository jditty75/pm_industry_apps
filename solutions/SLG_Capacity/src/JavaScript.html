<script>
  // ============================================================
  // Client state — applied filters (what the server currently sees)
  // + draft filters (what the user is staging inside the drawer)
  //
  // Priority 2 rename: State.filters.teams → State.filters.managers.
  // Server param contract stays as `teams`; client translates at
  // every server call site via buildServerParams_.
  //
  // Priority 3: Worker Scope has per-view defaults via
  // VIEW_WORKER_SCOPE_DEFAULTS. State.workerScopeChangedManually
  // tracks whether the user has explicitly overridden the view's
  // default, so navigation auto-flips only when they haven't.
  // ============================================================
  const FILTER_DEFAULTS = Object.freeze({
    quarter: null,
    managers: [],
    teamLabel: null,
    viewMode: 'Committed',
    groupBy: 'Individual',
    scenarioId: null,
    includeTimeOff: true,
    workerScope: 'All',     // global fallback; per-view overrides below
    includeMyManagers: true  // Priority 1: include-reports defaults on
  });

  // Priority 3: per-view Worker Scope defaults.
  // Views not listed inherit FILTER_DEFAULTS.workerScope.
  const VIEW_WORKER_SCOPE_DEFAULTS = Object.freeze({
    dashboard: 'SLG',
    explorer: 'SLG',
    reporting: 'All'
    // pipeline, deployments, scenarios, admin — inherit FILTER_DEFAULTS.workerScope
  });

  const State = {
    ref: null,
    filters: Object.assign({}, FILTER_DEFAULTS),
    draftFilters: Object.assign({}, FILTER_DEFAULTS),
    workerScopeChangedManually: false,  // Priority 3
    dashboard: null,
    dashboardCache: null,
    opportunities: [],
    deployments: [],
    scenarios: [],
    currentView: 'dashboard',
    selectedResource: null,
    selectedScenario: null,
    workerPlanning: null,      // Drop 7: { rows, summary } for Planning Detail card
    reporting: null,
    rpAccountsAll: [],
    rpHoursTotal: 0,
    rpExpandedTeams: null,
    rpExpandedAccounts: null,
    rpDiagnosticsOpen: false,
    rpActiveDrill: null,
    charts: {},
    projectAllocation: null  // { resource, monthKey } when Project Allocation card is open
  };

  // ============================================================
  // Utilities
  // ============================================================
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function fmtPct(v) {
    if (v == null || isNaN(v)) return '—';
    return Math.round(v * 100) + '%';
  }
  function fmtPct1(v) {
    if (v == null || isNaN(v)) return '—';
    return (Math.round(v * 1000) / 10).toFixed(1) + '%';
  }
  function fmtFte(v) {
    if (v == null || isNaN(v)) return '—';
    return (Math.round(v * 10) / 10).toFixed(1);
  }
  function fmtMoney(v) {
    if (!v) return '$0';
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
    if (v >= 1e3) return '$' + Math.round(v / 1e3) + 'K';
    return '$' + v;
  }
  function fmtHours(v) {
    if (v == null || isNaN(v)) return '—';
    return Math.round(v).toLocaleString();
  }
  function fmtDate(d) {
    if (!d) return '—';
    const x = new Date(d);
    if (isNaN(x)) return '—';
    return x.toISOString().slice(0, 10);
  }
  function fmtDateTime(d) {
    if (!d) return '—';
    const x = new Date(d);
    if (isNaN(x)) return String(d);
    return x.toLocaleString('en-US', {
      year: 'numeric', month: 'short', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  }
  function fmtMonth(monthKey) {
    const [y, m] = monthKey.split('-');
    const dt = new Date(+y, +m - 1, 1);
    return dt.toLocaleString('en', { month: 'short', year: '2-digit' });
  }

  // ============================================================
  // Fiscal calendar (weekly-forecast-migration §4/§13) -- MUST mirror
  // Constants.gs's FISCAL_YEAR_START_MONTH/FISCAL_QUARTER_BY_CALENDAR_MONTH
  // and Util.gs's fiscalYear_/fiscalQuarter_/fiscalQuarterKey_ exactly, so
  // client and server produce identical fiscal-quarter keys (e.g. 'FY27-Q2').
  // Replaces the old calendar Math.floor(month/3) quarter mapping
  // everywhere on the client (recomputeKpisForClient, chip strip label,
  // #quarterFilter comparisons).
  // ============================================================
  const FISCAL_YEAR_START_MONTH = 2; // February
  const FISCAL_QUARTER_BY_CALENDAR_MONTH = {
    1:  'Q4',
    2:  'Q1', 3:  'Q1', 4:  'Q1',
    5:  'Q2', 6:  'Q2', 7:  'Q2',
    8:  'Q3', 9:  'Q3', 10: 'Q3',
    11: 'Q4', 12: 'Q4'
  };
  function fiscalYear_(d) {
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    return (m >= FISCAL_YEAR_START_MONTH) ? y + 1 : y;
  }
  function fiscalQuarter_(d) {
    return FISCAL_QUARTER_BY_CALENDAR_MONTH[d.getMonth() + 1];
  }
  function fiscalQuarterKey_(d) {
    const fy = fiscalYear_(d);
    const q = fiscalQuarter_(d);
    return 'FY' + String(fy % 100).padStart(2, '0') + '-' + q;
  }
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => {
          // Detect server-side authorization failure mid-session
          if (err && String(err.message || '').indexOf('NOT_AUTHORIZED') >= 0) {
            renderAccessDenied_({
              email: (State.ref && State.ref.user) || '',
              emailDomain: 'workday.com'  // assume Workday since they got past init
            });
            return;  // do not invoke reject; the page is now access-denied
          }
          reject(err);
        })[fn](...args);
    });
  }
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    $('#toastStack').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
  function escapeHtml_(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function debounce_(fn, wait) {
    let timer;
    return function(...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), wait);
    };
  }

  /**
   * Drop 7: Generic loading-state wrapper for async button handlers.
   * Disables the button, swaps its label, adds .is-loading, and restores
   * on completion (success or failure). Returns asyncFn's result.
   *
   * @param {HTMLElement|null} button
   * @param {function():Promise} asyncFn
   * @param {{ label?: string }} [options]
   */
  async function withLoading_(button, asyncFn, options) {
    options = options || {};
    if (!button) return asyncFn();
    const originalText = button.textContent;
    const loadingLabel = options.label || 'Working...';
    button.disabled = true;
    button.classList.add('is-loading');
    button.dataset.originalText = originalText;
    button.textContent = loadingLabel;
    try {
      return await asyncFn();
    } finally {
      button.disabled = false;
      button.classList.remove('is-loading');
      button.textContent = button.dataset.originalText || originalText;
      delete button.dataset.originalText;
    }
  }

  // ============================================================
  // Issue 1: Generic confirm modal helper.
  // Replaces all synchronous window.confirm() call sites.
  // ============================================================
  let _confirmModalOpen = false;

  /**
   * Show a confirmation modal that blocks until the user decides.
   * If asyncHandler is provided, runs it on confirm with proper button-disable + spinner.
   *
   * @param {Object} opts
   * @param {string} opts.title            - Modal title
   * @param {string} opts.body             - Modal body text (plain text; will be escaped)
   * @param {string} [opts.confirmLabel]   - Confirm button label. Default: 'Confirm'
   * @param {string} [opts.cancelLabel]    - Cancel button label. Default: 'Cancel'
   * @param {'primary'|'danger'} [opts.confirmStyle] - Default: 'primary'
   * @param {Function} [opts.asyncHandler] - async () => any. Runs on confirm.
   *                                          If it throws, error is shown inline, modal stays open.
   * @returns {Promise<boolean>} true if confirmed (and handler resolved), false if canceled
   */
  function confirmAction_(opts) {
    if (_confirmModalOpen) throw new Error('confirmAction_: a confirm modal is already open');
    opts = opts || {};
    const title        = opts.title        || 'Confirm';
    const bodyText     = opts.body         || '';
    const confirmLabel = opts.confirmLabel || 'Confirm';
    const cancelLabel  = opts.cancelLabel  || 'Cancel';
    const confirmStyle = opts.confirmStyle || 'primary';
    const asyncHandler = opts.asyncHandler || null;

    return new Promise(function(resolve) {
      _confirmModalOpen = true;
      const modal      = $('#confirmModal');
      const titleEl    = $('#confirmModalTitle');
      const bodyEl     = $('#confirmModalBody');
      const errorEl    = $('#confirmModalError');
      const confirmBtn = $('#confirmModalConfirm');
      const cancelBtn  = $('#confirmModalCancel');

      titleEl.textContent   = title;
      bodyEl.textContent    = bodyText;
      errorEl.textContent   = '';
      errorEl.hidden        = true;
      confirmBtn.textContent = confirmLabel;
      confirmBtn.className  = 'btn-primary' + (confirmStyle === 'danger' ? ' danger' : '');
      cancelBtn.textContent = cancelLabel;
      confirmBtn.disabled   = false;
      cancelBtn.disabled    = false;
      modal.hidden          = false;

      let inflight = false;

      function closeModal(result) {
        modal.hidden = true;
        _confirmModalOpen = false;
        modal.removeEventListener('click', onModalClick);
        document.removeEventListener('keydown', onKeyDown);
        resolve(result);
      }

      function onModalClick(e) {
        if (inflight) return;
        if (e.target.dataset && e.target.dataset.confirmClose !== undefined) closeModal(false);
      }

      function onKeyDown(e) {
        if (inflight) return;
        if (e.key === 'Escape') closeModal(false);
      }

      cancelBtn.onclick = function() {
        if (inflight) return;
        closeModal(false);
      };

      confirmBtn.onclick = async function() {
        if (inflight) return;
        if (!asyncHandler) { closeModal(true); return; }
        inflight = true;
        confirmBtn.disabled = true;
        cancelBtn.disabled  = true;
        confirmBtn.classList.add('is-loading');
        confirmBtn.textContent = 'Working\u2026';
        errorEl.hidden = true;
        try {
          await asyncHandler();
          inflight = false;
          closeModal(true);
        } catch (err) {
          inflight = false;
          confirmBtn.disabled = false;
          cancelBtn.disabled  = false;
          confirmBtn.classList.remove('is-loading');
          confirmBtn.textContent = confirmLabel;
          errorEl.textContent = (err && err.message) ? err.message : String(err);
          errorEl.hidden = false;
        }
      };

      modal.addEventListener('click', onModalClick);
      document.addEventListener('keydown', onKeyDown);
    });
  }

  // ============================================================
  // Priority 2: build server params with rename translation.
  // Client state uses `managers` and `teamLabel`. Server param
  // contract stays as `teams`. Centralizing the translation here
  // means every server call site stays consistent.
  // ============================================================
  function buildServerParams_(extra) {
    const f = State.filters;
    return Object.assign({
      teams: (f.managers && f.managers.length) ? f.managers : null,
      teamLabel: f.teamLabel || null,
      includeMyManagers: !!f.includeMyManagers,
      workerScope: f.workerScope || 'All',
      viewMode: f.viewMode || 'Committed',
      scenarioId: f.scenarioId || null,
      quarter: f.quarter || null,
      includeTimeOff: !!f.includeTimeOff,
      groupBy: f.groupBy || 'Individual'
    }, extra || {});
  }

  // ============================================================
  // Priority 3: per-view Worker Scope helpers.
  //
  // workerScopeDefaultForView_(view): returns the default scope for a
  //   given view ('dashboard' → 'SLG', etc.). Falls back to
  //   FILTER_DEFAULTS.workerScope for views without a specific default.
  //
  // applyViewWorkerScope_(view): if the user hasn't manually overridden
  //   Worker Scope, set State.filters.workerScope to the view's default.
  //   Returns true if the scope actually changed (so callers can know
  //   whether to invalidate a downstream load).
  //
  // currentViewWorkerScopeDefault_(): convenience for chip-strip
  //   comparison and reset behavior.
  // ============================================================
  function workerScopeDefaultForView_(view) {
    return VIEW_WORKER_SCOPE_DEFAULTS[view] || FILTER_DEFAULTS.workerScope;
  }
  function currentViewWorkerScopeDefault_() {
    return workerScopeDefaultForView_(State.currentView);
  }
  function applyViewWorkerScope_(view) {
    if (State.workerScopeChangedManually) return false;
    const target = workerScopeDefaultForView_(view);
    if (State.filters.workerScope === target) return false;
    State.filters.workerScope = target;
    return true;
  }

  // Heatmap color (diverging relative to ICP)
  function cellColor(utilization, icpTarget) {
    if (!utilization && utilization !== 0) {
      return { bg: 'var(--business-card)', fg: 'var(--staple)' };
    }
    const ratio = icpTarget > 0 ? utilization / icpTarget : 1;
    if (ratio < 0.60) return { bg: '#D6EBF9', fg: '#0a3d7c' };
    if (ratio < 0.85) return { bg: 'var(--blue-sky)', fg: '#0a3d7c' };
    if (ratio < 1.00) return { bg: '#FFF1B8', fg: '#6b4e00' };
    if (ratio < 1.10) return { bg: 'var(--pencil)', fg: '#3d2e00' };
    if (ratio < 1.25) return { bg: 'var(--happy-hour)', fg: '#fff' };
    return { bg: 'var(--thumbtack)', fg: '#fff' };
  }

  const GROUP_LABELS = {
    Individual: 'Individual',
    Team: 'SLG Team',
    Role: 'Job Profile',
    Function: 'Project Function'
  };

  const WORKER_SCOPE_LABELS = {
    SLG: 'SLG',
    NonSLG: 'NonSLG',
    Partners: 'Partners',
    WorkdayOnly: 'Workday Only',
    All: 'All'
  };

  function cssVar_(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // ============================================================
  // Month helpers — current month and later + planning window
  // ============================================================
  function monthKeyOnOrAfterToday(monthKey) {
    if (!monthKey) return false;
    const parts = monthKey.split('-');
    if (parts.length < 2) return false;
    const y = Number(parts[0]);
    const m = Number(parts[1]);
    if (!y || !m) return false;
    const today = new Date();
    const cy = today.getFullYear();
    const cm = today.getMonth() + 1;
    return y > cy || (y === cy && m >= cm);
  }

  function applyPlanningWindow(dashboardData) {
    const allMonths = dashboardData.heatmap?.months || [];
    if (!allMonths.length) return dashboardData;

    const windowMonths = (State.ref && State.ref.planningWindowMonths) ||
                         dashboardData.planningWindowMonths || 6;

    const desired = [];
    const today = new Date();
    for (let i = 0; i < windowMonths; i++) {
      const dt = new Date(today.getFullYear(), today.getMonth() + i, 1);
      const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      desired.push(key);
    }
    const desiredSet = new Set(desired);

    let keepMonths = allMonths.filter(m => desiredSet.has(m));
    if (!keepMonths.length) keepMonths = allMonths.slice(-windowMonths);

    const monthSet = new Set(keepMonths);
    dashboardData.heatmap.months = keepMonths;
    if (dashboardData.heatmap.cells) {
      dashboardData.heatmap.cells = dashboardData.heatmap.cells.filter(c => monthSet.has(c.monthKey));
    }
    if (dashboardData.trend) {
      dashboardData.trend = dashboardData.trend.filter(t => monthSet.has(t.monthKey));
    }
    dashboardData.monthsInView = keepMonths;
    return dashboardData;
  }

  function recomputeKpisForClient(d, quarterFilter) {
    const monthsInView = d.monthsInView || (d.heatmap ? d.heatmap.months : []);
    const baseMonthSet = new Set(monthsInView);
    let monthSet = baseMonthSet;

    if (quarterFilter) {
      const qSet = new Set();
      monthsInView.forEach(mk => {
        const [y, m] = mk.split('-');
        const dt = new Date(+y, +m - 1, 1);
        const qKey = fiscalQuarterKey_(dt);
        if (qKey === quarterFilter) qSet.add(mk);
      });
      if (qSet.size) monthSet = qSet;
    }

    const includePTO = State.filters.includeTimeOff;
    let totalCommittedHours = 0;
    let totalScenarioHours = 0;
    let usedSum = 0, capSum = 0;

    const byResource = d.byResource || [];
    const over = [];
    const under = [];

    if (byResource.length) {
      byResource.forEach(r => {
        let numUtil = 0, denUtil = 0;
        r.months.forEach(m => {
          if (!monthSet.has(m.monthKey)) return;
          const committedWork = m.committed || 0;
          const ptoHours = m.timeOff || 0;
          const scenarioHours = m.scenario || 0;
          const cap = Number(m.capacity) || 0;
          const usedHours = includePTO ? committedWork + ptoHours : committedWork;
          totalCommittedHours += usedHours;
          totalScenarioHours += scenarioHours;
          if (cap > 0) {
            usedSum += usedHours;
            capSum += cap;
            numUtil += usedHours / cap;
            denUtil += 1;
          }
        });
        if (!denUtil) return;
        const avgUtil = numUtil / denUtil;
        if (avgUtil > 1.05) over.push({ name: r.resource, avgUtil });
        else if (avgUtil < 0.75) under.push({ name: r.resource, avgUtil });
      });
    } else if (d.heatmap && d.heatmap.cells) {
      d.heatmap.cells.forEach(c => {
        if (!monthSet.has(c.monthKey)) return;
        const committedWork = Number(c.committed) || 0;
        const ptoHours = Number(c.timeOff) || 0;
        const cap = Number(c.capacity) || 0;
        const usedHours = includePTO ? committedWork + ptoHours : committedWork;
        totalCommittedHours += usedHours;
        if (cap > 0) { usedSum += usedHours; capSum += cap; }
      });
    }

    const avgUtilization = capSum > 0 ? usedSum / capSum : 0;
    const headcount = byResource.length;

    return {
      totalCommittedHours,
      scenarioDemandHours: totalScenarioHours,
      overUtilized: over,
      underUtilized: under,
      avgUtilization,
      headcount
    };
  }

  // ============================================================
  // Routing
  //
  // Priority 3: showView() applies the view's Worker Scope default
  // BEFORE the view-specific load function fires, so the load
  // happens with the correct scope on the first request.
  // ============================================================
  function showView(name) {
    const previousView = State.currentView;
    State.currentView = name;

    // Priority 3: apply view-default Worker Scope before load.
    // Returns true if the scope changed; we don't need to act on
    // that here because the load function below will use the new
    // value via buildServerParams_.
    applyViewWorkerScope_(name);

    $$('.view').forEach(v => { v.hidden = v.dataset.view !== name; });
    $$('.nav-item').forEach(n =>
      n.classList.toggle('active', n.dataset.view === name)
    );

    // If scope changed, the chip strip needs to re-render even if
    // the load function doesn't trigger onAppliedFiltersChanged_.
    if (previousView !== name) {
      renderChipStrip_();
      updateFilterCountBadge_();
    }

    if (name === 'dashboard') loadDashboard();
    if (name === 'quarterly-scorecard') loadQuarterlyScorecard();
    if (name === 'explorer') renderResourceList();
    if (name === 'pipeline') loadOpportunities();
    if (name === 'deployments') loadDeployments();
    if (name === 'scenarios') loadScenarios();
    if (name === 'reporting') loadReporting();
    if (name === 'admin') {
      const savedTab = localStorage.getItem(ADMIN_TAB_KEY) || 'operations';
      activateAdminTab_(savedTab);
      loadAdmin();
    }
  }
  $$('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => showView(btn.dataset.view));
  });
  // Desktop-first (weekly-forecast-migration §9/§11): the mobile hamburger
  // button and off-canvas sidebar toggle are gone (#hamburger removed from
  // Index.html); the sidebar is always visible now.

  // ============================================================
  // Init
  // ============================================================
  async function init() {
    try {
      let access;
      try {
        access = await call('api_getCurrentUserAccess');
      } catch (err) {
        renderAccessError_('There was a problem checking your access. Try refreshing.');
        return;
      }

      if (!access.canViewApp) {
        renderAccessDenied_(access);
        return;  // do not proceed with the rest of init
      }

      State.ref = await call('api_getReference');
      $('#userChip').textContent = State.ref.user || 'unknown';

      const qSel = $('#quarterFilter');
      qSel.innerHTML = '<option value="">All quarters</option>' +
        State.ref.quarters.map(q => `<option value="${q}">${q}</option>`).join('');
      qSel.value = '';
      qSel.addEventListener('change', () => {
        State.filters.quarter = qSel.value || null;
        onAppliedFiltersChanged_();
      });

      renderTeamLabelSelect();   // Priority 2 — Team dropdown
      renderTeamsSelect();        // Manager dropdown

      $('#openFiltersBtn').addEventListener('click', openFiltersDrawer_);
      $('#refreshBtn').addEventListener('click', async (e) => {
        const btn = e.currentTarget;
        State.dashboardCache = null;
        await withLoading_(btn, async () => {
          await refreshReferenceData_();
          await reloadCurrentView_();
        }, { label: 'Refreshing...' });
      });

      initFiltersDrawer_();
      initAdminTabs_();

      $('#chipStrip').addEventListener('click', onChipStripClick_);
      $('#chipClearAll').addEventListener('click', clearAllFilters_);

      initReportingHandlers_();

      // Priority 1: apply auto-manager defaults based on logged-in user.
      applyAutoManagerDefaults_();

      // Priority 3: apply initial view's Worker Scope default
      // (Dashboard → SLG). Must run AFTER applyAutoManagerDefaults_
      // so we don't overwrite an intentional state.
      applyViewWorkerScope_('dashboard');

      renderChipStrip_();
      updateFilterCountBadge_();

      showView('dashboard');

      // Background fetch: populate Admin tab override badge without blocking init.
      setTimeout(function () {
        call('api_getOverrideHygieneSummary').then(function (h) {
          const count = (h.expiringSoon || 0) + (h.stale || 0);
          const badge = $('#adminTabBadgeOverrides');
          if (!badge) return;
          if (count > 0) {
            badge.textContent = String(count);
            badge.hidden = false;
          } else {
            badge.hidden = true;
          }
        }).catch(function () {});
      }, 1500);

    } catch (err) {
      toast('Init failed: ' + err.message, 'err');
      console.error(err);
    }
  }
  document.addEventListener('DOMContentLoaded', init);

  // ============================================================
  // Access-denied renderers (RESTRICTED_DOMAIN gating)
  // ============================================================

  function renderAccessDenied_(access) {
    const email = escapeHtml_((access && access.email) || '(unknown)');
    const domain = (access && access.emailDomain) || '';
    let html;
    if (domain === 'workday.com') {
      // Variant B — Workday account but not authorized
      html = `<div class="access-denied">
        <h1>Access required</h1>
        <p>The SLG Capacity Planner is restricted to authorized users. If you believe you should have access, contact <a href="mailto:jeffrey.ditty@workday.com">jeffrey.ditty@workday.com</a>.</p>
        <p class="muted">Signed in as: <strong>${email}</strong></p>
      </div>`;
    } else {
      // Variant A — non-Workday account
      html = `<div class="access-denied">
        <h1>Access required</h1>
        <p>The SLG Capacity Planner requires a Workday corporate account.</p>
        <p class="muted">Signed in as: <strong>${email}</strong></p>
        <p>Please <a href="https://accounts.google.com/Logout" target="_blank" rel="noopener">sign out of Google</a> and sign back in with your @workday.com identity.</p>
      </div>`;
    }
    const app = document.getElementById('app');
    if (app) app.innerHTML = html;
  }

  function renderAccessError_(msg) {
    const html = `<div class="access-denied">
      <h1>Unable to verify access</h1>
      <p>${escapeHtml_(msg)}</p>
      <p><a href="javascript:location.reload()">Refresh page</a></p>
    </div>`;
    const app = document.getElementById('app');
    if (app) app.innerHTML = html;
  }

  // ============================================================
  // Priority 1: Auto-set Manager filter from logged-in user
  //
  // WFM-FIX.1: personalized boot default. default_team_filter previously
  // hardcoded 'Delivery' for everyone, which was wrong for most users and
  // (because the Team filter suppresses the Manager filter) actively
  // masked the manager hierarchy for those users. Boot behavior is now:
  //   - Recognized manager  -> their own FULL org (self + descendants),
  //                            no team filter.
  //   - Admin / unrecognized-but-authorized -> all workers, all teams,
  //                            no filters.
  // ============================================================
  function applyAutoManagerDefaults_() {
    const ref = State.ref || {};
    const matched = ref.matchedManager || null;

    // Never set a team filter on boot — the manager hierarchy is the scope.
    State.filters.teamLabel = null;

    if (ref.userIsAdmin || !matched) {
      // Admin (Jeff, Windsel) or unrecognized → all workers, all teams, no filter.
      State.filters.managers = [];
    } else {
      // Recognized manager → boot into their FULL org (self + descendants).
      State.filters.managers = [matched];
      State.filters.includeMyManagers = true;
    }

    const mgrSel = $('#teamsSelect');
    if (mgrSel) mgrSel.value = State.filters.managers[0] || '';
    const teamSel = $('#teamLabelFilter');
    if (teamSel) teamSel.value = '';
  }

  function onAppliedFiltersChanged_() {
    State.dashboardCache = null;
    renderChipStrip_();
    updateFilterCountBadge_();
    reloadCurrentView_();
  }

  async function reloadCurrentView_() {
    if (State.currentView === 'dashboard')    return loadDashboard();
    if (State.currentView === 'quarterly-scorecard') return loadQuarterlyScorecard();
    if (State.currentView === 'pipeline')     return loadOpportunities();
    if (State.currentView === 'deployments')  return loadDeployments();
    if (State.currentView === 'scenarios')    return loadScenarios();
    if (State.currentView === 'reporting')    return loadReporting();
    if (State.currentView === 'admin')        return loadAdmin();
    if (State.currentView === 'explorer') {
      renderResourceList();
      // If a worker is currently selected, re-fetch their detail so
      // the chart reflects current View Mode / scenarioId filters.
      if (State.selectedResource) {
        await loadResourceDetail_(State.selectedResource);
      }
    }
  }

  /**
   * Re-fetch api_getReference and update State.ref, then re-render all
   * dropdowns that source from reference data (manager filter, team label
   * filter). Called by the global Refresh button so new generic workers,
   * exclusion changes, etc. surface without a full page reload.
   *
   * Does NOT re-attach event listeners — renderTeamsSelect and
   * renderTeamLabelSelect both use .onchange = ... (not addEventListener)
   * so they are safe to call on every refresh.
   */
  async function refreshReferenceData_() {
    try {
      State.ref = await call('api_getReference');
      renderTeamLabelSelect();
      renderTeamsSelect();
      if (State.currentView === 'explorer') renderResourceList();
    } catch (e) {
      // Swallow — reloadCurrentView_ still runs with the previous State.ref.
    }
  }
</script>

<script>
  // ============================================================
  // Manager filter dropdown (#teamsSelect — id retained for
  // backwards-compat; underlying state is State.filters.managers).
  // ============================================================
  function renderTeamsSelect() {
    const sel = $('#teamsSelect');
    const source = (State.ref && Array.isArray(State.ref.managerOrgs))
      ? State.ref.managerOrgs : [];

    const managerOptions = source
      .map(t => `<option value="${t.replace(/"/g, '&quot;')}">${t}</option>`)
      .join('');

    sel.innerHTML = `<option value="">All managers</option>` + managerOptions;
    sel.value = State.filters.managers.length ? State.filters.managers[0] : '';

    // Use onchange (not addEventListener) so re-renders don't stack listeners.
    sel.onchange = () => {
      const val = sel.value;
      State.filters.managers = val ? [val] : [];
      // WFM-FIX.1: selecting a manager from the topbar defaults to their
      // full reporting hierarchy (see all by default, then filter down).
      // Prevents a stale includeMyManagers=false from a prior drawer
      // Apply / Clear All from collapsing the view to direct reports only.
      if (val) State.filters.includeMyManagers = true;
      onAppliedFiltersChanged_();
    };
  }

  // ============================================================
  // Priority 2: Team filter dropdown (#teamLabelFilter).
  // ============================================================
  function renderTeamLabelSelect() {
    const sel = $('#teamLabelFilter');
    if (!sel) return;
    const source = (State.ref && Array.isArray(State.ref.teamLabels))
      ? State.ref.teamLabels : [];

    const opts = source
      .map(t => `<option value="${t.replace(/"/g, '&quot;')}">${t}</option>`)
      .join('');

    sel.innerHTML = `<option value="">All teams</option>` + opts;
    sel.value = State.filters.teamLabel || '';

    // WFM-FIX.1: no team filter is forced at boot (see
    // applyAutoManagerDefaults_) — the manager hierarchy is the scope.

    // Use onchange (not addEventListener) so re-renders don't stack listeners.
    sel.onchange = () => {
      sel.dataset.userTouched = '1';
      const val = sel.value;
      State.filters.teamLabel = val || null;
      onAppliedFiltersChanged_();
    };
  }
</script>

<script>
  // ============================================================
  // Filters drawer (apply-on-click)
  //
  // Priority 3: Worker Scope drawer click marks workerScopeChangedManually.
  // ============================================================
  function initFiltersDrawer_() {
    $('#drawerViewModeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $$('#drawerViewModeSeg button').forEach(x => x.classList.toggle('on', x === b));
      State.draftFilters.viewMode = b.dataset.val;
      $('#drawerScenarioField').hidden = State.draftFilters.viewMode !== 'Scenario';
      markDirty_(b);
    });

    $('#drawerWorkerScopeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $$('#drawerWorkerScopeSeg button').forEach(x => x.classList.toggle('on', x === b));
      State.draftFilters.workerScope = b.dataset.val || 'All';
      markDirty_(b);
    });

    $('#drawerIncludeMyManagers').addEventListener('change', (e) => {
      State.draftFilters.includeMyManagers = !!e.target.checked;
      markDirty_(e.target);
    });

    $('#drawerIncludeTimeOffToggle').addEventListener('change', (e) => {
      State.draftFilters.includeTimeOff = !!e.target.checked;
      markDirty_(e.target);
    });

    $('#drawerScenarioSelect').addEventListener('change', (e) => {
      State.draftFilters.scenarioId = e.target.value || null;
      markDirty_(e.target);
    });

    $('#filtersApplyBtn').addEventListener('click', applyDraftFilters_);
    $('#filtersResetBtn').addEventListener('click', resetDraftFiltersToDefaults_);

    $('#filtersDrawer').addEventListener('click', (e) => {
      if (e.target.dataset && e.target.dataset.close !== undefined) {
        closeFiltersDrawer_();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const d = $('#filtersDrawer');
        if (d && !d.hidden) closeFiltersDrawer_();
      }
    });
  }

  function markDirty_(el) {
    const field = el && el.closest && el.closest('.field');
    if (field) field.classList.add('dirty');
  }
  function clearDirtyMarks_() {
    $$('#filtersDrawer .field.dirty').forEach(f => f.classList.remove('dirty'));
  }
  async function openFiltersDrawer_() {
    if (!State.scenarios.length) await loadScenariosList();
    State.draftFilters = Object.assign({}, State.filters);
    syncDrawerInputsToDraft_();
    clearDirtyMarks_();
    $('#filtersDrawer').hidden = false;
  }
  function closeFiltersDrawer_() {
    $('#filtersDrawer').hidden = true;
    clearDirtyMarks_();
  }

  function syncDrawerInputsToDraft_() {
    const d = State.draftFilters;

    $('#drawerIncludeMyManagers').checked = !!d.includeMyManagers;

    let ws = String(d.workerScope || 'All');
    if (ws === 'External') ws = 'NonSLG';
    if (ws === 'Both') ws = 'All';
    $$('#drawerWorkerScopeSeg button').forEach(btn => {
      btn.classList.toggle('on', btn.dataset.val === ws);
    });

    $$('#drawerViewModeSeg button').forEach(btn => {
      btn.classList.toggle('on', btn.dataset.val === d.viewMode);
    });

    $('#drawerScenarioField').hidden = d.viewMode !== 'Scenario';

    const scenSel = $('#drawerScenarioSelect');
    if (scenSel) {
      scenSel.innerHTML = '<option value="">— No scenario —</option>' +
        (State.scenarios || [])
          .filter(s => s.status !== 'Archived')
          .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`)
          .join('');
      scenSel.value = d.scenarioId || '';
    }

    $('#drawerIncludeTimeOffToggle').checked = !!d.includeTimeOff;
  }

  function applyDraftFilters_() {
    // Priority 3: if Worker Scope changed via the drawer, mark it manual.
    if (State.draftFilters.workerScope !== State.filters.workerScope) {
      State.workerScopeChangedManually = true;
    }

    State.filters = Object.assign({}, State.draftFilters);

    const mgrSel = $('#teamsSelect');
    if (mgrSel) mgrSel.value = State.filters.managers.length ? State.filters.managers[0] : '';

    const teamSel = $('#teamLabelFilter');
    if (teamSel) teamSel.value = State.filters.teamLabel || '';

    closeFiltersDrawer_();
    onAppliedFiltersChanged_();
    toast('Filters applied', 'ok');
  }

  function resetDraftFiltersToDefaults_() {
    // Priority 3: reset honors the CURRENT VIEW's Worker Scope default,
    // not the global FILTER_DEFAULTS.
    State.draftFilters = Object.assign({}, FILTER_DEFAULTS);
    State.draftFilters.workerScope = currentViewWorkerScopeDefault_();
    // Preserve pinned topbar fields that user sets directly outside drawer
    State.draftFilters.quarter = State.filters.quarter;
    State.draftFilters.managers = State.filters.managers.slice();
    State.draftFilters.teamLabel = State.filters.teamLabel;
    syncDrawerInputsToDraft_();
    $$('#filtersDrawer .field.dirty').forEach(f => f.classList.add('dirty'));
  }
</script>

<script>
  // ============================================================
  // Chip strip — active-filter summary with inline ✕ clear
  //
  // Priority 3: Worker Scope chip compares against current-view default,
  // not global FILTER_DEFAULTS. So a Dashboard user at SLG sees no chip
  // (it's the view default); a Reporting user at SLG sees a chip
  // (override of the view default).
  // ============================================================
  function getActiveFilterChips_() {
    const chips = [];
    const f = State.filters;

    if (f.quarter) {
      chips.push({ key: 'quarter', label: 'Quarter', value: f.quarter });
    }
    if (f.teamLabel) {
      chips.push({ key: 'teamLabel', label: 'Team', value: f.teamLabel });
    }
    if (f.managers && f.managers.length) {
      chips.push({
        key: 'managers',
        label: 'Manager',
        value: f.managers[0],
        suspended: !!f.teamLabel,
        suspendedReason: 'Manager filter suspended while Team filter is active'
      });
    }
    if (f.includeMyManagers !== FILTER_DEFAULTS.includeMyManagers && !f.teamLabel) {
      chips.push({ key: 'includeMyManagers', label: 'Manager scope', value: f.includeMyManagers ? 'Include reports' : 'Direct only' });
    }

    // Priority 3: compare Worker Scope against current-view default.
    const viewWsDefault = currentViewWorkerScopeDefault_();
    if (f.workerScope && f.workerScope !== viewWsDefault) {
      const lbl = WORKER_SCOPE_LABELS[f.workerScope] || f.workerScope;
      chips.push({ key: 'workerScope', label: 'Worker scope', value: lbl });
    }

    if (f.viewMode && f.viewMode !== FILTER_DEFAULTS.viewMode) {
      chips.push({ key: 'viewMode', label: 'View mode', value: f.viewMode });
    }
    if (f.viewMode === 'Scenario' && f.scenarioId) {
      const sc = (State.scenarios || []).find(s => s.scenario_id === f.scenarioId);
      chips.push({ key: 'scenarioId', label: 'Scenario', value: sc ? sc.name : f.scenarioId });
    }
    if (f.includeTimeOff !== FILTER_DEFAULTS.includeTimeOff) {
      chips.push({
        key: 'includeTimeOff', label: 'Time off',
        value: f.includeTimeOff ? 'Include PTO/Holiday' : 'Exclude PTO/Holiday'
      });
    }
    if (f.groupBy && f.groupBy !== FILTER_DEFAULTS.groupBy) {
      chips.push({ key: 'groupBy', label: 'Group by', value: GROUP_LABELS[f.groupBy] || f.groupBy });
    }
    return chips;
  }

  function renderChipStrip_() {
    const chips = getActiveFilterChips_();
    const strip = $('#chipStrip');
    const items = $('#chipStripItems');
    const clearAll = $('#chipClearAll');

    if (!chips.length) {
      strip.hidden = true;
      items.innerHTML = '';
      clearAll.hidden = true;
      return;
    }

    strip.hidden = false;
    items.innerHTML = chips.map(c => {
      const suspended = !!c.suspended;
      const title = suspended
        ? (c.suspendedReason || 'This filter is suspended')
        : 'Click to change in the Filters drawer · ✕ to clear';
      const cls = 'chip' + (suspended ? ' chip-suspended' : '');
      return `
        <span class="${cls}" data-chip-key="${c.key}" title="${escapeHtml_(title)}">
          <span class="chip-label"><strong>${escapeHtml_(c.label)}:</strong> ${escapeHtml_(String(c.value))}</span>
          <button type="button" class="chip-clear" data-clear-key="${c.key}" title="Clear ${escapeHtml_(c.label)}">✕</button>
        </span>`;
    }).join('');
    clearAll.hidden = false;
  }

  function onChipStripClick_(e) {
    const clearBtn = e.target.closest('.chip-clear');
    if (clearBtn) {
      e.stopPropagation();
      clearSingleFilter_(clearBtn.dataset.clearKey);
      return;
    }
    const chip = e.target.closest('.chip');
    if (chip) {
      openFiltersDrawer_();
    }
  }

  function clearSingleFilter_(key) {
    if (!key) return;
    switch (key) {
      case 'quarter':
        State.filters.quarter = null;
        $('#quarterFilter').value = '';
        break;
      case 'teamLabel':
        State.filters.teamLabel = null;
        $('#teamLabelFilter').value = '';
        break;
      case 'managers':
        State.filters.managers = [];
        $('#teamsSelect').value = '';
        break;
      case 'includeMyManagers':
        State.filters.includeMyManagers = false;
        break;
      case 'workerScope':
        // Priority 3: clearing the workerScope chip resets to the
        // current view's default and clears the manual-override flag.
        State.workerScopeChangedManually = false;
        State.filters.workerScope = currentViewWorkerScopeDefault_();
        break;
      case 'viewMode':
        State.filters.viewMode = FILTER_DEFAULTS.viewMode;
        State.filters.scenarioId = null;
        break;
      case 'scenarioId':
        State.filters.scenarioId = null;
        break;
      case 'includeTimeOff':
        State.filters.includeTimeOff = FILTER_DEFAULTS.includeTimeOff;
        break;
      case 'groupBy':
        State.filters.groupBy = FILTER_DEFAULTS.groupBy;
        break;
      default:
        return;
    }
    onAppliedFiltersChanged_();
  }

  function clearAllFilters_() {
    // Reset to defaults, re-apply auto-manager match, then apply the
    // CURRENT VIEW's Worker Scope default (Priority 3). "Clear all"
    // means "back to your personalized default state."
    State.filters = Object.assign({}, FILTER_DEFAULTS);
    State.workerScopeChangedManually = false;
    $('#quarterFilter').value = '';
    $('#teamsSelect').value = '';
    $('#teamLabelFilter').value = '';
    applyAutoManagerDefaults_();
    applyViewWorkerScope_(State.currentView);
    onAppliedFiltersChanged_();
  }

  function updateFilterCountBadge_() {
    const chips = getActiveFilterChips_();
    const drawerChipCount = chips.filter(
      c => c.key !== 'quarter' && c.key !== 'managers' && c.key !== 'teamLabel'
    ).length;
    const badge = $('#filterCount');
    if (drawerChipCount > 0) {
      badge.textContent = String(drawerChipCount);
      badge.hidden = false;
    } else {
      badge.hidden = true;
    }
  }
</script>

<script>
  // ============================================================
  // Dashboard: KPIs, weekly forecast table
  // ============================================================
  // WFM-PERF.2: honest loading state for the Dashboard's first (possibly
  // cold) load, so a slow api_getDashboard/api_getForecastTable reads as
  // "working", not frozen. Mirrors the "Loading…" table-body convention
  // already used by loadWeeklyForecastTable.
  const DASHBOARD_LOADING_MSG = 'Computing capacity forecast\u2026 (first load after an upload can take a moment)';

  function showDashboardLoading_() {
    $('#kpiIcpUtil').textContent = '\u2026';
    $('#kpiFinUtil').textContent = '\u2026';
    $('#kpiProductive').textContent = '\u2026';
    $('#kpiScenario').textContent = '\u2026';
    $('#kpiOverUnder').textContent = '\u2026';
    const loadingSub = DASHBOARD_LOADING_MSG;
    $('#kpiIcpUtilSub').textContent = loadingSub;
    $('#kpiFinUtilSub').textContent = loadingSub;
    $('#kpiProductiveSub').textContent = loadingSub;
    const headcountBody = $('#kpiHeadcountBody');
    if (headcountBody) {
      headcountBody.innerHTML = '<tr><td colspan="10" class="muted" style="padding:12px">' +
        escapeHtml_(DASHBOARD_LOADING_MSG) + '</td></tr>';
    }
  }

  async function loadDashboard() {
    showDashboardLoading_();
    try {
      const params = buildServerParams_({ quarter: null });
      const signature = JSON.stringify(params);
      let d;
      if (State.dashboardCache && State.dashboardCache.signature === signature) {
        d = JSON.parse(JSON.stringify(State.dashboardCache.data));
      } else {
        d = await call('api_getDashboard', params);
        State.dashboardCache = { signature, data: JSON.parse(JSON.stringify(d)) };
      }
      d = applyPlanningWindow(d);
      State.dashboard = d;

      renderKpis(d.kpis || null);
      renderHeadcountGap(d.headcountByTeam || []);
    } catch (err) {
      toast('Dashboard load failed: ' + err.message, 'err');
      console.error(err);
    }

    loadWeeklyForecastTable();
  }

  function renderKpis(k) {
    const windowLabel = (k && k.windowLabel) ? k.windowLabel : '';
    const windowSuffix = windowLabel ? ' · ' + windowLabel : '';

    $('#kpiIcpUtil').textContent = k ? fmtPct(k.avgIcpProductiveUtilization) : '—';
    $('#kpiIcpUtilSub').textContent = k
      ? ('Actuals to date + forecast forward · holiday-adjusted' + windowSuffix)
      : '';

    $('#kpiFinUtil').textContent = k ? fmtPct(k.avgFinancialUtilization) : '—';
    $('#kpiFinUtilSub').textContent = k
      ? ('Actuals to date + forecast forward · raw capacity' + windowSuffix)
      : '';

    $('#kpiProductive').textContent = k ? Math.round(k.totalProductiveHours).toLocaleString() : '—';
    $('#kpiProductiveSub').textContent = k
      ? ('Excludes PTO/Holiday' + windowSuffix)
      : '';

    $('#kpiScenario').textContent = k ? Math.round(k.scenarioDemandHours).toLocaleString() : '—';
    $('#kpiScenarioSub').textContent = k ? ('All scenarios in scope' + windowSuffix) : '';

    const overList = (k && k.overUtilized) ? k.overUtilized : [];
    const underList = (k && k.underUtilized) ? k.underUtilized : [];
    const overCount = overList.length;
    const underCount = underList.length;
    $('#kpiOverUnder').textContent = overCount + ' / ' + underCount;

    const overNames = overList.map(o => o.name + ' (' + fmtPct(o.avgUtil) + ')');
    const underNames = underList.map(u => u.name + ' (' + fmtPct(u.avgUtil) + ')');
    const tooltipLines = [];
    if (overNames.length) { tooltipLines.push('Over-utilized (ICP-target-based):'); tooltipLines.push(...overNames); }
    if (underNames.length) {
      if (tooltipLines.length) tooltipLines.push('');
      tooltipLines.push('Under-utilized (ICP-target-based):'); tooltipLines.push(...underNames);
    }
    const tooltipText = tooltipLines.join('\n') || 'No over/under-utilization in current view';
    $('#kpiOverUnder').title = tooltipText;
    $('#kpiOverUnderSub').title = tooltipText;
  }

  // ============================================================
  // Team Quarterly Scorecard (WFM.17)
  // ============================================================
  const QuarterlyScorecardState = {
    metric: 'icp',
    data: null
  };

  function bonusCellColor_(attainment) {
    if (!attainment && attainment !== 0) {
      return { bg: 'var(--business-card)', fg: 'var(--staple)' };
    }
    if (attainment >= 1.0) return { bg: '#c8e6c9', fg: '#1b5e20' };
    if (attainment >= 0.85) return { bg: '#fff3e0', fg: '#e65100' };
    return { bg: '#ffcdd2', fg: '#b71c1c' };
  }

  function renderQuarterlySummaryStrip_(data) {
    const strip = $('#qsSummaryStrip');
    if (!strip) return;
    const summary = (data && data.teamSummary) || [];
    if (!summary.length) {
      strip.innerHTML = '<span class="muted">No data</span>';
      return;
    }
    strip.innerHTML = summary.map(function (q) {
      const curTag = q.isCurrentQuarter ? ' <span class="qs-cur-tag">current</span>' : '';
      return '<div class="qs-summary-quarter">' +
        '<div class="qs-summary-qlabel">' + escapeHtml_(q.quarterLabel) + curTag + '</div>' +
        '<div class="qs-summary-metrics">' +
          '<span>ICP ' + fmtPct(q.icpUtil) + '</span>' +
          '<span>Fin ' + fmtPct(q.financeUtil) + '</span>' +
          '<span>Bonus ' + fmtPct(q.bonusAttainment) + '</span>' +
          '<span>Track ' + Math.round(q.trackingHours).toLocaleString() + 'h</span>' +
        '</div></div>';
    }).join('');
  }

  function renderQuarterlyScorecardTable_(data) {
    const headerRow = $('#qsHeaderRow');
    const body = $('#qsBody');
    const foot = $('#qsFoot');
    if (!headerRow || !body) return;

    const quarterKeys = (data && data.quarterKeys) || [];
    const workers = (data && data.workers) || [];
    const metric = QuarterlyScorecardState.metric;

    $$('.qs-col-quarter', headerRow).forEach(function (el) { el.remove(); });
    quarterKeys.forEach(function (qk) {
      const th = document.createElement('th');
      th.className = 'qs-col-quarter';
      th.textContent = qk;
      headerRow.appendChild(th);
    });

    if (!workers.length) {
      body.innerHTML = '<tr><td colspan="' + (4 + quarterKeys.length) +
        '" class="muted" style="padding:12px">No workers in scope</td></tr>';
      if (foot) foot.innerHTML = '';
      return;
    }

    body.innerHTML = workers.map(function (w) {
      const cells = (w.quarters || []).map(function (q) {
        if (metric === 'bonus') {
          if (!q.targetHours) {
            return '<td class="qs-cell qs-cell-neutral" title="No target">—</td>';
          }
          const color = bonusCellColor_(q.bonusAttainment);
          const tip = [
            'Projected/productive: ' + q.productiveHours.toFixed(1) + 'h',
            'Quarter target: ' + q.targetHours.toFixed(1) + 'h',
            'Tracking: ' + (q.trackingHours >= 0 ? '+' : '') + q.trackingHours.toFixed(1) + 'h',
            'Bonus attainment: ' + fmtPct(q.bonusAttainment)
          ].join('\n');
          return '<td class="qs-cell" style="background:' + color.bg + ';color:' + color.fg + '" title="' +
            escapeHtml_(tip) + '">' + fmtPct(q.bonusAttainment) + '</td>';
        }
        const color = cellColor(q.icpUtil, w.icpTarget);
        const tip = [
          'Productive: ' + q.productiveHours.toFixed(1) + 'h',
          'ICP available: ' + q.icpAvailableHours.toFixed(1) + 'h',
          'ICP target: ' + fmtPct(w.icpTarget),
          'Ratio to target: ' + (q.ratioToTarget * 100).toFixed(1) + '%',
          'Tracking: ' + (q.trackingHours >= 0 ? '+' : '') + q.trackingHours.toFixed(1) + 'h'
        ].join('\n');
        return '<td class="qs-cell" style="background:' + color.bg + ';color:' + color.fg + '" title="' +
          escapeHtml_(tip) + '">' + fmtPct(q.icpUtil) + '</td>';
      }).join('');
      return '<tr>' +
        '<td class="qs-col-sticky qs-col-worker">' + escapeHtml_(w.worker) + '</td>' +
        '<td class="qs-col-sticky qs-col-level">' + escapeHtml_(w.level) + '</td>' +
        '<td class="qs-col-sticky qs-col-manager">' + escapeHtml_(w.manager) + '</td>' +
        '<td class="qs-col-sticky qs-col-team">' + escapeHtml_(w.teamLabel) + '</td>' +
        cells + '</tr>';
    }).join('');

    if (foot) {
      const summary = (data && data.teamSummary) || [];
      const totalCells = summary.map(function (q) {
        if (metric === 'bonus') {
          return '<td class="qs-cell qs-total">' + fmtPct(q.bonusAttainment) + '</td>';
        }
        return '<td class="qs-cell qs-total">' + fmtPct(q.icpUtil) + '</td>';
      }).join('');
      foot.innerHTML = '<tr class="qs-total-row">' +
        '<td class="qs-col-sticky" colspan="4"><strong>TOTAL</strong></td>' +
        totalCells + '</tr>';
    }
  }

  function renderQuarterlyScorecard_(data) {
    QuarterlyScorecardState.data = data;
    renderQuarterlySummaryStrip_(data);
    renderQuarterlyScorecardTable_(data);
  }

  async function loadQuarterlyScorecard() {
    const body = $('#qsBody');
    const strip = $('#qsSummaryStrip');
    if (body) body.innerHTML = '<tr><td colspan="8" class="muted" style="padding:12px">' +
      escapeHtml_(DASHBOARD_LOADING_MSG) + '</td></tr>';
    if (strip) strip.innerHTML = '<span class="muted">' + escapeHtml_(DASHBOARD_LOADING_MSG) + '</span>';
    try {
      const params = buildServerParams_();
      const data = await call('api_getQuarterlyScorecard', params);
      renderQuarterlyScorecard_(data);
    } catch (err) {
      if (body) {
        body.innerHTML = '<tr><td class="muted" style="padding:12px;color:var(--thumbtack)">' +
          'Failed to load scorecard: ' + escapeHtml_(err.message || String(err)) + '</td></tr>';
      }
      console.error('loadQuarterlyScorecard failed:', err);
    }
  }

  (function initQuarterlyScorecard_() {
    const toggle = $('#qsMetricToggle');
    if (!toggle) return;
    toggle.querySelectorAll('.btn-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        toggle.querySelectorAll('.btn-toggle').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        QuarterlyScorecardState.metric = btn.dataset.metric || 'icp';
        if (QuarterlyScorecardState.data) renderQuarterlyScorecardTable_(QuarterlyScorecardState.data);
      });
    });
  })();

  // ============================================================
  // Weekly Forecast Table (weekly-forecast-migration §10) -- replaces
  // renderHeatmap/renderTrend above. Fetches api_getForecastTable via
  // buildServerParams_, groups by worker with sticky identity columns,
  // per-week cells colored by utilization-vs-ICP (cellColor, reused from
  // the removed heatmap), and expandable worker→project child rows.
  // ============================================================
  const WeeklyForecastState = {
    expanded: new Set(),   // worker names with project rows currently shown
    showManagersManager: false,
    expandNextQuarter: false
  };

  async function loadWeeklyForecastTable() {
    const body = $('#weeklyForecastBody');
    if (body) body.innerHTML = '<tr><td class="muted" style="padding:12px">' + escapeHtml_(DASHBOARD_LOADING_MSG) + '</td></tr>';
    try {
      const params = buildServerParams_();
      const forecast = await call('api_getForecastTable', params);
      State.weeklyForecast = forecast;
      renderWeeklyForecastTable_(forecast);
    } catch (err) {
      if (body) {
        body.innerHTML = '<tr><td class="muted" style="padding:12px;color:var(--thumbtack)">' +
          'Failed to load weekly forecast: ' + escapeHtml_(err.message || String(err)) + '</td></tr>';
      }
      console.error('loadWeeklyForecastTable failed:', err);
    }
  }

  function buildWeeklyForecastColumns_(weeks) {
    const curQ = fiscalQuarterKey_(new Date());
    const nextQDate = new Date(new Date().getFullYear(), new Date().getMonth() + 3, 1);
    const nextQ = fiscalQuarterKey_(nextQDate);
    const currentQuarterWeeks = weeks.filter(function (w) { return w.fiscalQuarterKey === curQ; });
    const nextQuarterWeeks = weeks.filter(function (w) { return w.fiscalQuarterKey === nextQ; });
    const columns = [];
    currentQuarterWeeks.forEach(function (w) { columns.push({ type: 'week', week: w }); });
    if (nextQuarterWeeks.length) {
      if (WeeklyForecastState.expandNextQuarter) {
        nextQuarterWeeks.forEach(function (w) { columns.push({ type: 'week', week: w }); });
      } else {
        columns.push({
          type: 'collapsed',
          quarterKey: nextQ,
          weeks: nextQuarterWeeks,
          label: nextQ + ' (forecast)'
        });
      }
    }
    return { columns: columns, curQ: curQ, nextQ: nextQ };
  }

  function findSeamColumnIndex_(columns, seamWeekKey) {
    if (!seamWeekKey) return -1;
    for (let i = 0; i < columns.length; i++) {
      const col = columns[i];
      if (col.type === 'week' && col.week.weekKey === seamWeekKey) return i + 1;
    }
    return -1;
  }

  function aggregateNextQuarterCell_(weekCells, icpTarget) {
    let sumHours = 0;
    let sumIcpAvailable = 0;
    weekCells.forEach(function (cell) {
      const hours = Number(cell.hours) || 0;
      const util = Number(cell.icpUtil) || 0;
      const icpAvailableForWeek = util > 0 ? (hours / util) : 0;
      sumHours += hours;
      sumIcpAvailable += icpAvailableForWeek;
    });
    const aggUtil = sumIcpAvailable > 0 ? (sumHours / sumIcpAvailable) : 0;
    return {
      hours: sumHours,
      aggUtil: aggUtil,
      color: cellColor(aggUtil, icpTarget)
    };
  }

  function renderWeeklyForecastTable_(forecast) {
    const table = $('#weeklyForecastTable');
    const headerRow = $('#weeklyForecastHeaderRow');
    const body = $('#weeklyForecastBody');
    if (!headerRow || !body) return;

    const weeks = (forecast && forecast.weeks) || [];
    const rows = (forecast && forecast.rows) || [];
    const seamWeekKey = (forecast && forecast.seamWeekKey) || '';
    const columnPlan = buildWeeklyForecastColumns_(weeks);
    const columns = columnPlan.columns;
    const seamColIdx = findSeamColumnIndex_(columns, seamWeekKey);
    const stickyColCount = WeeklyForecastState.showManagersManager ? 4 : 3;

    let zoneRow = $('#weeklyForecastZoneHeaderRow');
    if (seamWeekKey && columns.length) {
      if (!zoneRow && table) {
        zoneRow = document.createElement('tr');
        zoneRow.id = 'weeklyForecastZoneHeaderRow';
        zoneRow.className = 'wf-zone-header';
        headerRow.parentNode.insertBefore(zoneRow, headerRow);
      }
      if (zoneRow) {
        let actualSpan = 0;
        let forecastSpan = 0;
        columns.forEach(function (col, idx) {
          if (idx < seamColIdx) actualSpan++;
          else forecastSpan++;
        });
        zoneRow.innerHTML =
          '<th class="wf-col-sticky" colspan="' + stickyColCount + '"></th>' +
          (actualSpan ? '<th class="wf-zone-actual" colspan="' + actualSpan + '">actual</th>' : '') +
          (forecastSpan ? '<th class="wf-zone-forecast" colspan="' + forecastSpan + '">forecast</th>' : '');
        zoneRow.hidden = false;
      }
    } else if (zoneRow) {
      zoneRow.hidden = true;
      zoneRow.innerHTML = '';
    }

    $$('.wf-col-week, .wf-col-collapsed', headerRow).forEach(function (el) { el.remove(); });
    columns.forEach(function (col, idx) {
      const th = document.createElement('th');
      if (col.type === 'collapsed') {
        th.className = 'wf-col-collapsed';
        th.textContent = col.label;
        th.title = col.label;
      } else {
        th.className = 'wf-col-week' + (idx === seamColIdx ? ' wf-seam-divider' : '');
        const zoneTag = seamWeekKey
          ? (idx < seamColIdx ? '<span class="wf-header-tag">actual</span>' : '<span class="wf-header-tag">forecast</span>')
          : '';
        th.innerHTML = col.week.label + ' · ' + col.week.fiscalQuarter +
          (zoneTag ? '<br>' + zoneTag : '');
        th.title = col.week.fiscalQuarterKey;
      }
      headerRow.appendChild(th);
    });

    if (!rows.length) {
      body.innerHTML = '<tr><td class="muted" style="padding:12px" colspan="' + (stickyColCount + columns.length) + '">' +
        'No forecast data in current scope.</td></tr>';
      return;
    }

    const showMgrMgr = WeeklyForecastState.showManagersManager;
    const html = [];
    rows.forEach(function (r) {
      const isOpen = WeeklyForecastState.expanded.has(r.worker);
      const weekByKey = {};
      (r.workerWeekly || []).forEach(function (w) { weekByKey[w.weekKey] = w; });

      html.push('<tr class="wf-row-worker' + (isOpen ? ' wf-open' : '') + '" data-worker="' + escapeHtml_(r.worker) + '">');
      html.push(
        '<td class="wf-col-sticky wf-col-worker">' +
          '<button type="button" class="wf-expand-toggle" aria-expanded="' + isOpen + '">' +
            '<span class="wf-expand-chev">' + (isOpen ? '▾' : '▸') + '</span> ' +
            escapeHtml_(r.worker) +
          '</button>' +
        '</td>'
      );
      html.push('<td class="wf-col-sticky wf-col-level">' + escapeHtml_(r.level || '') + '</td>');
      html.push('<td class="wf-col-sticky wf-col-manager">' + escapeHtml_(r.manager || '') + '</td>');
      html.push(
        '<td class="wf-col-sticky wf-col-mgrmgr"' + (showMgrMgr ? '' : ' hidden') + '>' +
          escapeHtml_(r.managersManager || '') +
        '</td>'
      );

      columns.forEach(function (col, idx) {
        if (col.type === 'collapsed') {
          const weekCells = col.weeks.map(function (w) {
            return weekByKey[w.weekKey] || {
              hours: 0, icpUtil: 0, icpTarget: r.icpTarget || 0.72
            };
          });
          const agg = aggregateNextQuarterCell_(weekCells, r.icpTarget || 0.72);
          const title = [
            r.worker + ' · ' + col.label,
            'Total forecast hours: ' + Math.round(agg.hours) + 'h',
            'Aggregate ICP utilization: ' + fmtPct(agg.aggUtil),
            'ICP target: ' + fmtPct(r.icpTarget || 0.72)
          ].join('\n');
          html.push(
            '<td class="wf-col-collapsed wf-cell wf-cell-forecast" style="background:' + agg.color.bg +
            ';color:' + agg.color.fg + '" title="' + escapeHtml_(title) + '">' +
            Math.round(agg.hours) + '</td>'
          );
          return;
        }

        const w = col.week;
        const cell = weekByKey[w.weekKey] ||
          { hours: 0, icpUtil: 0, financeUtil: 0, icpTarget: r.icpTarget || 0.72,
            icpAvailable: r.rawCapacity || 40, holidayHours: 0, isActual: false };
        const color = cellColor(cell.icpUtil, cell.icpTarget);
        const holidayNote = cell.holidayHours
          ? ' (raw ' + Math.round(r.rawCapacity) + 'h − ' + Math.round(cell.holidayHours) + 'h holiday)'
          : '';
        const actualLabel = cell.isActual ? 'Actual' : 'Forecast';
        const title = [
          r.worker + ' · ' + w.label,
          actualLabel,
          'Hours: ' + Math.round(cell.hours) + 'h',
          'ICP available: ' + Math.round(cell.icpAvailable) + 'h' + holidayNote,
          'ICP utilization: ' + fmtPct(cell.icpUtil),
          'ICP target: ' + fmtPct(cell.icpTarget),
          'Finance utilization: ' + fmtPct(cell.financeUtil)
        ].join('\n');
        const seamCls = idx === seamColIdx ? ' wf-seam-divider' : '';
        const forecastCls = cell.isActual ? '' : ' wf-cell-forecast';
        html.push(
          '<td class="wf-col-week wf-cell' + seamCls + forecastCls + '" style="background:' + color.bg +
          ';color:' + color.fg + '" title="' + escapeHtml_(title) + '">' + Math.round(cell.hours) + '</td>'
        );
      });
      html.push('</tr>');

      (r.projects || []).forEach(function (p) {
        const projByKey = {};
        (p.weekly || []).forEach(function (w) { projByKey[w.weekKey] = w; });
        html.push('<tr class="wf-row-project"' + (isOpen ? '' : ' hidden') + ' data-worker="' + escapeHtml_(r.worker) + '">');
        html.push('<td class="wf-col-sticky wf-col-worker wf-project-name">↳ ' + escapeHtml_(p.project) + '</td>');
        html.push('<td class="wf-col-sticky wf-col-level"></td>');
        html.push('<td class="wf-col-sticky wf-col-manager"></td>');
        html.push('<td class="wf-col-sticky wf-col-mgrmgr"' + (showMgrMgr ? '' : ' hidden') + '></td>');
        columns.forEach(function (col) {
          if (col.type === 'collapsed') {
            let sumHrs = 0;
            col.weeks.forEach(function (w) {
              const cell = projByKey[w.weekKey];
              sumHrs += cell ? Number(cell.hours) || 0 : 0;
            });
            html.push('<td class="wf-col-collapsed wf-cell-project">' + (sumHrs ? Math.round(sumHrs) : '—') + '</td>');
            return;
          }
          const cell = projByKey[col.week.weekKey];
          const hrs = cell ? Math.round(cell.hours) : 0;
          html.push('<td class="wf-col-week wf-cell-project">' + (hrs || '—') + '</td>');
        });
        html.push('</tr>');
      });
    });

    body.innerHTML = html.join('');

    const expandNextBtn = $('#wfExpandNextQuarterBtn');
    if (expandNextBtn) {
      expandNextBtn.textContent = WeeklyForecastState.expandNextQuarter
        ? 'Collapse next quarter'
        : 'Expand next quarter';
    }
  }

  document.addEventListener('click', (e) => {
    const toggle = e.target.closest('.wf-expand-toggle');
    if (!toggle) return;
    const tr = toggle.closest('tr[data-worker]');
    if (!tr) return;
    const worker = tr.dataset.worker;
    const nowOpen = !WeeklyForecastState.expanded.has(worker);
    if (nowOpen) WeeklyForecastState.expanded.add(worker);
    else WeeklyForecastState.expanded.delete(worker);
    toggle.setAttribute('aria-expanded', String(nowOpen));
    tr.classList.toggle('wf-open', nowOpen);
    const chev = toggle.querySelector('.wf-expand-chev');
    if (chev) chev.textContent = nowOpen ? '▾' : '▸';
    $$('tr.wf-row-project').forEach(pr => {
      if (pr.dataset.worker === worker) pr.hidden = !nowOpen;
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    const expandBtn = $('#wfExpandAllBtn');
    const collapseBtn = $('#wfCollapseAllBtn');
    const expandNextBtn = $('#wfExpandNextQuarterBtn');
    const mgrMgrToggle = $('#wfShowManagersManager');
    if (expandNextBtn) expandNextBtn.addEventListener('click', () => {
      WeeklyForecastState.expandNextQuarter = !WeeklyForecastState.expandNextQuarter;
      renderWeeklyForecastTable_(State.weeklyForecast);
    });
    if (expandBtn) expandBtn.addEventListener('click', () => {
      const forecast = State.weeklyForecast;
      if (forecast && forecast.rows) forecast.rows.forEach(r => WeeklyForecastState.expanded.add(r.worker));
      renderWeeklyForecastTable_(forecast);
    });
    if (collapseBtn) collapseBtn.addEventListener('click', () => {
      WeeklyForecastState.expanded.clear();
      renderWeeklyForecastTable_(State.weeklyForecast);
    });
    if (mgrMgrToggle) mgrMgrToggle.addEventListener('change', (e) => {
      WeeklyForecastState.showManagersManager = !!e.target.checked;
      const col = $('#wfColManagersManager');
      if (col) col.hidden = !WeeklyForecastState.showManagersManager;
      renderWeeklyForecastTable_(State.weeklyForecast);
    });
  });

    function renderHeadcountGap(rows) {
    const body = $('#kpiHeadcountBody');
    const sub = $('#kpiHeadcountSub');
    if (!body) return;
    if (!rows || !rows.length) {
      body.innerHTML = '<tr><td colspan="10" class="muted" style="padding:12px">' +
        'No SLG headcount data in current scope.</td></tr>';
      if (sub) sub.textContent = 'SLG only · current filters';
      return;
    }

    const order = ['EM', 'PD', 'DA', 'CS_FUNC', 'CS_TECH'];
    const sorted = rows.slice().sort(function (a, b) {
      const ia = order.indexOf(a.role);
      const ib = order.indexOf(b.role);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return String(a.role || '').localeCompare(String(b.role || ''));
    });

    function fmtMonthShort(mk) {
      if (!mk || typeof mk !== 'string') return '—';
      const parts = mk.split('-');
      if (parts.length < 2) return mk;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
      if (isNaN(dt.getTime())) return mk;
      return dt.toLocaleString('en', { month: 'short', year: '2-digit' });
    }

    body.innerHTML = sorted.map(function (r) {
      const heads = Number(r.suggestedHeads) || 0;
      const peakGap = Number(r.peakGap) || 0;
      const peakUtil = Number(r.peakUtil) || 0;
      const avgUtil = Number(r.avgUtil) || 0;
      let cls = '';
      if (peakGap > 0) cls = 'warn-row';
      else if (peakUtil >= 0.95) cls = 'hot-row';
      return (
        '<tr class="' + cls + '">' +
        '<td>' + escapeHtml_(r.team || 'Unclassified') + '</td>' +
        '<td class="num">' + fmtFte(r.capacityFte) + '</td>' +
        '<td class="num">' + fmtFte(r.peakDemandFte) + '</td>' +
        '<td class="num">' + fmtPct(peakUtil) + '</td>' +
        '<td class="num">' + fmtFte(peakGap) + '</td>' +
        '<td class="num">' + heads + '</td>' +
        '<td>' + escapeHtml_(fmtMonthShort(r.peakMonth)) + '</td>' +
        '<td class="num">' + fmtFte(r.avgDemandFte) + '</td>' +
        '<td class="num">' + fmtPct(avgUtil) + '</td>' +
        '<td class="num">' + fmtFte(r.avgGap) + '</td>' +
        '</tr>'
      );
    }).join('');

    if (sub) {
      const windowMonths = (State.ref && State.ref.planningWindowMonths) ||
                           (State.dashboard && State.dashboard.planningWindowMonths) || 6;
      const ptoNote = State.filters.includeTimeOff ? 'Includes PTO/Holiday' : 'Excludes PTO/Holiday';
      sub.textContent = 'SLG only · ' + windowMonths + '-month planning window · ' + ptoNote;
    }
  }

</script>

<script>
  // ============================================================
  // Reporting & Metrics view
  // ============================================================
  async function loadReporting() {
    rpShowLoadingState_();

    try {
      const params = buildServerParams_();
      const summary = await call('api_getReportingSummary', params);

      State.reporting = summary;
      State.rpAccountsAll = summary.byAccount || [];
      State.rpHoursTotal = Number((summary.totals || {}).totalHours || 0);
      if (!State.rpExpandedTeams) State.rpExpandedTeams = new Set();
      if (!State.rpExpandedAccounts) State.rpExpandedAccounts = new Set();

      renderReportingSummary(summary);
    } catch (err) {
      const msg = (err && (err.message || err.toString())) || 'unknown error';
      console.error('loadReporting failed:', err);
      toast('Failed to load Reporting & Metrics: ' + msg, 'err');
      rpShowFailureState_(msg);
    }
  }

  function rpShowLoadingState_() {
    const ids = [
      'rpTeamBody', 'rpAccountBody', 'rpRoleCategoryBody', 'rpJobProfileBody',
      'rpTop5AccountsBody', 'rpTop5RolesBody', 'rpDonutLegendBody',
      'rpUnmappedBody', 'rpBlankClassBody'
    ];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<tr><td class="muted" style="padding:12px" colspan="7">Loading…</td></tr>';
    });
    const legendEl = document.getElementById('rpHorizontalBarLegend');
    if (legendEl) legendEl.innerHTML = '<div class="muted" style="padding:12px">Loading…</div>';
  }

  function rpShowFailureState_(msg) {
    const html =
      '<tr><td class="muted" style="padding:12px;color:var(--thumbtack);" colspan="7">Failed to load: ' +
      escapeHtml_(msg) + '</td></tr>';
    [
      'rpTeamBody', 'rpAccountBody', 'rpRoleCategoryBody', 'rpJobProfileBody',
      'rpTop5AccountsBody', 'rpTop5RolesBody', 'rpDonutLegendBody',
      'rpUnmappedBody', 'rpBlankClassBody'
    ].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = html;
    });
  }

  function renderReportingSummary(summary) {
    summary = summary || {};
    const totals = summary.totals || {};
    const byTeam = summary.byTeam || [];
    const byAccount = summary.byAccount || [];
    const byRoleCat = summary.byRoleCategory || [];
    const byJobProf = summary.byJobProfile || [];
    const topAccounts = summary.topAccounts || [];
    const topRoles = summary.topRoles || [];
    const diag = summary.diagnostics || {};

    renderReportingBanners_(totals);
    renderReportingKpis_(totals);
    renderReportingComposition_(totals);
    renderReportingTeamTable_(byTeam, totals);
    renderReportingAccountTable_(byAccount, totals);
    renderReportingRoleCategoryTable_(byRoleCat, totals);
    renderReportingJobProfileTable_(byJobProf, totals);
    renderReportingTop5_(topAccounts, topRoles, totals);
    renderReportingDiagnostics_(diag, totals);
  }

  // Banners
  function renderReportingBanners_(totals) {
    const container = $('#reportBanners');
    if (!container) return;
    const banners = [];

    if (totals && totals.reconcileOk === false) {
      banners.push({
        kind: 'err', icon: '⚠',
        title: 'Numbers do not reconcile.',
        body: 'The team, account, and worker-class totals do not all equal the headline total. See diagnostics below.'
      });
    }

    if (State.filters.viewMode === 'Scenario') {
      const scen = (State.scenarios || []).find(s => s.scenario_id === State.filters.scenarioId);
      banners.push({
        kind: 'warn', icon: 'ℹ',
        title: 'Scenario view mode.',
        body: 'Including modeled hours' + (scen ? ' from "' + escapeHtml_(scen.name) + '"' : '') +
              '. Numbers are forecast, not committed.'
      });
    }

    // Priority 3: compare workerScope against current-view default, not global FILTER_DEFAULTS.
    const ws = String(State.filters.workerScope || 'All');
    const viewWsDefault = currentViewWorkerScopeDefault_();
    if (ws !== viewWsDefault) {
      const lbl = WORKER_SCOPE_LABELS[ws] || ws;
      const filteredOut = Number((totals || {}).scopeFilteredOutHours || 0);
      const filteredOutText = filteredOut > 0 ? ' ' + fmtHours(filteredOut) + ' hrs hidden by this scope.' : '';
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Worker scope: ' + lbl + '.',
        body: 'Showing only ' + lbl + ' workers.' + filteredOutText,
        action: { label: 'Reset to view default', clearKey: 'workerScope' }
      });
    }

    if (State.filters.teamLabel) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Team filter active.',
        body: 'Scoped to "' + escapeHtml_(State.filters.teamLabel) + '". Manager filter is suspended while Team is set.',
        action: { label: 'Clear', clearKey: 'teamLabel' }
      });
    }

    if (State.filters.managers && State.filters.managers.length && !State.filters.teamLabel) {
      const mgr = State.filters.managers[0];
      const inc = State.filters.includeMyManagers ? ' (including reports)' : '';
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Manager filter active.',
        body: 'Filtered to "' + escapeHtml_(mgr) + '"' + inc + '.',
        action: { label: 'Clear', clearKey: 'managers' }
      });
    }

    const practiceHrs = Number((totals || {}).externalHoursByPracticeOwnership || 0);
    if (State.filters.managers && State.filters.managers.length && !State.filters.teamLabel && practiceHrs > 0) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Practice ownership applied.',
        body: 'Including ' + fmtHours(practiceHrs) + ' External hrs attributed via practice ownership in addition to direct reports.'
      });
    }

    if (State.filters.quarter) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Quarter filter active.',
        body: 'Showing ' + escapeHtml_(State.filters.quarter) + ' only.',
        action: { label: 'Clear', clearKey: 'quarter' }
      });
    }

    if (!banners.length) {
      container.hidden = true;
      container.innerHTML = '';
      return;
    }

    const MAX_VISIBLE = 3;
    const visible = banners.slice(0, MAX_VISIBLE);
    const overflow = banners.length - visible.length;

    container.innerHTML = visible.map(b => {
      const actionHtml = b.action
        ? `<button type="button" class="banner-action" data-banner-action="${escapeHtml_(b.action.clearKey)}">${escapeHtml_(b.action.label)}</button>`
        : '';
      return `
        <div class="report-banner ${b.kind}">
          <span class="report-banner-icon">${b.icon}</span>
          <span><strong>${escapeHtml_(b.title)}</strong> ${b.body}</span>
          ${actionHtml}
        </div>`;
    }).join('') +
    (overflow > 0
      ? `<div class="report-banner info">
           <span class="report-banner-icon">…</span>
           <span>+${overflow} more active filter${overflow === 1 ? '' : 's'}. See chip strip above for details.</span>
         </div>`
      : '');
