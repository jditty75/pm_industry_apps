  // ============================================================
  // Weekly Forecast Table (weekly-forecast-migration §10) -- replaces
  // renderHeatmap/renderTrend above. Fetches api_getForecastTable via
  // buildServerParams_, groups by worker with sticky identity columns,
  // per-week cells colored by utilization-vs-ICP (cellColor, reused from
  // the removed heatmap), and expandable worker→project child rows.
  // ============================================================
  const WeeklyForecastState = {
    expanded: new Set(),   // worker names with project rows currently shown
    showManagersManager: false,
    expandNextQuarter: false
  };

  async function loadWeeklyForecastTable() {
    const body = $('#weeklyForecastBody');
    if (body) body.innerHTML = '<tr><td class="muted" style="padding:12px">' + escapeHtml_(DASHBOARD_LOADING_MSG) + '</td></tr>';
    try {
      const params = buildServerParams_();
      const forecast = await call('api_getForecastTable', params);
      State.weeklyForecast = forecast;
      renderWeeklyForecastTable_(forecast);
    } catch (err) {
      if (body) {
        body.innerHTML = '<tr><td class="muted" style="padding:12px;color:var(--thumbtack)">' +
          'Failed to load weekly forecast: ' + escapeHtml_(err.message || String(err)) + '</td></tr>';
      }
      console.error('loadWeeklyForecastTable failed:', err);
    }
  }

  function buildWeeklyForecastColumns_(weeks) {
    const curQ = fiscalQuarterKey_(new Date());
    const nextQDate = new Date(new Date().getFullYear(), new Date().getMonth() + 3, 1);
    const nextQ = fiscalQuarterKey_(nextQDate);
    const currentQuarterWeeks = weeks.filter(function (w) { return w.fiscalQuarterKey === curQ; });
    const nextQuarterWeeks = weeks.filter(function (w) { return w.fiscalQuarterKey === nextQ; });
    const columns = [];
    currentQuarterWeeks.forEach(function (w) { columns.push({ type: 'week', week: w }); });
    if (nextQuarterWeeks.length) {
      if (WeeklyForecastState.expandNextQuarter) {
        nextQuarterWeeks.forEach(function (w) { columns.push({ type: 'week', week: w }); });
      } else {
        columns.push({
          type: 'collapsed',
          quarterKey: nextQ,
          weeks: nextQuarterWeeks,
          label: nextQ + ' (forecast)'
        });
      }
    }
    return { columns: columns, curQ: curQ, nextQ: nextQ };
  }

  function findSeamColumnIndex_(columns, seamWeekKey) {
    if (!seamWeekKey) return -1;
    for (let i = 0; i < columns.length; i++) {
      const col = columns[i];
      if (col.type === 'week' && col.week.weekKey === seamWeekKey) return i + 1;
    }
    return -1;
  }

  function aggregateNextQuarterCell_(weekCells, icpTarget) {
    let sumHours = 0;
    let sumIcpAvailable = 0;
    weekCells.forEach(function (cell) {
      const hours = Number(cell.hours) || 0;
      const util = Number(cell.icpUtil) || 0;
      const icpAvailableForWeek = util > 0 ? (hours / util) : 0;
      sumHours += hours;
      sumIcpAvailable += icpAvailableForWeek;
    });
    const aggUtil = sumIcpAvailable > 0 ? (sumHours / sumIcpAvailable) : 0;
    return {
      hours: sumHours,
      aggUtil: aggUtil,
      color: cellColor(aggUtil, icpTarget)
    };
  }

  function renderWeeklyForecastTable_(forecast) {
    const table = $('#weeklyForecastTable');
    const headerRow = $('#weeklyForecastHeaderRow');
    const body = $('#weeklyForecastBody');
    if (!headerRow || !body) return;

    const weeks = (forecast && forecast.weeks) || [];
    const rows = (forecast && forecast.rows) || [];
    const seamWeekKey = (forecast && forecast.seamWeekKey) || '';
    const columnPlan = buildWeeklyForecastColumns_(weeks);
    const columns = columnPlan.columns;
    const seamColIdx = findSeamColumnIndex_(columns, seamWeekKey);
    const stickyColCount = WeeklyForecastState.showManagersManager ? 4 : 3;

    let zoneRow = $('#weeklyForecastZoneHeaderRow');
    if (seamWeekKey && columns.length) {
      if (!zoneRow && table) {
        zoneRow = document.createElement('tr');
        zoneRow.id = 'weeklyForecastZoneHeaderRow';
        zoneRow.className = 'wf-zone-header';
        headerRow.parentNode.insertBefore(zoneRow, headerRow);
      }
      if (zoneRow) {
        let actualSpan = 0;
        let forecastSpan = 0;
        columns.forEach(function (col, idx) {
          if (idx < seamColIdx) actualSpan++;
          else forecastSpan++;
        });
        zoneRow.innerHTML =
          '<th class="wf-col-sticky" colspan="' + stickyColCount + '"></th>' +
          (actualSpan ? '<th class="wf-zone-actual" colspan="' + actualSpan + '">actual</th>' : '') +
          (forecastSpan ? '<th class="wf-zone-forecast" colspan="' + forecastSpan + '">forecast</th>' : '');
        zoneRow.hidden = false;
      }
    } else if (zoneRow) {
      zoneRow.hidden = true;
      zoneRow.innerHTML = '';
    }

    $$('.wf-col-week, .wf-col-collapsed', headerRow).forEach(function (el) { el.remove(); });
    columns.forEach(function (col, idx) {
      const th = document.createElement('th');
      if (col.type === 'collapsed') {
        th.className = 'wf-col-collapsed';
        th.textContent = col.label;
        th.title = col.label;
      } else {
        th.className = 'wf-col-week' + (idx === seamColIdx ? ' wf-seam-divider' : '');
        const zoneTag = seamWeekKey
          ? (idx < seamColIdx ? '<span class="wf-header-tag">actual</span>' : '<span class="wf-header-tag">forecast</span>')
          : '';
        th.innerHTML = col.week.label + ' · ' + col.week.fiscalQuarter +
          (zoneTag ? '<br>' + zoneTag : '');
        th.title = col.week.fiscalQuarterKey;
      }
      headerRow.appendChild(th);
    });

    if (!rows.length) {
      body.innerHTML = '<tr><td class="muted" style="padding:12px" colspan="' + (stickyColCount + columns.length) + '">' +
        'No forecast data in current scope.</td></tr>';
      return;
    }

    const showMgrMgr = WeeklyForecastState.showManagersManager;
    const html = [];
    rows.forEach(function (r) {
      const isOpen = WeeklyForecastState.expanded.has(r.worker);
      const weekByKey = {};
      (r.workerWeekly || []).forEach(function (w) { weekByKey[w.weekKey] = w; });

      html.push('<tr class="wf-row-worker' + (isOpen ? ' wf-open' : '') + '" data-worker="' + escapeHtml_(r.worker) + '">');
      html.push(
        '<td class="wf-col-sticky wf-col-worker">' +
          '<button type="button" class="wf-expand-toggle" aria-expanded="' + isOpen + '">' +
            '<span class="wf-expand-chev">' + (isOpen ? '▾' : '▸') + '</span> ' +
            escapeHtml_(r.worker) +
          '</button>' +
        '</td>'
      );
      html.push('<td class="wf-col-sticky wf-col-level">' + escapeHtml_(r.level || '') + '</td>');
      html.push('<td class="wf-col-sticky wf-col-manager">' + escapeHtml_(r.manager || '') + '</td>');
      html.push(
        '<td class="wf-col-sticky wf-col-mgrmgr"' + (showMgrMgr ? '' : ' hidden') + '>' +
          escapeHtml_(r.managersManager || '') +
        '</td>'
      );

      columns.forEach(function (col, idx) {
        if (col.type === 'collapsed') {
          const weekCells = col.weeks.map(function (w) {
            return weekByKey[w.weekKey] || {
              hours: 0, icpUtil: 0, icpTarget: r.icpTarget || 0.72
            };
          });
          const agg = aggregateNextQuarterCell_(weekCells, r.icpTarget || 0.72);
          const title = [
            r.worker + ' · ' + col.label,
            'Total forecast hours: ' + Math.round(agg.hours) + 'h',
            'Aggregate ICP utilization: ' + fmtPct(agg.aggUtil),
            'ICP target: ' + fmtPct(r.icpTarget || 0.72)
          ].join('\n');
          html.push(
            '<td class="wf-col-collapsed wf-cell wf-cell-forecast" style="background:' + agg.color.bg +
            ';color:' + agg.color.fg + '" title="' + escapeHtml_(title) + '">' +
            Math.round(agg.hours) + '</td>'
          );
          return;
        }

        const w = col.week;
        const cell = weekByKey[w.weekKey] ||
          { hours: 0, icpUtil: 0, financeUtil: 0, icpTarget: r.icpTarget || 0.72,
            icpAvailable: r.rawCapacity || 40, holidayHours: 0, isActual: false };
        const color = cellColor(cell.icpUtil, cell.icpTarget);
        const holidayNote = cell.holidayHours
          ? ' (raw ' + Math.round(r.rawCapacity) + 'h − ' + Math.round(cell.holidayHours) + 'h holiday)'
          : '';
        const actualLabel = cell.isActual ? 'Actual' : 'Forecast';
        const title = [
          r.worker + ' · ' + w.label,
          actualLabel,
          'Hours: ' + Math.round(cell.hours) + 'h',
          'ICP available: ' + Math.round(cell.icpAvailable) + 'h' + holidayNote,
          'ICP utilization: ' + fmtPct(cell.icpUtil),
          'ICP target: ' + fmtPct(cell.icpTarget),
          'Finance utilization: ' + fmtPct(cell.financeUtil)
        ].join('\n');
        const seamCls = idx === seamColIdx ? ' wf-seam-divider' : '';
        const forecastCls = cell.isActual ? '' : ' wf-cell-forecast';
        html.push(
          '<td class="wf-col-week wf-cell' + seamCls + forecastCls + '" style="background:' + color.bg +
          ';color:' + color.fg + '" title="' + escapeHtml_(title) + '">' + Math.round(cell.hours) + '</td>'
        );
      });
      html.push('</tr>');

      (r.projects || []).forEach(function (p) {
        const projByKey = {};
        (p.weekly || []).forEach(function (w) { projByKey[w.weekKey] = w; });
        html.push('<tr class="wf-row-project"' + (isOpen ? '' : ' hidden') + ' data-worker="' + escapeHtml_(r.worker) + '">');
        html.push('<td class="wf-col-sticky wf-col-worker wf-project-name">↳ ' + escapeHtml_(p.project) + '</td>');
        html.push('<td class="wf-col-sticky wf-col-level"></td>');
        html.push('<td class="wf-col-sticky wf-col-manager"></td>');
        html.push('<td class="wf-col-sticky wf-col-mgrmgr"' + (showMgrMgr ? '' : ' hidden') + '></td>');
        columns.forEach(function (col) {
          if (col.type === 'collapsed') {
            let sumHrs = 0;
            col.weeks.forEach(function (w) {
              const cell = projByKey[w.weekKey];
              sumHrs += cell ? Number(cell.hours) || 0 : 0;
            });
            html.push('<td class="wf-col-collapsed wf-cell-project">' + (sumHrs ? Math.round(sumHrs) : '—') + '</td>');
            return;
          }
          const cell = projByKey[col.week.weekKey];
          const hrs = cell ? Math.round(cell.hours) : 0;
          html.push('<td class="wf-col-week wf-cell-project">' + (hrs || '—') + '</td>');
        });
        html.push('</tr>');
      });
    });

    body.innerHTML = html.join('');

    const expandNextBtn = $('#wfExpandNextQuarterBtn');
    if (expandNextBtn) {
      expandNextBtn.textContent = WeeklyForecastState.expandNextQuarter
        ? 'Collapse next quarter'
        : 'Expand next quarter';
    }
  }

  document.addEventListener('click', (e) => {
    const toggle = e.target.closest('.wf-expand-toggle');
    if (!toggle) return;
    const tr = toggle.closest('tr[data-worker]');
    if (!tr) return;
    const worker = tr.dataset.worker;
    const nowOpen = !WeeklyForecastState.expanded.has(worker);
    if (nowOpen) WeeklyForecastState.expanded.add(worker);
    else WeeklyForecastState.expanded.delete(worker);
    toggle.setAttribute('aria-expanded', String(nowOpen));
    tr.classList.toggle('wf-open', nowOpen);
    const chev = toggle.querySelector('.wf-expand-chev');
    if (chev) chev.textContent = nowOpen ? '▾' : '▸';
    $$('tr.wf-row-project').forEach(pr => {
      if (pr.dataset.worker === worker) pr.hidden = !nowOpen;
    });
  });

  document.addEventListener('DOMContentLoaded', () => {
    const expandBtn = $('#wfExpandAllBtn');
    const collapseBtn = $('#wfCollapseAllBtn');
    const expandNextBtn = $('#wfExpandNextQuarterBtn');
    const mgrMgrToggle = $('#wfShowManagersManager');
    if (expandNextBtn) expandNextBtn.addEventListener('click', () => {
      WeeklyForecastState.expandNextQuarter = !WeeklyForecastState.expandNextQuarter;
      renderWeeklyForecastTable_(State.weeklyForecast);
    });
    if (expandBtn) expandBtn.addEventListener('click', () => {
      const forecast = State.weeklyForecast;
      if (forecast && forecast.rows) forecast.rows.forEach(r => WeeklyForecastState.expanded.add(r.worker));
      renderWeeklyForecastTable_(forecast);
    });
    if (collapseBtn) collapseBtn.addEventListener('click', () => {
      WeeklyForecastState.expanded.clear();
      renderWeeklyForecastTable_(State.weeklyForecast);
    });
    if (mgrMgrToggle) mgrMgrToggle.addEventListener('change', (e) => {
      WeeklyForecastState.showManagersManager = !!e.target.checked;
      const col = $('#wfColManagersManager');
      if (col) col.hidden = !WeeklyForecastState.showManagersManager;
      renderWeeklyForecastTable_(State.weeklyForecast);
    });
  });

    function renderHeadcountGap(rows) {
    const body = $('#kpiHeadcountBody');
    const sub = $('#kpiHeadcountSub');
    if (!body) return;
    if (!rows || !rows.length) {
      body.innerHTML = '<tr><td colspan="10" class="muted" style="padding:12px">' +
        'No SLG headcount data in current scope.</td></tr>';
      if (sub) sub.textContent = 'SLG only · current filters';
      return;
    }

    const order = ['EM', 'PD', 'DA', 'CS_FUNC', 'CS_TECH'];
    const sorted = rows.slice().sort(function (a, b) {
      const ia = order.indexOf(a.role);
      const ib = order.indexOf(b.role);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return String(a.role || '').localeCompare(String(b.role || ''));
    });

    function fmtMonthShort(mk) {
      if (!mk || typeof mk !== 'string') return '—';
      const parts = mk.split('-');
      if (parts.length < 2) return mk;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
      if (isNaN(dt.getTime())) return mk;
      return dt.toLocaleString('en', { month: 'short', year: '2-digit' });
    }

    body.innerHTML = sorted.map(function (r) {
      const heads = Number(r.suggestedHeads) || 0;
      const peakGap = Number(r.peakGap) || 0;
      const peakUtil = Number(r.peakUtil) || 0;
      const avgUtil = Number(r.avgUtil) || 0;
      let cls = '';
      if (peakGap > 0) cls = 'warn-row';
      else if (peakUtil >= 0.95) cls = 'hot-row';
      return (
        '<tr class="' + cls + '">' +
        '<td>' + escapeHtml_(r.team || 'Unclassified') + '</td>' +
        '<td class="num">' + fmtFte(r.capacityFte) + '</td>' +
        '<td class="num">' + fmtFte(r.peakDemandFte) + '</td>' +
        '<td class="num">' + fmtPct(peakUtil) + '</td>' +
        '<td class="num">' + fmtFte(peakGap) + '</td>' +
        '<td class="num">' + heads + '</td>' +
        '<td>' + escapeHtml_(fmtMonthShort(r.peakMonth)) + '</td>' +
        '<td class="num">' + fmtFte(r.avgDemandFte) + '</td>' +
        '<td class="num">' + fmtPct(avgUtil) + '</td>' +
        '<td class="num">' + fmtFte(r.avgGap) + '</td>' +
        '</tr>'
      );
    }).join('');

    if (sub) {
      const windowMonths = (State.ref && State.ref.planningWindowMonths) ||
                           (State.dashboard && State.dashboard.planningWindowMonths) || 6;
      const ptoNote = State.filters.includeTimeOff ? 'Includes PTO/Holiday' : 'Excludes PTO/Holiday';
      sub.textContent = 'SLG only · ' + windowMonths + '-month planning window · ' + ptoNote;
    }
  }

</script>

<script>
  // ============================================================
  // Reporting & Metrics view
  // ============================================================
  async function loadReporting() {
    rpShowLoadingState_();

    try {
      const params = buildServerParams_();
      const summary = await call('api_getReportingSummary', params);

      State.reporting = summary;
      State.rpAccountsAll = summary.byAccount || [];
      State.rpHoursTotal = Number((summary.totals || {}).totalHours || 0);
      if (!State.rpExpandedTeams) State.rpExpandedTeams = new Set();
      if (!State.rpExpandedAccounts) State.rpExpandedAccounts = new Set();

      renderReportingSummary(summary);
    } catch (err) {
      const msg = (err && (err.message || err.toString())) || 'unknown error';
      console.error('loadReporting failed:', err);
      toast('Failed to load Reporting & Metrics: ' + msg, 'err');
      rpShowFailureState_(msg);
    }
  }

  function rpShowLoadingState_() {
    const ids = [
      'rpTeamBody', 'rpAccountBody', 'rpRoleCategoryBody', 'rpJobProfileBody',
      'rpTop5AccountsBody', 'rpTop5RolesBody', 'rpDonutLegendBody',
      'rpUnmappedBody', 'rpBlankClassBody'
    ];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<tr><td class="muted" style="padding:12px" colspan="7">Loading…</td></tr>';
    });
    const legendEl = document.getElementById('rpHorizontalBarLegend');
    if (legendEl) legendEl.innerHTML = '<div class="muted" style="padding:12px">Loading…</div>';
  }

  function rpShowFailureState_(msg) {
    const html =
      '<tr><td class="muted" style="padding:12px;color:var(--thumbtack);" colspan="7">Failed to load: ' +
      escapeHtml_(msg) + '</td></tr>';
    [
      'rpTeamBody', 'rpAccountBody', 'rpRoleCategoryBody', 'rpJobProfileBody',
      'rpTop5AccountsBody', 'rpTop5RolesBody', 'rpDonutLegendBody',
      'rpUnmappedBody', 'rpBlankClassBody'
    ].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = html;
    });
  }

  function renderReportingSummary(summary) {
    summary = summary || {};
    const totals = summary.totals || {};
    const byTeam = summary.byTeam || [];
    const byAccount = summary.byAccount || [];
    const byRoleCat = summary.byRoleCategory || [];
    const byJobProf = summary.byJobProfile || [];
    const topAccounts = summary.topAccounts || [];
    const topRoles = summary.topRoles || [];
    const diag = summary.diagnostics || {};

    renderReportingBanners_(totals);
    renderReportingKpis_(totals);
    renderReportingComposition_(totals);
    renderReportingTeamTable_(byTeam, totals);
    renderReportingAccountTable_(byAccount, totals);
    renderReportingRoleCategoryTable_(byRoleCat, totals);
    renderReportingJobProfileTable_(byJobProf, totals);
    renderReportingTop5_(topAccounts, topRoles, totals);
    renderReportingDiagnostics_(diag, totals);
  }

  // Banners
  function renderReportingBanners_(totals) {
    const container = $('#reportBanners');
    if (!container) return;
    const banners = [];

    if (totals && totals.reconcileOk === false) {
      banners.push({
        kind: 'err', icon: '⚠',
        title: 'Numbers do not reconcile.',
        body: 'The team, account, and worker-class totals do not all equal the headline total. See diagnostics below.'
      });
    }

    if (State.filters.viewMode === 'Scenario') {
      const scen = (State.scenarios || []).find(s => s.scenario_id === State.filters.scenarioId);
      banners.push({
        kind: 'warn', icon: 'ℹ',
        title: 'Scenario view mode.',
        body: 'Including modeled hours' + (scen ? ' from "' + escapeHtml_(scen.name) + '"' : '') +
              '. Numbers are forecast, not committed.'
      });
    }

    // Priority 3: compare workerScope against current-view default, not global FILTER_DEFAULTS.
    const ws = String(State.filters.workerScope || 'All');
    const viewWsDefault = currentViewWorkerScopeDefault_();
    if (ws !== viewWsDefault) {
      const lbl = WORKER_SCOPE_LABELS[ws] || ws;
      const filteredOut = Number((totals || {}).scopeFilteredOutHours || 0);
      const filteredOutText = filteredOut > 0 ? ' ' + fmtHours(filteredOut) + ' hrs hidden by this scope.' : '';
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Worker scope: ' + lbl + '.',
        body: 'Showing only ' + lbl + ' workers.' + filteredOutText,
        action: { label: 'Reset to view default', clearKey: 'workerScope' }
      });
    }

    if (State.filters.teamLabel) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Team filter active.',
        body: 'Scoped to "' + escapeHtml_(State.filters.teamLabel) + '". Manager filter is suspended while Team is set.',
        action: { label: 'Clear', clearKey: 'teamLabel' }
      });
    }

    if (State.filters.managers && State.filters.managers.length && !State.filters.teamLabel) {
      const mgr = State.filters.managers[0];
      const inc = State.filters.includeMyManagers ? ' (including reports)' : '';
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Manager filter active.',
        body: 'Filtered to "' + escapeHtml_(mgr) + '"' + inc + '.',
        action: { label: 'Clear', clearKey: 'managers' }
      });
    }

    const practiceHrs = Number((totals || {}).externalHoursByPracticeOwnership || 0);
    if (State.filters.managers && State.filters.managers.length && !State.filters.teamLabel && practiceHrs > 0) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Practice ownership applied.',
        body: 'Including ' + fmtHours(practiceHrs) + ' External hrs attributed via practice ownership in addition to direct reports.'
      });
    }

    if (State.filters.quarter) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Quarter filter active.',
        body: 'Showing ' + escapeHtml_(State.filters.quarter) + ' only.',
        action: { label: 'Clear', clearKey: 'quarter' }
      });
    }

    if (!banners.length) {
      container.hidden = true;
      container.innerHTML = '';
      return;
    }

    const MAX_VISIBLE = 3;
    const visible = banners.slice(0, MAX_VISIBLE);
    const overflow = banners.length - visible.length;

    container.innerHTML = visible.map(b => {
      const actionHtml = b.action
        ? `<button type="button" class="banner-action" data-banner-action="${escapeHtml_(b.action.clearKey)}">${escapeHtml_(b.action.label)}</button>`
        : '';
      return `
        <div class="report-banner ${b.kind}">
          <span class="report-banner-icon">${b.icon}</span>
          <span><strong>${escapeHtml_(b.title)}</strong> ${b.body}</span>
          ${actionHtml}
        </div>`;
    }).join('') +
    (overflow > 0
      ? `<div class="report-banner info">
           <span class="report-banner-icon">…</span>
           <span>+${overflow} more active filter${overflow === 1 ? '' : 's'}. See chip strip above for details.</span>
         </div>`
      : '');
    container.hidden = false;
  }

  // KPIs
  function renderReportingKpis_(totals) {
    totals = totals || {};
    const total = Number(totals.totalHours || 0);
    const slgHours = Number(totals.slgHours || 0);
    const nonSlg = Number(totals.nonSlgHours || 0);
    const partner = Number(totals.partnerHours || 0);
    const slgPct = Number(totals.slgPct || 0);
    const nonSlgPct = Number(totals.nonSlgPct || 0);
    const partPct = Number(totals.partnerPct || 0);
    const util = Number(totals.avgUtilization || 0);
    const months = Number(totals.monthsInScope || 0);
    const headcount = Number(totals.headcount || 0);

    $('#rpKpiTotal').textContent = fmtHours(total);
    $('#rpKpiTotalSub').textContent = headcount + ' workers · ' + months + ' months in scope';
    $('#rpKpiSlg').textContent = fmtHours(slgHours);
    $('#rpKpiSlgPct').textContent = fmtPct1(slgPct) + ' of total';
    $('#rpKpiNonSlg').textContent = fmtHours(nonSlg);
    $('#rpKpiNonSlgPct').textContent = fmtPct1(nonSlgPct) + ' of total';
    $('#rpKpiPartner').textContent = fmtHours(partner);
    $('#rpKpiPartnerPct').textContent = fmtPct1(partPct) + ' of total';
    $('#rpKpiUtil').textContent = fmtPct(util);
    $('#rpKpiUtilSub').textContent = total > 0
      ? 'against ' + fmtHours(Number(totals.capacityHours || 0)) + ' hrs capacity'
      : 'no data in scope';

    const reconCard = $('#rpKpiReconcile').closest('.kpi-card');
    const reconValue = $('#rpKpiReconcile');
    const reconSub = $('#rpKpiReconcileSub');
    if (total === 0) {
      if (reconCard) reconCard.setAttribute('data-state', '');
      reconValue.textContent = 'No data';
      reconSub.textContent = 'No hours in current scope.';
      reconSub.title = '';
    } else if (totals.reconcileOk) {
      if (reconCard) reconCard.setAttribute('data-state', 'ok');
      reconValue.textContent = '✓ Reconciled';
      reconSub.textContent = 'All totals tie';
      const d = totals.reconciliationDetail || {};
      reconSub.title = 'totalHours: ' + fmtHours(d.totalHours) + '\n' +
                      'teamSum: ' + fmtHours(d.teamSum) + '\n' +
                      'accountSum: ' + fmtHours(d.accountSum) + '\n' +
                      'workerClassSum: ' + fmtHours(d.workerClassSum);
    } else {
      if (reconCard) reconCard.setAttribute('data-state', 'warn');
      reconValue.textContent = '⚠ Mismatch';
      reconSub.textContent = 'See diagnostics';
      const d = totals.reconciliationDetail || {};
      const c = d.checks || {};
      const tt = [];
      if (!c.teamMatches) tt.push('team sum ≠ total');
      if (!c.accountMatches) tt.push('account sum ≠ total');
      if (!c.workerClassMatches) tt.push('worker class sum ≠ total');
      reconSub.title = tt.length ? tt.join('; ') : 'See diagnostics';
    }
  }

  // Composition
  function renderReportingComposition_(totals) {
    totals = totals || {};
    const slgReal = Number(totals.slgRealHours || 0);
    const slgGeneric = Number(totals.slgGenericHours || 0);
    const nonSlg = Number(totals.nonSlgHours || 0);
    const partner = Number(totals.partnerHours || 0);
    const total = slgReal + slgGeneric + nonSlg + partner;

    const colSlg = cssVar_('--wc-slg');
    const colSlgGen = cssVar_('--wc-slg-generic');
    const colNonSlg = cssVar_('--wc-nonslg');
    const colPartner = cssVar_('--wc-partner');

    const donutCtx = $('#rpDonutChart').getContext('2d');
    if (State.charts.rpDonut) State.charts.rpDonut.destroy();
    State.charts.rpDonut = new Chart(donutCtx, {
      type: 'doughnut',
      data: {
        labels: ['SLG (Workday SLG)', 'SLG Generic', 'Workday Non-SLG', 'Partner'],
        datasets: [{
          data: [slgReal, slgGeneric, nonSlg, partner],
          backgroundColor: [colSlg, colSlgGen, colNonSlg, colPartner],
          borderWidth: 1, borderColor: '#fff'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        cutout: '62%',
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed;
                const pct = total > 0 ? (v / total) : 0;
                return ctx.label + ': ' + fmtHours(v) + ' hrs (' + fmtPct1(pct) + ')';
              }
            }
          }
        }
      }
    });

    const legendRows = [
      { label: 'SLG (Workday SLG)', hours: slgReal, color: colSlg, cls: 'slg' },
      { label: 'SLG Generic', hours: slgGeneric, color: colSlgGen, cls: 'slg-generic' },
      { label: 'Workday Non-SLG', hours: nonSlg, color: colNonSlg, cls: 'nonslg' },
      { label: 'Partner', hours: partner, color: colPartner, cls: 'partner' }
    ];
    $('#rpDonutLegendBody').innerHTML = legendRows.map(r => {
      const pct = total > 0 ? (r.hours / total) : 0;
      return `
        <tr>
          <td>
            <span class="wc-swatch ${r.cls}"></span>
            ${escapeHtml_(r.label)}
          </td>
          <td class="num">${fmtHours(r.hours)}</td>
          <td class="num">${fmtPct1(pct)}</td>
        </tr>`;
    }).join('');

    const slgCombined = slgReal + slgGeneric;
    const barCtx = $('#rpHorizontalBarChart').getContext('2d');
    if (State.charts.rpHBar) State.charts.rpHBar.destroy();
    State.charts.rpHBar = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['SLG vs Everyone Else'],
        datasets: [
          { label: 'SLG', data: [slgCombined], backgroundColor: colSlg, stack: 'mix' },
          { label: 'Workday Non-SLG', data: [nonSlg], backgroundColor: colNonSlg, stack: 'mix' },
          { label: 'Partner', data: [partner], backgroundColor: colPartner, stack: 'mix' }
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed.x;
                const pct = total > 0 ? (v / total) : 0;
                return ctx.dataset.label + ': ' + fmtHours(v) + ' hrs (' + fmtPct1(pct) + ')';
              }
            }
          }
        },
        scales: {
          x: { stacked: true, display: false, max: total > 0 ? total : 1 },
          y: { stacked: true, display: false }
        }
      }
    });

    const barLegendRows = [
      { label: 'SLG', hours: slgCombined, cls: 'slg' },
      { label: 'Workday Non-SLG', hours: nonSlg, cls: 'nonslg' },
      { label: 'Partner', hours: partner, cls: 'partner' }
    ];
    $('#rpHorizontalBarLegend').innerHTML = barLegendRows.map(r => {
      const pct = total > 0 ? (r.hours / total) : 0;
      return `
        <div class="lg-row">
          <span class="lg-swatch wc-mix-seg ${r.cls}"></span>
          <span class="lg-label">${escapeHtml_(r.label)}</span>
          <span class="lg-value">${fmtHours(r.hours)} · ${fmtPct1(pct)}</span>
        </div>`;
    }).join('');
  }

  // Worker class mix bar
  function wcMixBarHtml_(wcb, rowTotal) {
    wcb = wcb || {};
    const slg = Number(wcb.slg || 0);
    const slgGen = Number(wcb.slgGeneric || 0);
    const nonSlg = Number(wcb.nonSlg || 0);
    const partner = Number(wcb.partner || 0);
    const sum = slg + slgGen + nonSlg + partner;
    if (sum <= 0) {
      return '<div class="wc-mix-bar" title="No worker class breakdown"></div>';
    }
    const denom = rowTotal > 0 ? rowTotal : sum;
    const seg = (val, cls, name) => {
      if (val <= 0) return '';
      const pct = (val / denom) * 100;
      return `<div class="wc-mix-seg ${cls}" style="width:${pct}%;" title="${name}: ${fmtHours(val)} hrs (${fmtPct1(val/denom)})"></div>`;
    };
    const title = 'SLG: ' + fmtHours(slg) + ' · ' +
                  'SLG Generic: ' + fmtHours(slgGen) + ' · ' +
                  'Workday Non-SLG: ' + fmtHours(nonSlg) + ' · ' +
                  'Partner: ' + fmtHours(partner);
    return `<div class="wc-mix-bar" title="${escapeHtml_(title)}">
      ${seg(slg, 'slg', 'SLG')}
      ${seg(slgGen, 'slg-generic', 'SLG Generic')}
      ${seg(nonSlg, 'nonslg', 'Workday Non-SLG')}
      ${seg(partner, 'partner', 'Partner')}
    </div>`;
  }

  // Team table
  function renderReportingTeamTable_(byTeam, totals) {
    const body = $('#rpTeamBody');
    const foot = $('#rpTeamFooter');
    const total = $('#rpTeamTotalHours');
    const grand = Number((totals || {}).totalHours || 0);
    if (!byTeam.length) {
      body.innerHTML = '<tr><td colspan="4" class="muted" style="padding:12px">No data in current scope.</td></tr>';
      foot.hidden = true;
      return;
    }
    body.innerHTML = byTeam.map(r => {
      const hrs = Number(r.hours || 0);
      const pct = grand > 0 ? (hrs / grand) : 0;
      const isUnclassified = r.team === 'Unclassified';
      const baseCls = isUnclassified ? 'warn-row' : '';
      const isExpanded = State.rpExpandedTeams.has(r.team);
      const expandCls = isExpanded ? 'team-row expanded' : 'team-row';
      const safeTeam = escapeHtml_(r.team || 'Unclassified');
      return `
        <tr class="${baseCls} ${expandCls} rp-team-row" data-team="${safeTeam}" style="cursor:pointer;">
          <td>
            <span class="team-toggle" aria-hidden="true">${isExpanded ? '▼' : '▶'}</span>
            ${safeTeam}
          </td>
          <td class="num">${fmtHours(hrs)}</td>
          <td class="num">${fmtPct1(pct)}</td>
          <td>${wcMixBarHtml_(r.workerClassBreakdown, hrs)}</td>
        </tr>
        ${isExpanded ? renderTeamDrillInlineRow_(r) : ''}`;
    }).join('');
    foot.hidden = false;
    total.textContent = fmtHours(grand);
  }

  function renderTeamDrillInlineRow_(teamRow) {
    const topRC = teamRow.topRoleCategories || [];
    const topAccts = teamRow.topAccounts || [];
    const topProjs = teamRow.topProjects || [];
    const hasMoreRC = (teamRow.allRoleCategories || []).length > topRC.length || topRC.some(x => x.isOther);
    const hasMoreAct = (teamRow.allAccounts || []).length > topAccts.length || topAccts.some(x => x.isOther);
    const hasMorePj = (teamRow.allProjects || []).length > topProjs.length || topProjs.some(x => x.isOther);

    function renderMiniRow_(x) {
      const pct = Number(x.pct || 0);
      const pctW = Math.max(2, Math.min(100, pct * 100));
      const cls = x.isOther ? 'drill-other' : '';
      return `
        <tr class="${cls}">
          <td class="drill-label">${escapeHtml_(x.label || '')}</td>
          <td class="drill-hours num">${fmtHours(x.hours || 0)}</td>
          <td class="drill-bar">
            <div class="bar-wrap">
              <div class="bar-fill" style="width:${pctW}%;"></div>
              <span class="bar-pct">${fmtPct(pct)}</span>
            </div>
          </td>
        </tr>`;
    }

    const rcRows = topRC.length
      ? topRC.map(renderMiniRow_).join('')
      : '<tr><td colspan="3" class="muted" style="padding:8px 10px;">No role categories</td></tr>';
    const acctRows = topAccts.length
      ? topAccts.map(renderMiniRow_).join('')
      : '<tr><td colspan="3" class="muted" style="padding:8px 10px;">No accounts</td></tr>';
    const projRows = topProjs.length
      ? topProjs.map(renderMiniRow_).join('')
      : '<tr><td colspan="3" class="muted" style="padding:8px 10px;">No projects</td></tr>';

    const safeTeam = escapeHtml_(teamRow.team || 'Unclassified');
    return `
      <tr class="team-drill-row" data-team="${safeTeam}">
        <td colspan="4" style="padding:0; background:#FBFCFE;">
          <div class="drill-grid" style="grid-template-columns:1fr 1fr 1fr;">
            <div class="drill-pane">
              <div class="drill-head">
                <span class="drill-title">Top role categories</span>
                ${hasMoreRC ? `<a href="#" class="drill-showall rp-drill-showall" data-scope="team" data-kind="roleCategories" data-key="${safeTeam}">Show all →</a>` : ''}
              </div>
              <table class="drill-table"><tbody>${rcRows}</tbody></table>
            </div>
            <div class="drill-pane">
              <div class="drill-head">
                <span class="drill-title">Top accounts</span>
                ${hasMoreAct ? `<a href="#" class="drill-showall rp-drill-showall" data-scope="team" data-kind="accounts" data-key="${safeTeam}">Show all →</a>` : ''}
              </div>
              <table class="drill-table"><tbody>${acctRows}</tbody></table>
            </div>
            <div class="drill-pane">
              <div class="drill-head">
                <span class="drill-title">Top projects</span>
                ${hasMorePj ? `<a href="#" class="drill-showall rp-drill-showall" data-scope="team" data-kind="projects" data-key="${safeTeam}">Show all →</a>` : ''}
              </div>
              <table class="drill-table"><tbody>${projRows}</tbody></table>
            </div>
          </div>
        </td>
      </tr>`;
  }

  // Account table
  function renderReportingAccountTable_(byAccount, totals) {
    const body = $('#rpAccountBody');
    const foot = $('#rpAccountFooter');
    const lbl = $('#rpAccountFooterLabel');
    const hrsEl = $('#rpAccountFooterHours');
    const pctEl = $('#rpAccountFooterPct');
    const grand = Number((totals || {}).totalHours || 0);
    if (!byAccount.length) {
      body.innerHTML = '<tr><td colspan="4" class="muted" style="padding:12px">No data in current scope.</td></tr>';
      foot.hidden = true;
      $('#rpAccountViewAllBtn').hidden = true;
      return;
    }
    const top10 = byAccount.slice(0, 10);
    const total = byAccount.length;
    const sumTop = top10.reduce((s, r) => s + Number(r.hours || 0), 0);

    body.innerHTML = top10.map(r => {
      const hrs = Number(r.hours || 0);
      const pct = grand > 0 ? (hrs / grand) : 0;
      const isExpanded = State.rpExpandedAccounts.has(r.account);
      const expandCls = isExpanded ? 'team-row expanded' : 'team-row';
      const safeAcct = escapeHtml_(r.account || 'Unspecified');
      return `
        <tr class="${expandCls} rp-account-row" data-account="${safeAcct}" style="cursor:pointer;">
          <td>
            <span class="team-toggle" aria-hidden="true">${isExpanded ? '▼' : '▶'}</span>
            ${safeAcct}
          </td>
          <td class="num">${fmtHours(hrs)}</td>
          <td class="num">${fmtPct1(pct)}</td>
          <td>${wcMixBarHtml_(r.workerClassBreakdown, hrs)}</td>
        </tr>
        ${isExpanded ? renderAccountDrillInlineRow_(r) : ''}`;
    }).join('');

    foot.hidden = false;
    lbl.textContent = 'Top ' + Math.min(10, total) + ' of ' + total;
    hrsEl.textContent = fmtHours(sumTop);
    pctEl.textContent = grand > 0 ? fmtPct1(sumTop / grand) : '—';

    const viewAllBtn = $('#rpAccountViewAllBtn');
    if (viewAllBtn) {
      viewAllBtn.hidden = total <= 10;
      viewAllBtn.textContent = 'View all ' + total + ' accounts';
    }
  }

  function renderAccountDrillInlineRow_(acctRow) {
    const topRoles = acctRow.topRoles || [];
    const topProjs = acctRow.topProjects || [];
    const hasMoreR = (acctRow.allRoles || []).length > topRoles.length || topRoles.some(x => x.isOther);
    const hasMoreP = (acctRow.allProjects || []).length > topProjs.length || topProjs.some(x => x.isOther);

    function renderMiniRow_(x) {
      const pct = Number(x.pct || 0);
      const pctW = Math.max(2, Math.min(100, pct * 100));
      const cls = x.isOther ? 'drill-other' : '';
      return `
        <tr class="${cls}">
          <td class="drill-label">${escapeHtml_(x.label || '')}</td>
          <td class="drill-hours num">${fmtHours(x.hours || 0)}</td>
          <td class="drill-bar">
            <div class="bar-wrap">
              <div class="bar-fill" style="width:${pctW}%;"></div>
              <span class="bar-pct">${fmtPct(pct)}</span>
            </div>
          </td>
        </tr>`;
    }

    const wcb = acctRow.workerClassBreakdown || {};
    const wcRows = [
      { label: 'SLG (Workday SLG)', hours: Number(wcb.slg || 0), cls: 'slg' },
      { label: 'SLG Generic', hours: Number(wcb.slgGeneric || 0), cls: 'slg-generic' },
      { label: 'Workday Non-SLG', hours: Number(wcb.nonSlg || 0), cls: 'nonslg' },
      { label: 'Partner', hours: Number(wcb.partner || 0), cls: 'partner' }
    ].filter(r => r.hours > 0);
    const wcTotal = wcRows.reduce((s, r) => s + r.hours, 0);

    const wcMiniRows = wcRows.length
      ? wcRows.map(r => {
          const pct = wcTotal > 0 ? (r.hours / wcTotal) : 0;
          const pctW = Math.max(2, Math.min(100, pct * 100));
          return `
            <tr>
              <td class="drill-label">
                <span class="wc-swatch ${r.cls}"></span>
                ${escapeHtml_(r.label)}
              </td>
              <td class="drill-hours num">${fmtHours(r.hours)}</td>
              <td class="drill-bar">
                <div class="bar-wrap">
                  <div class="bar-fill" style="width:${pctW}%;background:var(--wc-${r.cls});opacity:1;"></div>
                  <span class="bar-pct">${fmtPct(pct)}</span>
                </div>
              </td>
            </tr>`;
        }).join('')
      : '<tr><td colspan="3" class="muted" style="padding:8px 10px;">No worker class breakdown</td></tr>';

    const roleRows = topRoles.length
      ? topRoles.map(renderMiniRow_).join('')
      : '<tr><td colspan="3" class="muted" style="padding:8px 10px;">No roles</td></tr>';
    const projRows = topProjs.length
      ? topProjs.map(renderMiniRow_).join('')
      : '<tr><td colspan="3" class="muted" style="padding:8px 10px;">No projects</td></tr>';

    const safeAcct = escapeHtml_(acctRow.account || 'Unspecified');
    return `
      <tr class="team-drill-row" data-account="${safeAcct}">
        <td colspan="4" style="padding:0; background:#FBFCFE;">
          <div class="drill-grid" style="grid-template-columns:1fr 1fr 1fr;">
            <div class="drill-pane">
              <div class="drill-head">
                <span class="drill-title">Worker class breakdown</span>
              </div>
              <table class="drill-table"><tbody>${wcMiniRows}</tbody></table>
            </div>
            <div class="drill-pane">
              <div class="drill-head">
                <span class="drill-title">Top roles</span>
                ${hasMoreR ? `<a href="#" class="drill-showall rp-drill-showall" data-scope="account" data-kind="roles" data-key="${safeAcct}">Show all →</a>` : ''}
              </div>
              <table class="drill-table"><tbody>${roleRows}</tbody></table>
            </div>
            <div class="drill-pane">
              <div class="drill-head">
                <span class="drill-title">Top projects</span>
                ${hasMoreP ? `<a href="#" class="drill-showall rp-drill-showall" data-scope="account" data-kind="projects" data-key="${safeAcct}">Show all →</a>` : ''}
              </div>
              <table class="drill-table"><tbody>${projRows}</tbody></table>
            </div>
          </div>
        </td>
      </tr>`;
  }

  function renderReportingRoleCategoryTable_(rows, totals) {
    const body = $('#rpRoleCategoryBody');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">No data in current scope.</td></tr>';
      return;
    }
    body.innerHTML = rows.map(r => `
      <tr>
        <td>${escapeHtml_(r.roleCategory || 'Unclassified')}</td>
        <td class="num">${fmtHours(r.hours || 0)}</td>
        <td class="num">${fmtPct1(r.pctOfTotal || 0)}</td>
      </tr>`).join('');
  }

  function renderReportingJobProfileTable_(rows, totals) {
    const body = $('#rpJobProfileBody');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">No data in current scope.</td></tr>';
      return;
    }
    body.innerHTML = rows.map(r => `
      <tr>
        <td>${escapeHtml_(r.jobProfile || 'Unspecified')}</td>
        <td class="num">${fmtHours(r.hours || 0)}</td>
        <td class="num">${fmtPct1(r.pctOfTotal || 0)}</td>
      </tr>`).join('');
  }

  function renderReportingTop5_(topAccounts, topRoles, totals) {
    function renderTop5Row_(x) {
      const hrs = Number(x.hours || 0);
      const pct = Number(x.pct || 0);
      const pctW = Math.max(2, Math.min(100, pct * 100));
      return `
        <tr>
          <td>${escapeHtml_(x.label || '')}</td>
          <td class="num">${fmtHours(hrs)}</td>
          <td class="cell-with-bar" style="min-width:100px;">
            <div class="cell-bar-wrap">
              <div class="cell-bar-fill" style="width:${pctW}%;"></div>
              <span class="cell-bar-text">${fmtPct(pct)}</span>
            </div>
          </td>
        </tr>`;
    }

    const acctBody = $('#rpTop5AccountsBody');
    if (!topAccounts.length) {
      acctBody.innerHTML = '<tr><td colspan="3" class="muted" style="padding:8px 10px">No accounts in scope</td></tr>';
    } else {
      acctBody.innerHTML = topAccounts.map(renderTop5Row_).join('');
    }

    const roleBody = $('#rpTop5RolesBody');
    if (!topRoles.length) {
      roleBody.innerHTML = '<tr><td colspan="3" class="muted" style="padding:8px 10px">No roles in scope</td></tr>';
    } else {
      roleBody.innerHTML = topRoles.map(renderTop5Row_).join('');
    }
  }

  function renderReportingDiagnostics_(diag, totals) {
    diag = diag || {};
    const grand = Number((totals || {}).totalHours || 0);
    const unmapped = diag.unmapped || [];
    const blank = diag.blankClassWorkers || { count: 0, totalHours: 0, sampleNames: [] };

    const summaryParts = [];
    if (unmapped.length) summaryParts.push(unmapped.length + ' unmapped categor' + (unmapped.length === 1 ? 'y' : 'ies'));
    if (blank.count) summaryParts.push(blank.count + ' blank-class worker' + (blank.count === 1 ? '' : 's'));
    const summaryText = summaryParts.length ? summaryParts.join(' · ') : 'All clear';
    $('#rpDiagnosticsSummary').textContent = summaryText;

    if (!unmapped.length) {
      $('#rpUnmappedBody').innerHTML = '<tr><td colspan="3" class="muted" style="padding:12px">No unmapped categories — all rows classified.</td></tr>';
      $('#rpUnmappedBadge').className = 'badge ghost';
      $('#rpUnmappedBadge').textContent = '0';
    } else {
      const sumUn = unmapped.reduce((s, u) => s + Number(u.hours || 0), 0);
      $('#rpUnmappedBadge').className = 'badge amber';
      $('#rpUnmappedBadge').textContent = fmtHours(sumUn) + ' hrs · ' + unmapped.length;
      $('#rpUnmappedBody').innerHTML = unmapped.map(u => {
        const hrs = Number(u.hours || 0);
        const pct = grand > 0 ? (hrs / grand) : 0;
        return `
          <tr>
            <td><code>${escapeHtml_(u.key || '')}</code></td>
            <td class="num">${fmtHours(hrs)}</td>
            <td class="num">${fmtPct1(pct)}</td>
          </tr>`;
      }).join('');
    }

    if (!blank.count) {
      $('#rpBlankClassBody').innerHTML = '<tr><td colspan="2" class="muted" style="padding:12px">No blank-class workers detected.</td></tr>';
      $('#rpBlankClassBadge').className = 'badge ghost';
      $('#rpBlankClassBadge').textContent = '0';
    } else {
      $('#rpBlankClassBadge').className = 'badge amber';
      $('#rpBlankClassBadge').textContent = fmtHours(blank.totalHours) + ' hrs · ' + blank.count;
      const sample = blank.sampleNames || [];
      $('#rpBlankClassBody').innerHTML = sample.map(s => `
        <tr>
          <td>${escapeHtml_(s.name || '')}</td>
          <td class="num">${fmtHours(s.hours || 0)}</td>
        </tr>`).join('') +
        (blank.count > sample.length
          ? `<tr><td colspan="2" class="muted" style="padding:8px 12px">
               +${blank.count - sample.length} more not shown · resolve in Admin → Worker Exclusions
             </td></tr>`
          : '');
    }
  }

  // Event handlers + modals
  function initReportingHandlers_() {
    document.addEventListener('click', (e) => {
      const banAction = e.target.closest('[data-banner-action]');
      if (banAction) {
        clearSingleFilter_(banAction.dataset.bannerAction);
        return;
      }

      if (e.target.closest('#rpDiagnosticsHeader')) {
        rpToggleDiagnostics_();
        return;
      }

      const showAll = e.target.closest('.rp-drill-showall');
      if (showAll) {
        e.preventDefault();
        openRpDrillModal_({
          scope: showAll.dataset.scope,
          kind: showAll.dataset.kind,
          key: showAll.dataset.key
        });
        return;
      }

      if (e.target.closest('#rpAccountViewAllBtn')) {
        openRpAccountsModal_();
        return;
      }

      const inDrill = e.target.closest('#rpTeamDrillModal, #rpAccountDrillModal');
      if (inDrill && e.target.dataset && e.target.dataset.close !== undefined) {
        closeRpDrillModal_();
        return;
      }

      const inAcctsModal = e.target.closest('#rpAccountsModal');
      if (inAcctsModal && e.target.dataset && e.target.dataset.close !== undefined) {
        closeRpAccountsModal_();
        return;
      }

      const teamRow = e.target.closest('tr.rp-team-row');
      if (teamRow && !e.target.closest('tr.team-drill-row')) {
        const t = teamRow.dataset.team;
        if (t) rpToggleTeam_(t);
        return;
      }

      const acctRow = e.target.closest('tr.rp-account-row');
      if (acctRow && !e.target.closest('tr.team-drill-row')) {
        const a = acctRow.dataset.account;
        if (a) rpToggleAccount_(a);
        return;
      }
    });

    const _debouncedRpAccountsSearch_ = debounce_((value) => {
      renderRpAccountsModalRows_(State.rpAccountsAll || [], State.rpHoursTotal || 0, value);
    }, 200);
    const _debouncedRpDrillSearch_ = debounce_(() => renderRpDrillModalRows_(), 200);

    document.addEventListener('input', (e) => {
      if (e.target && e.target.id === 'rpAccountsModalSearch') {
        _debouncedRpAccountsSearch_(e.target.value);
      }
      if (e.target && (e.target.id === 'rpTeamDrillSearch' || e.target.id === 'rpAccountDrillSearch')) {
        _debouncedRpDrillSearch_();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      [['rpTeamDrillModal', closeRpDrillModal_],
       ['rpAccountDrillModal', closeRpDrillModal_],
       ['rpAccountsModal', closeRpAccountsModal_]].forEach(([id, closer]) => {
        const m = document.getElementById(id);
        if (m && !m.hidden) closer();
      });
    });

    $('#rpDiagnosticsHeader')?.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        rpToggleDiagnostics_();
      }
    });
  }

  function rpToggleDiagnostics_() {
    State.rpDiagnosticsOpen = !State.rpDiagnosticsOpen;
    const body = $('#rpDiagnosticsBody');
    const chev = $('#rpDiagnosticsChev');
    if (!body) return;
    body.hidden = !State.rpDiagnosticsOpen;
    if (chev) chev.classList.toggle('open', State.rpDiagnosticsOpen);
  }

    function rpToggleTeam_(teamName) {
    if (!State.rpExpandedTeams) State.rpExpandedTeams = new Set();
    if (State.rpExpandedTeams.has(teamName)) State.rpExpandedTeams.delete(teamName);
    else State.rpExpandedTeams.add(teamName);
    if (State.reporting) {
      renderReportingTeamTable_(State.reporting.byTeam || [], State.reporting.totals || {});
    }
  }

  function rpToggleAccount_(account) {
    if (!State.rpExpandedAccounts) State.rpExpandedAccounts = new Set();
    if (State.rpExpandedAccounts.has(account)) State.rpExpandedAccounts.delete(account);
    else State.rpExpandedAccounts.add(account);
    if (State.reporting) {
      renderReportingAccountTable_(State.reporting.byAccount || [], State.reporting.totals || {});
    }
  }

  function openRpDrillModal_(ctx) {
    if (!State.reporting) return;
    let list = []; let title = ''; let sub = '';
    let labelHeader = 'Label'; let modal = null;

    if (ctx.scope === 'team') {
      const team = (State.reporting.byTeam || []).find(t => t.team === ctx.key);
      if (!team) return;
      if (ctx.kind === 'roleCategories') { list = team.allRoleCategories || []; labelHeader = 'Role Category'; title = team.team + ' — All role categories'; }
      else if (ctx.kind === 'accounts')   { list = team.allAccounts || [];        labelHeader = 'Account';       title = team.team + ' — All accounts'; }
      else if (ctx.kind === 'projects')   { list = team.allProjects || [];        labelHeader = 'Project';       title = team.team + ' — All projects'; }
      modal = $('#rpTeamDrillModal');
      sub = (list.length || 0) + ' items';
    } else if (ctx.scope === 'account') {
      const acct = (State.reporting.byAccount || []).find(a => a.account === ctx.key);
      if (!acct) return;
      if (ctx.kind === 'roles')    { list = acct.allRoles || [];    labelHeader = 'Role';    title = acct.account + ' — All roles'; }
      else if (ctx.kind === 'projects') { list = acct.allProjects || []; labelHeader = 'Project'; title = acct.account + ' — All projects'; }
      modal = $('#rpAccountDrillModal');
      sub = (list.length || 0) + ' items';
    }

    if (!modal) return;
    State.rpActiveDrill = { ctx: ctx, list: list, modal: modal };

    if (ctx.scope === 'team') {
      $('#rpTeamDrillTitle').textContent = title;
      $('#rpTeamDrillSub').textContent = sub;
      $('#rpTeamDrillLabelHeader').textContent = labelHeader;
      const search = $('#rpTeamDrillSearch');
      if (search) search.value = '';
    } else {
      $('#rpAccountDrillTitle').textContent = title;
      $('#rpAccountDrillSub').textContent = sub;
      $('#rpAccountDrillLabelHeader').textContent = labelHeader;
      const search = $('#rpAccountDrillSearch');
      if (search) search.value = '';
    }

    renderRpDrillModalRows_();
    modal.hidden = false;
  }

  function renderRpDrillModalRows_() {
    if (!State.rpActiveDrill) return;
    const { ctx, list } = State.rpActiveDrill;
    const isTeam = ctx.scope === 'team';
    const searchEl = isTeam ? $('#rpTeamDrillSearch') : $('#rpAccountDrillSearch');
    const bodyEl = isTeam ? $('#rpTeamDrillBody') : $('#rpAccountDrillBody');
    const totalHrsEl = isTeam ? $('#rpTeamDrillTotalHours') : $('#rpAccountDrillTotalHours');
    const totalPctEl = isTeam ? $('#rpTeamDrillTotalPct') : $('#rpAccountDrillTotalPct');

    const q = String((searchEl && searchEl.value) || '').toLowerCase().trim();
    const filtered = q
      ? list.filter(x => String(x.label || '').toLowerCase().indexOf(q) >= 0)
      : list.slice();

    const grand = filtered.reduce((s, x) => s + Number(x.hours || 0), 0);

    bodyEl.innerHTML = filtered.length
      ? filtered.map((x, i) => {
          const hrs = Number(x.hours || 0);
          const pct = grand > 0 ? (hrs / grand) : 0;
          return `
            <tr>
              <td class="num">${i + 1}</td>
              <td>${escapeHtml_(x.label || '')}</td>
              <td class="num">${fmtHours(hrs)}</td>
              <td class="num">${fmtPct1(pct)}</td>
            </tr>`;
        }).join('')
      : '<tr><td colspan="4" class="muted" style="padding:12px">No matches.</td></tr>';

    totalHrsEl.textContent = fmtHours(grand);
    totalPctEl.textContent = grand > 0 ? '100%' : '—';
  }

  function closeRpDrillModal_() {
    const team = $('#rpTeamDrillModal');
    const acct = $('#rpAccountDrillModal');
    if (team) team.hidden = true;
    if (acct) acct.hidden = true;
    State.rpActiveDrill = null;
  }

  function openRpAccountsModal_() {
    const modal = $('#rpAccountsModal');
    if (!modal) return;
    const list = State.rpAccountsAll || [];
    const total = State.rpHoursTotal || 0;
    $('#rpAccountsModalSub').textContent = list.length + ' accounts in scope';
    const search = $('#rpAccountsModalSearch');
    if (search) search.value = '';
    renderRpAccountsModalRows_(list, total, '');
    modal.hidden = false;
  }

  function renderRpAccountsModalRows_(list, total, query) {
    const body = $('#rpAccountsModalBody');
    const totalHrsEl = $('#rpAccountsModalTotalHours');
    const totalPctEl = $('#rpAccountsModalTotalPct');
    if (!body) return;

    const q = String(query || '').toLowerCase().trim();
    const filtered = q
      ? list.filter(r => String(r.account || '').toLowerCase().indexOf(q) >= 0)
      : list.slice();

    const sumFiltered = filtered.reduce((s, r) => s + Number(r.hours || 0), 0);
    const grand = total > 0 ? total : sumFiltered;

    body.innerHTML = filtered.length
      ? filtered.map((r, i) => {
          const hrs = Number(r.hours || 0);
          const pct = grand > 0 ? (hrs / grand) : 0;
          return `
            <tr>
              <td class="num">${i + 1}</td>
              <td>${escapeHtml_(r.account || 'Unspecified')}</td>
              <td class="num">${fmtHours(hrs)}</td>
              <td class="num">${fmtPct1(pct)}</td>
            </tr>`;
        }).join('')
      : '<tr><td colspan="4" class="muted" style="padding:12px">No matches.</td></tr>';

    totalHrsEl.textContent = fmtHours(sumFiltered);
    totalPctEl.textContent = grand > 0 ? fmtPct1(sumFiltered / grand) : '—';
  }

  function closeRpAccountsModal_() {
    const modal = $('#rpAccountsModal');
    if (modal) modal.hidden = true;
  }
</script>

<script>
  // ============================================================
  // Capacity Explorer (WFM.18)
  //
  // Priority 3: resource list respects Worker Scope + Team + Manager
  // filters client-side against State.ref.resources. Detail pane
  // consumes api_getResourceDetailV2 (weekly/quarter canonical path).
  // Hybrid list defaults collapsed; dropdown + stepper when collapsed.
  // ============================================================
  const ExplorerQuarterState = { metric: 'icp' };
  const ExplorerProjectState = { expanded: new Set() };
  const EXPLORER_TEAM_ORDER = [
    'Functional Consulting',
    'Technical Consulting',
    'Delivery'
  ];
  const ExplorerGroupState = { collapsed: new Set() };

  function deriveExplorerLevel_(jobProfile) {
    return String(jobProfile || '').trim().substring(0, 2) || '—';
  }

  function getExplorerCurQuarter_() {
    return fiscalQuarterKey_(new Date());
  }

  /** True when both dates fall entirely within the calendar current fiscal quarter. */
  function isRangeEntirelyInCurrentQuarter_(startIso, endIso) {
    const curQ = getExplorerCurQuarter_();
    const startQ = fiscalQuarterKey_(new Date(startIso + 'T12:00:00'));
    const endQ = fiscalQuarterKey_(new Date(endIso + 'T12:00:00'));
    return startQ === curQ && endQ === curQ;
  }

  /** True when a reduction date range touches current quarter and extends into a forward quarter. */
  function reductionRangeSpansCurrentAndForward_(startIso, endIso) {
    const curQ = getExplorerCurQuarter_();
    const startQ = fiscalQuarterKey_(new Date(startIso + 'T12:00:00'));
    const endQ = fiscalQuarterKey_(new Date(endIso + 'T12:00:00'));
    return (startQ === curQ || endQ === curQ) && !(startQ === curQ && endQ === curQ);
  }

  function getReductionClampEffectiveHours_(resourceName) {
    const warnings = State.explorerProjection && State.explorerProjection.clampWarnings;
    if (!warnings || !warnings.length) return null;
    const match = warnings.find(function (w) { return w.resource_name === resourceName; });
    return match ? Number(match.effective_hours) : null;
  }

  function getExplorerWorkerBaseline_(resourceName) {
    const proj = State.explorerBaselineProjection;
    if (!proj || !proj.baseline) return null;
    return (proj.baseline.worker || []).find(function (w) {
      return w.resourceName === resourceName;
    }) || null;
  }

  function getExplorerWorkerBaselineUtil_(resourceName) {
    const row = getExplorerWorkerBaseline_(resourceName);
    if (!row) return null;
    const curQ = getExplorerCurQuarter_();
    const q = (row.quarters || []).find(function (qq) { return qq.quarterKey === curQ; });
    return q ? q.icpUtil : null;
  }

  function getExplorerTeamBaselineUtil_(teamLabel) {
    const proj = State.explorerBaselineProjection;
    if (!proj || !proj.baseline) return null;
    const org = (proj.baseline.orgTeams || []).find(function (o) {
      return o.teamLabel === teamLabel;
    });
    if (!org) return null;
    const curQ = getExplorerCurQuarter_();
    const q = (org.quarters || []).find(function (qq) { return qq.quarterKey === curQ; });
    return q ? q.icpUtil : null;
  }

  async function loadExplorerBaselineProjection_() {
    try {
      State.explorerBaselineProjection = await call(
        'api_projectSoftBookings',
        buildServerParams_(),
        []
      );
    } catch (e) {
      State.explorerBaselineProjection = null;
    }
  }

  function groupExplorerResources_(resources) {
    const groups = {};
    resources.forEach(function (r) {
      const label = r.resolvedTeam || 'Unclassified';
      if (!groups[label]) groups[label] = [];
      groups[label].push(r);
    });
    const ordered = [];
    EXPLORER_TEAM_ORDER.forEach(function (label) {
      if (groups[label] && groups[label].length) {
        ordered.push({ label: label, workers: groups[label] });
        delete groups[label];
      }
    });
    Object.keys(groups).sort().forEach(function (label) {
      ordered.push({ label: label, workers: groups[label] });
    });
    return ordered;
  }

  function renderExplorerUtilPill_(util, icpTarget) {
    const pct = util == null ? '—' : fmtPct1(util);
    const color = util == null
      ? { bg: 'var(--business-card)', fg: 'var(--staple)' }
      : cellColor(util, icpTarget || 0.75);
    return '<span class="explorer-util-pill" style="background:' + color.bg +
      ';color:' + color.fg + '">' + pct + '</span>';
  }

  function renderExplorerTeamGroupHtml_(group) {
    const collapsed = ExplorerGroupState.collapsed.has(group.label);
    const teamUtil = getExplorerTeamBaselineUtil_(group.label);
    const pill = renderExplorerUtilPill_(teamUtil, 0.75);
    let html = '<div class="explorer-team-group" data-team="' + escapeHtml_(group.label) + '">' +
      '<button type="button" class="explorer-team-header" data-team-toggle="' +
        escapeHtml_(group.label) + '" aria-expanded="' + (!collapsed) + '">' +
        '<span class="explorer-team-chevron">' + (collapsed ? '▶' : '▼') + '</span>' +
        '<span class="explorer-team-name">' + escapeHtml_(group.label) + '</span>' +
        '<span class="explorer-team-pill-wrap">' + pill + '</span>' +
      '</button>';
    if (!collapsed) {
      html += '<div class="explorer-team-body">';
      group.workers.forEach(function (r) {
        const level = deriveExplorerLevel_(r.job_profile);
        const util = getExplorerWorkerBaselineUtil_(r.name);
        const workerPill = renderExplorerUtilPill_(util, 0.75);
        const active = r.name === State.selectedResource ? ' active' : '';
        html += '<div class="resource-item explorer-worker-row' + active +
          '" data-resource="' + escapeHtml_(r.name) + '">' +
          '<div class="explorer-worker-main" data-select-worker="' + escapeHtml_(r.name) + '">' +
            '<div><div class="resource-name">' + escapeHtml_(r.name) + '</div>' +
            '<div class="resource-meta">' + escapeHtml_(level) + ' · ' + workerPill + '</div></div>' +
          '</div>' +
          '<button type="button" class="btn-ghost explorer-softbook-btn" data-softbook="' +
            escapeHtml_(r.name) + '">+ Soft book</button>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
    return html;
  }

  function wireExplorerResourceListEvents_() {
    $$('#resourceList [data-team-toggle]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        const team = btn.dataset.teamToggle;
        if (ExplorerGroupState.collapsed.has(team)) {
          ExplorerGroupState.collapsed.delete(team);
        } else {
          ExplorerGroupState.collapsed.add(team);
        }
        renderResourceList();
      });
    });
    $$('#resourceList [data-select-worker]').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        selectExplorerResource_(el.dataset.selectWorker);
      });
    });
    $$('#resourceList .explorer-softbook-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        openSoftBookPopover_(btn.dataset.softbook, btn);
      });
    });
