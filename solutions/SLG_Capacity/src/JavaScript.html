  /**
   * Advance a fiscal-quarter key by one quarter.
   * @param {string} qk
   * @returns {string}
   */
  function nextFiscalQuarterKey_(qk) {
    const m = String(qk || '').match(/^FY(\d{2})-(Q[1-4])$/);
    if (!m) return qk;
    let fy = parseInt(m[1], 10);
    let q = parseInt(m[2].charAt(1), 10);
    if (q === 4) { q = 1; fy++; } else { q++; }
    return 'FY' + String(fy).padStart(2, '0') + '-Q' + q;
  }

  /**
   * Inclusive fiscal-quarter key range.
   * @param {string} startKey
   * @param {string} endKey
   * @returns {string[]}
   */
  function wfm25FiscalQuarterRange_(startKey, endKey) {
    const keys = [];
    let k = startKey;
    let guard = 0;
    while (k && compareFiscalQuarterKeys_(k, endKey) <= 0 && guard++ < 48) {
      keys.push(k);
      if (k === endKey) break;
      k = nextFiscalQuarterKey_(k);
    }
    return keys;
  }

  /**
   * Build Mix & Trend bar descriptors from history + scorecard.
   * @param {Object|null} history api_getWorkerTypeHistory result
   * @param {Object|null} scorecard api_getQuarterlyScorecard result
   * @returns {Array<Object>}
   */
  function wfm25BuildMixTrendBars_(history, scorecard) {
    const bars = [];
    const qKeys = (scorecard && scorecard.quarterKeys) || [];
    const teamSummary = (scorecard && scorecard.teamSummary) || [];

    if (qKeys.length >= 3) {
      const prevQ = qKeys[0];
      const curQ = qKeys[1];
      const nextQ = qKeys[2];

      bars.push({
        quarterKey: prevQ,
        totalHours: Number((history && history.quarterTotals && history.quarterTotals[prevQ])) || 0,
        kind: 'actuals',
        label: 'Actuals',
        selectable: true
      });

      const curTeam = teamSummary[1] || {};
      const curSlgHours = Number(curTeam.productiveHours) || 0;
      const curXorgHours = wfm25XorgQuarterTotal_(WFM25State.xorgForecastData, curQ);
      bars.push({
        quarterKey: curQ,
        totalHours: curSlgHours + curXorgHours,
        kind: 'current',
        label: 'Actuals + Forecast',
        selectable: true,
        slgHours: curSlgHours
      });

      const nextTeam = teamSummary[2] || {};
      const nextSlgHours = Number(nextTeam.productiveHours) || 0;
      const nextXorgHours = wfm25XorgQuarterTotal_(WFM25State.xorgForecastData, nextQ);
      bars.push({
        quarterKey: nextQ,
        totalHours: nextSlgHours + nextXorgHours,
        kind: 'forecast',
        label: 'Forecast',
        selectable: true,
        slgHours: nextSlgHours
      });
    }

    bars.sort(function (a, b) {
      return compareFiscalQuarterKeys_(a.quarterKey, b.quarterKey);
    });
    return bars;
  }

  /**
   * Fill a continuous fiscal-quarter timeline with nodata placeholders.
   * @param {Array<Object>} bars
   * @returns {Array<Object>}
   */
  function wfm25BuildMixTrendTimeline_(bars) {
    if (!bars.length) return [];
    const byKey = {};
    bars.forEach(function (b) { byKey[b.quarterKey] = b; });

    const actualBars = bars.filter(function (b) { return b.kind === 'actuals'; });
    const startKey = actualBars.length ? actualBars[0].quarterKey : bars[0].quarterKey;
    const endKey = bars[bars.length - 1].quarterKey;

    return wfm25FiscalQuarterRange_(startKey, endKey).map(function (qk) {
      if (byKey[qk]) return byKey[qk];
      return {
        quarterKey: qk,
        totalHours: null,
        kind: 'nodata',
        label: 'No data',
        selectable: false
      };
    });
  }

  /**
   * Default bar selection: current quarter, else latest historical actual.
   * @param {Array<Object>} timeline
   * @returns {Object|null}
   */
  function wfm25MixTrendDefaultSelection_(timeline) {
    const selectable = timeline.filter(function (b) {
      return b.selectable !== false && b.kind !== 'nodata';
    });
    if (!selectable.length) return null;
    const cur = selectable.find(function (b) { return b.kind === 'current'; });
    if (cur) return cur;
    const actuals = selectable.filter(function (b) { return b.kind === 'actuals'; });
    return actuals.length ? actuals[actuals.length - 1] : selectable[selectable.length - 1];
  }

  /**
   * Concise data-coverage note for the Mix & Trend chart.
   * @param {Array<Object>} timeline
   * @returns {string}
   */
  function wfm25MixTrendCoverageNote_(timeline) {
    if (!timeline.length) return '';
    return 'Previous, current, and next quarter. Historical averages shown in the summary cards above.';

  /**

  function wfm25SelectMixTrendBar_(bar) {

  function wfm25SelectMixTrendCategory_(bar, category) {
    if (!bar || bar.kind === 'nodata') return;

      WFM25State.mixTrendSelectedCategory === category ? null : category;
    wfm25RenderMixTrendDetail_(bar);
  }

  /**
   * State chip label/class for a bar kind.
   * @param {Object} bar
   * @returns {{label:string, chipCls:string}}
   */
  function wfm25MixTrendStateChip_(bar) {
    if (bar.kind === 'current') return { label: 'Actuals + Forecast', chipCls: 'current' };
    if (bar.kind === 'forecast') return { label: 'Forecast', chipCls: 'forecast' };
    return { label: 'Actuals', chipCls: 'actuals' };
  }

  /**
   * Category hours for a selected quarter.
   * @param {Object} bar
   * @param {string} cls
   * @returns {number}
   */
  function wfm25MixTrendCategoryHours_(bar, cls) {
    if (bar.kind === 'actuals') {
      const classes = (WFM25State.historyData &&
        WFM25State.historyData.quarterClasses &&
        WFM25State.historyData.quarterClasses[bar.quarterKey]) || {};
      return Number(classes[cls]) || 0;
    }
    if (cls === 'SLG') return Number(bar.slgHours) || 0;
    return wfm25XorgGroupHours_(WFM25State.xorgForecastData, cls, bar.quarterKey);
  }

  /**
   * Render Mix & Trend bar chart (persistent; does not hide detail panel).
   * @param {Array<Object>} timeline
   */
  function renderWFM25MixTrendChart_(timeline) {
    const chart = document.getElementById('wfm25MixTrendChart');
    const loading = document.getElementById('wfm25MixTrendLoading');
    if (!chart) return;

    if (loading) loading.hidden = true;
    chart.hidden = false;

    if (!timeline.length) {
      chart.innerHTML = '<div class="muted wfm25-mix-trend-empty">No hours data available.</div>';
      return;
    }

    const dataBars = timeline.filter(function (b) { return b.kind !== 'nodata'; });
    const maxH = Math.max.apply(null, dataBars.map(function (b) { return b.totalHours; }).concat([1]));
    const plotH = WFM25_MIX_TREND_PLOT_H_;
    const yTicks = [maxH, maxH / 2, 0];
    const barsMinW = timeline.length * WFM25_MIX_TREND_BAR_MIN_W_;

    const gridHtml = yTicks.map(function (tick, i) {
      const pct = (1 - i / (yTicks.length - 1)) * 100;
      return '<div class="wfm25-mix-trend-gridline" style="bottom:' + pct.toFixed(1) + '%">' +
        '<span class="wfm25-mix-trend-grid-label">' + fmtHoursAbbrev_(tick) + '</span>' +
      '</div>';
    }).join('');

    const barsHtml = timeline.map(function (bar, idx) {
      const curTag = bar.kind === 'current' ? ' \u25c6' : '';
      const selected = WFM25State.mixTrendSelected &&
        WFM25State.mixTrendSelected.quarterKey === bar.quarterKey;

      if (bar.kind === 'nodata') {
        return '<div class="wfm25-mix-trend-bar-slot wfm25-mix-trend-bar-slot--nodata" role="listitem"' +
          ' aria-label="' + escapeHtml_(bar.quarterKey) + ': No data">' +
          '<div class="wfm25-mix-trend-bar-col">' +
            '<div class="wfm25-mix-trend-bar wfm25-mix-bar--nodata" title="No data"></div>' +
          '</div>' +
          '<div class="wfm25-mix-trend-bar-label">' + escapeHtml_(bar.quarterKey) + '</div>' +
          '<div class="wfm25-mix-trend-bar-kind">No data</div>' +
        '</div>';
      }

      const barPx = Math.max(3, (bar.totalHours / maxH) * plotH);
      const kindCls = 'wfm25-mix-bar--' + bar.kind;
      const exactH = fmtHours(bar.totalHours) + ' hours';
      return '<button type="button" class="wfm25-mix-trend-bar-btn' +
        (selected ? ' is-selected' : '') + '" role="listitem"' +
        ' data-bar-idx="' + idx + '" aria-pressed="' + (selected ? 'true' : 'false') + '"' +
        ' title="' + escapeHtml_(bar.quarterKey) + ': ' + exactH + ', ' + escapeHtml_(bar.label) + '"' +
        ' aria-label="' + escapeHtml_(bar.quarterKey) + ': ' + exactH + ', ' +
          escapeHtml_(bar.label) + '">' +
        '<div class="wfm25-mix-trend-bar-col">' +
          '<span class="wfm25-mix-trend-bar-val">' + fmtHoursAbbrev_(bar.totalHours) + '</span>' +
          '<div class="wfm25-mix-trend-bar ' + kindCls + '" style="height:' + barPx.toFixed(1) + 'px"' +
            ' title="' + escapeHtml_(exactH) + '"></div>' +
        '</div>' +
        '<div class="wfm25-mix-trend-bar-label">' + escapeHtml_(bar.quarterKey) + curTag + '</div>' +
        '<div class="wfm25-mix-trend-bar-kind">' + escapeHtml_(bar.label) + '</div>' +
      '</button>';
    }).join('');

    const coverage = wfm25MixTrendCoverageNote_(timeline);

    chart.innerHTML =
      '<div class="wfm25-mix-trend-chart-inner" role="img" aria-label="Total delivery hours by fiscal quarter">' +
        '<div class="wfm25-mix-trend-plot-scroll">' +
          '<div class="wfm25-mix-trend-plot-area" style="height:' + plotH + 'px;min-width:' +
            barsMinW + 'px">' +
            '<div class="wfm25-mix-trend-grid" aria-hidden="true">' + gridHtml + '</div>' +
            '<div class="wfm25-mix-trend-bars" role="list">' + barsHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="wfm25-mix-trend-legend" aria-hidden="true">' +
        '<span class="wfm25-mix-trend-legend-item"><span class="wfm25-mix-trend-legend-swatch wfm25-mix-bar--actuals"></span>Actuals</span>' +
        '<span class="wfm25-mix-trend-legend-item"><span class="wfm25-mix-trend-legend-swatch wfm25-mix-bar--current"></span>Actuals + Forecast</span>' +
        '<span class="wfm25-mix-trend-legend-item"><span class="wfm25-mix-trend-legend-swatch wfm25-mix-bar--forecast"></span>Forecast</span>' +
      '</div>' +
      (coverage ? '<div class="wfm25-mix-trend-coverage muted">' + escapeHtml_(coverage) + '</div>' : '');

    WFM25State._mixTrendTimeline = timeline;
    $$('.wfm25-mix-trend-bar-btn', chart).forEach(function (btn) {
      btn.addEventListener('click', function () {
        const i = Number(btn.dataset.barIdx);
        const bar = (WFM25State._mixTrendTimeline || [])[i];
        if (!bar) return;
        wfm25SelectMixTrendBar_(bar);
      });
    });
  }

  /**
   * Build one category row for the drill-down left panel.
   * @param {Object} bar
   * @param {string} cls
   * @param {number} hrs
   * @param {number} total
   * @param {boolean} interactive
   * @returns {string}
   */
  function wfm25MixTrendCatRowHtml_(bar, cls, hrs, total, interactive) {
    const share = total > 0 ? hrs / total : 0;
    const css = wfm25MixTrendCatCss_(cls);
    const selected = WFM25State.mixTrendSelectedCategory === cls;
    const isWd = cls === 'Workday Regions';
    const tag = interactive && isWd ? 'button' : 'div';
    const extraCls = (interactive ? '' : ' wfm25-mix-trend-cat-row--static') +
      (selected ? ' is-selected' : '');
    const typeAttr = tag === 'button' ? ' type="button"' : '';
    const aria = interactive && isWd
      ? ' aria-expanded="' + (selected ? 'true' : 'false') + '"' +
        ' aria-pressed="' + (selected ? 'true' : 'false') + '"' +
        ' data-wfm25-cat="' + escapeHtml_(cls) + '"'
      : '';
    return '<' + tag + typeAttr + ' class="wfm25-mix-trend-cat-row' + extraCls + '"' + aria + '>' +
      '<span class="wfm25-mix-trend-cat-dot wfm25-mix-trend-cat-dot--' + css + '" aria-hidden="true"></span>' +
      '<span class="wfm25-mix-trend-cat-name">' + escapeHtml_(cls) + '</span>' +
      '<span class="wfm25-mix-trend-cat-hours">' + fmtHours(hrs) + 'h</span>' +
      '<span class="wfm25-mix-trend-cat-pct">' + fmtPct1(share) + '</span>' +
      '<div class="wfm25-mix-trend-cat-bar-wrap" aria-hidden="true">' +
        '<div class="wfm25-mix-trend-cat-bar wfm25-mix-trend-cat-bar--' + css + '"' +
          ' style="width:' + (share * 100).toFixed(1) + '%"></div>' +
      '</div>' +
    '</' + tag + '>';
  }

  /**
   * Render Workday Regions breakdown in the right drill-down panel.
   * @param {Object} bar
   * @returns {string}
   */
  function wfm25MixTrendRegionPanelHtml_(bar) {
    const history = WFM25State.historyData || {};
    const xorg = WFM25State.xorgForecastData || {};
    const classTotal = wfm25MixTrendCategoryHours_(bar, 'Workday Regions');

    let rows = [];
    if (bar.kind === 'actuals') {
      const regionRows = (history.regionByQuarter && history.regionByQuarter[bar.quarterKey]) || null;
      if (regionRows && regionRows.length) {
        rows = regionRows;
      } else {
        const regions = (history.quarterRegions && history.quarterRegions[bar.quarterKey]) || {};
        rows = Object.keys(regions).map(function (rk) {
          return { workdayRegion: rk, hours: Number(regions[rk]) || 0 };
        }).sort(function (a, b) { return b.hours - a.hours; });
      }
    } else {
      const regions = (xorg.regionByQuarter && xorg.regionByQuarter[bar.quarterKey]) || {};
      rows = Object.keys(regions).map(function (rk) {
        return { workdayRegion: rk, hours: Number(regions[rk]) || 0 };
      }).sort(function (a, b) { return b.hours - a.hours; });
    }

    const gridHtml = rows.map(function (row) {
      const hrs = Number(row.hours) || 0;
      const name = row.workdayRegion || row.region || '';
      const share = classTotal > 0 ? hrs / classTotal : 0;
      return '<div class="wfm25-mix-trend-region-row">' +
        '<span class="wfm25-mix-trend-region-name">' + escapeHtml_(name) + '</span>' +
        '<span class="wfm25-mix-trend-region-hours">' + fmtHours(hrs) + 'h</span>' +
        '<span class="wfm25-mix-trend-region-pct">' + fmtPct1(share) + '</span>' +
        '<div class="wfm25-mix-trend-region-bar-wrap" aria-hidden="true">' +
          '<div class="wfm25-mix-trend-region-bar" style="width:' + (share * 100).toFixed(1) + '%"></div>' +
        '</div>' +
      '</div>';
    }).join('');

    return '<div class="wfm25-mix-trend-detail-right-header">' +
        '<h4 class="wfm25-mix-trend-detail-right-title">Workday Regions breakdown \u2014 ' +
          escapeHtml_(bar.quarterKey) + '</h4>' +
        '<span class="wfm25-mix-trend-detail-right-total">' + fmtHours(classTotal) + 'h</span>' +
      '</div>' +
      '<div class="wfm25-mix-trend-region-grid" role="list">' +
        (gridHtml || '<div class="muted">No region data.</div>') +
      '</div>';
  }

  /**
   * Render selected-quarter drill-down (two-panel B-3 layout).
   * @param {Object} bar
   */
  function wfm25RenderMixTrendDetail_(bar) {
    const reqId = WFM25State.mixTrendReqId;
    const detail = document.getElementById('wfm25MixTrendDetail');
    const left = document.getElementById('wfm25MixTrendDetailLeft');
    const right = document.getElementById('wfm25MixTrendDetailRight');
    if (!detail || !left) return;

    detail.hidden = false;

    if (!bar || bar.kind === 'nodata' || bar.selectable === false) {
      left.innerHTML =
        '<div class="wfm25-mix-trend-detail-empty muted">Select a quarter</div>';
      if (right) {
        right.hidden = true;
        right.innerHTML = '';
      }
      return;
    }

    const curTag = bar.kind === 'current' ? ' \u25c6' : '';
    const chip = wfm25MixTrendStateChip_(bar);
    const total = bar.totalHours || 0;
    let catRows = '';
    let noteHtml = '';

    if (bar.kind === 'actuals') {
      WFM25_MIX_CLASSES_.forEach(function (cls) {
        const hrs = wfm25MixTrendCategoryHours_(bar, cls);
        catRows += wfm25MixTrendCatRowHtml_(bar, cls, hrs, total, true);
      });
    } else {
      WFM25_MIX_CLASSES_.forEach(function (cls) {
        const hrs = wfm25MixTrendCategoryHours_(bar, cls);
        catRows += wfm25MixTrendCatRowHtml_(bar, cls, hrs, total, cls === 'Workday Regions');
      });
      if (bar.kind === 'current') {
        noteHtml = '<p class="muted wfm25-mix-trend-note">Current quarter SLG hours include actuals to date plus forecast forward. ' +
          'Workday Regions and Contractor are cross-org forecast hours from Xorg_Forecast_Aggregate.</p>';
      } else if (bar.kind === 'forecast') {
        noteHtml = '<p class="muted wfm25-mix-trend-note">Forecast quarter includes SLG planned hours plus cross-org / contractor forecast from Xorg_Forecast_Aggregate.</p>';
      }
    }

    if (reqId !== WFM25State.mixTrendReqId) return;

    left.innerHTML =
      '<div class="wfm25-mix-trend-detail-header">' +
        '<div class="wfm25-mix-trend-detail-title-row">' +
          '<h3 class="wfm25-mix-trend-detail-title">' + escapeHtml_(bar.quarterKey) + curTag + '</h3>' +
          '<span class="wfm25-mix-trend-state-chip wfm25-mix-trend-state-chip--' + chip.chipCls + '">' +
            escapeHtml_(chip.label) + '</span>' +
        '</div>' +
        '<div class="wfm25-mix-trend-detail-total">' + fmtHours(total) + 'h</div>' +
      '</div>' +
      '<div class="wfm25-mix-trend-cat-list" role="list">' + catRows + '</div>' +
      noteHtml;

    const showRegions = WFM25State.mixTrendSelectedCategory === 'Workday Regions' &&
      bar.kind !== 'nodata';
    if (right) {
      if (showRegions) {
        right.hidden = false;
        right.innerHTML = wfm25MixTrendRegionPanelHtml_(bar);
      } else {
        right.hidden = true;
        right.innerHTML = '';
      }
    }

    $$('[data-wfm25-cat]', left).forEach(function (btn) {
      btn.addEventListener('click', function () {
        const cat = btn.getAttribute('data-wfm25-cat');
        if (!cat) return;
        wfm25SelectMixTrendCategory_(bar, cat);
      });
    });
  }

  /**
   * Lazy-load history + render Mix & Trend chart and default detail.
   */
  async function loadWFM25MixTrend_() {
    const loading = document.getElementById('wfm25MixTrendLoading');
    const chart = document.getElementById('wfm25MixTrendChart');
    const detail = document.getElementById('wfm25MixTrendDetail');
    const reqId = ++WFM25State.mixTrendReqId;

    WFM25State.mixTrendSelected = null;
    WFM25State.mixTrendSelectedCategory = null;

    const banner = document.getElementById('wfm25MixTrendBanner');
    if (banner) banner.hidden = true;

    if (loading) { loading.hidden = false; loading.textContent = 'Loading\u2026'; }
    if (chart) chart.hidden = true;
    if (detail) detail.hidden = true;

    try {
      if (!WFM25State.scorecardData) {
        const params = buildServerParams_({ workerScope: 'SLG' });
        WFM25State.scorecardData = await call('api_getQuarterlyScorecard', params);
      }
      if (reqId !== WFM25State.mixTrendReqId) return;

      if (!WFM25State.historyData) {
        const histReq = ++WFM25State.historyReqId;
        const history = await call('api_getWorkerTypeHistory', buildServerParams_());
        if (histReq !== WFM25State.historyReqId) return;
        WFM25State.historyData = history;
      }
      if (reqId !== WFM25State.mixTrendReqId) return;

      await wfm25EnsureXorgForecast_();
      if (reqId !== WFM25State.mixTrendReqId) return;

      const bars = wfm25BuildMixTrendBars_(WFM25State.historyData, WFM25State.scorecardData);
      const timeline = wfm25BuildMixTrendTimeline_(bars);
      const def = wfm25MixTrendDefaultSelection_(timeline);
      if (def) WFM25State.mixTrendSelected = def;

      renderWFM25MixTrendBanner_(
        WFM25State.historyData && WFM25State.historyData.bannerSummary
      );
      renderWFM25MixTrendChart_(timeline);
      wfm25RenderMixTrendDetail_(def);
    } catch (err) {
      if (reqId !== WFM25State.mixTrendReqId) return;
      if (loading) {
        loading.hidden = false;
        loading.textContent = 'Failed to load: ' + (err.message || String(err));
        loading.style.color = 'var(--thumbtack)';
      }
      console.error('[WFM.25] loadWFM25MixTrend_ failed:', err);
    }
  }

  // ── Role group-by stub ────────────────────────────────────────

  /**
   * Show a clear "coming later" stub when Role group-by is selected.
   * Does NOT fake data. Makes the stub obvious as required by the spec.
   */
  function renderWFM25RoleStub_() {
    wfm25SetUtilLoading_(false);
    const contentEl = document.getElementById('wfm25UtilContent');
    if (contentEl) contentEl.hidden = false;
    const headerRow = document.getElementById('wfm25UtilHeaderRow');
    const body      = document.getElementById('wfm25UtilBody');
    if (headerRow) $$('.wfm25-qth', headerRow).forEach(function (el) { el.remove(); });
    if (body) {
      body.innerHTML = '<tr><td class="muted" style="padding:0">' +
        '<div class="wfm25-role-stub">' +
        '<strong>Role grouping</strong>' +
        'Role-based population grouping requires an additional data pass ' +
        'and will be available in a later stage.' +
        '</div></td></tr>';
    }
  }

  /**
   * Switch between Capacity and Admin surfaces in the WFM.25 shell.
   * @param {'capacity'|'admin'} view
   */
  function wfm25ShowView_(view) {
    const capacity = document.getElementById('capacityCanvas');
    const admin = document.getElementById('adminCanvas');
    if (capacity) capacity.hidden = (view !== 'capacity');
    if (admin) admin.hidden = (view !== 'admin');
    WFM25State.activeView = view;

    if (view === 'admin') {
      clearWFM25SoftBookings_('admin');
      wfm25CloseWorkerPanel_();
      wfm25SetBreadcrumb_([WFM25State.landingBreadcrumb, 'Admin']);
      loadWFM25Admin_();
      return;
    }

    if (WFM25State.expandedTeam) {
      wfm25SetBreadcrumb_([WFM25State.landingBreadcrumb, WFM25State.expandedTeam]);
    } else {
      wfm25SetBreadcrumb_(WFM25State.landingBreadcrumb);
    }
  }

  // ── WFM.25 Global Search overlay ─────────────────────────────

  const WFM25SearchState = {
    flatResults: [],
    groupedResults: { teams: [], workers: [], roles: [] },
    activeIndex: -1,
    reqId: 0,
    debounceTimer: null
  };

  /**
   * Ensure Capacity view is active before navigating from search.
   */
  function wfm25EnsureCapacityView_() {
    if (WFM25State.activeView === 'capacity') return;
    const capBtn = document.querySelector('.wfm25-strip-btn[data-wfm25-nav="capacity"]');
    if (capBtn) capBtn.click();
  }

  /**
   * Drill to a team using existing breadcrumb/zoom navigation.
   * @param {string|null} teamLabel
   */
  function wfm25NavigateToTeam_(teamLabel) {
    wfm25EnsureCapacityView_();
    wfm25ActivateTab_('utilization');
    WFM25State.expandedTeam = teamLabel || null;
    if (teamLabel) {
      wfm25SetBreadcrumb_([WFM25State.landingBreadcrumb, teamLabel]);
    } else {
      wfm25SetBreadcrumb_(WFM25State.landingBreadcrumb);
    }
    if (WFM25State.scorecardData) {
      renderWFM25UtilTable_(WFM25State.scorecardData);
    } else {
      loadWFM25Utilization_();
    }
  }

  /**
   * Navigate to a search result via existing routing only.
   * @param {{type:string, label?:string, name?:string, teamLabel?:string, sampleTeam?:string}} item
   */
  function wfm25NavigateSearchResult_(item) {
    if (!item || !item.type) return;
    wfm25CloseGlobalSearch_();
    if (item.type === 'team') {
      wfm25NavigateToTeam_(item.label || '');
    } else if (item.type === 'worker') {
      wfm25NavigateToTeam_(item.teamLabel || null);
      wfm25OpenWorkerPanel_(item.name, item.teamLabel || null);
    } else if (item.type === 'role') {
      wfm25NavigateToTeam_(item.sampleTeam || null);
    }
  }

  /**
   * Flatten grouped api_searchDirectory results for keyboard nav.
   * @param {{teams:Object[], workers:Object[], roles:Object[]}} data
   * @returns {Object[]}
   */
  function wfm25FlattenSearchResults_(data) {
    const flat = [];
    (data.teams || []).forEach(function (t) {
      flat.push({ type: 'team', label: t.label });
    });
    (data.workers || []).forEach(function (w) {
      flat.push({
        type: 'worker',
        name: w.name,
        teamLabel: w.teamLabel || '',
        roleCategory: w.roleCategory || ''
      });
    });
    (data.roles || []).forEach(function (r) {
      flat.push({
        type: 'role',
        label: r.label,
        sampleTeam: r.sampleTeam || '',
        count: r.count || 0
      });
    });
    return flat;
  }

  /**
   * Render grouped search results in the overlay listbox.
   * @param {{teams:Object[], workers:Object[], roles:Object[]}} data
   */
  function wfm25RenderSearchResults_(data) {
    const container = document.getElementById('wfm25SearchResults');
    if (!container) return;

    WFM25SearchState.flatResults = wfm25FlattenSearchResults_(data);
    WFM25SearchState.groupedResults = data || { teams: [], workers: [], roles: [] };
    if (!WFM25SearchState.flatResults.length) {
      container.innerHTML = '<div class="wfm25-search-empty muted">No matches</div>';
      WFM25SearchState.activeIndex = -1;
      return;
    }

    let html = '';
    let flatIdx = 0;

    function itemBtn_(item, meta) {
      const idx = flatIdx++;
      const active = idx === WFM25SearchState.activeIndex ? ' wfm25-search-item-active' : '';
      const dot = item.type === 'team'
        ? '<span class="wfm25-team-dot" style="background:' +
          wfm25TeamColor_(item.label) + '"></span>'
        : '';
      const label = item.type === 'worker' ? item.name : item.label;
      return '<button type="button" class="wfm25-search-item' + active + '"' +
        ' role="option" data-wfm25-search-idx="' + idx + '"' +
        (idx === WFM25SearchState.activeIndex ? ' aria-selected="true"' : '') + '>' +
        dot + '<span>' + escapeHtml_(label) + '</span>' +
        (meta ? '<span class="wfm25-search-item-meta">' + escapeHtml_(meta) + '</span>' : '') +
        '</button>';
    }

    if ((data.teams || []).length) {
      html += '<div class="wfm25-search-group-label">Teams</div>';
      data.teams.forEach(function (t) {
        html += itemBtn_({ type: 'team', label: t.label }, '');
      });
    }
    if ((data.workers || []).length) {
      html += '<div class="wfm25-search-group-label">Workers</div>';
      data.workers.forEach(function (w) {
        html += itemBtn_({
          type: 'worker',
          name: w.name,
          teamLabel: w.teamLabel || ''
        }, w.teamLabel || '');
      });
    }
    if ((data.roles || []).length) {
      html += '<div class="wfm25-search-group-label">Roles</div>';
      data.roles.forEach(function (r) {
        html += itemBtn_({
          type: 'role',
          label: r.label,
          sampleTeam: r.sampleTeam || '',
          count: r.count || 0
        }, r.count ? String(r.count) : '');
      });
    }

    container.innerHTML = html;
    $$('.wfm25-search-item', container).forEach(function (btn) {
      btn.addEventListener('click', function () {
        const idx = Number(btn.dataset.wfm25SearchIdx);
        const item = WFM25SearchState.flatResults[idx];
        if (item) wfm25NavigateSearchResult_(item);
      });
    });
  }

  /**
   * Fetch directory matches from read-only api_searchDirectory.
   * @param {string} query
   */
  async function wfm25FetchSearchResults_(query) {
    const reqId = ++WFM25SearchState.reqId;
    try {
      const data = await call('api_searchDirectory', query);
      if (reqId !== WFM25SearchState.reqId) return;
      wfm25RenderSearchResults_(data || { teams: [], workers: [], roles: [] });
    } catch (err) {
      if (reqId !== WFM25SearchState.reqId) return;
      const container = document.getElementById('wfm25SearchResults');
      if (container) {
        container.innerHTML = '<div class="wfm25-search-empty muted">Search failed: ' +
          escapeHtml_(err.message || String(err)) + '</div>';
      }
    }
  }

  /**
   * Open the global search command palette.
   */
  function wfm25OpenGlobalSearch_() {
    const overlay = document.getElementById('wfm25SearchOverlay');
    const input = document.getElementById('wfm25SearchInput');
    if (!overlay) return;
    overlay.hidden = false;
    overlay.classList.remove('wfm25-motion-overlay-exit');
    if (!wfm25MotionReduced_()) overlay.classList.add('wfm25-motion-overlay-enter');
    document.body.style.overflow = 'hidden';
    WFM25SearchState.activeIndex = -1;
    WFM25SearchState.flatResults = [];
    if (input) {
      input.value = '';
      input.focus();
    }
    wfm25RenderSearchResults_({ teams: [], workers: [], roles: [] });
    const container = document.getElementById('wfm25SearchResults');
    if (container) {
      container.innerHTML = '<div class="wfm25-search-empty muted">Type to search teams, workers, or roles</div>';
    }
  }

  /**
   * Close the global search overlay with motion.
   */
  function wfm25CloseGlobalSearch_() {
    const overlay = document.getElementById('wfm25SearchOverlay');
    if (!overlay || overlay.hidden) return;
    WFM25SearchState.reqId++;

    function hide_() {
      overlay.hidden = true;
      overlay.classList.remove('wfm25-motion-overlay-enter', 'wfm25-motion-overlay-exit');
      document.body.style.overflow = '';
    }

    if (wfm25MotionReduced_()) {
      hide_();
      return;
    }
    overlay.classList.remove('wfm25-motion-overlay-enter');
    overlay.classList.add('wfm25-motion-overlay-exit');
    overlay.addEventListener('animationend', hide_, { once: true });
    setTimeout(hide_, wfm25MotionDurationMs_() + 40);
  }

  /**
   * Move keyboard selection within search results.
   * @param {number} delta
   */
  function wfm25MoveSearchSelection_(delta) {
    const total = WFM25SearchState.flatResults.length;
    if (!total) return;
    let next = WFM25SearchState.activeIndex + delta;
    if (next < 0) next = total - 1;
    if (next >= total) next = 0;
    WFM25SearchState.activeIndex = next;
    wfm25RenderSearchResults_(WFM25SearchState.groupedResults);
    const activeBtn = document.querySelector(
      '.wfm25-search-item[data-wfm25-search-idx="' + next + '"]'
    );
    if (activeBtn) activeBtn.scrollIntoView({ block: 'nearest' });
  }

  /**
   * Wire global search overlay: open/close, debounced fetch, keyboard nav, focus trap.
   */
  function initWFM25GlobalSearch_() {
    const overlay = document.getElementById('wfm25SearchOverlay');
    const input = document.getElementById('wfm25SearchInput');
    const trigger = document.getElementById('wfm25SearchTrigger');
    const legacyBtn = document.getElementById('wfm25SearchBtn');
    const backdrop = document.getElementById('wfm25SearchBackdrop');

    function onQueryInput_() {
      const q = (input && input.value) ? input.value.trim() : '';
      WFM25SearchState.activeIndex = -1;
      if (WFM25SearchState.debounceTimer) clearTimeout(WFM25SearchState.debounceTimer);
      if (!q) {
        const container = document.getElementById('wfm25SearchResults');
        if (container) {
          container.innerHTML = '<div class="wfm25-search-empty muted">Type to search teams, workers, or roles</div>';
        }
        WFM25SearchState.flatResults = [];
        WFM25SearchState.groupedResults = { teams: [], workers: [], roles: [] };
        return;
      }
      WFM25SearchState.debounceTimer = setTimeout(function () {
        wfm25FetchSearchResults_(q);
      }, 180);
    }

    if (trigger) trigger.addEventListener('click', wfm25OpenGlobalSearch_);
    if (legacyBtn) legacyBtn.addEventListener('click', wfm25OpenGlobalSearch_);
    if (backdrop) backdrop.addEventListener('click', wfm25CloseGlobalSearch_);

    if (input) {
      input.addEventListener('input', onQueryInput_);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          wfm25MoveSearchSelection_(1);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          wfm25MoveSearchSelection_(-1);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          const item = WFM25SearchState.flatResults[WFM25SearchState.activeIndex];
          if (item) {
            wfm25NavigateSearchResult_(item);
          } else if (WFM25SearchState.flatResults.length === 1) {
            wfm25NavigateSearchResult_(WFM25SearchState.flatResults[0]);
          } else if ((input.value || '').trim()) {
            wfm25FetchSearchResults_(input.value.trim());
          }
        } else if (e.key === 'Escape') {
          e.preventDefault();
          wfm25CloseGlobalSearch_();
        }
      });
    }

    document.addEventListener('keydown', function (e) {
      const mod = e.ctrlKey || e.metaKey;
      if (mod && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        if (overlay && !overlay.hidden) {
          wfm25CloseGlobalSearch_();
        } else {
          wfm25OpenGlobalSearch_();
        }
      } else if (e.key === 'Escape' && overlay && !overlay.hidden) {
        wfm25CloseGlobalSearch_();
      }
    });
  }

  // ── WFM.25 Admin + data-freshness badge ───────────────────────

  const WFM25_FRESHNESS_SOURCES = [
    { key: 'wowIngest', label: 'WoW Workbook', thresholdKey: 'wowIngestDays' },
    { key: 'pipeline', label: 'Pipeline feed', thresholdKey: 'pipelineDays' },
    { key: 'deployments', label: 'Deployments feed', thresholdKey: 'deploymentsDays' }
  ];

  let _wfm25FreshnessThresholds = null;
  let _wfm25AdminOvRows = [];
  let _wfm25AdminOnLeaveRows = [];

  /**
   * Parse row count from api_getDataFreshness lastSuccess.detail (e.g. "123 rows").
   * @param {string} detail
   * @returns {string}
   */
  function parseWFM25FreshnessRowCount_(detail) {
    const m = String(detail || '').match(/(\d[\d,]*)\s*rows?/i);
    return m ? m[1] : (detail ? String(detail) : '—');
  }

  /**
   * Evaluate one feed's freshness against a day threshold.
   * @param {{lastSuccess?:Object, lastFailure?:Object}} feed
   * @param {number} thresholdDays
   * @returns {{status:'current'|'stale'|'error', warning:string, lastWhen:string, rowCount:string}}
   */
  function evalWFM25FreshnessSource_(feed, thresholdDays) {
    feed = feed || {};
    const success = feed.lastSuccess;
    const failure = feed.lastFailure;
    if (!success || !success.when) {
      const warn = failure && failure.when
        ? String(failure.detail || 'Last run failed')
        : 'No successful update found';
      return {
        status: 'error',
        warning: warn,
        lastWhen: failure && failure.when ? fmtDateTime(failure.when) : '—',
        rowCount: '—'
      };
    }
    const when = new Date(success.when);
    const ageMs = Date.now() - when.getTime();
    const thresholdMs = thresholdDays * 24 * 60 * 60 * 1000;
    const rowCount = parseWFM25FreshnessRowCount_(success.detail);
    if (isNaN(when.getTime()) || ageMs > thresholdMs) {
      const warn = failure && failure.when
        ? String(failure.detail || '')
        : 'Data older than ' + thresholdDays + ' days';
      return {
        status: 'stale',
        warning: warn,
        lastWhen: fmtDateTime(success.when),
        rowCount: rowCount
      };
    }
    const warn = failure && failure.when ? String(failure.detail || '') : '';
    return {
      status: 'current',
      warning: warn,
      lastWhen: fmtDateTime(success.when),
      rowCount: rowCount
    };
  }

  /**
   * Worst-of status for overall badge.
   * @param {('current'|'stale'|'error')[]} statuses
   * @returns {'current'|'stale'|'error'}
   */
  function worstWFM25FreshnessStatus_(statuses) {
    if (statuses.some(function (s) { return s === 'error'; })) return 'error';
    if (statuses.some(function (s) { return s === 'stale'; })) return 'stale';
    return 'current';
  }

  /**
   * Load staleness thresholds (cached per session).
   * @returns {Promise<{wowIngestDays:number, pipelineDays:number, deploymentsDays:number}>}
   */
  async function getWFM25FreshnessThresholds_() {
    if (_wfm25FreshnessThresholds) return _wfm25FreshnessThresholds;
    try {
      _wfm25FreshnessThresholds = await call('api_getDataFreshnessThresholds');
    } catch (e) {
      _wfm25FreshnessThresholds = { wowIngestDays: 7, pipelineDays: 2, deploymentsDays: 2 };
    }
    return _wfm25FreshnessThresholds;
  }

  /**
   * Paint header freshness badge from overall status.
   * @param {'current'|'stale'|'error'} status
   */
  function renderWFM25FreshnessBadge_(status) {
    const badge = document.getElementById('wfm25FreshnessBadge');
    const dot = document.getElementById('wfm25FreshnessDot');
    const label = document.getElementById('wfm25FreshnessLabel');
    if (!badge || !dot || !label) return;

    const labels = {
      current: 'Data current',
      stale: 'Data stale',
      error: 'Data issue'
    };
    const ariaLabels = {
      current: 'Data freshness: current — open Admin',
      stale: 'Data freshness: stale — open Admin',
      error: 'Data freshness: issue detected — open Admin'
    };
    const s = labels[status] ? status : 'error';
    badge.className = 'wfm25-freshness-badge wfm25-freshness-badge--' + s;
    dot.className = 'wfm25-freshness-dot wfm25-freshness-dot--' + s;
    label.textContent = labels[s];
    badge.setAttribute('aria-label', ariaLabels[s]);
    badge.hidden = false;
  }

  /**
   * Render Admin Data Sources card rows.
   * @param {Object} freshness
   * @param {Object} thresholds
   */
  function renderWFM25AdminDataSources_(freshness, thresholds) {
    const body = document.getElementById('wfm25AdminDataSourcesBody');
    if (!body) return;
    thresholds = thresholds || { wowIngestDays: 7, pipelineDays: 2, deploymentsDays: 2 };

    const statuses = [];
    const rowsHtml = WFM25_FRESHNESS_SOURCES.map(function (src) {
      const feed = (freshness && freshness[src.key]) || {};
      const days = Number(thresholds[src.thresholdKey]) || 2;
      const ev = evalWFM25FreshnessSource_(feed, days);
      statuses.push(ev.status);
      const statusLabel = ev.status === 'current' ? 'Current' : (ev.status === 'stale' ? 'Stale' : 'Issue');
      const warnHtml = ev.warning
        ? '<div class="wfm25-admin-source-warning muted">' + escapeHtml_(ev.warning) + '</div>'
        : '';
      return '<div class="wfm25-admin-source-row">' +
        '<div class="wfm25-admin-source-main">' +
          '<div class="wfm25-admin-source-name">' + escapeHtml_(src.label) + '</div>' +
          '<div class="wfm25-admin-source-meta muted">' +
            '<span class="wfm25-admin-source-ts">' + escapeHtml_(ev.lastWhen) + '</span>' +
            (ev.rowCount !== '—'
              ? '<span class="wfm25-admin-source-rows tabular-nums">' + escapeHtml_(ev.rowCount) + ' rows</span>'
              : '') +
          '</div>' +
        '</div>' +
        '<div class="wfm25-admin-source-status">' +
          '<span class="wfm25-freshness-dot wfm25-freshness-dot--' + ev.status + '" aria-hidden="true"></span>' +
          '<span class="wfm25-admin-source-status-label">' + escapeHtml_(statusLabel) + '</span>' +
        '</div>' +
        warnHtml +
        '</div>';
    }).join('');

    body.className = 'wfm25-admin-data-sources-body';
    body.innerHTML = rowsHtml;
    renderWFM25FreshnessBadge_(worstWFM25FreshnessStatus_(statuses));
  }

  /**
   * Fetch freshness + update badge and Admin Data Sources (if mounted).
   */
  async function loadWFM25Freshness_() {
    try {
      const thresholds = await getWFM25FreshnessThresholds_();
      const freshness = await call('api_getDataFreshness');
      renderWFM25FreshnessBadge_(worstWFM25FreshnessStatus_(
        WFM25_FRESHNESS_SOURCES.map(function (src) {
          const days = Number(thresholds[src.thresholdKey]) || 2;
          return evalWFM25FreshnessSource_((freshness && freshness[src.key]) || {}, days).status;
        })
      ));
      if (document.getElementById('wfm25AdminDataSourcesBody')) {
        renderWFM25AdminDataSources_(freshness, thresholds);
      }
    } catch (err) {
      renderWFM25FreshnessBadge_('error');
      const body = document.getElementById('wfm25AdminDataSourcesBody');
      if (body) {
        body.innerHTML = '<div class="muted">Failed to load data freshness: ' +
          escapeHtml_(err.message) + '</div>';
      }
    }
  }

  /**
   * Minimal recent-uploads log (latest ~3 entries).
   */
  async function loadWFM25AdminRefreshLog_() {
    const list = document.getElementById('wfm25AdminRefreshLogBody');
    if (!list) return;
    try {
      const rows = await call('api_getRefreshLog');
      const recent = (rows || []).slice(0, 3);
      if (!recent.length) {
        list.innerHTML = '<li class="muted">No recent uploads logged</li>';
        return;
      }
      list.innerHTML = recent.map(function (r) {
        const ts = r.timestamp ? fmtDateTime(r.timestamp) : '—';
        const src = String(r.source || '—');
        const inOut = Number(r.rows_in || 0).toLocaleString() + ' → ' +
          Number(r.rows_out || 0).toLocaleString();
        return '<li><span class="wfm25-admin-refresh-ts tabular-nums">' + escapeHtml_(ts) + '</span> ' +
          '<span class="wfm25-admin-refresh-src">' + escapeHtml_(src) + '</span> ' +
          '<span class="wfm25-admin-refresh-rows tabular-nums muted">' + escapeHtml_(inOut) + '</span></li>';
      }).join('');
    } catch (err) {
      list.innerHTML = '<li class="muted">Refresh log unavailable</li>';
    }
  }

  function filterWFM25AdminOverrides_(rows) {

  /**

  /**
   * Wire WFM.25 Admin handlers (refresh log toggle, overrides CSV, delete).
   */
  function initWFM25AdminHandlers_() {
    const freshnessBadge = document.getElementById('wfm25FreshnessBadge');
    if (freshnessBadge) {
      freshnessBadge.addEventListener('click', wfm25OpenAdminDataSources_);
    }

    const refreshToggle = document.getElementById('wfm25AdminRefreshLogToggle');
    const refreshBody = document.getElementById('wfm25AdminRefreshLogBody');
    if (refreshToggle && refreshBody) {
      refreshToggle.addEventListener('click', function () {
        const open = refreshBody.hidden;
        refreshBody.hidden = !open;
        refreshToggle.setAttribute('aria-expanded', String(open));
        refreshToggle.classList.toggle('is-open', open);
      });
    }

    const ovTableBody = document.getElementById('wfm25AdminOvTableBody');
    if (ovTableBody) {
      ovTableBody.addEventListener('click', async function (e) {
        const btn = e.target.closest('[data-ov-delete]');
        if (!btn) return;
        const id = btn.getAttribute('data-ov-delete');
        if (!id) return;
        const reason = prompt('Reason for deleting this override:');
        if (!reason || !reason.trim()) return;
        btn.disabled = true;
        try {
          await call('api_deleteOverride', id, reason.trim());
          toast('Override deleted', 'ok');
          await loadWFM25AdminOverrides_();
        } catch (err) {
          toast('Delete failed: ' + err.message, 'err');
          btn.disabled = false;
        }
      });
    }

    const reviewBtn = document.getElementById('wfm25AdminOvReviewBtn');
    if (reviewBtn) {
      reviewBtn.addEventListener('click', function () {
        const wrap = document.querySelector('.wfm25-admin-overrides-card');
        if (wrap) wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
        toast('Review overrides that may no longer match source data', 'info');
      });
    }

    const exportBtn = document.getElementById('wfm25AdminOvExportBtn');
    if (exportBtn) {
      exportBtn.addEventListener('click', async function () {
        try {
          const rows = await call('api_listOverrides', { status: 'Active' });
          const filtered = filterWFM25AdminOverrides_(rows);
          const headers = ['override_id', 'source', 'record_id', 'field', 'original_value',
            'override_value', 'reason', 'expires_at', 'status',
            'created_by', 'created_at', 'modified_by', 'modified_at'];
          const matrix = [headers];
          filtered.forEach(function (r) {
            matrix.push(headers.map(function (h) { return r[h] != null ? r[h] : ''; }));
          });
          const csvText = matrix.map(function (row) {
            return row.map(_csvCell_).join(',');
          }).join('\n');
          const blob = new Blob([csvText], { type: 'text/csv' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          const ts = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
          a.href = url;
          a.download = 'overrides_deployments_pipeline_' + ts + '.csv';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
        } catch (err) {
          toast('Export failed: ' + err.message, 'err');
        }
      });
    }

    const importBtn = document.getElementById('wfm25AdminOvImportBtn');
    const importFile = document.getElementById('wfm25AdminOvImportFile');
    if (importBtn && importFile) {
      importBtn.addEventListener('click', function () { importFile.click(); });
      importFile.addEventListener('change', async function (e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        try {
          const text = await file.text();
          const matrix = _parseCsv_(text);
          if (matrix.length < 2) { toast('CSV has no data rows', 'err'); return; }
          const dataRows = matrix.length - 1;
          const importOk = await confirmAction_({
            title: 'Import overrides?',
            body: 'Import ' + dataRows + ' row(s) as new overrides?',
            confirmLabel: 'Import',
            confirmStyle: 'primary'
          });
          if (!importOk) return;
          const result = await call('api_importOverridesCsv', matrix);
          if (result.skipped && result.skipped.length > 0) {
            toast('Imported ' + result.created + ', skipped ' + result.skipped.length, 'err');
          } else {
            toast('Imported ' + result.created + ' override(s)', 'ok');
          }
          e.target.value = '';
          await loadWFM25AdminOverrides_();
        } catch (err) {
          toast('Import failed: ' + err.message, 'err');
        }
      });
    }

    const onLeaveBody = document.getElementById('wfm25AdminOnLeaveTableBody');
    if (onLeaveBody) {
      onLeaveBody.addEventListener('change', async function (e) {
        const input = e.target.closest('.wfm25-admin-onleave-date-input');
        if (!input) return;
        const workerKey = input.getAttribute('data-onleave-date');
        if (!workerKey) return;
        const prevModifiedAt = input.getAttribute('data-modified-at') || '';
        const returnDate = input.value || '';
        input.disabled = true;
        try {
          const saved = await call('api_saveOnLeaveReturnDate', workerKey, returnDate, prevModifiedAt || null);
          const idx = _wfm25AdminOnLeaveRows.findIndex(function (r) {
            return String(r.worker_key) === String(workerKey);
          });
          if (idx >= 0) {
            _wfm25AdminOnLeaveRows[idx] = Object.assign({}, _wfm25AdminOnLeaveRows[idx], saved);
          }
          input.setAttribute('data-modified-at', saved.modified_at || '');
          input.value = wfm25DateInputValue_(saved.return_date);
          toast('Return date saved', 'ok');
        } catch (err) {
          const msg = String(err.message || err);
          toast('Save failed: ' + msg, 'err');
          if (/refresh/i.test(msg)) {
            await loadWFM25AdminOnLeave_();
          }
        } finally {
          input.disabled = false;
        }
      });
    }
  }

  // ── WFM.25 main init ──────────────────────────────────────────

  /**
   * WFM.25 entry point called from init() when WFM25_SHELL is true.
   * Sets landing breadcrumb, wires navigation, tab switching, group-by,
   * and loads the Utilization tab.
   */
  async function initWFM25_() {
    const ref = State.ref || {};

    // ── Landing breadcrumb (role-aware) ──
    WFM25State.landingBreadcrumb = wfm25LandingBreadcrumb_(ref);
    wfm25SetBreadcrumb_(WFM25State.landingBreadcrumb);

    // ── Left icon strip: Capacity ↔ Admin ──
    $$('.wfm25-strip-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        $$('.wfm25-strip-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        wfm25ShowView_(btn.dataset.wfm25Nav === 'admin' ? 'admin' : 'capacity');
      });
    });

    const backBtn = document.getElementById('wfm25BackToCapacityBtn');
    if (backBtn) {
      backBtn.addEventListener('click', function () {
        const capBtn = document.querySelector('.wfm25-strip-btn[data-wfm25-nav="capacity"]');
        if (capBtn) capBtn.click();
      });
    }

    // ── Tab switching ──
    $$('.wfm25-tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        wfm25ActivateTab_(btn.dataset.wfm25Tab);
      });
    });

    // ── Group-by toggle (Team only in Stage 4) ──
    $$('.wfm25-groupby-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (WFM25State.selectedWorker) {
          wfm25CloseWorkerPanel_();
        }
        $$('.wfm25-groupby-btn').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        WFM25State.groupBy = btn.dataset.wfm25Groupby;
        if (WFM25State.groupBy === 'role') {
          renderWFM25RoleStub_();
        } else {
          // Re-render with cached data, or fetch if not yet loaded
          if (WFM25State.scorecardData) {
            renderWFM25UtilTable_(WFM25State.scorecardData);
          } else {
            loadWFM25Utilization_();
          }
        }
      });
    });

    // ── Global search overlay ──
    initWFM25GlobalSearch_();
    initWFM25AdminHandlers_();

    // ── Worker panel close + soft-booking overlay ──
    const panelClose = document.getElementById('wfm25WorkerPanelClose');
    if (panelClose) panelClose.addEventListener('click', wfm25CloseWorkerPanel_);

    const adjustHoursBtn = document.getElementById('wfm25AdjustHoursBtn');
    if (adjustHoursBtn) {
      adjustHoursBtn.addEventListener('click', function () {
        if (WFM25State.selectedWorker) openWFM25SoftBookOverlay_(WFM25State.selectedWorker);
      });
    }
    const sbDirAdd = document.getElementById('wfm25SbDirAdd');
    const sbDirReduce = document.getElementById('wfm25SbDirReduce');
    if (sbDirAdd) {
      sbDirAdd.addEventListener('click', function () { wfm25SetSoftBookDirection_('add'); });
    }
    if (sbDirReduce) {
      sbDirReduce.addEventListener('click', function () { wfm25SetSoftBookDirection_('reduce'); });
    }
    const sbClose = document.getElementById('wfm25SoftBookClose');
    const sbCancel = document.getElementById('wfm25SbCancel');
    const sbBackdrop = document.getElementById('wfm25SoftBookBackdrop');
    if (sbClose) sbClose.addEventListener('click', closeWFM25SoftBookOverlay_);
    if (sbCancel) sbCancel.addEventListener('click', closeWFM25SoftBookOverlay_);
    if (sbBackdrop) sbBackdrop.addEventListener('click', closeWFM25SoftBookOverlay_);
    const sbAdd = document.getElementById('wfm25SbAdd');
    if (sbAdd) sbAdd.addEventListener('click', addWFM25SoftBooking_);
    const sbHours = document.getElementById('wfm25SbHours');
    if (sbHours) {
      sbHours.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') addWFM25SoftBooking_();
      });
    }

    initWFM25DraftTray_();

    document.addEventListener('click', wfm25WorkerPanelOutsideClick_);
    document.addEventListener('keydown', wfm25WorkerPanelKeydown_);

    // ── Load baseline projection for employee_id lookup ──
    loadExplorerBaselineProjection_();

    // ── Load Utilization tab (active on boot) ──
    await loadWFM25Utilization_();
    loadWFM25Freshness_();
  }
</script>
