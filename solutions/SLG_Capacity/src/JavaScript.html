<script>
  // ============================================================
  // Client state — applied filters (what the server currently sees)
  // + draft filters (what the user is staging inside the drawer)
  //
  // Priority 2 rename: State.filters.teams → State.filters.managers.
  // Server param contract stays as `teams`; client translates at
  // every server call site via buildServerParams_.
  //
  // Priority 3: Worker Scope has per-view defaults via
  // VIEW_WORKER_SCOPE_DEFAULTS. State.workerScopeChangedManually
  // tracks whether the user has explicitly overridden the view's
  // default, so navigation auto-flips only when they haven't.
  // ============================================================
  const FILTER_DEFAULTS = Object.freeze({
    quarter: null,
    managers: [],
    teamLabel: null,
    viewMode: 'Committed',
    groupBy: 'Individual',
    scenarioId: null,
    includeTimeOff: true,
    workerScope: 'All',     // global fallback; per-view overrides below
    includeMyManagers: true  // Priority 1: include-reports defaults on
  });

  // Priority 3: per-view Worker Scope defaults.
  // Views not listed inherit FILTER_DEFAULTS.workerScope.
  const VIEW_WORKER_SCOPE_DEFAULTS = Object.freeze({
    dashboard: 'SLG',
    explorer: 'SLG',
    reporting: 'All'
    // pipeline, deployments, scenarios, admin — inherit FILTER_DEFAULTS.workerScope
  });

  const State = {
    ref: null,
    filters: Object.assign({}, FILTER_DEFAULTS),
    draftFilters: Object.assign({}, FILTER_DEFAULTS),
    workerScopeChangedManually: false,  // Priority 3
    dashboard: null,
    dashboardCache: null,
    opportunities: [],
    deployments: [],
    scenarios: [],
    currentView: 'dashboard',
    selectedResource: null,
    selectedScenario: null,
    reporting: null,
    rpAccountsAll: [],
    rpHoursTotal: 0,
    rpExpandedTeams: null,
    rpExpandedAccounts: null,
    rpDiagnosticsOpen: false,
    rpActiveDrill: null,
    charts: {}
  };

  // ============================================================
  // Utilities
  // ============================================================
  const $  = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  function fmtPct(v) {
    if (v == null || isNaN(v)) return '—';
    return Math.round(v * 100) + '%';
  }
  function fmtPct1(v) {
    if (v == null || isNaN(v)) return '—';
    return (Math.round(v * 1000) / 10).toFixed(1) + '%';
  }
  function fmtFte(v) {
    if (v == null || isNaN(v)) return '—';
    return (Math.round(v * 10) / 10).toFixed(1);
  }
  function fmtMoney(v) {
    if (!v) return '$0';
    if (v >= 1e6) return '$' + (v / 1e6).toFixed(1) + 'M';
    if (v >= 1e3) return '$' + Math.round(v / 1e3) + 'K';
    return '$' + v;
  }
  function fmtHours(v) {
    if (v == null || isNaN(v)) return '—';
    return Math.round(v).toLocaleString();
  }
  function fmtDate(d) {
    if (!d) return '—';
    const x = new Date(d);
    if (isNaN(x)) return '—';
    return x.toISOString().slice(0, 10);
  }
  function fmtDateTime(d) {
    if (!d) return '—';
    const x = new Date(d);
    if (isNaN(x)) return String(d);
    return x.toLocaleString('en-US', {
      year: 'numeric', month: 'short', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  }
  function fmtMonth(monthKey) {
    const [y, m] = monthKey.split('-');
    const dt = new Date(+y, +m - 1, 1);
    return dt.toLocaleString('en', { month: 'short', year: '2-digit' });
  }
  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)[fn](...args);
    });
  }
  function toast(msg, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.textContent = msg;
    $('#toastStack').appendChild(el);
    setTimeout(() => el.remove(), 3500);
  }
  function escapeHtml_(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function debounce_(fn, wait) {
    let timer;
    return function(...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), wait);
    };
  }

  // ============================================================
  // Priority 2: build server params with rename translation.
  // Client state uses `managers` and `teamLabel`. Server param
  // contract stays as `teams`. Centralizing the translation here
  // means every server call site stays consistent.
  // ============================================================
  function buildServerParams_(extra) {
    const f = State.filters;
    return Object.assign({
      teams: (f.managers && f.managers.length) ? f.managers : null,
      teamLabel: f.teamLabel || null,
      includeMyManagers: !!f.includeMyManagers,
      workerScope: f.workerScope || 'All',
      viewMode: f.viewMode || 'Committed',
      scenarioId: f.scenarioId || null,
      quarter: f.quarter || null,
      includeTimeOff: !!f.includeTimeOff,
      groupBy: f.groupBy || 'Individual'
    }, extra || {});
  }

  // ============================================================
  // Priority 3: per-view Worker Scope helpers.
  //
  // workerScopeDefaultForView_(view): returns the default scope for a
  //   given view ('dashboard' → 'SLG', etc.). Falls back to
  //   FILTER_DEFAULTS.workerScope for views without a specific default.
  //
  // applyViewWorkerScope_(view): if the user hasn't manually overridden
  //   Worker Scope, set State.filters.workerScope to the view's default.
  //   Returns true if the scope actually changed (so callers can know
  //   whether to invalidate a downstream load).
  //
  // currentViewWorkerScopeDefault_(): convenience for chip-strip
  //   comparison and reset behavior.
  // ============================================================
  function workerScopeDefaultForView_(view) {
    return VIEW_WORKER_SCOPE_DEFAULTS[view] || FILTER_DEFAULTS.workerScope;
  }
  function currentViewWorkerScopeDefault_() {
    return workerScopeDefaultForView_(State.currentView);
  }
  function applyViewWorkerScope_(view) {
    if (State.workerScopeChangedManually) return false;
    const target = workerScopeDefaultForView_(view);
    if (State.filters.workerScope === target) return false;
    State.filters.workerScope = target;
    return true;
  }

  // Heatmap color (diverging relative to ICP)
  function cellColor(utilization, icpTarget) {
    if (!utilization && utilization !== 0) {
      return { bg: 'var(--business-card)', fg: 'var(--staple)' };
    }
    const ratio = icpTarget > 0 ? utilization / icpTarget : 1;
    if (ratio < 0.60) return { bg: '#D6EBF9', fg: '#0a3d7c' };
    if (ratio < 0.85) return { bg: 'var(--blue-sky)', fg: '#0a3d7c' };
    if (ratio < 1.00) return { bg: '#FFF1B8', fg: '#6b4e00' };
    if (ratio < 1.10) return { bg: 'var(--pencil)', fg: '#3d2e00' };
    if (ratio < 1.25) return { bg: 'var(--happy-hour)', fg: '#fff' };
    return { bg: 'var(--thumbtack)', fg: '#fff' };
  }

  const GROUP_LABELS = {
    Individual: 'Individual',
    Team: 'SLG Team',
    Role: 'Job Profile',
    Function: 'Project Function'
  };

  const WORKER_SCOPE_LABELS = {
    SLG: 'SLG',
    NonSLG: 'NonSLG',
    Partners: 'Partners',
    WorkdayOnly: 'Workday Only',
    All: 'All'
  };

  function cssVar_(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  // ============================================================
  // Month helpers — current month and later + planning window
  // ============================================================
  function monthKeyOnOrAfterToday(monthKey) {
    if (!monthKey) return false;
    const parts = monthKey.split('-');
    if (parts.length < 2) return false;
    const y = Number(parts[0]);
    const m = Number(parts[1]);
    if (!y || !m) return false;
    const today = new Date();
    const cy = today.getFullYear();
    const cm = today.getMonth() + 1;
    return y > cy || (y === cy && m >= cm);
  }

  function applyPlanningWindow(dashboardData) {
    const allMonths = dashboardData.heatmap?.months || [];
    if (!allMonths.length) return dashboardData;

    const windowMonths = (State.ref && State.ref.planningWindowMonths) ||
                         dashboardData.planningWindowMonths || 6;

    const desired = [];
    const today = new Date();
    for (let i = 0; i < windowMonths; i++) {
      const dt = new Date(today.getFullYear(), today.getMonth() + i, 1);
      const key = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
      desired.push(key);
    }
    const desiredSet = new Set(desired);

    let keepMonths = allMonths.filter(m => desiredSet.has(m));
    if (!keepMonths.length) keepMonths = allMonths.slice(-windowMonths);

    const monthSet = new Set(keepMonths);
    dashboardData.heatmap.months = keepMonths;
    if (dashboardData.heatmap.cells) {
      dashboardData.heatmap.cells = dashboardData.heatmap.cells.filter(c => monthSet.has(c.monthKey));
    }
    if (dashboardData.trend) {
      dashboardData.trend = dashboardData.trend.filter(t => monthSet.has(t.monthKey));
    }
    dashboardData.monthsInView = keepMonths;
    return dashboardData;
  }

  function recomputeKpisForClient(d, quarterFilter) {
    const monthsInView = d.monthsInView || (d.heatmap ? d.heatmap.months : []);
    const baseMonthSet = new Set(monthsInView);
    let monthSet = baseMonthSet;

    if (quarterFilter) {
      const qSet = new Set();
      monthsInView.forEach(mk => {
        const [y, m] = mk.split('-');
        const dt = new Date(+y, +m - 1, 1);
        const qKey = dt.getFullYear() + '-Q' + (Math.floor(dt.getMonth() / 3) + 1);
        if (qKey === quarterFilter) qSet.add(mk);
      });
      if (qSet.size) monthSet = qSet;
    }

    const includePTO = State.filters.includeTimeOff;
    let totalCommittedHours = 0;
    let totalScenarioHours = 0;
    let usedSum = 0, capSum = 0;

    const byResource = d.byResource || [];
    const over = [];
    const under = [];

    if (byResource.length) {
      byResource.forEach(r => {
        let numUtil = 0, denUtil = 0;
        r.months.forEach(m => {
          if (!monthSet.has(m.monthKey)) return;
          const committedWork = m.committed || 0;
          const ptoHours = m.timeOff || 0;
          const scenarioHours = m.scenario || 0;
          const cap = Number(m.capacity) || 0;
          const usedHours = includePTO ? committedWork + ptoHours : committedWork;
          totalCommittedHours += usedHours;
          totalScenarioHours += scenarioHours;
          if (cap > 0) {
            usedSum += usedHours;
            capSum += cap;
            numUtil += usedHours / cap;
            denUtil += 1;
          }
        });
        if (!denUtil) return;
        const avgUtil = numUtil / denUtil;
        if (avgUtil > 1.05) over.push({ name: r.resource, avgUtil });
        else if (avgUtil < 0.75) under.push({ name: r.resource, avgUtil });
      });
    } else if (d.heatmap && d.heatmap.cells) {
      d.heatmap.cells.forEach(c => {
        if (!monthSet.has(c.monthKey)) return;
        const committedWork = Number(c.committed) || 0;
        const ptoHours = Number(c.timeOff) || 0;
        const cap = Number(c.capacity) || 0;
        const usedHours = includePTO ? committedWork + ptoHours : committedWork;
        totalCommittedHours += usedHours;
        if (cap > 0) { usedSum += usedHours; capSum += cap; }
      });
    }

    const avgUtilization = capSum > 0 ? usedSum / capSum : 0;
    const headcount = byResource.length;

    return {
      totalCommittedHours,
      scenarioDemandHours: totalScenarioHours,
      overUtilized: over,
      underUtilized: under,
      avgUtilization,
      headcount
    };
  }

  function computeTrendForClient(d, quarterFilter) {
    const monthsInView = d.monthsInView || (d.heatmap ? d.heatmap.months : []);
    const baseMonthSet = new Set(monthsInView);
    let monthSet = baseMonthSet;

    if (quarterFilter) {
      const qSet = new Set();
      monthsInView.forEach(mk => {
        const [y, m] = mk.split('-');
        const dt = new Date(+y, +m - 1, 1);
        const qKey = dt.getFullYear() + '-Q' + (Math.floor(dt.getMonth() / 3) + 1);
        if (qKey === quarterFilter) qSet.add(mk);
      });
      if (qSet.size) monthSet = qSet;
    }

    const includePTO = State.filters.includeTimeOff;
    const byMonth = {};
    if (d.byResource) {
      d.byResource.forEach(r => {
        r.months.forEach(m => {
          if (!monthSet.has(m.monthKey)) return;
          const key = m.monthKey;
          if (!byMonth[key]) byMonth[key] = { used: 0, capacity: 0 };
          const committed = Number(m.committed) || 0;
          const timeOff = Number(m.timeOff) || 0;
          const cap = Number(m.capacity) || 0;
          const usedHours = includePTO ? committed + timeOff : committed;
          byMonth[key].used += usedHours;
          byMonth[key].capacity += cap;
        });
      });
    }
    return Object.keys(byMonth).sort().map(k => {
      const row = byMonth[k];
      const util = row.capacity > 0 ? row.used / row.capacity : 0;
      return { monthKey: k, utilization: util };
    });
  }

  // ============================================================
  // Routing
  //
  // Priority 3: showView() applies the view's Worker Scope default
  // BEFORE the view-specific load function fires, so the load
  // happens with the correct scope on the first request.
  // ============================================================
  function showView(name) {
    const previousView = State.currentView;
    State.currentView = name;

    // Priority 3: apply view-default Worker Scope before load.
    // Returns true if the scope changed; we don't need to act on
    // that here because the load function below will use the new
    // value via buildServerParams_.
    applyViewWorkerScope_(name);

    $$('.view').forEach(v => { v.hidden = v.dataset.view !== name; });
    $$('.nav-item').forEach(n =>
      n.classList.toggle('active', n.dataset.view === name)
    );

    // If scope changed, the chip strip needs to re-render even if
    // the load function doesn't trigger onAppliedFiltersChanged_.
    if (previousView !== name) {
      renderChipStrip_();
      updateFilterCountBadge_();
    }

    if (name === 'dashboard') loadDashboard();
    if (name === 'explorer') renderResourceList();
    if (name === 'pipeline') loadOpportunities();
    if (name === 'deployments') loadDeployments();
    if (name === 'scenarios') loadScenarios();
    if (name === 'reporting') loadReporting();
    if (name === 'admin') {
      const savedTab = localStorage.getItem(ADMIN_TAB_KEY) || 'operations';
      activateAdminTab_(savedTab);
      loadAdmin();
    }
    if (window.innerWidth <= 768) $('#sidebar').classList.remove('open');
  }
  $$('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => showView(btn.dataset.view));
  });
  $('#hamburger').addEventListener('click', () =>
    $('#sidebar').classList.toggle('open')
  );

  // ============================================================
  // Init
  // ============================================================
  async function init() {
    try {
      State.ref = await call('api_getReference');
      $('#userChip').textContent = State.ref.user || 'unknown';

      const qSel = $('#quarterFilter');
      qSel.innerHTML = '<option value="">All quarters</option>' +
        State.ref.quarters.map(q => `<option value="${q}">${q}</option>`).join('');
      qSel.value = '';
      qSel.addEventListener('change', () => {
        State.filters.quarter = qSel.value || null;
        onAppliedFiltersChanged_();
      });

      renderTeamLabelSelect();   // Priority 2 — Team dropdown
      renderTeamsSelect();        // Manager dropdown

      $('#openFiltersBtn').addEventListener('click', openFiltersDrawer_);
      $('#refreshBtn').addEventListener('click', () => {
        State.dashboardCache = null;
        reloadCurrentView_();
      });

      initFiltersDrawer_();
      initAdminTabs_();

      $('#chipStrip').addEventListener('click', onChipStripClick_);
      $('#chipClearAll').addEventListener('click', clearAllFilters_);

      initReportingHandlers_();

      // Priority 1: apply auto-manager defaults based on logged-in user.
      applyAutoManagerDefaults_();

      // Priority 3: apply initial view's Worker Scope default
      // (Dashboard → SLG). Must run AFTER applyAutoManagerDefaults_
      // so we don't overwrite an intentional state.
      applyViewWorkerScope_('dashboard');

      renderChipStrip_();
      updateFilterCountBadge_();

      showView('dashboard');

      // Background fetch: populate Admin tab override badge without blocking init.
      setTimeout(function () {
        call('api_getOverrideHygieneSummary').then(function (h) {
          const count = (h.expiringSoon || 0) + (h.stale || 0);
          const badge = $('#adminTabBadgeOverrides');
          if (!badge) return;
          if (count > 0) {
            badge.textContent = String(count);
            badge.hidden = false;
          } else {
            badge.hidden = true;
          }
        }).catch(function () {});
      }, 1500);

    } catch (err) {
      toast('Init failed: ' + err.message, 'err');
      console.error(err);
    }
  }
  document.addEventListener('DOMContentLoaded', init);

  // ============================================================
  // Priority 1: Auto-set Manager filter from logged-in user
  // ============================================================
  function applyAutoManagerDefaults_() {
    const ref = State.ref || {};
    const matched = ref.matchedManager || null;
    const recognized = !!ref.recognized;

    const bannerWrap = $('#autoManagerBannerWrap');

    if (matched) {
      State.filters.managers = [matched];
      State.filters.includeMyManagers = true;
      const sel = $('#teamsSelect');
      if (sel) sel.value = matched;
      if (bannerWrap) bannerWrap.hidden = true;
      return;
    }

    State.filters.managers = [];
    const sel = $('#teamsSelect');
    if (sel) sel.value = '';

    if (bannerWrap) {
      bannerWrap.hidden = recognized;
    }
  }

  function onAppliedFiltersChanged_() {
    State.dashboardCache = null;
    renderChipStrip_();
    updateFilterCountBadge_();
    reloadCurrentView_();
  }

  function reloadCurrentView_() {
  if (State.currentView === 'dashboard') loadDashboard();
  else if (State.currentView === 'pipeline') loadOpportunities();
  else if (State.currentView === 'scenarios') loadScenarios();
  else if (State.currentView === 'reporting') loadReporting();
  else if (State.currentView === 'admin') loadAdmin();
  else if (State.currentView === 'explorer') {
    renderResourceList();
    // If a worker is currently selected, re-fetch their detail so
    // the chart reflects current View Mode / scenarioId filters.
    // Without this, the chart stays stale showing data loaded at
    // last-click time even after the user switches View Mode.
    if (State.selectedResource) {
      loadResourceDetail_(State.selectedResource);
    }
  }
}
</script>

<script>
  // ============================================================
  // Manager filter dropdown (#teamsSelect — id retained for
  // backwards-compat; underlying state is State.filters.managers).
  // ============================================================
  function renderTeamsSelect() {
    const sel = $('#teamsSelect');
    const source = (State.ref && Array.isArray(State.ref.managerOrgs))
      ? State.ref.managerOrgs : [];

    const managerOptions = source
      .map(t => `<option value="${t.replace(/"/g, '&quot;')}">${t}</option>`)
      .join('');

    sel.innerHTML = `<option value="">All managers</option>` + managerOptions;
    sel.value = State.filters.managers.length ? State.filters.managers[0] : '';

    sel.addEventListener('change', () => {
      const val = sel.value;
      State.filters.managers = val ? [val] : [];
      onAppliedFiltersChanged_();
    });
  }

  // ============================================================
  // Priority 2: Team filter dropdown (#teamLabelFilter).
  // ============================================================
  function renderTeamLabelSelect() {
    const sel = $('#teamLabelFilter');
    if (!sel) return;
    const source = (State.ref && Array.isArray(State.ref.teamLabels))
      ? State.ref.teamLabels : [];

    const opts = source
      .map(t => `<option value="${t.replace(/"/g, '&quot;')}">${t}</option>`)
      .join('');

    sel.innerHTML = `<option value="">All teams</option>` + opts;
    sel.value = State.filters.teamLabel || '';

    // Phase 6: default to ref.defaultTeamFilter on first load only.
    // Reads once; subsequent manual changes are preserved via userTouched.
    if (State.ref && State.ref.defaultTeamFilter &&
        !sel.dataset.userTouched && !State.filters.teamLabel) {
      sel.value = State.ref.defaultTeamFilter;
      State.filters.teamLabel = State.ref.defaultTeamFilter;
    }

    sel.addEventListener('change', () => {
      sel.dataset.userTouched = '1';
      const val = sel.value;
      State.filters.teamLabel = val || null;
      onAppliedFiltersChanged_();
    });
  }
</script>

<script>
  // ============================================================
  // Filters drawer (apply-on-click)
  //
  // Priority 3: Worker Scope drawer click marks workerScopeChangedManually.
  // ============================================================
  function initFiltersDrawer_() {
    $('#drawerViewModeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $$('#drawerViewModeSeg button').forEach(x => x.classList.toggle('on', x === b));
      State.draftFilters.viewMode = b.dataset.val;
      $('#drawerScenarioField').hidden = State.draftFilters.viewMode !== 'Scenario';
      markDirty_(b);
    });

    $('#drawerWorkerScopeSeg').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $$('#drawerWorkerScopeSeg button').forEach(x => x.classList.toggle('on', x === b));
      State.draftFilters.workerScope = b.dataset.val || 'All';
      markDirty_(b);
    });

    $('#drawerGroupBySeg').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      $$('#drawerGroupBySeg button').forEach(x => x.classList.toggle('on', x === b));
      State.draftFilters.groupBy = b.dataset.val;
      markDirty_(b);
    });

    $('#drawerIncludeMyManagers').addEventListener('change', (e) => {
      State.draftFilters.includeMyManagers = !!e.target.checked;
      markDirty_(e.target);
    });

    $('#drawerIncludeTimeOffToggle').addEventListener('change', (e) => {
      State.draftFilters.includeTimeOff = !!e.target.checked;
      markDirty_(e.target);
    });

    $('#drawerScenarioSelect').addEventListener('change', (e) => {
      State.draftFilters.scenarioId = e.target.value || null;
      markDirty_(e.target);
    });

    $('#filtersApplyBtn').addEventListener('click', applyDraftFilters_);
    $('#filtersResetBtn').addEventListener('click', resetDraftFiltersToDefaults_);

    $('#filtersDrawer').addEventListener('click', (e) => {
      if (e.target.dataset && e.target.dataset.close !== undefined) {
        closeFiltersDrawer_();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const d = $('#filtersDrawer');
        if (d && !d.hidden) closeFiltersDrawer_();
      }
    });
  }

  function markDirty_(el) {
    const field = el && el.closest && el.closest('.field');
    if (field) field.classList.add('dirty');
  }
  function clearDirtyMarks_() {
    $$('#filtersDrawer .field.dirty').forEach(f => f.classList.remove('dirty'));
  }
  async function openFiltersDrawer_() {
    if (!State.scenarios.length) await loadScenariosList();
    State.draftFilters = Object.assign({}, State.filters);
    syncDrawerInputsToDraft_();
    clearDirtyMarks_();
    $('#filtersDrawer').hidden = false;
  }
  function closeFiltersDrawer_() {
    $('#filtersDrawer').hidden = true;
    clearDirtyMarks_();
  }

  function syncDrawerInputsToDraft_() {
    const d = State.draftFilters;

    $('#drawerIncludeMyManagers').checked = !!d.includeMyManagers;

    let ws = String(d.workerScope || 'All');
    if (ws === 'External') ws = 'NonSLG';
    if (ws === 'Both') ws = 'All';
    $$('#drawerWorkerScopeSeg button').forEach(btn => {
      btn.classList.toggle('on', btn.dataset.val === ws);
    });

    $$('#drawerViewModeSeg button').forEach(btn => {
      btn.classList.toggle('on', btn.dataset.val === d.viewMode);
    });

    $('#drawerScenarioField').hidden = d.viewMode !== 'Scenario';

    const scenSel = $('#drawerScenarioSelect');
    if (scenSel) {
      scenSel.innerHTML = '<option value="">— No scenario —</option>' +
        (State.scenarios || [])
          .filter(s => s.status !== 'Archived')
          .map(s => `<option value="${s.scenario_id}">${escapeHtml_(s.name)}</option>`)
          .join('');
      scenSel.value = d.scenarioId || '';
    }

    $('#drawerIncludeTimeOffToggle').checked = !!d.includeTimeOff;

    $$('#drawerGroupBySeg button').forEach(btn => {
      btn.classList.toggle('on', btn.dataset.val === d.groupBy);
    });
  }

  function applyDraftFilters_() {
    // Priority 3: if Worker Scope changed via the drawer, mark it manual.
    if (State.draftFilters.workerScope !== State.filters.workerScope) {
      State.workerScopeChangedManually = true;
    }

    State.filters = Object.assign({}, State.draftFilters);

    const mgrSel = $('#teamsSelect');
    if (mgrSel) mgrSel.value = State.filters.managers.length ? State.filters.managers[0] : '';

    const teamSel = $('#teamLabelFilter');
    if (teamSel) teamSel.value = State.filters.teamLabel || '';

    closeFiltersDrawer_();
    onAppliedFiltersChanged_();
    toast('Filters applied', 'ok');
  }

  function resetDraftFiltersToDefaults_() {
    // Priority 3: reset honors the CURRENT VIEW's Worker Scope default,
    // not the global FILTER_DEFAULTS.
    State.draftFilters = Object.assign({}, FILTER_DEFAULTS);
    State.draftFilters.workerScope = currentViewWorkerScopeDefault_();
    // Preserve pinned topbar fields that user sets directly outside drawer
    State.draftFilters.quarter = State.filters.quarter;
    State.draftFilters.managers = State.filters.managers.slice();
    State.draftFilters.teamLabel = State.filters.teamLabel;
    syncDrawerInputsToDraft_();
    $$('#filtersDrawer .field.dirty').forEach(f => f.classList.add('dirty'));
  }
</script>

<script>
  // ============================================================
  // Chip strip — active-filter summary with inline ✕ clear
  //
  // Priority 3: Worker Scope chip compares against current-view default,
  // not global FILTER_DEFAULTS. So a Dashboard user at SLG sees no chip
  // (it's the view default); a Reporting user at SLG sees a chip
  // (override of the view default).
  // ============================================================
  function getActiveFilterChips_() {
    const chips = [];
    const f = State.filters;

    if (f.quarter) {
      chips.push({ key: 'quarter', label: 'Quarter', value: f.quarter });
    }
    if (f.teamLabel) {
      chips.push({ key: 'teamLabel', label: 'Team', value: f.teamLabel });
    }
    if (f.managers && f.managers.length) {
      chips.push({
        key: 'managers',
        label: 'Manager',
        value: f.managers[0],
        suspended: !!f.teamLabel,
        suspendedReason: 'Manager filter suspended while Team filter is active'
      });
    }
    if (f.includeMyManagers !== FILTER_DEFAULTS.includeMyManagers && !f.teamLabel) {
      chips.push({ key: 'includeMyManagers', label: 'Manager scope', value: f.includeMyManagers ? 'Include reports' : 'Direct only' });
    }

    // Priority 3: compare Worker Scope against current-view default.
    const viewWsDefault = currentViewWorkerScopeDefault_();
    if (f.workerScope && f.workerScope !== viewWsDefault) {
      const lbl = WORKER_SCOPE_LABELS[f.workerScope] || f.workerScope;
      chips.push({ key: 'workerScope', label: 'Worker scope', value: lbl });
    }

    if (f.viewMode && f.viewMode !== FILTER_DEFAULTS.viewMode) {
      chips.push({ key: 'viewMode', label: 'View mode', value: f.viewMode });
    }
    if (f.viewMode === 'Scenario' && f.scenarioId) {
      const sc = (State.scenarios || []).find(s => s.scenario_id === f.scenarioId);
      chips.push({ key: 'scenarioId', label: 'Scenario', value: sc ? sc.name : f.scenarioId });
    }
    if (f.includeTimeOff !== FILTER_DEFAULTS.includeTimeOff) {
      chips.push({
        key: 'includeTimeOff', label: 'Time off',
        value: f.includeTimeOff ? 'Include PTO/Holiday' : 'Exclude PTO/Holiday'
      });
    }
    if (f.groupBy && f.groupBy !== FILTER_DEFAULTS.groupBy) {
      chips.push({ key: 'groupBy', label: 'Group by', value: GROUP_LABELS[f.groupBy] || f.groupBy });
    }
    return chips;
  }

  function renderChipStrip_() {
    const chips = getActiveFilterChips_();
    const strip = $('#chipStrip');
    const items = $('#chipStripItems');
    const clearAll = $('#chipClearAll');

    if (!chips.length) {
      strip.hidden = true;
      items.innerHTML = '';
      clearAll.hidden = true;
      return;
    }

    strip.hidden = false;
    items.innerHTML = chips.map(c => {
      const suspended = !!c.suspended;
      const title = suspended
        ? (c.suspendedReason || 'This filter is suspended')
        : 'Click to change in the Filters drawer · ✕ to clear';
      const cls = 'chip' + (suspended ? ' chip-suspended' : '');
      return `
        <span class="${cls}" data-chip-key="${c.key}" title="${escapeHtml_(title)}">
          <span class="chip-label"><strong>${escapeHtml_(c.label)}:</strong> ${escapeHtml_(String(c.value))}</span>
          <button type="button" class="chip-clear" data-clear-key="${c.key}" title="Clear ${escapeHtml_(c.label)}">✕</button>
        </span>`;
    }).join('');
    clearAll.hidden = false;
  }

  function onChipStripClick_(e) {
    const clearBtn = e.target.closest('.chip-clear');
    if (clearBtn) {
      e.stopPropagation();
      clearSingleFilter_(clearBtn.dataset.clearKey);
      return;
    }
    const chip = e.target.closest('.chip');
    if (chip) {
      openFiltersDrawer_();
    }
  }

  function clearSingleFilter_(key) {
    if (!key) return;
    switch (key) {
      case 'quarter':
        State.filters.quarter = null;
        $('#quarterFilter').value = '';
        break;
      case 'teamLabel':
        State.filters.teamLabel = null;
        $('#teamLabelFilter').value = '';
        break;
      case 'managers':
        State.filters.managers = [];
        $('#teamsSelect').value = '';
        break;
      case 'includeMyManagers':
        State.filters.includeMyManagers = false;
        break;
      case 'workerScope':
        // Priority 3: clearing the workerScope chip resets to the
        // current view's default and clears the manual-override flag.
        State.workerScopeChangedManually = false;
        State.filters.workerScope = currentViewWorkerScopeDefault_();
        break;
      case 'viewMode':
        State.filters.viewMode = FILTER_DEFAULTS.viewMode;
        State.filters.scenarioId = null;
        break;
      case 'scenarioId':
        State.filters.scenarioId = null;
        break;
      case 'includeTimeOff':
        State.filters.includeTimeOff = FILTER_DEFAULTS.includeTimeOff;
        break;
      case 'groupBy':
        State.filters.groupBy = FILTER_DEFAULTS.groupBy;
        break;
      default:
        return;
    }
    onAppliedFiltersChanged_();
  }

  function clearAllFilters_() {
    // Reset to defaults, re-apply auto-manager match, then apply the
    // CURRENT VIEW's Worker Scope default (Priority 3). "Clear all"
    // means "back to your personalized default state."
    State.filters = Object.assign({}, FILTER_DEFAULTS);
    State.workerScopeChangedManually = false;
    $('#quarterFilter').value = '';
    $('#teamsSelect').value = '';
    $('#teamLabelFilter').value = '';
    applyAutoManagerDefaults_();
    applyViewWorkerScope_(State.currentView);
    onAppliedFiltersChanged_();
  }

  function updateFilterCountBadge_() {
    const chips = getActiveFilterChips_();
    const drawerChipCount = chips.filter(
      c => c.key !== 'quarter' && c.key !== 'managers' && c.key !== 'teamLabel'
    ).length;
    const badge = $('#filterCount');
    if (drawerChipCount > 0) {
      badge.textContent = String(drawerChipCount);
      badge.hidden = false;
    } else {
      badge.hidden = true;
    }
  }
</script>

<script>
  // ============================================================
  // Dashboard: KPIs, heatmap, trend
  // ============================================================
  async function loadDashboard() {
    const grid = $('#heatmap');
    grid.innerHTML = '<div style="padding:32px;text-align:center;color:var(--staple)">Loading…</div>';
    grid.style.gridTemplateColumns = '1fr';

    try {
      const params = buildServerParams_({ quarter: null });
      const signature = JSON.stringify(params);
      let d;
      if (State.dashboardCache && State.dashboardCache.signature === signature) {
        d = JSON.parse(JSON.stringify(State.dashboardCache.data));
      } else {
        d = await call('api_getDashboard', params);
        State.dashboardCache = { signature, data: JSON.parse(JSON.stringify(d)) };
      }
      d = applyPlanningWindow(d);
      State.dashboard = d;

      const quarterFilter = State.filters.quarter;
      const kpis = recomputeKpisForClient(d, quarterFilter);
      const clientTrend = computeTrendForClient(d, quarterFilter);

      renderKpis(kpis);
      renderHeatmap(d.heatmap);
      renderHeadcountGap(d.headcountByTeam || []);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => renderTrend(clientTrend));
      });
    } catch (err) {
      toast('Dashboard load failed: ' + err.message, 'err');
      console.error(err);
    }
  }

  function renderKpis(k) {
    $('#kpiUtil').textContent = k ? fmtPct(k.avgUtilization) : '—';
    $('#kpiUtilSub').textContent = k ? ((k.headcount || 0) + ' resources in scope') : '';
    $('#kpiCommitted').textContent = k ? Math.round(k.totalCommittedHours).toLocaleString() : '—';
    $('#kpiCommittedSub').textContent = State.filters.includeTimeOff
      ? 'Includes PTO/Holiday'
      : 'Excludes PTO/Holiday';
    $('#kpiScenario').textContent = k ? Math.round(k.scenarioDemandHours).toLocaleString() : '—';

    const overCount = k ? k.overUtilized.length : 0;
    const underCount = k ? k.underUtilized.length : 0;
    $('#kpiOverUnder').textContent = overCount + ' / ' + underCount;

    const overNames = (k ? k.overUtilized : []).map(o => o.name + ' (' + fmtPct(o.avgUtil) + ')');
    const underNames = (k ? k.underUtilized : []).map(u => u.name + ' (' + fmtPct(u.avgUtil) + ')');
    const tooltipLines = [];
    if (overNames.length) { tooltipLines.push('Over-utilized:'); tooltipLines.push(...overNames); }
    if (underNames.length) {
      if (tooltipLines.length) tooltipLines.push('');
      tooltipLines.push('Under-utilized:'); tooltipLines.push(...underNames);
    }
    const tooltipText = tooltipLines.join('\n') || 'No over/under-utilization in current view';
    $('#kpiOverUnder').title = tooltipText;
    $('#kpiOverUnderSub').title = tooltipText;
  }

  function renderHeatmap(h) {
    const grid = $('#heatmap');
    const rows = h.rows || [];
    const months = h.months || [];
    grid.style.gridTemplateColumns = `minmax(180px, 240px) repeat(${months.length}, minmax(80px, 1fr))`;
    const idx = {};
    (h.cells || []).forEach(c => { idx[c.rowKey + '|' + c.monthKey] = c; });

    const html = [];
    const label = GROUP_LABELS[State.filters.groupBy] || State.filters.groupBy;
    html.push(`<div class="heatmap-head heatmap-label" style="left:0;position:sticky;z-index:3">${label}</div>`);
    months.forEach(m => { html.push(`<div class="heatmap-head">${fmtMonth(m)}</div>`); });

    rows.forEach(r => {
      html.push(`<div class="heatmap-label" title="${r}">${r}</div>`);
      months.forEach(m => {
        const c = idx[r + '|' + m];
        if (!c) {
          html.push(`<div class="heatmap-cell empty">—</div>`);
        } else {
          const includePTO = State.filters.includeTimeOff;
          const committedWork = Number(c.committed) || 0;
          const timeOff = Number(c.timeOff) || 0;
          const capacity = Number(c.capacity) || 0;
          const committedTotal = includePTO ? (committedWork + timeOff) : committedWork;
          const util = capacity > 0 ? (committedTotal / capacity) : 0;
          const color = cellColor(util, c.icpTarget);
          const title = [
            `${r} · ${fmtMonth(m)}`,
            `Utilization: ${fmtPct(util)}`,
            `ICP target: ${fmtPct(c.icpTarget)}`,
            `Committed: ${Math.round(committedTotal)}h`,
            `Capacity: ${Math.round(capacity)}h`,
            `Time off: ${Math.round(timeOff)}h`,
            `Headcount: ${c.headcount}`
          ].join('\n');
          html.push(
            `<div class="heatmap-cell" style="background:${color.bg};color:${color.fg}" title="${title.replace(/"/g, '&quot;')}">${fmtPct(util)}</div>`
          );
        }
      });
    });
    grid.innerHTML = html.join('');
  }

  function renderTrend(trend) {
    const ctx = $('#trendChart').getContext('2d');
    if (State.charts.trend) State.charts.trend.destroy();
    const cs = getComputedStyle(document.documentElement);
    const data = Array.isArray(trend) ? trend : [];
    State.charts.trend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: data.map(t => fmtMonth(t.monthKey)),
        datasets: [{
          label: 'Avg Utilization',
          data: data.map(t => Math.round(t.utilization * 1000) / 10),
          borderColor: cs.getPropertyValue('--ballpoint').trim(),
          backgroundColor: 'rgba(8,117,193,.12)',
          tension: .3, fill: true, pointRadius: 3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        animation: false, resizeDelay: 100,
        plugins: { legend: { display: false } },
        scales: {
          y: { beginAtZero: true, ticks: { callback: v => v + '%' }, grid: { color: '#ECEEF1' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

    function renderHeadcountGap(rows) {
    const body = $('#kpiHeadcountBody');
    const sub = $('#kpiHeadcountSub');
    if (!body) return;
    if (!rows || !rows.length) {
      body.innerHTML = '<tr><td colspan="10" class="muted" style="padding:12px">' +
        'No SLG headcount data in current scope.</td></tr>';
      if (sub) sub.textContent = 'SLG only · current filters';
      return;
    }

    const order = ['EM', 'PD', 'DA', 'CS_FUNC', 'CS_TECH'];
    const sorted = rows.slice().sort(function (a, b) {
      const ia = order.indexOf(a.role);
      const ib = order.indexOf(b.role);
      if (ia !== -1 && ib !== -1) return ia - ib;
      if (ia !== -1) return -1;
      if (ib !== -1) return 1;
      return String(a.role || '').localeCompare(String(b.role || ''));
    });

    function fmtMonthShort(mk) {
      if (!mk || typeof mk !== 'string') return '—';
      const parts = mk.split('-');
      if (parts.length < 2) return mk;
      const dt = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
      if (isNaN(dt.getTime())) return mk;
      return dt.toLocaleString('en', { month: 'short', year: '2-digit' });
    }

    body.innerHTML = sorted.map(function (r) {
      const heads = Number(r.suggestedHeads) || 0;
      const peakGap = Number(r.peakGap) || 0;
      const peakUtil = Number(r.peakUtil) || 0;
      const avgUtil = Number(r.avgUtil) || 0;
      let cls = '';
      if (peakGap > 0) cls = 'warn-row';
      else if (peakUtil >= 0.95) cls = 'hot-row';
      return (
        '<tr class="' + cls + '">' +
        '<td>' + escapeHtml_(r.team || 'Unclassified') + '</td>' +
        '<td class="num">' + fmtFte(r.capacityFte) + '</td>' +
        '<td class="num">' + fmtFte(r.peakDemandFte) + '</td>' +
        '<td class="num">' + fmtPct(peakUtil) + '</td>' +
        '<td class="num">' + fmtFte(peakGap) + '</td>' +
        '<td class="num">' + heads + '</td>' +
        '<td>' + escapeHtml_(fmtMonthShort(r.peakMonth)) + '</td>' +
        '<td class="num">' + fmtFte(r.avgDemandFte) + '</td>' +
        '<td class="num">' + fmtPct(avgUtil) + '</td>' +
        '<td class="num">' + fmtFte(r.avgGap) + '</td>' +
        '</tr>'
      );
    }).join('');

    if (sub) {
      const windowMonths = (State.ref && State.ref.planningWindowMonths) ||
                           (State.dashboard && State.dashboard.planningWindowMonths) || 6;
      const ptoNote = State.filters.includeTimeOff ? 'Includes PTO/Holiday' : 'Excludes PTO/Holiday';
      sub.textContent = 'SLG only · ' + windowMonths + '-month planning window · ' + ptoNote;
    }
  }

  document.addEventListener('click', (e) => {
    const seg = e.target.closest('#groupBySeg button');
    if (!seg) return;
    $$('#groupBySeg button').forEach(x => x.classList.toggle('on', x === seg));
    State.filters.groupBy = seg.dataset.val;
    renderChipStrip_();
    updateFilterCountBadge_();
    loadDashboard();
  });
</script>

<script>
  // ============================================================
  // Reporting & Metrics view
  // ============================================================
  async function loadReporting() {
    rpShowLoadingState_();

    try {
      const params = buildServerParams_();
      const summary = await call('api_getReportingSummary', params);

      State.reporting = summary;
      State.rpAccountsAll = summary.byAccount || [];
      State.rpHoursTotal = Number((summary.totals || {}).totalHours || 0);
      if (!State.rpExpandedTeams) State.rpExpandedTeams = new Set();
      if (!State.rpExpandedAccounts) State.rpExpandedAccounts = new Set();

      renderReportingSummary(summary);
    } catch (err) {
      const msg = (err && (err.message || err.toString())) || 'unknown error';
      console.error('loadReporting failed:', err);
      toast('Failed to load Reporting & Metrics: ' + msg, 'err');
      rpShowFailureState_(msg);
    }
  }

  function rpShowLoadingState_() {
    const ids = [
      'rpTeamBody', 'rpAccountBody', 'rpRoleCategoryBody', 'rpJobProfileBody',
      'rpTop5AccountsBody', 'rpTop5RolesBody', 'rpDonutLegendBody',
      'rpUnmappedBody', 'rpBlankClassBody'
    ];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<tr><td class="muted" style="padding:12px" colspan="7">Loading…</td></tr>';
    });
    const legendEl = document.getElementById('rpHorizontalBarLegend');
    if (legendEl) legendEl.innerHTML = '<div class="muted" style="padding:12px">Loading…</div>';
  }

  function rpShowFailureState_(msg) {
    const html =
      '<tr><td class="muted" style="padding:12px;color:var(--thumbtack);" colspan="7">Failed to load: ' +
      escapeHtml_(msg) + '</td></tr>';
    [
      'rpTeamBody', 'rpAccountBody', 'rpRoleCategoryBody', 'rpJobProfileBody',
      'rpTop5AccountsBody', 'rpTop5RolesBody', 'rpDonutLegendBody',
      'rpUnmappedBody', 'rpBlankClassBody'
    ].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = html;
    });
  }

  function renderReportingSummary(summary) {
    summary = summary || {};
    const totals = summary.totals || {};
    const byTeam = summary.byTeam || [];
    const byAccount = summary.byAccount || [];
    const byRoleCat = summary.byRoleCategory || [];
    const byJobProf = summary.byJobProfile || [];
    const topAccounts = summary.topAccounts || [];
    const topRoles = summary.topRoles || [];
    const diag = summary.diagnostics || {};

    renderReportingBanners_(totals);
    renderReportingKpis_(totals);
    renderReportingComposition_(totals);
    renderReportingTeamTable_(byTeam, totals);
    renderReportingAccountTable_(byAccount, totals);
    renderReportingRoleCategoryTable_(byRoleCat, totals);
    renderReportingJobProfileTable_(byJobProf, totals);
    renderReportingTop5_(topAccounts, topRoles, totals);
    renderReportingDiagnostics_(diag, totals);
  }

  // Banners
  function renderReportingBanners_(totals) {
    const container = $('#reportBanners');
    if (!container) return;
    const banners = [];

    if (totals && totals.reconcileOk === false) {
      banners.push({
        kind: 'err', icon: '⚠',
        title: 'Numbers do not reconcile.',
        body: 'The team, account, and worker-class totals do not all equal the headline total. See diagnostics below.'
      });
    }

    if (State.filters.viewMode === 'Scenario') {
      const scen = (State.scenarios || []).find(s => s.scenario_id === State.filters.scenarioId);
      banners.push({
        kind: 'warn', icon: 'ℹ',
        title: 'Scenario view mode.',
        body: 'Including modeled hours' + (scen ? ' from "' + escapeHtml_(scen.name) + '"' : '') +
              '. Numbers are forecast, not committed.'
      });
    }

    // Priority 3: compare workerScope against current-view default, not global FILTER_DEFAULTS.
    const ws = String(State.filters.workerScope || 'All');
    const viewWsDefault = currentViewWorkerScopeDefault_();
    if (ws !== viewWsDefault) {
      const lbl = WORKER_SCOPE_LABELS[ws] || ws;
      const filteredOut = Number((totals || {}).scopeFilteredOutHours || 0);
      const filteredOutText = filteredOut > 0 ? ' ' + fmtHours(filteredOut) + ' hrs hidden by this scope.' : '';
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Worker scope: ' + lbl + '.',
        body: 'Showing only ' + lbl + ' workers.' + filteredOutText,
        action: { label: 'Reset to view default', clearKey: 'workerScope' }
      });
    }

    if (State.filters.teamLabel) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Team filter active.',
        body: 'Scoped to "' + escapeHtml_(State.filters.teamLabel) + '". Manager filter is suspended while Team is set.',
        action: { label: 'Clear', clearKey: 'teamLabel' }
      });
    }

    if (State.filters.managers && State.filters.managers.length && !State.filters.teamLabel) {
      const mgr = State.filters.managers[0];
      const inc = State.filters.includeMyManagers ? ' (including reports)' : '';
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Manager filter active.',
        body: 'Filtered to "' + escapeHtml_(mgr) + '"' + inc + '.',
        action: { label: 'Clear', clearKey: 'managers' }
      });
    }

    const practiceHrs = Number((totals || {}).externalHoursByPracticeOwnership || 0);
    if (State.filters.managers && State.filters.managers.length && !State.filters.teamLabel && practiceHrs > 0) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Practice ownership applied.',
        body: 'Including ' + fmtHours(practiceHrs) + ' External hrs attributed via practice ownership in addition to direct reports.'
      });
    }

    if (State.filters.quarter) {
      banners.push({
        kind: 'info', icon: 'ℹ',
        title: 'Quarter filter active.',
        body: 'Showing ' + escapeHtml_(State.filters.quarter) + ' only.',
        action: { label: 'Clear', clearKey: 'quarter' }
      });
    }

    if (!banners.length) {
      container.hidden = true;
      container.innerHTML = '';
      return;
    }

    const MAX_VISIBLE = 3;
    const visible = banners.slice(0, MAX_VISIBLE);
    const overflow = banners.length - visible.length;

    container.innerHTML = visible.map(b => {
      const actionHtml = b.action
        ? `<button type="button" class="banner-action" data-banner-action="${escapeHtml_(b.action.clearKey)}">${escapeHtml_(b.action.label)}</button>`
        : '';
      return `
        <div class="report-banner ${b.kind}">
          <span class="report-banner-icon">${b.icon}</span>
          <span><strong>${escapeHtml_(b.title)}</strong> ${b.body}</span>
          ${actionHtml}
        </div>`;
    }).join('') +
    (overflow > 0
      ? `<div class="report-banner info">
           <span class="report-banner-icon">…</span>
           <span>+${overflow} more active filter${overflow === 1 ? '' : 's'}. See chip strip above for details.</span>
         </div>`
      : '');
    container.hidden = false;
  }

  // KPIs
  function renderReportingKpis_(totals) {
    totals = totals || {};
    const total = Number(totals.totalHours || 0);
    const slgHours = Number(totals.slgHours || 0);
    const nonSlg = Number(totals.nonSlgHours || 0);
    const partner = Number(totals.partnerHours || 0);
    const slgPct = Number(totals.slgPct || 0);
    const nonSlgPct = Number(totals.nonSlgPct || 0);
    const partPct = Number(totals.partnerPct || 0);
    const util = Number(totals.avgUtilization || 0);
    const months = Number(totals.monthsInScope || 0);
    const headcount = Number(totals.headcount || 0);

    $('#rpKpiTotal').textContent = fmtHours(total);
    $('#rpKpiTotalSub').textContent = headcount + ' workers · ' + months + ' months in scope';
    $('#rpKpiSlg').textContent = fmtHours(slgHours);
    $('#rpKpiSlgPct').textContent = fmtPct1(slgPct) + ' of total';
    $('#rpKpiNonSlg').textContent = fmtHours(nonSlg);
    $('#rpKpiNonSlgPct').textContent = fmtPct1(nonSlgPct) + ' of total';
    $('#rpKpiPartner').textContent = fmtHours(partner);
    $('#rpKpiPartnerPct').textContent = fmtPct1(partPct) + ' of total';
    $('#rpKpiUtil').textContent = fmtPct(util);
    $('#rpKpiUtilSub').textContent = total > 0
      ? 'against ' + fmtHours(Number(totals.capacityHours || 0)) + ' hrs capacity'
      : 'no data in scope';

    const reconCard = $('#rpKpiReconcile').closest('.kpi-card');
    const reconValue = $('#rpKpiReconcile');
    const reconSub = $('#rpKpiReconcileSub');
    if (total === 0) {
      if (reconCard) reconCard.setAttribute('data-state', '');
      reconValue.textContent = 'No data';
      reconSub.textContent = 'No hours in current scope.';
      reconSub.title = '';
    } else if (totals.reconcileOk) {
      if (reconCard) reconCard.setAttribute('data-state', 'ok');
      reconValue.textContent = '✓ Reconciled';
      reconSub.textContent = 'All totals tie';
      const d = totals.reconciliationDetail || {};
      reconSub.title = 'totalHours: ' + fmtHours(d.totalHours) + '\n' +
                      'teamSum: ' + fmtHours(d.teamSum) + '\n' +
                      'accountSum: ' + fmtHours(d.accountSum) + '\n' +
                      'workerClassSum: ' + fmtHours(d.workerClassSum);
    } else {
      if (reconCard) reconCard.setAttribute('data-state', 'warn');
      reconValue.textContent = '⚠ Mismatch';
      reconSub.textContent = 'See diagnostics';
      const d = totals.reconciliationDetail || {};
      const c = d.checks || {};
      const tt = [];
      if (!c.teamMatches) tt.push('team sum ≠ total');
      if (!c.accountMatches) tt.push('account sum ≠ total');
      if (!c.workerClassMatches) tt.push('worker class sum ≠ total');
      reconSub.title = tt.length ? tt.join('; ') : 'See diagnostics';
    }
  }

  // Composition
  function renderReportingComposition_(totals) {
    totals = totals || {};

    const donutCtx = $('#rpDonutChart').getContext('2d');

      type: 'doughnut',
      data: {
        labels: ['SLG (Workday SLG)', 'SLG Generic', 'Workday Non-SLG', 'Partner'],
        datasets: [{
          data: [slgReal, slgGeneric, nonSlg, partner],

        }]

          }
        }
      }
    });

      { label: 'SLG Generic', hours: slgGeneric, color: colSlgGen, cls: 'slg-generic' },

        <tr>

          <td class="num">${fmtHours(r.hours)}</td>

        </tr>`;
    }).join('');

    const slgCombined = slgReal + slgGeneric;
    const barCtx = $('#rpHorizontalBarChart').getContext('2d');
    if (State.charts.rpHBar) State.charts.rpHBar.destroy();
    State.charts.rpHBar = new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['SLG vs Everyone Else'],
        datasets: [
          { label: 'SLG', data: [slgCombined], backgroundColor: colSlg, stack: 'mix' },
          { label: 'Workday Non-SLG', data: [nonSlg], backgroundColor: colNonSlg, stack: 'mix' },
          { label: 'Partner', data: [partner], backgroundColor: colPartner, stack: 'mix' }
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed.x;
                const pct = total > 0 ? (v / total) : 0;
                return ctx.dataset.label + ': ' + fmtHours(v) + ' hrs (' + fmtPct1(pct) + ')';
              }

          }
        },
        scales: {
          x: { stacked: true, display: false, max: total > 0 ? total : 1 },
          y: { stacked: true, display: false }

      { label: 'SLG', hours: slgCombined, cls: 'slg' },
      { label: 'Workday Non-SLG', hours: nonSlg, cls: 'nonslg' },
      { label: 'Partner', hours: partner, cls: 'partner' }

      return `

          <span class="lg-swatch wc-mix-seg ${r.cls}"></span>
          <span class="lg-label">${escapeHtml_(r.label)}</span>
          <span class="lg-value">${fmtHours(r.hours)} · ${fmtPct1(pct)}</span>
        </div>`;
    }).join('');
  }

  // Worker class mix bar
  function wcMixBarHtml_(wcb, rowTotal) {
    wcb = wcb || {};
    const slg = Number(wcb.slg || 0);
    const slgGen = Number(wcb.slgGeneric || 0);
    const nonSlg = Number(wcb.nonSlg || 0);
    const partner = Number(wcb.partner || 0);
    const sum = slg + slgGen + nonSlg + partner;
    if (sum <= 0) {
      return '<div class="wc-mix-bar" title="No worker class breakdown"></div>';
    }
    const denom = rowTotal > 0 ? rowTotal : sum;
    const seg = (val, cls, name) => {
      if (val <= 0) return '';
      const pct = (val / denom) * 100;
      return `<div class="wc-mix-seg ${cls}" style="width:${pct}%;" title="${name}: ${fmtHours(val)} hrs (${fmtPct1(val/denom)})"></div>`;
    };
    const title = 'SLG: ' + fmtHours(slg) + ' · ' +
                  'SLG Generic: ' + fmtHours(slgGen) + ' · ' +
                  'Workday Non-SLG: ' + fmtHours(nonSlg) + ' · ' +
                  'Partner: ' + fmtHours(partner);
    return `<div class="wc-mix-bar" title="${escapeHtml_(title)}">
      ${seg(slg, 'slg', 'SLG')}
      ${seg(slgGen, 'slg-generic', 'SLG Generic')}
      ${seg(nonSlg, 'nonslg', 'Workday Non-SLG')}
      ${seg(partner, 'partner', 'Partner')}
    </div>`;
  }
