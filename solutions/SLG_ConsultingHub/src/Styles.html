<style>
  :root {
    --bg:#f5f7fb;
    --card:#fff;
    --text:#1b1f27;
    --muted:#6b7280;
    --primary:#1f3a5f;
    --primary-ink:#fff;
    --accent:#2563eb;
    --border:#e5e7eb;
    --chip:#eef2ff;
    --row-hover:#f9fafb;
    --row-alt:#fafbfd;
    --danger:#b91c1c;
    --danger-bg:#fee2e2;
    --warn-bg:#fef3c7;
    --warn-ink:#92400e;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* ---------- Top bar ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--primary);
    color: #fff;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .2px; }
  .brand-logo {
    width: 32px; height: 32px;
    display: block; border-radius: 6px;
    background: #fff; padding: 2px; flex-shrink: 0;
    box-shadow: 0 1px 2px #00000033;
  }
  .brand-text { font-size: 16px; line-height: 1; }

  @media (max-width: 640px) {
    .brand-logo { width: 28px; height: 28px; }
    .brand-text { font-size: 15px; }
  }

  .user .badge {
    margin-left: 8px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #ffffff22;
    font-size: 12px;
  }
  .user .badge.admin { background: #f59e0b; }

  /* ---------- Tabs + filter bar ---------- */
  .tabs {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .tab {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
    cursor: pointer;
  }
  .tab.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .grow { flex: 1; }

  /* Inline filter controls */
  .inline-filter {
    width: auto;
    min-width: 0;
    padding: 6px 10px;
    font-size: 13px;
  }
  select.inline-filter { max-width: 160px; }
  input[type="month"].inline-filter { max-width: 160px; }

  .inline-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    padding: 0 4px;
  }
  .inline-toggle.hidden { display: none; }
  .inline-toggle input { width: auto; }

  /* ---------- Form controls ---------- */
  input, select, textarea, button { font: inherit; }
  input, select, textarea {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    width: 100%;
    background: #fff;
    color: var(--text);
  }
  button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  button.primary {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  button.danger-ghost {
    color: var(--danger);
    border-color: var(--danger);
    background: #fff;
  }
  button.danger-ghost:hover { background: var(--danger-bg); }
  button[disabled] { opacity: .6; cursor: not-allowed; }

  /* Screen-reader-only label */
  .sr-label {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* ---------- Main layout ---------- */
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }

  .results-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- Table ---------- */
  .table-wrap {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-x: auto;      /* allow horizontal scroll if needed */
    overflow-y: hidden;    /* keep vertical clipping */
    box-shadow: 0 1px 2px #0000000a;
  }
  .topics-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 14px;
  }
  .topics-table thead th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #f3f4f6;
    text-align: left;
    padding: 10px 12px;
    font-weight: 600;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .04em;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    user-select: none;
  }
  .topics-table thead th.sortable { cursor: pointer; }
  .topics-table thead th.sortable:hover { color: var(--primary); }
  .topics-table thead th .sort-ind {
    display: inline-block;
    width: 10px;
    margin-left: 4px;
    color: var(--primary);
    opacity: .75;
  }
  .topics-table thead th.col-actions {
    text-align: center;
    padding-left: 0;
    padding-right: 0;
  }
  .topics-table tbody td.col-actions { text-align: center; }

  .topics-table tbody td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .topics-table tbody tr:nth-child(even) td { background: var(--row-alt); }
  .topics-table tbody tr:hover td { background: var(--row-hover); }
  .topics-table tbody tr.expanded td { background: #eef4ff; }
  .topics-table tbody tr { cursor: pointer; }
  .topics-table tbody tr.detail { cursor: default; }
  .topics-table tbody tr.detail td {
    background: #f8fafc;
    padding: 14px 18px 18px 42px;
  }
  .topics-table tbody tr.detail .desc {
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .topics-table tbody tr.detail .detail-meta {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .topics-table tbody tr.detail .detail-links {
    margin: 4px 0 0 16px;
    padding: 0;
  }
  .topics-table tbody tr.detail .detail-links li { margin-bottom: 2px; }
  .topics-table tbody tr.detail .detail-links a {
    color: var(--accent);
    text-decoration: none;
  }
  .topics-table tbody tr.detail .detail-links a:hover {
    text-decoration: underline;
  }

  /* Archived rows */
  .topics-table tbody tr.archived-row td {
    opacity: .65;
    font-style: italic;
  }

  /* Column widths */
  .col-expand { width: 28px; text-align: center; color: var(--muted); }
  .col-area { width: 74px; }
  .col-title { min-width: 220px; } /* slightly narrower to free space for actions */
  .col-priority { width: 92px; }
  .col-target { width: 80px; }
  .col-votes { width: 80px; text-align: right; }
  .col-comments { width: 80px; text-align: center; }
  .col-status { width: 110px; }
  .col-submitter {
    max-width: 180px;       /* narrower submitter column */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis; /* show ... instead of wrapping */
  }
  .col-created { width: 100px; white-space: nowrap; }
  .col-actions {
    width: 120px;           /* reserve consistent width for icons */
    text-align: center;
    white-space: nowrap;
  }

  .title-cell { font-weight: 600; color: var(--text); }
  .title-cell .snippet {
    font-weight: 400;
    color: var(--muted);
    font-size: 12px;
    display: block;
    margin-top: 2px;
  }

  /* ---------- Chips ---------- */
  .chip {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--primary);
    font-size: 12px;
  }
  .chip.discussed { background: #ecfdf5; color: #047857; }
  .chip.scheduled { background: #fef3c7; color: #92400e; }
  .chip.proposed  { background: #eef2ff; color: #3730a3; }
  .chip.archived  { background: #e5e7eb; color: #6b7280; }
  .chip.cross {
    background: #fef3c7;
    color: #92400e;
    font-weight: 600;
  }

  /* Priority chips */
  .chip.priority-high { background: #fee2e2; color: #991b1b; font-weight: 600; }
  .chip.priority-med  { background: #fef3c7; color: #92400e; font-weight: 600; }
  .chip.priority-low  { background: #e5e7eb; color: #374151; }

  /* Target month chip */
  .chip.target-month {
    background: #1f3a5f;
    color: #fff;
    font-weight: 600;
    letter-spacing: .03em;
  }

  .areas-list {
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ---------- Vote & actions cluster ---------- */
  .vote-inline {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .vote-inline button {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px;
  }
  .vote-inline button.voted {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .vote-inline .vote-count {
    min-width: 20px;
    display: inline-block;
    text-align: right;
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 4px;
  }
  .actions-secondary {
    display: inline-flex;
    gap: 4px;
  }

  .icon-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 13px;
    border: 1px solid #d1d5db;
    background: #f3f4f6;
    color: #111827;
    cursor: pointer;
    box-shadow: 0 1px 2px #00000014;
  }
  .icon-button:hover {
    background: #e5e7eb;
    border-color: #9ca3af;
  }

  .link {
    background: none;
    border: none;
    color: var(--accent);
    cursor: pointer;
    padding: 0;
    font-size: 13px;
  }
  .link:hover { text-decoration: underline; }

  .empty-state {
    padding: 32px;
    text-align: center;
    color: var(--muted);
  }

  /* ---------- Comments column badge ---------- */
  .comments-chip {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .comments-chip:hover {
    background: var(--row-hover);
    border-color: var(--accent);
    color: var(--accent);
  }
  .comments-chip .comments-count {
    font-weight: 600;
    min-width: 12px;
    text-align: center;
  }

  /* ---------- Form layout ---------- */
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .row.end {
    justify-content: flex-end;
    margin-top: 8px;
  }
  .row.two-col > label { flex: 1 1 0; min-width: 0; }
  .row.three-col > label { flex: 1 1 0; min-width: 0; }

  .modal-body > label {
    display: block;
    margin: 10px 0 4px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .modal-body > label > input,
  .modal-body > label > textarea,
  .modal-body > label > select {
    margin-top: 4px;
  }

  .row > label {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  .row.two-col > label,
  .row.three-col > label {
    display: block;
  }

  #f_areas, #m_areas {
    margin-top: 4px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }

  /* ---------- Multi-presenter UI ---------- */
  .presenter-field {
    display: block;
    width: 100%;
  }

  .presenter-multi {
    margin-top: 4px;
    padding: 4px 6px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }

  .presenter-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .presenter-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--chip);
    color: var(--text);
    font-size: 12px;
  }

  .presenter-chip button {
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    color: var(--muted);
  }

  .presenter-chip button:hover {
    color: var(--danger);
  }

  .presenter-multi #m_presenterInput {
    border: none;
    flex: 1 1 120px;
    min-width: 80px;
    padding: 4px 2px;
  }

  .presenter-multi #m_presenterInput:focus-visible {
    outline: none;
  }

  /* ---------- Modals ---------- */
  .modal {
    position: fixed;
    inset: 0;
    background: #0008;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal.hidden { display: none; }

  .modal-body {
    background: #fff;
    border-radius: 10px;
    padding: 16px 20px;      /* slightly tighter padding */
    width: min(520px, 92vw);
    max-height: 95vh;        /* use more vertical real estate */
    overflow: auto;
    color: var(--text);
  }
  .modal-body.wide {
    width: min(960px, 96vw); /* wider manage modal */
  }
  .modal-body h3 {
    margin: 0 0 8px 0;
  }

  /* ---------- Manage modal specifics ---------- */
  .section-title {
    margin: 12px 0 4px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--primary);
    border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
  }
  .section-title .section-hint {
    margin-left: 8px;
    text-transform: none;
    letter-spacing: normal;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
  }
  .manage-audit {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    min-height: 16px;
  }
  .manage-footer { gap: 6px; }

  .char-count {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    margin-top: 2px;
  }
  .char-count .over { color: var(--danger); font-weight: 600; }
  #m_notes_count.over { color: var(--danger); font-weight: 600; }

  /* Drive link repeater */
  .links-list { margin: 4px 0 8px 0; }
  .links-empty {
    padding: 10px 12px;
    font-size: 13px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: #fafbfd;
  }
  .link-row {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 6px;
    background: #fafbfd;
  }
  .link-grid {
    display: grid;
    grid-template-columns: 1fr 2fr auto auto;
    gap: 6px;
    align-items: center;
  }
  .link-grid .link-title,
  .link-grid .link-url {
    width: 100%;
  }
  .link-grid .link-fetch {
    padding: 6px 10px;
    font-size: 12px;
    white-space: nowrap;
  }
  .link-grid .link-remove {
    padding: 4px 10px;
    line-height: 1;
    font-size: 16px;
    color: var(--danger);
    border-color: var(--danger);
    background: #fff;
  }
  .link-grid .link-remove:hover {
    background: var(--danger-bg);
  }

  @media (max-width: 640px) {
    .link-grid {
      grid-template-columns: 1fr auto;
      grid-auto-rows: min-content;
    }
    .link-grid .link-title { grid-column: 1 / 3; }
    .link-grid .link-url   { grid-column: 1 / 3; }
    .link-grid .link-fetch { grid-column: 1 / 2; }
    .link-grid .link-remove{ grid-column: 2 / 3; }
  }

  /* ---------- Comments backdrop & side panel ---------- */
  .comments-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.25);
    z-index: 55;
  }
  .comments-backdrop.hidden { display: none; }

  .comments-panel {
    position: fixed;
    top: 64px;
    right: 0;
    bottom: 0;
    width: 380px;
    max-width: 100vw;
    background: #f9fafb;
    border-left: 1px solid var(--border);
    box-shadow: -12px 0 24px #0000001a;
    display: flex;
    flex-direction: column;
    z-index: 60;
  }
  .comments-panel.hidden { display: none; }

  .comments-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: #f3f4f6;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .comments-title-block { flex: 1 1 auto; min-width: 0; }
  .comments-topic-id {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .comments-title {
    margin: 2px 0 0 0;
    font-size: 15px;
  }
  .comments-topic-meta {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .comments-close {
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 18px;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .comments-close:hover {
    background: var(--row-hover);
    color: var(--text);
  }

  .comments-body {
    flex: 1 1 auto;
    padding: 8px 14px 8px 14px;
    overflow-y: auto;
  }
  .comments-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .comments-loading,
  .comments-error,
  .comments-empty {
    font-size: 13px;
    color: var(--muted);
    margin: 8px 0;
  }

  .comment {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    background: #f9fafb;
  }
  .comment-header {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 4px;
  }
  .comment-meta { font-size: 12px; color: var(--muted); }
  .comment-actions {
    flex-shrink: 0;
    display: inline-flex;
    gap: 4px;
  }
  .comment-body {
    font-size: 13px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .comment-body-deleted {
    font-style: italic;
    color: var(--muted);
  }

  .comments-composer {
    border-top: 1px solid var(--border);
    padding: 8px 14px 10px;
    background: #f3f4f6;
  }
  .comments-composer textarea {
    width: 100%;
    resize: vertical;
    min-height: 60px;
  }
  .comments-composer-footer {
    margin-top: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #commentInputCount.over {
    color: var(--danger);
    font-weight: 600;
  }

  /* ---------- Admin tools text helpers ---------- */
  .tool-help {
    font-size: 13px;
    color: var(--muted);
    margin: 6px 0 10px;
  }
  .tool-status {
    font-size: 12px;
    margin-left: 8px;
  }
  .tool-status.ok { color: #047857; }
  .tool-status.err{ color: #b91c1c; }

  /* ---------- FAB cluster ---------- */
  .fab-cluster {
    position: fixed;
    right: 20px;
    bottom: 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    z-index: 40;
  }
  .fab-cluster.hidden { display: none; }
  .fab {
    padding: 12px 18px;
    border-radius: 999px;
    background: var(--primary);
    color: #fff;
    border: none;
    box-shadow: 0 6px 20px #00000026;
    cursor: pointer;
  }
  .fab.ghost {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--border);
  }

  /* ---------- Agenda picker / output ---------- */
  .agenda-picker {
    max-height: 50vh;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px;
    margin-top: 10px;
    background: #fff;
  }
  .agenda-picker .pick {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: flex-start;
    padding: 6px 10px;
    margin: 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.35;
    cursor: pointer;
    text-align: left;
  }
  .agenda-picker .pick:last-child { border-bottom: none; }
  .agenda-picker .pick:hover { background: var(--row-hover); }
  .agenda-picker .pick > input[type="checkbox"] {
    width: auto;
    flex: 0 0 auto;
    margin: 0;
  }
  .agenda-picker .pick > div {
    flex: 1 1 auto;
    min-width: 0;
  }
  .agenda-picker .pick strong {
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .agenda-picker .pick .meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .agenda-picker em {
    display: block;
    padding: 16px;
    text-align: center;
    color: var(--muted);
    font-style: normal;
  }

  .agenda-output textarea {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
  }
  .agenda-output iframe {
    width: 100%;
    height: 420px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
  }

  /* ---------- Meetings list ---------- */
  .meeting-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
