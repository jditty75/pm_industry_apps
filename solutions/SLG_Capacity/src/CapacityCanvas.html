<!-- CapacityCanvas.html — WFM.25 aggregate column (direct flex child of .wfm25-capacity-body).
     Included via <?!= include('CapacityCanvas'); ?> in Index.html.
     Contains: tab bar, #wfm25CapacityPrimary / #aggregateContent, utilization panels.
     All behavior is wired in JavaScript.html (initWFM25_). -->

<div id="capacityCanvas" class="wfm25-capacity-canvas wfm25-capacity-primary">

  <!-- ── Tab bar + Group-by toggle (right-aligned) ── -->
  <div class="wfm25-tab-bar">
    <div class="wfm25-tabs" role="tablist" aria-label="Capacity views">
      <button class="wfm25-tab active" data-wfm25-tab="utilization"
              role="tab" aria-selected="true" id="wfm25TabUtilization">Utilization</button>
      <button class="wfm25-tab" data-wfm25-tab="hours-budget"
              role="tab" aria-selected="false" id="wfm25TabHoursCapacity">Hours &amp; Capacity</button>
      <button class="wfm25-tab" data-wfm25-tab="mix-trend"
              role="tab" aria-selected="false" id="wfm25TabMixTrend">Mix &amp; Trend</button>
    </div>
    <div class="wfm25-groupby" aria-label="Group by">
      <span class="wfm25-groupby-label">Group by:</span>
      <button class="wfm25-groupby-btn active" data-wfm25-groupby="team"
              aria-pressed="true">Team</button>
      <!-- Role grouping deferred to Stage 6; hidden from Stage 4 VP deck -->
      <button class="wfm25-groupby-btn wfm25-groupby-deferred" data-wfm25-groupby="role"
              hidden aria-hidden="true" tabindex="-1">Role</button>
    </div>
  </div>

  <!-- ── Aggregate scroll region ── -->
  <div id="wfm25CapacityPrimary" class="wfm25-capacity-inner">
    <div id="aggregateContent" class="wfm25-aggregate-content">

      <!-- ─ Utilization panel (active by default) ─ -->
      <div class="wfm25-tab-panel" id="wfm25PanelUtilization"
           data-wfm25-panel="utilization">
        <div class="table-wrap" id="wfm25UtilWrap">
          <table class="wfm25-util-table wfm25-table" id="wfm25UtilTable">
            <thead>
              <tr id="wfm25UtilHeaderRow">
                <th class="wfm25-team-col">Team</th>
                <!-- quarter header <th> cells injected by renderWFM25UtilTable_() -->
              </tr>
            </thead>
            <tbody id="wfm25UtilBody">
              <tr>
                <td colspan="5" class="muted" style="padding:14px">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ─ Hours & Capacity panel ─ -->
      <div class="wfm25-tab-panel" id="wfm25PanelHoursBudget"
           data-wfm25-panel="hours-budget" hidden>
        <div class="table-wrap wfm25-hours-capacity-wrap" id="wfm25HoursCapacityWrap">
          <table class="wfm25-hours-capacity-table wfm25-table" id="wfm25HoursCapacityTable"
                 aria-label="Hours and capacity by team">
            <thead>
              <tr id="wfm25HoursCapacityHeaderRow">
                <th class="wfm25-team-col">Team</th>
                <!-- quarter header cells injected by renderWFM25HoursCapacityTable_() -->
              </tr>
            </thead>
            <tbody id="wfm25HoursCapacityBody">
              <tr>
                <td colspan="5" class="muted" style="padding:14px">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ─ Mix & Trend panel ─ -->
      <div class="wfm25-tab-panel" id="wfm25PanelMixTrend"
           data-wfm25-panel="mix-trend" hidden>
        <div class="wfm25-mix-trend-root" id="wfm25MixTrendRoot">
          <div class="wfm25-mix-trend-chart-wrap" id="wfm25MixTrendChartWrap"
               role="img" aria-label="Total delivery hours by fiscal quarter">
            <div class="wfm25-mix-trend-loading muted" id="wfm25MixTrendLoading">Loading…</div>
            <div class="wfm25-mix-trend-chart" id="wfm25MixTrendChart" hidden></div>
          </div>
          <div class="wfm25-mix-trend-detail" id="wfm25MixTrendDetail" hidden>
            <div class="wfm25-mix-trend-detail-header">
              <button type="button" class="btn-ghost wfm25-mix-trend-back" id="wfm25MixTrendBack"
                      aria-label="Back to chart">&larr; Back</button>
              <h3 class="wfm25-mix-trend-detail-title" id="wfm25MixTrendDetailTitle"></h3>
              <span class="wfm25-mix-trend-detail-kind muted" id="wfm25MixTrendDetailKind"></span>
            </div>
            <div class="wfm25-mix-trend-detail-body" id="wfm25MixTrendDetailBody"></div>
          </div>
        </div>
      </div>

    </div><!-- /#aggregateContent -->
  </div><!-- /#wfm25CapacityPrimary -->

</div><!-- /#capacityCanvas -->
